<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Activate Adminuscurator</title>
<style>
  :root { --brand:#4f46e5; --brand2:#4338ca; --ink:#0b1220; --muted:#5b6478; --border:#e2e6ef; --danger:#dc2626; --ok:#059669; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink);
    background:radial-gradient(1200px 600px at 100% -10%, #e8f0fd 0%, transparent 60%), #f6f8fc;
    display:grid; place-items:center; padding:24px; -webkit-user-select:none; user-select:none; }
  .card { width:100%; max-width:440px; background:#fff; border:1px solid var(--border); border-radius:20px;
    box-shadow:0 24px 48px -20px rgba(15,23,42,.25); padding:36px 32px; text-align:center; }
  .logo { width:64px; height:64px; margin:0 auto 18px; border-radius:16px; background:linear-gradient(135deg,#4f46e5,#2a8fdc); display:grid; place-items:center; }
  h1 { font-size:1.35rem; margin:0 0 6px; letter-spacing:-.02em; }
  p.sub { color:var(--muted); margin:0 0 24px; font-size:.95rem; line-height:1.5; }
  label { display:block; text-align:left; font-size:.8rem; font-weight:600; margin:0 0 6px; }
  input { width:100%; height:52px; padding:0 16px; font-size:1.15rem; letter-spacing:.06em; text-align:center;
    text-transform:uppercase; border:1.5px solid var(--border); border-radius:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 4px rgba(29,111,224,.15); }
  input.err { border-color:var(--danger); }
  button { width:100%; height:50px; margin-top:16px; border:0; border-radius:12px; background:var(--brand); color:#fff;
    font-size:1rem; font-weight:650; cursor:pointer; transition:background .15s, transform .1s; }
  button:hover { background:var(--brand2); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.6; cursor:default; }
  .msg { min-height:22px; margin-top:14px; font-size:.9rem; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:var(--ok); }
  .banner { border-radius:12px; padding:12px 14px; font-size:.9rem; margin-bottom:20px; text-align:left; line-height:1.45; }
  .banner.expired { background:#fef2f2; border:1px solid #fbd5d5; color:#991b1b; }
  .banner.clock { background:#fffbeb; border:1px solid #fde68a; color:#92400e; }
  .foot { margin-top:22px; font-size:.78rem; color:var(--muted); line-height:1.5; }
  .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.5); border-right-color:#fff; border-radius:50%; display:inline-block; vertical-align:-3px; margin-right:8px; animation:s .7s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <main class="card" role="dialog" aria-labelledby="title">
    <div class="logo" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 48 48"><g stroke-width="2.5" stroke-linejoin="round"><path d="M7.5 33L15 33L11 41L3.5 41Z" fill="#fff" stroke="#fff" opacity=".62"/><path d="M40.5 33L33 33L37 41L44.5 41Z" fill="#fff" stroke="#fff" opacity=".62"/><path d="M14 20L21.5 20L17.5 28L10 28Z" fill="#fff" stroke="#fff" opacity=".82"/><path d="M34 20L26.5 20L30.5 28L38 28Z" fill="#fff" stroke="#fff" opacity=".82"/><path d="M20.5 7L27.5 7L31.5 15L16.5 15Z" fill="#fff" stroke="#fff"/></g></svg>
    </div>
    <h1 id="title">Activate Adminuscurator</h1>
    <p class="sub" id="sub">Enter your activation code to start your 7-day access.</p>
    <div id="banner"></div>
    <form id="form">
      <label for="code">Activation code</label>
      <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false"
        placeholder="#XXXX-XXXX-XXXX" aria-describedby="msg" required />
      <button type="submit" id="submit">Activate</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
    <p class="foot">Your access lasts 7 days from activation. Your shop data always stays on this computer.</p>
  </main>
<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form"), input = $("code"), submit = $("submit"), msg = $("msg"), banner = $("banner"), sub = $("sub");

  function showBanner(status) {
    if (status.state === "expired") { banner.className = "banner expired"; banner.textContent = status.message; sub.textContent = "Enter a new activation code to continue using the app."; }
    else if (status.state === "clock") { banner.className = "banner clock"; banner.textContent = status.message; }
    else if (status.state === "locked") { banner.className = "banner expired"; banner.textContent = status.message; }
    else { banner.className = ""; banner.textContent = ""; }
  }

  window.LicenseAPI.status().then(showBanner);

  // Group the code as the user types: #XXXX-XXXX-...
  input.addEventListener("input", () => {
    let raw = input.value.toUpperCase().replace(/[^0-9A-Z]/g, "");
    input.value = raw ? "#" + raw.replace(/(.{4})/g, "$1-").replace(/-$/, "") : "";
    input.classList.remove("err"); msg.textContent = "";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submit.disabled = true; submit.innerHTML = '<span class="spinner"></span>Checking…';
    msg.className = "msg"; msg.textContent = "";
    const res = await window.LicenseAPI.activate(input.value);
    if (res.ok) {
      msg.className = "msg ok";
      msg.textContent = "Activated! Opening the app…";
      setTimeout(() => window.LicenseAPI.open(), 700);
      return;
    }
    input.classList.add("err");
    msg.className = "msg err"; msg.textContent = res.message;
    submit.disabled = false; submit.textContent = "Activate";
  });
  input.focus();
</script>
</body>
</html>
