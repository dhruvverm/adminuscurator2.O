/* =========================================================================
   20-models.js — data access + business rules

      d.purchases.length + ':' + d.expenses.length;
  }

  M.index = function () {
    var d = App.db, st = stamp();
    if (IDX && IDX.db === d && IDX.stamp === st) return IDX;
    var ix = { db: d, stamp: st, byId: {}, paidBySale: {}, salesByCust: {}, paysByCust: {}, rxByCust: {}, billed: {}, paid: {} };
    ['customers','prescriptions','suppliers','products','sales','payments','purchases','expenses'].forEach(function (k) {
      var m = ix.byId[k] = {};
      d[k].forEach(function (x) { m[x.id] = x; });
    });
    d.sales.forEach(function (x) {
      if (x.deletedAt || !x.customerId) return;
      (ix.salesByCust[x.customerId] = ix.salesByCust[x.customerId] || []).push(x);
      ix.billed[x.customerId] = (ix.billed[x.customerId] || 0) + App.n(x.total);
    });
    d.payments.forEach(function (x) {
      if (x.deletedAt) return;
      if (x.saleId) ix.paidBySale[x.saleId] = (ix.paidBySale[x.saleId] || 0) + App.n(x.amount);
      if (!x.customerId) return;
      (ix.paysByCust[x.customerId] = ix.paysByCust[x.customerId] || []).push(x);
      ix.paid[x.customerId] = (ix.paid[x.customerId] || 0) + App.n(x.amount);
    });
    d.prescriptions.forEach(function (x) {
      if (!x.deletedAt && x.customerId) (ix.rxByCust[x.customerId] = ix.rxByCust[x.customerId] || []).push(x);
    });
    var newest = function (a, b) { return (b.date + b.createdAt) > (a.date + a.createdAt) ? 1 : -1; };
    Object.keys(ix.salesByCust).forEach(function (k) { ix.salesByCust[k].sort(newest); });
    Object.keys(ix.paysByCust).forEach(function (k) { ix.paysByCust[k].sort(newest); });
    Object.keys(ix.rxByCust).forEach(function (k) { ix.rxByCust[k].sort(function (a, b) { return b.date > a.date ? 1 : -1; }); });
    IDX = ix;
    return ix;
  };

  M.find = function (coll, id) {
    var ix = M.index();
    if (ix.byId[coll]) return ix.byId[coll][id] || null;
    var a = App.db[coll] || [];
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  };

  /* soft delete -> recoverable from Trash */
  M.softDelete = function (coll, id, reason) {
    var it = M.find(coll, id);
    if (!it) return false;
    it.deletedAt = App.nowISO();
    App.db.trash.push({
      id: App.uid('tr'), coll: coll, refId: id, at: it.deletedAt,
      label: M.labelOf(coll, it), reason: reason || ''
    });
    App.store.touch();
    return true;
  };

  M.restoreTrash = function (trashId) {
    var idx = -1;
    for (var i = 0; i < App.db.trash.length; i++) if (App.db.trash[i].id === trashId) idx = i;
    if (idx < 0) return false;
    var t = App.db.trash[idx];
    var it = M.find(t.coll, t.refId);
    if (it) { delete it.deletedAt; }
    App.db.trash.splice(idx, 1);
    App.store.touch();
    return true;
  };

  M.labelOf = function (coll, it) {

      case 'products': return it.name + ' (' + it.sku + ')';
      case 'sales': return 'Invoice ' + it.invoiceNo + ' — ' + App.money(it.total);
      case 'payments': return 'Payment ' + App.money(it.amount) + ' on ' + App.fmtDate(it.date);
      case 'expenses': return it.category + ' — ' + App.money(it.amount);
      case 'prescriptions': return 'Prescription ' + App.fmtDate(it.date);
      case 'purchases': return 'Purchase ' + (it.billNo || '') + ' — ' + App.money(it.total);
      case 'suppliers': return it.name;

  /* =========================================================
     PRESCRIPTIONS
     ========================================================= */
  function eyeClean(e) {
    e = e || {};
    return { sph: e.sph || '', cyl: e.cyl || '', axis: e.axis || '', add: e.add || '', pd: e.pd || '' };
  }

  /* Contact lens power. Kept only when something was actually filled in, so the
     thousands of spectacles-only records stay exactly as they are. */
  function clEyeClean(e) {
    e = e || {};
    return { sph: e.sph || '', cyl: e.cyl || '', axis: e.axis || '', bc: e.bc || '', dia: e.dia || '' };
  }
  function clClean(c) {
    if (!c || typeof c !== 'object') return null;
    var out = { od: clEyeClean(c.od), os: clEyeClean(c.os), brand: (c.brand || '').trim() };
    return M.hasCl({ cl: out }) ? out : null;
  }
  M.clClean = clClean;

  /* Does this prescription carry a contact lens power? */
  M.hasCl = function (rx) {
    var c = rx && rx.cl;
    if (!c || typeof c !== 'object') return false;
    if (String(c.brand || '').trim()) return true;
    return ['od', 'os'].some(function (k) {
      var e = c[k] || {};
      return ['sph', 'cyl', 'axis', 'bc', 'dia'].some(function (f) {
        return String(e[f] === undefined || e[f] === null ? '' : e[f]).trim() !== '';

    });

      image: d.image || '',

  M.rxUpdate = function (id, d) {

    r.doctor = (d.doctor || '').trim();

  /* A copy of the prescription as it was when the bill was made, so later
     edits to the customer's record never rewrite an invoice already given out. */
  M.rxSnapshot = function (rx) {
    if (!rx || typeof rx !== 'object') return null;
    var str = function (v) { return v === undefined || v === null ? '' : String(v); };
    var eye = function (e) { e = e || {}; return { sph: str(e.sph), cyl: str(e.cyl), axis: str(e.axis), add: str(e.add), pd: str(e.pd) }; };
    var snap = { code: str(rx.code), date: typeof rx.date === 'string' ? rx.date : '', doctor: str(rx.doctor),
      followUpDate: typeof rx.followUpDate === 'string' ? rx.followUpDate : '', od: eye(rx.od), os: eye(rx.os) };
    if (M.hasCl(rx)) {
      var cle = function (e) { e = e || {}; return { sph: str(e.sph), cyl: str(e.cyl), axis: str(e.axis), bc: str(e.bc), dia: str(e.dia) }; };
      snap.cl = { od: cle(rx.cl.od), os: cle(rx.cl.os), brand: str(rx.cl.brand) };
    }
    return snap;
  };

  /* change which prescription prints on a saved invoice (null removes it) */
  M.setSalePrescription = function (saleId, rx) {
    var sale = M.find('sales', saleId);
    if (!sale) return false;
    sale.prescription = M.rxSnapshot(rx);
    sale.prescriptionId = rx && App.safeId(rx.id) && rx.customerId ? rx.id : '';
    App.store.touch();
    App.store.saveNow();
    return true;
  };

  M.followUpsDue = function (withinDays) {
    var today = App.today(), out = [];
    live(App.db.prescriptions).forEach(function (r) {
      if (!r.followUpDate) return;
      var d = App.daysBetween(today, r.followUpDate);
      if (d <= (withinDays === undefined ? 30 : withinDays)) {
        var c = M.find('customers', r.customerId);
        if (c && !c.deletedAt) out.push({ rx: r, customer: c, inDays: d });
      }
    });
    return out.sort(function (a, b) { return a.inDays - b.inDays; });
  };

  /* =========================================================
     PRODUCTS + STOCK

  M.CATEGORIES = ['General','Food & Drinks','Grocery','Retail','Services','Other'];

  M.products = function () { return live(App.db.products); };

  M.productCreate = function (d) {
    var minS = d.minStock === '' || d.minStock === undefined ? App.n(App.db.settings.lowStockGlobal) : App.n(d.minStock);
    var p = {
      id: App.uid('prd'),
      sku: d.sku && d.sku.trim() ? d.sku.trim() : M.nextSKU(),
      name: (d.name || '').trim(),
      brand: (d.brand || '').trim(),
      category: d.category || M.CATEGORIES[0],
      model: (d.model || '').trim(),
      costPrice: App.n(d.costPrice),
      sellPrice: App.n(d.sellPrice),
      mrp: App.n(d.mrp),
      stock: 0,                 /* total across variants, kept in sync by stockMove */
      minStock: minS,
      variants: [],             /* clothing: [{id,size,colour,sku,stock,minStock,barcode}] */
      supplierId: d.supplierId || '',
      image: d.image || '',
      notes: (d.notes || '').trim(),
      createdAt: App.nowISO(),
      updatedAt: App.nowISO()
    };
    /* Build variants. If none supplied, make one plain variant (opening stock d.stock). */
    var rows = Array.isArray(d.variants) && d.variants.length ? d.variants : [{ size: (d.size||''), colour: (d.colour||''), barcode: (d.barcode||''), stock: d.stock }];
    rows.forEach(function (v) {
      p.variants.push({ id: App.uid('var'), size: (v.size||'').trim(), colour: (v.colour||'').trim(),
        sku: (v.sku||'').trim(), minStock: v.minStock===''||v.minStock===undefined ? minS : App.n(v.minStock),
        barcode: (v.barcode||'').trim(), stock: 0 });
    });
    App.db.products.push(p);
    p.variants.forEach(function (v, i) {
      var opening = App.n(rows[i] && rows[i].stock);
      if (opening) M.stockMove(p.id, opening, 'opening', 'product', p.id, 'Opening stock', v.id);
    });

    return p;
  };

  /* Helpers for variants */
  M.variantLabel = function (v) {
    if (!v) return '';
    var parts = [v.size, v.colour].filter(function (x) { return x && String(x).trim(); });
    return parts.join(' / ') || 'Standard';
  };
  M.productVariant = function (p, variantId) {
    if (!p || !p.variants) return null;
    return p.variants.filter(function (v) { return v.id === variantId; })[0] || null;
  };
  M.productStock = function (p) {
    if (!p) return 0;
    if (p.variants && p.variants.length) return App.round2(App.sum(p.variants, function (v) { return App.n(v.stock); }));
    return App.n(p.stock);
  };

  M.productUpdate = function (id, d) {
    var p = M.find('products', id);
    if (!p) return null;
    ['sku','name','brand','category','model','supplierId','notes','image'].forEach(function (k) {
      if (d[k] !== undefined) p[k] = typeof d[k] === 'string' ? d[k].trim() : d[k];
    });
    ['costPrice','sellPrice','mrp','minStock'].forEach(function (k) {
      if (d[k] !== undefined) p[k] = App.n(d[k]);
    });
    /* stock is only changed through stockMove so the ledger always matches */
    if (d.stock !== undefined && App.n(d.stock) !== App.n(p.stock)) {
      var diff = App.round2(App.n(d.stock) - App.n(p.stock));
      M.stockMove(p.id, diff, 'adjust', 'manual', '', 'Manual stock correction');
    }
    p.updatedAt = App.nowISO();
    App.store.touch();
    return p;
  };

  /* the ONLY function that changes stock. variantId targets one size/colour. */
  M.stockMove = function (productId, qty, type, refType, refId, note, variantId) {
    var p = M.find('products', productId);
    if (!p) return null;
    var v = variantId ? M.productVariant(p, variantId) : (p.variants && p.variants[0]);
    if (v) v.stock = App.round2(App.n(v.stock) + App.n(qty));
    else p.stock = App.round2(App.n(p.stock) + App.n(qty));
    p.stock = M.productStock(p);     /* keep the product total in sync */
    var mv = {
      id: App.uid('mv'),
      seq: App.db.counters.stockMove++,
      date: App.today(),
      productId: productId,
      variantId: v ? v.id : '',
      qty: App.round2(qty),
      type: type,               /* opening|sale|sale-return|purchase|purchase-return|adjust */
      refType: refType || '',
      refId: refId || '',
      note: note || '',
      balanceAfter: v ? v.stock : p.stock,
      createdAt: App.nowISO()
    };
    App.db.stockMoves.push(mv);
    return mv;
  };

  M.lowStock = function () {
    return M.products().filter(function (p) {
      if (p.variants && p.variants.length) return p.variants.some(function (v) { return App.n(v.stock) <= App.n(v.minStock !== undefined ? v.minStock : p.minStock); });
      return App.n(p.stock) <= App.n(p.minStock);
    }).sort(function (a, b) { return M.productStock(a) - M.productStock(b); });
  };
  /* Flat list of low variants for the report/list screens. */
  /* Replace a product's variants from the form (adds stock moves for changes). */
  M.setVariants = function (productId, rows) {
    var p = M.find('products', productId);
    if (!p) return null;
    if (!Array.isArray(p.variants)) p.variants = [];
    var minDefault = App.n(p.minStock);
    var keep = {};
    (rows || []).forEach(function (r) {
      var v = r.id ? M.productVariant(p, r.id) : null;
      var want = App.n(r.stock);
      var min = r.minStock === '' || r.minStock === undefined ? minDefault : App.n(r.minStock);
      if (v) {
        v.size = (r.size||'').trim(); v.colour = (r.colour||'').trim(); v.sku = (r.sku||'').trim();
        v.barcode = (r.barcode||'').trim(); v.minStock = min;
        var diff = App.round2(want - App.n(v.stock));
        if (diff) M.stockMove(p.id, diff, 'adjust', 'manual', '', 'Stock correction ('+M.variantLabel(v)+')', v.id);
        keep[v.id] = 1;
      } else {
        var nv = { id: App.uid('var'), size:(r.size||'').trim(), colour:(r.colour||'').trim(), sku:(r.sku||'').trim(), barcode:(r.barcode||'').trim(), minStock: min, stock: 0 };
        p.variants.push(nv); keep[nv.id] = 1;
        if (want) M.stockMove(p.id, want, 'opening', 'product', p.id, 'Opening stock ('+M.variantLabel(nv)+')', nv.id);
      }
    });
    /* remove variants the form dropped (only if they have no stock) */
    p.variants = p.variants.filter(function (v) { return keep[v.id] || App.n(v.stock) !== 0; });
    if (!p.variants.length) p.variants.push({ id: App.uid('var'), size:'', colour:'', sku:'', barcode:'', minStock: minDefault, stock: 0 });
    p.stock = M.productStock(p);
    p.updatedAt = App.nowISO();
    App.store.touch();
    return p;
  };

  M.lowStockVariants = function () {
    var out = [];
    M.products().forEach(function (p) {
      (p.variants || []).forEach(function (v) {
        var min = App.n(v.minStock !== undefined ? v.minStock : p.minStock);
        if (App.n(v.stock) <= min) out.push({ product: p, variant: v, stock: App.n(v.stock), min: min });
      });
    });
    return out.sort(function (a, b) { return a.stock - b.stock; });
  };

  /* =========================================================
     SALES / INVOICES
     ========================================================= */
  M.PAY_METHODS = ['Cash','UPI','Card','Bank Transfer','Credit','Other'];

  M.sales = function () { return live(App.db.sales); };

  /* Compute totals from raw line items + discount/tax settings */
  M.calcSale = function (items, opts) {
    opts = opts || {};
    var sub = 0, itemDisc = 0;
    var lines = items.map(function (it) {
      var qty = App.n(it.qty), rate = App.n(it.rate);
      var gross = App.round2(qty * rate);
      var d = App.n(it.discount);
      var dAmt = (it.discountType === '%') ? App.round2(gross * d / 100) : App.round2(d);
      if (dAmt > gross) dAmt = gross;
      var net = App.round2(gross - dAmt);
      sub += gross; itemDisc += dAmt;
      return Object.assign({}, it, { gross: gross, discountAmount: dAmt, amount: net });
    });
    sub = App.round2(sub);
    itemDisc = App.round2(itemDisc);
    var afterItem = App.round2(sub - itemDisc);

    /* bill-level discount */
    var bd = App.n(opts.billDiscount);
    var billDisc = (opts.billDiscountType === '%') ? App.round2(afterItem * bd / 100) : App.round2(bd);
    if (billDisc > afterItem) billDisc = afterItem;
    var taxable = App.round2(afterItem - billDisc);

    /* tax */
    var taxPct = App.n(opts.taxPercent);
    var taxAmount = 0, grand = taxable;
    if (opts.taxEnabled && taxPct > 0) {
      if (opts.taxInclusive) {
        taxAmount = App.round2(taxable - (taxable * 100 / (100 + taxPct)));
        grand = taxable;
      } else {
        taxAmount = App.round2(taxable * taxPct / 100);
        grand = App.round2(taxable + taxAmount);
      }
    }
    var rounded = Math.round(grand);
    var roundOff = opts.roundOff ? App.round2(rounded - grand) : 0;
    if (opts.roundOff) grand = rounded;

    return {
      lines: lines,
      subtotal: sub,
      itemDiscount: itemDisc,
      billDiscount: billDisc,
      totalDiscount: App.round2(itemDisc + billDisc),
      taxable: taxable,
      taxPercent: taxPct,
      taxAmount: taxAmount,
      roundOff: roundOff,
      total: App.round2(grand)
    };
  };

  /* ATOMIC: builds the invoice, payment row and stock moves, then one save.
     Anything thrown before commit leaves the database untouched. */
  M.saleCreate = function (d) {
    if (!d.items || !d.items.length) throw new Error('Add at least one product.');
    d.items.forEach(function (it) {
      if (!(App.n(it.qty) > 0)) throw new Error('Quantity must be more than 0 for "' + it.name + '".');
      if (App.n(it.rate) < 0) throw new Error('Rate cannot be negative for "' + it.name + '".');
    });

    var calc = M.calcSale(d.items, d);

    /* a bill can be paid in parts (Cash 500 + UPI 700). Each part becomes its own payment
       record, so cash in hand and the method totals in Reports stay exact. */
    var split = (d.payments || []).map(function (p) {
      return { method: p.method || 'Cash', amount: App.round2(Math.max(0, App.n(p.amount))) };
    }).filter(function (p) { return p.amount > 0.004; });
    var paidNow = split.length ? App.round2(App.sum(split, function (p) { return p.amount; })) : App.n(d.paidNow);
    if (paidNow > calc.total) {
      var over = App.round2(paidNow - calc.total);
      for (var si = split.length - 1; si >= 0 && over > 0; si--) {   /* never record more than the bill */
        var cut = Math.min(split[si].amount, over);
        split[si].amount = App.round2(split[si].amount - cut);
        over = App.round2(over - cut);
      }
      split = split.filter(function (p) { return p.amount > 0.004; });
      paidNow = calc.total;
    }
    var mainMethod = split.length
      ? split.slice().sort(function (a, b) { return b.amount - a.amount; })[0].method
      : (d.paymentMethod || 'Cash');

    /* --- validate stock before touching anything --- */
    var problems = [];
    calc.lines.forEach(function (l) {
      if (!l.productId) return;
      var p = M.find('products', l.productId);
      if (!p) return;
      var v = l.variantId ? M.productVariant(p, l.variantId) : (p.variants && p.variants[0]);
      var have = v ? App.n(v.stock) : App.n(p.stock);
      if (have < App.n(l.qty)) {
        var lbl = v ? (p.name + ' (' + M.variantLabel(v) + ')') : p.name;
        problems.push(lbl + ' (stock ' + have + ', needed ' + App.n(l.qty) + ')');
      }
    });
    if (problems.length && !d.allowNegativeStock) {
      var e = new Error('Not enough stock: ' + problems.join(', '));
      e.code = 'LOW_STOCK';
      e.problems = problems;
      throw e;
    }

    var saleId = App.uid('sal');
    var invoiceNo = d.invoiceNo || M.nextInvoiceNo();
    /* a bill linked to a customer should carry their name even if the caller did not pass it */
    var linked = d.customerId ? M.find('customers', d.customerId) : null;

    var sale = {
      id: saleId,
      invoiceNo: invoiceNo,
      date: d.date || App.today(),
      customerId: d.customerId || '',
      customerName: d.customerName || (linked ? linked.name : ''),
      customerMobile: d.customerMobile || (linked ? linked.mobile : ''),
      items: calc.lines.map(lineOut),
      subtotal: calc.subtotal,
      itemDiscount: calc.itemDiscount,
      billDiscount: calc.billDiscount,
      billDiscountRaw: App.n(d.billDiscount),
      billDiscountType: d.billDiscountType || '₹',
      totalDiscount: calc.totalDiscount,
      taxEnabled: !!d.taxEnabled,
      taxInclusive: !!d.taxInclusive,
      taxPercent: calc.taxPercent,
      taxAmount: calc.taxAmount,
      roundOff: calc.roundOff,
      total: calc.total,
      paymentMethod: mainMethod,
      paymentSplit: split.length > 1 ? split : null,
      notes: (d.notes || '').trim(),
      status: 'active',
      createdAt: App.nowISO()
    };

    /* --- commit --- */
    App.db.sales.push(sale);

    (split.length ? split : (paidNow > 0 ? [{ method: mainMethod, amount: App.round2(paidNow) }] : [])).forEach(function (part) {
      App.db.payments.push({
        id: App.uid('pay'),
        customerId: sale.customerId,
        saleId: saleId,
        date: sale.date,
        amount: App.round2(part.amount),
        method: part.method,
        note: 'Paid with invoice ' + invoiceNo,
        atInvoice: true,
        createdAt: App.nowISO()
      });
    });

    sale.items.forEach(function (l) {
      if (l.productId) M.stockMove(l.productId, -App.n(l.qty), 'sale', 'sale', saleId, 'Invoice ' + invoiceNo, l.variantId);
    });

    App.store.touch();
    if (!d.noSave) App.store.saveNow();       /* money moved — write straight away (a bulk import saves once at the end) */
    return sale;
  };

  /* Cancel: stock goes back, invoice marked cancelled, its payments reversed */
  /* the shape of one line as it is kept on a saved bill */
  function lineOut(l) {
    return {
      productId: l.productId || '',
      variantId: l.variantId || '',
      variantLabel: l.variantLabel || '',
      sku: l.sku || '',
      name: l.name,
      qty: App.n(l.qty),
      rate: App.n(l.rate),
      costPrice: App.n(l.costPrice),
      discount: App.n(l.discount),
      discountType: l.discountType || '₹',
      discountAmount: l.discountAmount,
      amount: l.amount
    };
  }

  /* ---------------------------------------------------------------
     Correct a bill that has already been made.
     The invoice number stays the same, the money already received is
     left alone, stock moves by the difference only, and the version
     being replaced is kept on the bill so nothing is quietly rewritten.
     --------------------------------------------------------------- */
  M.saleUpdate = function (id, d) {
    var s = M.find('sales', id);
    if (!s) return null;
    if (s.status === 'cancelled') throw new Error('A cancelled bill cannot be changed.');

    var calc = M.calcSale(d.items, d);

    /* stock: only the difference matters */
    var oldQty = {}, newQty = {}, keyMeta = {};
    function kOf(l) { return (l.productId || '') + '::' + (l.variantId || ''); }
    s.items.forEach(function (l) { if (l.productId) { var k=kOf(l); oldQty[k]=App.n(oldQty[k])+App.n(l.qty); keyMeta[k]={pid:l.productId,vid:l.variantId||''}; } });
    calc.lines.forEach(function (l) { if (l.productId) { var k=kOf(l); newQty[k]=App.n(newQty[k])+App.n(l.qty); keyMeta[k]={pid:l.productId,vid:l.variantId||''}; } });

    var problems = [];
    Object.keys(newQty).forEach(function (k) {
      var extra = App.round2(newQty[k] - App.n(oldQty[k]));
      if (extra <= 0) return;
      var m = keyMeta[k], p = M.find('products', m.pid);
      if (!p) return;
      var v = m.vid ? M.productVariant(p, m.vid) : (p.variants && p.variants[0]);
      var have = v ? App.n(v.stock) : App.n(p.stock);
      if (have < extra) problems.push((v ? p.name+' ('+M.variantLabel(v)+')' : p.name) + ' (stock ' + have + ', ' + extra + ' more needed)');
    });
    if (problems.length && !d.allowNegativeStock) {
      var e = new Error('Not enough stock: ' + problems.join(', '));
      e.code = 'LOW_STOCK';
      e.problems = problems;
      throw e;
    }

    var wantNo = String(d.invoiceNo || '').trim();
    if (wantNo && wantNo !== s.invoiceNo) {
      var taken = App.db.sales.filter(function (x) { return x.id !== id && x.invoiceNo === wantNo; })[0];
      if (taken) {
        var e2 = new Error('Bill number ' + wantNo + ' is already used by another bill (' + (taken.customerName || 'walk-in') + ').');
        e2.code = 'NUMBER_TAKEN';
        throw e2;
      }
    }

    var linked = d.customerId ? M.find('customers', d.customerId) : null;

    /* keep the version being replaced */
    if (!Array.isArray(s.edits)) s.edits = [];
    s.edits.push({
      at: App.nowISO(),
      reason: (d.reason || '').trim(),
      before: {
        date: s.date, invoiceNo: s.invoiceNo, received: M.salePaid(id),
        customerId: s.customerId, customerName: s.customerName, customerMobile: s.customerMobile,
        items: JSON.parse(JSON.stringify(s.items)),
        subtotal: s.subtotal, totalDiscount: s.totalDiscount,
        billDiscountRaw: App.n(s.billDiscountRaw), billDiscountType: s.billDiscountType,
        taxEnabled: !!s.taxEnabled, taxPercent: App.n(s.taxPercent), taxAmount: App.n(s.taxAmount),
        roundOff: s.roundOff, total: App.n(s.total), notes: s.notes || ''
      }
    });

    /* stock correction, product by product */
    var done = {};
    Object.keys(oldQty).concat(Object.keys(newQty)).forEach(function (k) {
      if (done[k]) return;
      done[k] = 1;
      var diff = App.round2(App.n(newQty[k]) - App.n(oldQty[k]));
      if (!diff) return;
      var m = keyMeta[k];
      M.stockMove(m.pid, -diff, diff > 0 ? 'sale' : 'sale-return', 'sale', id, 'Invoice ' + s.invoiceNo + ' corrected', m.vid);
    });

    if (wantNo) s.invoiceNo = wantNo;
    s.date = d.date || s.date;
    s.customerId = d.customerId || '';
    s.customerName = d.customerName || (linked ? linked.name : '');
    s.customerMobile = d.customerMobile || (linked ? linked.mobile : '');
    s.items = calc.lines.map(lineOut);
    s.subtotal = calc.subtotal;
    s.itemDiscount = calc.itemDiscount;
    s.billDiscount = calc.billDiscount;
    s.billDiscountRaw = App.n(d.billDiscount);
    s.billDiscountType = d.billDiscountType || '₹';
    s.totalDiscount = calc.totalDiscount;
    s.taxEnabled = !!d.taxEnabled;
    s.taxInclusive = !!d.taxInclusive;
    s.taxPercent = calc.taxPercent;
    s.taxAmount = calc.taxAmount;
    s.roundOff = calc.roundOff;
    s.total = calc.total;
    s.notes = (d.notes || '').trim();
    s.editedAt = App.nowISO();

    /* money taken with the bill, when the caller corrected it (payments recorded later,
       through "Receive payment", are never touched here) */
    if (Array.isArray(d.payments)) {
      var parts = d.payments.map(function (x) {
        return { method: (x && x.method) || 'Cash', amount: App.round2(App.n(x && x.amount)) };
      }).filter(function (x) { return x.amount > 0.004; });
      App.db.payments = App.db.payments.filter(function (p) { return !(p.saleId === id && p.atInvoice && !p.deletedAt); });
      parts.forEach(function (part) {
        App.db.payments.push({
          id: App.uid('pay'),
          customerId: s.customerId,
          saleId: id,
          date: s.date,
          amount: part.amount,
          method: part.method,
          note: 'Paid with invoice ' + s.invoiceNo,
          atInvoice: true,
          createdAt: App.nowISO()
        });
      });
      if (parts.length) {
        s.paymentMethod = parts.slice().sort(function (a, b) { return b.amount - a.amount; })[0].method;
        s.paymentSplit = parts.length > 1 ? parts : null;
      } else {
        s.paymentSplit = null;
      }
    }

    /* the rest of the money on this bill keeps pointing at the right customer and date */
    App.db.payments.forEach(function (p) {
      if (p.saleId !== id || p.deletedAt) return;
      p.customerId = s.customerId;
      if (p.atInvoice) p.date = s.date;
    });

    App.store.touch();
    App.store.saveNow();
    return s;
  };

  /* plain-English list of what changed between two versions of a bill */
  M.saleChanges = function (a, b) {
    var out = [];
    var keyOf = function (l) { return l.productId ? 'p:' + l.productId : 'n:' + App.norm(l.name || ''); };
    var pack = function (list) {
      var m = {};
      (list || []).forEach(function (l) {
        var k = keyOf(l);
        if (!m[k]) m[k] = { name: l.name, qty: 0, rate: App.n(l.rate) };
        m[k].qty = App.round2(m[k].qty + App.n(l.qty));
        m[k].rate = App.n(l.rate);
        m[k].name = l.name;
      });
      return m;
    };
    var A = pack(a.items), B = pack(b.items);
    Object.keys(B).forEach(function (k) {
      if (!A[k]) { out.push('Added: ' + B[k].name + ' (' + B[k].qty + ' × ' + App.money(B[k].rate) + ')'); return; }
      if (A[k].name !== B[k].name) out.push('Item name: ' + A[k].name + ' → ' + B[k].name);
      if (A[k].qty !== B[k].qty) out.push(B[k].name + ' — quantity ' + A[k].qty + ' → ' + B[k].qty);
      if (App.round2(A[k].rate) !== App.round2(B[k].rate)) out.push(B[k].name + ' — price ' + App.money(A[k].rate) + ' → ' + App.money(B[k].rate));
    });
    Object.keys(A).forEach(function (k) {
      if (!B[k]) out.push('Removed: ' + A[k].name + ' (' + A[k].qty + ' × ' + App.money(A[k].rate) + ')');
    });
    var nameA = a.customerName || 'Walk-in', nameB = b.customerName || 'Walk-in';
    if (nameA !== nameB) out.push('Name on the bill: ' + nameA + ' → ' + nameB);
    if ((a.customerMobile || '') !== (b.customerMobile || '')) {
      out.push('Mobile on the bill: ' + (a.customerMobile || 'none') + ' → ' + (b.customerMobile || 'none'));
    }
    if (a.invoiceNo && b.invoiceNo && a.invoiceNo !== b.invoiceNo) out.push('Bill number: ' + a.invoiceNo + ' → ' + b.invoiceNo);
    if (a.received !== undefined && b.received !== undefined &&
        App.round2(App.n(a.received)) !== App.round2(App.n(b.received))) {
      out.push('Money received: ' + App.money(a.received) + ' → ' + App.money(b.received));
    }
    if (a.date !== b.date) out.push('Bill date: ' + App.fmtDate(a.date) + ' → ' + App.fmtDate(b.date));
    if (App.round2(App.n(a.billDiscountRaw)) !== App.round2(App.n(b.billDiscountRaw)) ||
        (a.billDiscountType || '₹') !== (b.billDiscountType || '₹')) {
      var dt = function (x) { return App.n(x.billDiscountRaw) ? App.n(x.billDiscountRaw) + ((x.billDiscountType || '₹') === '%' ? '%' : '₹') : 'none'; };
      out.push('Discount on bill: ' + dt(a) + ' → ' + dt(b));
    }
    if (!!a.taxEnabled !== !!b.taxEnabled || App.n(a.taxPercent) !== App.n(b.taxPercent)) {
      var tx = function (x) { return x.taxEnabled ? 'GST ' + App.n(x.taxPercent) + '%' : 'no GST'; };
      out.push(tx(a) + ' → ' + tx(b));
    }
    var rxOf = function (x) {
      var p = x.prescription;
      return p ? (p.code || (p.date ? App.fmtDate(p.date) : '') || 'one prescription') : '';
    };
    if (rxOf(a) !== rxOf(b)) out.push('Prescription on the bill: ' + (rxOf(a) || 'none') + ' → ' + (rxOf(b) || 'none'));
    if ((a.notes || '') !== (b.notes || '')) out.push('Note on the bill changed');
    if (App.round2(App.n(a.total)) !== App.round2(App.n(b.total))) {
      out.push('Total: ' + App.money(a.total) + ' → ' + App.money(b.total));
    }
    return out;
  };

  M.saleCancel = function (id, reason) {
    var s = M.find('sales', id);
    if (!s || s.status === 'cancelled') return false;
    s.status = 'cancelled';
    s.cancelledAt = App.nowISO();
    s.cancelReason = reason || '';
    s.total = 0;               /* keeps outstanding math honest */
    s.totalBeforeCancel = s.totalBeforeCancel === undefined ? s.subtotal : s.totalBeforeCancel;

    s.items.forEach(function (l) {
      if (l.productId) M.stockMove(l.productId, App.n(l.qty), 'sale-return', 'sale', id, 'Invoice ' + s.invoiceNo + ' cancelled', l.variantId);
    });

    /* remove payments attached to this invoice */
    App.db.payments.forEach(function (p) {
      if (p.saleId === id && !p.deletedAt) {
        p.deletedAt = App.nowISO();
        p.note = (p.note || '') + ' [invoice cancelled]';
      }
    });

    App.store.touch();
    App.store.saveNow();
    return true;
  };

  M.saleProfit = function (s) {
    if (s.status === 'cancelled') return 0;
    if (s.imported === 'register') return 0;     /* the register never recorded what things cost */
    var cost = App.sum(s.items, function (l) { return App.n(l.costPrice) * App.n(l.qty); });
    var net = App.round2(App.n(s.total) - App.n(s.taxAmount));
    return App.round2(net - cost);
  };

  M.salePaid = function (saleId) { return App.round2(M.index().paidBySale[saleId] || 0); };

  /* =========================================================
     PAYMENTS (credit collection)
     ========================================================= */
  M.paymentCreate = function (d) {
    var p = {
      id: App.uid('pay'),
      customerId: d.customerId || '',
      saleId: d.saleId || '',
      date: d.date || App.today(),
      amount: App.round2(App.n(d.amount)),
      method: d.method || 'Cash',
      note: (d.note || '').trim(),
      atInvoice: false,
      createdAt: App.nowISO()
    };
    if (p.amount <= 0) throw new Error('Amount must be more than 0.');
    App.db.payments.push(p);
    App.store.touch();
    App.store.saveNow();
    return p;
  };

  M.payments = function () { return live(App.db.payments); };

  /* =========================================================
     PURCHASES (stock in)
     ========================================================= */
  M.purchaseCreate = function (d) {
    if (!d.items || !d.items.length) throw new Error('Add at least one product.');
    d.items.forEach(function (it) {
      if (!(App.n(it.qty) > 0)) throw new Error('Quantity must be more than 0 for "' + it.name + '".');
      if (App.n(it.rate) < 0) throw new Error('Rate cannot be negative for "' + it.name + '".');
    });
    var id = App.uid('pur');
    var items = d.items.map(function (it) {
      return {
        productId: it.productId, name: it.name, qty: App.n(it.qty),
        rate: App.n(it.rate), amount: App.round2(App.n(it.qty) * App.n(it.rate))
      };
    });
    var total = App.sum(items, function (i) { return i.amount; });
    var pu = {
      id: id, date: d.date || App.today(), supplierId: d.supplierId || '',
      billNo: (d.billNo || '').trim(), items: items, total: total,
      paid: App.n(d.paid), method: d.method || 'Cash',
      notes: (d.notes || '').trim(), status: 'active', createdAt: App.nowISO()
    };
    App.db.purchases.push(pu);
    items.forEach(function (i) {
      if (i.productId) M.stockMove(i.productId, i.qty, 'purchase', 'purchase', id, 'Purchase ' + (pu.billNo || ''));
    });
    /* update cost price to latest purchase rate */
    items.forEach(function (i) {
      var p = M.find('products', i.productId);
      if (p && i.rate > 0) { p.costPrice = i.rate; p.updatedAt = App.nowISO(); }
    });
    App.store.touch();
    App.store.saveNow();
    return pu;
  };

  M.purchaseCancel = function (id) {
    var pu = M.find('purchases', id);
    if (!pu || pu.status === 'cancelled') return false;
    pu.status = 'cancelled';
    pu.cancelledAt = App.nowISO();
    pu.items.forEach(function (i) {
      if (i.productId) M.stockMove(i.productId, -i.qty, 'purchase-return', 'purchase', id, 'Purchase cancelled');
    });
    App.store.touch(); App.store.saveNow();
    return true;
  };

  M.purchases = function () { return live(App.db.purchases); };

  /* =========================================================
     EXPENSES
     ========================================================= */
  M.EXPENSE_CATEGORIES = ['Shop Rent','Electricity','Salary','Internet','Transport','Packaging','Repairs','Purchase','Marketing','Tea / Food','Other'];

  M.expenseCreate = function (d) {
    var e = {
      id: App.uid('exp'),
      date: d.date || App.today(),
      category: d.category || 'Other',
      amount: App.round2(App.n(d.amount)),
      method: d.method || 'Cash',
      description: (d.description || '').trim(),
      notes: (d.notes || '').trim(),
      createdAt: App.nowISO()
    };
    if (e.amount <= 0) throw new Error('Amount must be more than 0.');
    App.db.expenses.push(e);
    App.store.touch(); App.store.saveNow();
    return e;
  };

  M.expenseUpdate = function (id, d) {
    var e = M.find('expenses', id);
    if (!e) return null;
    e.date = d.date || e.date;
    e.category = d.category || e.category;
    e.amount = App.round2(App.n(d.amount));
    e.method = d.method || e.method;
    e.description = (d.description || '').trim();
    e.notes = (d.notes || '').trim();
    App.store.touch();
    return e;
  };

  M.expenses = function () { return live(App.db.expenses); };

  /* =========================================================
     DAY / RANGE SUMMARY  (the accounting core)
     ========================================================= */
  M.summary = function (from, to) {
    to = to || from;
    function inR(d) { var x = String(d).slice(0, 10); return x >= from && x <= to; }

    var sales = M.sales().filter(function (s) { return s.status !== 'cancelled' && inR(s.date); });
    var pays = M.payments().filter(function (p) { return inR(p.date); });
    var exps = M.expenses().filter(function (e) { return inR(e.date); });
    var purs = M.purchases().filter(function (p) { return p.status !== 'cancelled' && inR(p.date); });

    var byMethod = {};
    M.PAY_METHODS.forEach(function (m) { byMethod[m] = 0; });
    pays.forEach(function (p) { byMethod[p.method] = App.round2((byMethod[p.method] || 0) + App.n(p.amount)); });

    var salesByMethod = {};
    M.PAY_METHODS.forEach(function (m) { salesByMethod[m] = 0; });
    sales.forEach(function (s) {
      var parts = s.paymentSplit && s.paymentSplit.length > 1 ? s.paymentSplit : null;
      if (!parts) {
        salesByMethod[s.paymentMethod] = App.round2((salesByMethod[s.paymentMethod] || 0) + App.n(s.total));
        return;
      }
      var used = 0;                       /* a split bill counts under each method it was paid with */
      parts.forEach(function (p) {
        salesByMethod[p.method] = App.round2((salesByMethod[p.method] || 0) + App.n(p.amount));
        used = App.round2(used + App.n(p.amount));
      });
      var rest = App.round2(App.n(s.total) - used);      /* anything still owed sits with the main method */
      if (rest > 0.004) salesByMethod[s.paymentMethod] = App.round2((salesByMethod[s.paymentMethod] || 0) + rest);
    });

    var totalSales = App.sum(sales, function (s) { return s.total; });
    var collected = App.sum(pays, function (p) { return p.amount; });
    var expenses = App.sum(exps, function (e) { return e.amount; });
    var grossProfit = App.sum(sales, function (s) { return M.saleProfit(s); });
    var creditGiven = App.round2(totalSales - App.sum(pays.filter(function (p) { return p.atInvoice; }), function (p) { return p.amount; }));

    var newCustomers = M.customers().filter(function (c) { return inR(c.registeredOn || App.dstr(c.createdAt)); }).length;

    return {
      from: from, to: to,
      sales: sales, payments: pays, expenses: exps, purchases: purs,
      totalSales: totalSales,
      invoiceCount: sales.length,
      itemsSold: App.sum(sales, function (s) { return App.sum(s.items, function (i) { return i.qty; }); }),
      collected: collected,
      collectionByMethod: byMethod,
      salesByMethod: salesByMethod,
      cashIn: App.round2(App.n(byMethod['Cash'])),
      upiIn: App.round2(App.n(byMethod['UPI'])),
      cardIn: App.round2(App.n(byMethod['Card'])),
      bankIn: App.round2(App.n(byMethod['Bank Transfer'])),
      creditGiven: creditGiven > 0 ? creditGiven : 0,
      totalExpenses: expenses,
      purchaseTotal: App.sum(purs, function (p) { return p.total; }),
      grossProfit: grossProfit,
      netProfit: App.round2(grossProfit - expenses),
      taxCollected: App.sum(sales, function (s) { return s.taxAmount; }),
      discountGiven: App.sum(sales, function (s) { return s.totalDiscount; }),
      newCustomers: newCustomers,
      cashInHand: App.round2(App.n(byMethod['Cash']) - App.sum(exps.filter(function (e) { return e.method === 'Cash'; }), function (e) { return e.amount; }))
    };
  };

  /* every day in a range in ONE pass — the daily report used to recount everything per day */
  M.summaryByDay = function (from, to) {
    var days = {};
    function day(dt) {
      return days[dt] || (days[dt] = { date: dt, invoiceCount: 0, totalSales: 0, discountGiven: 0, collected: 0,
        cashIn: 0, upiIn: 0, totalExpenses: 0, grossProfit: 0 });
    }
    function inR(dt) { return dt >= from && dt <= to; }
    App.db.sales.forEach(function (x) {
      if (x.deletedAt || x.status === 'cancelled' || !inR(x.date)) return;
      var r = day(x.date);
      r.invoiceCount++; r.totalSales += App.n(x.total); r.discountGiven += App.n(x.totalDiscount); r.grossProfit += M.saleProfit(x);
    });
    App.db.payments.forEach(function (x) {
      if (x.deletedAt || !inR(x.date)) return;
      var r = day(x.date), amt = App.n(x.amount);
      r.collected += amt;
      if (x.method === 'Cash') r.cashIn += amt; else if (x.method === 'UPI') r.upiIn += amt;
    });
    App.db.expenses.forEach(function (x) {
      if (!x.deletedAt && inR(x.date)) day(x.date).totalExpenses += App.n(x.amount);
    });
    return Object.keys(days).sort().reverse().map(function (k) {
      var r = days[k];
      ['totalSales','discountGiven','collected','cashIn','upiIn','totalExpenses','grossProfit'].forEach(function (f) { r[f] = App.round2(r[f]); });
      r.netProfit = App.round2(r.grossProfit - r.totalExpenses);
      return r;
    });
  };

  /* =========================================================
     SEARCH (global)
     ========================================================= */
  M.search = function (q, limit) {
    q = App.norm(q);
    if (!q) return [];
    limit = limit || 30;
    var out = [];

    M.customers().forEach(function (c) {
      if (out.length >= limit * 3) return;
      var hay = App.norm(c.name + ' ' + c.mobile + ' ' + c.altMobile + ' ' + c.code + ' ' + c.email);
      if (hay.indexOf(q) >= 0) out.push({ type: 'customer', id: c.id, title: c.name,
        sub: c.code + ' · ' + (App.oneLine(c.address) || c.mobile || 'no address'), obj: c });
    });

    M.products().forEach(function (p) {
      if (out.length >= limit * 3) return;
      var hay = App.norm(p.name + ' ' + p.sku + ' ' + p.brand + ' ' + p.model + ' ' + p.barcode + ' ' + p.category);
      if (hay.indexOf(q) >= 0) out.push({ type: 'product', id: p.id, title: p.name, sub: p.sku + ' · ' + p.brand + ' · Stock ' + App.n(p.stock), obj: p });
    });

    M.sales().forEach(function (s) {
      if (out.length >= limit * 3) return;
      var hay = App.norm(s.invoiceNo + ' ' + s.customerName + ' ' + s.customerMobile);
      if (hay.indexOf(q) >= 0) out.push({ type: 'sale', id: s.id, title: 'Invoice ' + s.invoiceNo, sub: (s.customerName || 'Walk-in') + ' · ' + App.fmtDate(s.date) + ' · ' + App.money(s.total), obj: s });
    });

    M.suppliers().forEach(function (s) {
      if (out.length >= limit * 3) return;
      if (App.norm(s.name + ' ' + s.phone).indexOf(q) >= 0)
        out.push({ type: 'supplier', id: s.id, title: s.name, sub: s.phone || 'Supplier', obj: s });
    });

    return out.slice(0, limit);
  };
})();


/* ===== 30-ui.js ===== */
/* =========================================================================
   30-ui.js — shell, router, modal, confirm, toast, form helpers
   ========================================================================= */
(function () {
  'use strict';

  var UI = {};
  App.UI = UI;
  App.routes = {};

  /* ---------------- toast ---------------- */
  App.toast = function (msg, kind, ms) {
    var wrap = App.el('#toasts');
    if (!wrap) return;
    var t = App.h('div', { class: 'toast ' + (kind || '') }, App.esc(msg));
    wrap.appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity .25s, transform .25s';
      t.style.opacity = '0'; t.style.transform = 'translateY(8px)';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 260);
    }, ms || 2600);
  };

  /* ---------------- modal ---------------- */
  var openModals = [];

  UI.modal = function (opts) {
    var bg = App.h('div', { class: 'modal-bg' });
    var m = App.h('div', { class: 'modal ' + (opts.size || '') });
    m.innerHTML =
      '<div class="modal-head"><h3>' + App.esc(opts.title || '') + '</h3>' +
      '<button class="x" data-close type="button" aria-label="Close">' + App.icon('x', 20) + '</button></div>' +
      '<div class="modal-body"></div>' +
      (opts.footer === false ? '' : '<div class="modal-foot"></div>');
    bg.appendChild(m);

    var body = App.el('.modal-body', m);
    if (typeof opts.body === 'string') body.innerHTML = opts.body;
    else if (opts.body) body.appendChild(opts.body);

    var foot = App.el('.modal-foot', m);
    var api = {
      el: m, body: body, foot: foot, bg: bg,
      close: function () {
        if (bg.parentNode) bg.parentNode.removeChild(bg);
        var i = openModals.indexOf(api);
        if (i >= 0) openModals.splice(i, 1);
        if (opts.onClose) opts.onClose();
      },
      setBusy: function (b) {
        App.els('button', m).forEach(function (x) { x.disabled = !!b; });
      }
    };

    if (foot && opts.buttons) {
      opts.buttons.forEach(function (b) {
        if (b.spacer) { foot.appendChild(App.h('div', { class: 'left' })); return; }
        var btn = App.h('button', { class: 'btn ' + (b.class || ''), type: 'button' },
          (b.icon ? App.icon(b.icon, 18) : '') + '<span>' + App.esc(b.label) + '</span>');
        btn.addEventListener('click', function () { b.onClick ? b.onClick(api) : api.close(); });
        foot.appendChild(btn);
      });
    }

    App.on(m, 'click', '[data-close]', function () { api.close(); });
    bg.addEventListener('mousedown', function (e) {
      if (e.target === bg && opts.dismissable !== false) api.close();
    });

    document.body.appendChild(bg);
    openModals.push(api);
    setTimeout(function () {
      var f = m.querySelector('input:not([readonly]),select,textarea');
      if (f && opts.autofocus !== false && window.innerWidth > 860) f.focus();
    }, 60);
    return api;
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && openModals.length) openModals[openModals.length - 1].close();
  });

  /* ---------------- confirm ---------------- */
  UI.confirm = function (opts) {
    return new Promise(function (res) {
      var m = UI.modal({
        title: opts.title || 'Please confirm',
        size: 'narrow',
        dismissable: false,
        body: '<div style="font-size:15px;line-height:1.55">' + (opts.html || App.esc(opts.message || '')) + '</div>',
        buttons: [
          { label: opts.cancelLabel || 'No', onClick: function (a) { a.close(); res(false); } },
          { label: opts.okLabel || 'Yes', class: opts.danger ? 'btn-danger' : 'btn-primary',
            onClick: function (a) { a.close(); res(true); } }
        ]
      });
      m.bg.addEventListener('mousedown', function (e) { if (e.target === m.bg) { m.close(); res(false); } });
    });
  };

  /* type-to-confirm for the really destructive things */
  UI.confirmTyped = function (opts) {
    return new Promise(function (res) {
      var word = opts.word || 'DELETE';
      var m = UI.modal({
        title: opts.title || 'Are you sure?',
        size: 'narrow',
        dismissable: false,
        body: '<div style="font-size:15px;line-height:1.55">' + (opts.html || '') + '</div>' +
              '<div class="f mt16"><label>To confirm, type <b>' + App.esc(word) + '</b> exactly</label>' +
              '<input id="ctw" autocomplete="off" autocapitalize="characters"></div>',
        buttons: [
          { label: 'Cancel', onClick: function (a) { a.close(); res(false); } },
          { label: opts.okLabel || 'Confirm', class: 'btn-danger', onClick: function (a) {
              var v = App.el('#ctw', a.el).value.trim().toUpperCase();
              if (v !== word.toUpperCase()) { App.toast('Type the word exactly', 'err'); return; }
              a.close(); res(true);
            } }
        ]
      });
    });
  };

  /* ---------------- form helper ---------------- */
  /* fields: [{k,label,type,required,options,value,help,placeholder,span,attrs}] */
  UI.formHTML = function (fields, cols) {
    var html = '<div class="frm">';
    var open = false, count = 0;
    fields.forEach(function (f) {
      if (f.type === 'section') {
        if (open) { html += '</div>'; open = false; }
        html += '<div class="b" style="font-size:13px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin-top:6px">' + App.esc(f.label) + '</div>';
        return;
      }
      if (!open) {
        html += '<div class="row" style="grid-template-columns:repeat(' + (cols || 2) + ',1fr)">';
        open = true; count = 0;
      }
      var span = f.span || 1;
      var style = span > 1 ? ' style="grid-column:span ' + span + '"' : '';
      html += '<div class="f" data-f="' + f.k + '"' + style + '>';
      html += '<label>' + App.esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + '</label>';
      var v = f.value === undefined || f.value === null ? '' : String(f.value);
      var attrs = f.attrs || '';
      if (f.type === 'select') {
        html += '<select name="' + f.k + '" ' + attrs + '>';
        (f.options || []).forEach(function (o) {
          var val = (typeof o === 'object') ? o.v : o;
          var lab = (typeof o === 'object') ? o.l : o;
          html += '<option value="' + App.esc(val) + '"' + (String(val) === v ? ' selected' : '') + '>' + App.esc(lab) + '</option>';
        });
        html += '</select>';
      } else if (f.type === 'textarea') {
        html += '<textarea name="' + f.k + '" placeholder="' + App.esc(f.placeholder || '') + '" ' + attrs + '>' + App.esc(v) + '</textarea>';
      } else {
        html += '<input type="' + (f.type || 'text') + '" name="' + f.k + '" value="' + App.esc(v) + '" placeholder="' + App.esc(f.placeholder || '') + '" ' + attrs + '>';
      }
      if (f.help) html += '<div class="help">' + App.esc(f.help) + '</div>';
      html += '</div>';
      count++;
      if (count >= (cols || 2)) { html += '</div>'; open = false; }
    });
    if (open) html += '</div>';
    html += '</div>';
    return html;
  };

  UI.readForm = function (root) {
    var out = {};
    App.els('[name]', root).forEach(function (i) {
      out[i.getAttribute('name')] = i.type === 'checkbox' ? i.checked : i.value;
    });
    return out;
  };

  UI.markError = function (root, key, msg) {
    var f = App.el('[data-f="' + key + '"]', root);
    if (!f) return;
    f.classList.add('bad');
    var old = App.el('.err', f);
    if (old) old.remove();
    f.appendChild(App.h('div', { class: 'err' }, App.icon('alert', 15) + '<span>' + App.esc(msg) + '</span>'));
    var input = App.el('[name]', f);
    if (input) input.focus();
  };

  UI.clearErrors = function (root) {
    App.els('.f.bad', root).forEach(function (f) {
      f.classList.remove('bad');
      var e = App.el('.err', f); if (e) e.remove();
    });
  };

  /* ---------------- long lists render in pages ----------------
     A shop with years of records would otherwise build tens of thousands of
     rows at once and freeze. */
  UI.PAGE = 200;
  UI.shown = function (r) {
    return Math.max(UI.PAGE, Math.round(App.n(r && r.query && r.query.show)) || UI.PAGE);
  };
  UI.moreRows = function (shown, total) {
    if (total <= shown) return '';
    return '<div class="more-rows"><span>Showing ' + shown + ' of ' + total + '</span>' +
      '<button class="btn" type="button" data-more>' + App.icon('chevronD', 18) +
      '<span>Show ' + Math.min(UI.PAGE, total - shown) + ' more</span></button></div>';
  };
  UI.wireMore = function (view, shown) {
    var b = App.el('[data-more]', view);
    if (!b) return;
    b.addEventListener('click', function () {
      var y = App.el('#view').scrollTop;
      var base = location.hash.replace(/^#/, '').replace(/([?&])show=\d+&?/, '$1').replace(/[?&]$/, '');
      history.replaceState(null, '', '#' + base + (base.indexOf('?') >= 0 ? '&' : '?') + 'show=' + (shown + UI.PAGE));
      UI.render();
      App.el('#view').scrollTop = y;
    });
  };

  /* ---------------- empty state ---------------- */
  /* `icon` is an icon name from 05-icons.js, never an emoji. */
  UI.empty = function (icon, title, desc, btnLabel, btnAction) {
    return '<div class="empty"><div class="eic">' + App.icon(icon, 26) + '</div>' +
      '<div class="t">' + App.esc(title) + '</div>' +
      (desc ? '<div class="d">' + App.esc(desc) + '</div>' : '') +
      (btnLabel ? '<button class="btn btn-primary mt16" data-act="' + btnAction + '">' +
        App.icon('plus', 18) + '<span>' + App.esc(btnLabel).replace(/^\+\s*/, '') + '</span></button>' : '') +
      '</div>';
  };

  /* ---------------- router ---------------- */
  UI.route = function (path, fn) { App.routes[path] = fn; };

  UI.go = function (hash) {
    if (location.hash === '#' + hash) UI.render();
    else location.hash = hash;
  };

  UI.current = function () {
    var h = location.hash.replace(/^#/, '') || '/dashboard';
    return h;
  };

  UI.parse = function (h) {
    var qi = h.indexOf('?');
    var query = {};
    if (qi >= 0) {
      h.slice(qi + 1).split('&').forEach(function (kv) {
        var p = kv.split('=');
        query[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
      });
      h = h.slice(0, qi);
    }
    return { parts: h.split('/').filter(Boolean), query: query, path: h };
  };

  UI.render = function () {
    var h = UI.current();
    var r = UI.parse(h);
    var key = r.parts[0] || 'dashboard';
    var fn = App.routes[key] || App.routes['dashboard'];

    /* Swap in a brand-new #view node every time. Any listener a screen
       attached to its container dies with the old node, so handlers can
       never pile up or leak across screens. */
    var old = App.el('#view');
    var view = App.h('main', { class: 'view', id: 'view' });
    old.parentNode.replaceChild(view, old);

    try {
      fn(view, r);
    } catch (e) {
      view.innerHTML = '<div class="card card-pad"><h3 style="color:var(--danger)">This screen could not load</h3>' +
        '<p class="muted sm">' + App.esc(e.message) + '</p>' +
        '<pre class="tiny dim" style="white-space:pre-wrap;overflow:auto">' + App.esc(e.stack || '') + '</pre></div>';
      if (window.console) console.error(e);
    }
    App.els('.nav-item[data-nav]').forEach(function (n) {
      n.classList.toggle('active', n.getAttribute('data-nav') === key);
    });
    UI.closeSidebar();
    UI.refreshBadges();
  };

  window.addEventListener('hashchange', UI.render);

  UI.closeSidebar = function () {
    var s = App.el('.sidebar'), sc = App.el('.scrim');
    if (s) s.classList.remove('open');
    if (sc) sc.classList.remove('on');
  };

  UI.refreshBadges = function () {
    var low = App.M.lowStock().length;
    var b = App.el('[data-nav="products"] .badge');
    if (b) { b.textContent = low; b.style.display = low ? '' : 'none'; }
  };

  /* ---------------- theme ---------------- */
  UI.applyTheme = function () {
    var t = App.db.settings.theme || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var mt = App.el('meta[name="theme-color"]');
    if (mt) mt.setAttribute('content', t === 'dark' ? '#0e1420' : '#f4f6fa');
  };

  UI.toggleTheme = function () {
    App.db.settings.theme = App.db.settings.theme === 'dark' ? 'light' : 'dark';
    App.store.touch();
    UI.applyTheme();
  };

  /* ---------------- print ---------------- */
  /* opts.raw: html is a complete document (the invoice); opts.title names the print job */
  UI.print = function (html, opts) {
    opts = opts || {};
    var root = App.el('#print-root');
    root.innerHTML = opts.raw ? html : '<div class="pr">' + html + '</div>';
    setTimeout(function () {
      var nat = App.native();
      if (nat && typeof nat.print === 'function') {
        var r = nat.print(opts.title || document.title);
        if (r && r.indexOf('OK') !== 0) App.toast(r, 'err', 6000);
      } else {
        window.print();
      }
    }, 80);
  };

  /* ---------------- shared pickers ---------------- */
  UI.pickCustomer = function (cb, opts) {
    opts = opts || {};
    var out = App.M.outstandingMap();
    var buttons = [];
    if (opts.allowWalkIn !== false) {
      buttons.push({ label: 'Walk-in customer', icon: 'walk', class: 'btn-sm btn-ghost btn-walk',
        onClick: function (a) { a.close(); cb(null); } });
      buttons.push({ spacer: true });
    }
    buttons.push({ label: 'Cancel', onClick: function (a) { a.close(); } });

    var m = UI.modal({
      title: 'Who is buying?',
      body: '<p class="sm muted" style="margin:0 0 12px">Search by name or mobile number, or add a new customer.</p>' +
            '<div class="pc-top">' +
              '<div class="f"><input id="pcq" type="search" placeholder="Name or mobile number" aria-label="Search customers" autocomplete="off"></div>' +
              '<button class="btn btn-primary" id="pcnew" type="button">' + App.icon('plus', 18) + '<span>New customer</span></button>' +
            '</div>' +
            '<div class="picklist" id="pclist"></div>',
      buttons: buttons
    });

    function draw(q) {
      var list = App.M.customers();
      if (q) {
        q = App.norm(q);
        list = list.filter(function (c) {
          return App.norm(c.name + ' ' + c.mobile + ' ' + c.altMobile + ' ' + c.code).indexOf(q) >= 0;
        });
      }
      list = list.slice(0, 80);
      var el = App.el('#pclist', m.el);
      if (!list.length) { el.innerHTML = '<div class="empty"><div class="t">No customers found</div></div>'; return; }
      el.innerHTML = list.map(function (c) {
        var o = App.n(out[c.id]);
        return '<div class="pick" data-id="' + c.id + '">' +
          '<div class="avatar">' + App.esc(App.initials(c.name)) + '</div>' +
          '<div><div class="t">' + App.esc(c.name) + '</div>' +
          '<div class="d">' + App.esc(c.code) + ' · ' + App.esc(c.mobile || '—') + '</div></div>' +
          '<div class="rt">' + (o > 0.5 ? '<span class="pill p-danger">Due ' + App.money(o) + '</span>' : '<span class="pill p-ok">Clear</span>') + '</div>' +
          '</div>';
      }).join('');
    }

    App.el('#pcq', m.el).addEventListener('input', App.debounce(function () { draw(this.value); }, 120));
    App.on(m.el, 'click', '.pick', function () {
      var c = App.M.find('customers', this.getAttribute('data-id'));
      m.close(); cb(c);
    });
    App.el('#pcnew', m.el).addEventListener('click', function () {
      m.close();
      App.customerForm(null, function (c) { cb(c); });
    });
    draw('');
  };

  UI.pickProduct = function (cb) {
    var m = UI.modal({
      title: 'Choose product',
      size: 'wide',
      body: '<div class="f"><input id="ppq" placeholder="Name, SKU, brand or barcode..." autocomplete="off"></div>' +
            '<div class="chips mt12" id="ppcat"></div>' +
            '<button class="btn btn-block mt12" id="ppfree">' + App.icon('pencil', 18) + ' Add a line without a product (custom item)</button>' +
            '<div class="picklist" id="pplist"></div>',
      buttons: [{ label: 'Cancel', onClick: function (a) { a.close(); } }]
    });

    var cat = '';
    App.el('#ppcat', m.el).innerHTML =
      '<button class="chip on" data-c="">All</button>' +
      App.M.CATEGORIES.map(function (c) { return '<button class="chip" data-c="' + App.esc(c) + '">' + App.esc(c) + '</button>'; }).join('');

    function draw() {
      var q = App.norm(App.el('#ppq', m.el).value);
      var list = App.M.products();
      if (cat) list = list.filter(function (p) { return p.category === cat; });
      if (q) list = list.filter(function (p) {
        return App.norm(p.name + ' ' + p.sku + ' ' + p.brand + ' ' + p.model + ' ' + p.barcode).indexOf(q) >= 0;
      });
      list = list.slice(0, 100);
      var el = App.el('#pplist', m.el);
      if (!list.length) { el.innerHTML = '<div class="empty"><div class="t">No products found</div></div>'; return; }
      el.innerHTML = list.map(function (p) {
        var lo = App.n(p.stock) <= App.n(p.minStock);
        return '<div class="pick" data-id="' + p.id + '">' +
          '<div><div class="t">' + App.esc(p.name) + '</div>' +
          '<div class="d">' + App.esc(p.sku) + (p.brand ? ' · ' + App.esc(p.brand) : '') + ' · ' + App.esc(p.category) + '</div></div>' +
          '<div class="rt"><div class="b">' + App.money(p.sellPrice) + '</div>' +
          '<div class="tiny ' + (lo ? 'neg' : 'dim') + '">Stock: ' + App.n(p.stock) + '</div></div></div>';
      }).join('');
    }

    App.el('#ppq', m.el).addEventListener('input', App.debounce(draw, 120));
    App.on(m.el, 'click', '#ppcat .chip', function () {
      App.els('#ppcat .chip', m.el).forEach(function (c) { c.classList.remove('on'); });
      this.classList.add('on');
      cat = this.getAttribute('data-c');
      draw();
    });
    App.on(m.el, 'click', '.pick', function () {
      var p = App.M.find('products', this.getAttribute('data-id'));
      m.close(); cb(p);
    });
    App.el('#ppfree', m.el).addEventListener('click', function () { m.close(); cb(null); });
    draw();
  };
})();


/* ===== 31-datepicker.js ===== */
/* =========================================================================
   31-datepicker.js — the app's own calendar for every date field.

   Tap a date field and this opens: tap the month name for a month list, the
   year for a year list, then one tap on the day. The field stays a real
   <input type="date">, so its value is still a plain date and every screen
   that reads or watches it keeps working. The field is made read-only so the
   device's own calendar never opens on top of this one.
   ========================================================================= */
(function () {
  'use strict';
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var live = null;                                  /* the open calendar, if any */

  function iso(y, m, d) { return y + '-' + App.pad(m + 1, 2) + '-' + App.pad(d, 2); }
  function parse(v) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(v || ''));
    return m ? { y: +m[1], m: +m[2] - 1, d: +m[3] } : null;
  }
  function daysIn(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function mondayFirst(y, m) { return (new Date(y, m, 1).getDay() + 6) % 7; }
  function outside(inp, v) {
    return (inp.min && v < inp.min) || (inp.max && v > inp.max);
  }
  function dmy(p) { return p ? App.pad(p.d, 2) + '/' + App.pad(p.m + 1, 2) + '/' + p.y : ''; }

  /* what someone types: 13/9/2026, 13-09-26, 13.9.2026, 13092026, or 2026-09-13 */
  function typedDate(text) {
    var v = String(text || '').trim();
    var m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(v);          /* year first */
    if (!m) {
      var g = /^(\d{1,2})\s*[-\/. ]\s*(\d{1,2})\s*[-\/. ]\s*(\d{2}|\d{4})$/.exec(v);
      if (g) m = [v, g[3], g[2], g[1]];
      else if (/^\d{8}$/.test(v)) m = [v, v.slice(4), v.slice(2, 4), v.slice(0, 2)];
      else if (/^\d{6}$/.test(v)) m = [v, v.slice(4), v.slice(2, 4), v.slice(0, 2)];
      else return null;
    }
    var y = +m[1], mo = +m[2], d = +m[3];
    if (y < 100) y += y > 70 ? 1900 : 2000;
    if (!y || mo < 1 || mo > 12 || d < 1) return null;
    if (y < 1900 || y > 2200) return null;
    if (d > daysIn(y, mo - 1)) return null;                             /* 31 February is not a date */
    return { y: y, m: mo - 1, d: d };
  }

  /* ---------------- attach to every date field ---------------- */
  function prepare(root) {
    App.els('input[type="date"]:not([data-dt])', root || document).forEach(function (inp) {
      inp.setAttribute('data-dt', '1');
      inp.setAttribute('autocomplete', 'off');
      inp.readOnly = true;
      inp.classList.add('dt-in');

  /* ---------------- the calendar ---------------- */

    var box = App.h('div', { class: 'dtp', role: 'dialog', 'aria-label': 'Choose a date' });
    box.innerHTML =
      '<div class="dtp-type">' +
        '<input type="text" class="dtp-typed" inputmode="numeric" autocomplete="off" maxlength="10" ' +
          'placeholder="dd/mm/yyyy" aria-label="Type the date" value="' + App.esc(dmy(picked)) + '">' +
        '<button type="button" class="btn btn-sm btn-primary" data-set>Set</button>' +
      '</div><div class="dtp-msg" hidden></div><div class="dtp-main"></div>';
    document.body.appendChild(box);
    var main = App.el('.dtp-main', box), typed = App.el('.dtp-typed', box), msg = App.el('.dtp-msg', box);
    live = { box: box, input: inp, place: function () { place(); } };

    function say(text) {
      msg.textContent = text || '';
      msg.hidden = !text;
      place();
    }

    function draw() {
      var head =
        '<div class="dtp-head">' +
          '<button type="button" class="dtp-nav" data-step="-1" aria-label="Previous">' + App.icon('arrowLeft', 18) + '</button>' +
          '<button type="button" class="dtp-lbl" data-view="months">' + MONTHS[state.m] + '</button>' +
          '<button type="button" class="dtp-lbl" data-view="years">' + state.y + '</button>' +
          '<button type="button" class="dtp-nav" data-step="1" aria-label="Next">' + App.icon('arrowLeft', 18, 'flip') + '</button>' +
        '</div>';
      var body = '';
      if (state.view === 'days') {
        body = '<div class="dtp-week">' + WEEK.map(function (d) { return '<span>' + d + '</span>'; }).join('') + '</div><div class="dtp-grid">';
        var blanks = mondayFirst(state.y, state.m), total = daysIn(state.y, state.m);
        for (var i = 0; i < blanks; i++) body += '<span></span>';
        for (var d = 1; d <= total; d++) {
          var v = iso(state.y, state.m, d);
          var cls = 'dtp-day' + (picked && v === iso(picked.y, picked.m, picked.d) ? ' on' : '') +
            (today && v === iso(today.y, today.m, today.d) ? ' today' : '');
          body += '<button type="button" class="' + cls + '" data-day="' + d + '"' + (outside(inp, v) ? ' disabled' : '') + '>' + d + '</button>';
        }
        body += '</div>';
      } else if (state.view === 'months') {
        body = '<div class="dtp-grid m">' + MONTHS.map(function (name, i) {
          return '<button type="button" class="dtp-cell' + (i === state.m ? ' on' : '') + '" data-month="' + i + '">' + SHORT[i] + '</button>';
        }).join('') + '</div>';
      } else {
        if (!state.yearFrom) state.yearFrom = state.y - 7;
        body = '<div class="dtp-grid y">';
        for (var k = 0; k < 16; k++) {
          var yr = state.yearFrom + k;
          body += '<button type="button" class="dtp-cell' + (yr === state.y ? ' on' : '') + '" data-year="' + yr + '">' + yr + '</button>';
        }
        body += '</div>';
      }
      var foot = '<div class="dtp-foot">' +
        '<button type="button" class="btn btn-sm" data-today>Today</button>' +
        (inp.required ? '' : '<button type="button" class="btn btn-sm btn-ghost" data-clear>Clear</button>') +
        '<button type="button" class="btn btn-sm btn-ghost" data-close>Close</button></div>';
      main.innerHTML = head + '<div class="dtp-body">' + body + '</div>' + foot;
    }

    function place() {
      var r = inp.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;

      box.style.top = Math.round(top) + 'px';
    }

    /* the typed box: show what it means on the calendar, and set it on Enter or Set */
    function useTyped(apply) {

      if (!p) { if (apply) say(typed.value.trim() ? 'That is not a date. Type it as dd/mm/yyyy.' : 'Type a date first.'); return; }

      if (outside(inp, v)) {

          (inp.min ? ' — nothing before ' + dmy(parse(inp.min)) : '') +
          (inp.max ? (inp.min ? ',' : ' —') + ' nothing after ' + dmy(parse(inp.max)) : ''));
        return;
      }
      say('');
      picked = p;
      state.y = p.y; state.m = p.m; state.view = 'days'; state.yearFrom = 0;
      draw(); place();
      if (apply) set(p.y, p.m, p.d);
    }

    typed.addEventListener('input', function (e) {
      var back = e && (e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward');

      else if (!back && /^\d{2}\/\d{2}$/.test(this.value)) this.value += '/';
      say('');
      if (typedDate(this.value)) useTyped(false);
    });
    typed.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); useTyped(true); }
    });
    typed.addEventListener('focus', function () { this.select(); });

    function set(y, m, d) {
      inp.value = iso(y, m, d);
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true }));
      close();
    }

    box.addEventListener('click', function (e) {
      var t = e.target.closest('button');
      if (!t) return;
      e.preventDefault();
      e.stopPropagation();
      if (t.hasAttribute('data-step')) {
        var step = App.n(t.getAttribute('data-step'));
        if (state.view === 'years') state.yearFrom += step * 16;
        else if (state.view === 'months') state.y += step;
        else {
          state.m += step;
          if (state.m < 0) { state.m = 11; state.y--; }
          else if (state.m > 11) { state.m = 0; state.y++; }
        }
        draw(); place(); return;
      }
      if (t.hasAttribute('data-view')) { state.view = t.getAttribute('data-view'); draw(); place(); return; }
      if (t.hasAttribute('data-month')) { state.m = App.n(t.getAttribute('data-month')); state.view = 'days'; draw(); place(); return; }
      if (t.hasAttribute('data-year')) { state.y = App.n(t.getAttribute('data-year')); state.view = 'months'; draw(); place(); return; }
      if (t.hasAttribute('data-day')) { set(state.y, state.m, App.n(t.getAttribute('data-day'))); return; }
      if (t.hasAttribute('data-today')) { var n0 = parse(App.today()); typed.value = dmy(n0); set(n0.y, n0.m, n0.d); return; }
      if (t.hasAttribute('data-clear')) {
        inp.value = '';
        inp.dispatchEvent(new Event('input', { bubbles: true }));
        inp.dispatchEvent(new Event('change', { bubbles: true }));
        close(); return;
      }
      if (t.hasAttribute('data-set')) { useTyped(true); return; }
      if (t.hasAttribute('data-close')) close();
    });

    draw();
    place();
    var first = App.el('.dtp-day.on', box) || App.el('.dtp-day.today', box) || App.el('.dtp-lbl', box);
    if (first) first.focus({ preventScroll: true });
  }

  function close() {
    if (!live) return;
    var inp = live.input;
    if (live.box.parentNode) live.box.parentNode.removeChild(live.box);
    live = null;
    if (inp) inp.focus({ preventScroll: true });
  }
  App.DateField = { prepare: prepare, open: openFor, close: close };

  /* ---------------- wiring ---------------- */
  var refresh = App.debounce(function () { prepare(document); }, 60);
  document.addEventListener('click', function (e) {
    var inp = e.target.closest ? e.target.closest('input[data-dt]') : null;
    if (inp) { e.preventDefault(); openFor(inp); return; }
    if (live && !e.target.closest('.dtp')) close();
  }, true);
  document.addEventListener('keydown', function (e) {
    if (live && e.key === 'Escape') { e.preventDefault(); close(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('input[data-dt]')) {

  /* while the cursor is in the calendar's own date box, the page moving underneath (the on-screen

  function busyTyping() {
    var a = document.activeElement;

  }
  window.addEventListener('scroll', function (e) {
    if (!live) return;
    if (busyTyping() || (e.target && e.target.closest && e.target.closest('.dtp'))) return;

  }, true);
  window.addEventListener('resize', function () {
    if (!live) return;
    if (busyTyping()) live.place();
    else close();
  });

    new MutationObserver(refresh).observe(document.documentElement, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { prepare(document); });
  else prepare(document);
})();

(function () {
  'use strict';
  var M = App.M;

    'Dear {name},\n' +
    'Thank you for shopping with {shop}!\n\n' +
    'Invoice: {invoice}\n' +
    'Date: {date}\n' +
    '{items}\n' +
    'Total: {total}\n' +
    'Paid: {paid}\n' +
    '{due_line}\n\n' +
    'We look forward to seeing you again.\n' +
    '{shop}';

  /* true when at least one power/PD value is filled in */
  INV.hasRx = function (rx) {
    if (!rx) return false;
    return ['od','os'].some(function (eye) {
      var e = rx[eye] || {};
      return ['sph','cyl','axis','add','pd'].some(function (f) { return e[f] !== undefined && e[f] !== null && String(e[f]).trim() !== ''; });
    });
  };

  /* retail invoices never print an eye prescription */
  INV.rxOf = function () { return null; };

  /* everything the invoice needs, gathered once */
  INV.data = function (saleId) {
    var s = M.find('sales', saleId);
    if (!s) return null;
    var c = s.customerId ? M.find('customers', s.customerId) : null;
    var paid = M.salePaid(s.id);
    var due = App.round2(App.n(s.total) - paid);
    var refund = due < -0.5 ? App.round2(-due) : 0;   /* a correction can leave the shop owing money back */
    if (due < 0) due = 0;
    var status = s.status === 'cancelled' ? 'CANCELLED'
      : due <= 0.5 ? 'PAID'
      : paid > 0.5 ? 'PART PAID' : 'UNPAID';
    var name = s.customerName && s.customerName !== 'Walk-in' ? s.customerName : 'Walk-in customer';
    return {
      s: s, c: c, set: App.db.settings,
      paid: paid, due: due, refund: refund, status: status, name: name,
      rx: INV.rxOf(s),
      outstanding: c ? M.customerStats(c.id).outstanding : 0,
      mobile: s.customerMobile || (c && c.mobile) || '',

  /* 'Cash', or 'Cash + UPI' when the bill was paid in parts */
  INV.paymentText = function (s) {

      : (s.paymentMethod || '—');
  };

  INV.statusClass = function (st) {
    return { 'PAID': 'is-paid', 'PART PAID': 'is-part', 'UNPAID': 'is-unpaid', 'CANCELLED': 'is-cancelled' }[st] || '';
  };

  INV.fileName = function (d) {
    return 'Invoice_' + String(d.s.invoiceNo || 'bill').replace(/[^A-Za-z0-9_-]/g, '_') + '.png';
  };

  /* ---------------- number for WhatsApp: digits with country code ---------------- */
  App.waNumber = function (raw) {
    var cc = String((App.db && App.db.settings.whatsappCountryCode) || '91').replace(/\D/g, '') || '91';
    var d = String(raw || '').replace(/\D/g, '').replace(/^0+/, '');
    if (d.length === 10) return cc + d;
    if (d.length >= 11 && d.length <= 15) return d;

  };

  INV.message = function (d, withItems) {

    var items = withItems ? s.items.map(function (i) {
      return '• ' + i.name + ' × ' + App.n(i.qty) + ' = ' + App.money(i.amount);
    }).join('\n') : '';
    var map = {
      name: d.name === 'Walk-in customer' ? 'Customer' : d.name,

      invoice: s.invoiceNo,
      date: App.fmtDate(s.date),
      total: App.money(s.total),
      paid: App.money(d.paid),
      due: App.money(d.due),
      due_line: d.due > 0.5 ? 'Balance due: ' + App.money(d.due)

    return tpl.replace(/\{(\w+)\}/g, function (m, k) { return map.hasOwnProperty(k) ? map[k] : m; })
      .replace(/[ \t]+\n/g, '\n')
