<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f4f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Adminuscurator POS">

<style>
/* ==========================================================================
   Optical Shop Manager — design system
   Style:  Data-Dense Dashboard (operations software)
   Colour: navy authority + green for money received + red for money owed
   Type:   system stack (the app is offline — no webfont may be fetched),
           tabular figures everywhere a number can change.
   Grid:   4px base. Touch targets never below 44px.
   ========================================================================== */

/* ---------------------------------------------------------------- tokens */
:root{
  /* brand */
  --primary:#4F46E5;
  --primary-hover:#4338CA;
  --primary-soft:#EEF0FE;
  --on-primary:#FFFFFF;
  --secondary:#2563EB;
  --accent:#047857;          /* money in — 5.48:1 on white */
  --accent-soft:#E3F5EE;
  --danger:#C81E1E;          /* money owed / destructive — 5.74:1 on white */
  --danger-soft:#FDEAEA;
  --warn:#B45309;
  --warn-soft:#FDF2E2;
  --info:#2563EB;
  --info-soft:#E6EEFE;

  /* surfaces */
  --bg:#F8FAFC;
  --surface:#FFFFFF;
  --surface-2:#F4F7FA;
  --surface-3:#EAEFF5;
  --border:#E4E7EB;
  --border-strong:#9AA8BC;
  --border-input:#7E8DA4;    /* control boundaries: 3:1 non-text contrast */
  --scrim:rgba(15,23,42,.55);

  /* text */
  --fg:#0F172A;              /* 16.1:1 on surface */
  --fg-2:#4A5568;            /*  7.5:1 */
  --fg-3:#5C6B80;            /*  5.43:1 — AA on white and on surface-2 */

  /* type scale */
  --t-xs:12px; --t-sm:13px; --t-md:14px; --t-base:16px;
  --t-lg:18px; --t-xl:22px; --t-2xl:28px; --t-3xl:34px;

  /* spacing (4pt rhythm) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;

  /* radius */
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px; --r-full:999px;

  /* elevation — one consistent ramp, never ad-hoc shadows */
  --e1:0 1px 2px rgba(15,23,42,.06);
  --e2:0 1px 3px rgba(15,23,42,.08), 0 4px 12px rgba(15,23,42,.05);
  --e3:0 4px 12px rgba(15,23,42,.10), 0 12px 32px rgba(15,23,42,.08);
  --e4:0 12px 40px rgba(15,23,42,.22);

  /* motion */
  --dur:180ms;
  --dur-fast:120ms;
  --ease:cubic-bezier(.2,0,0,1);

  --tap:48px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
         "Noto Sans","Noto Sans Devanagari",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --z-nav:300; --z-scrim:290; --z-modal:400; --z-toast:500;
}

/* Dark mode is designed, not inverted: desaturated surfaces, lifted brand. */
html[data-theme="dark"]{
  --primary:#818CF8;
  --primary-hover:#A5B4FC;
  --primary-soft:#2A2550;
  --on-primary:#08131F;
  --secondary:#7EA9FB;
  --accent:#34D399;
  --accent-soft:#0F2C23;
  --danger:#F87171;
  --danger-soft:#33191B;
  --warn:#F5B14C;
  --warn-soft:#302512;
  --info:#A5B4FC;
  --info-soft:#1E1E3A;

  --bg:#0B1220;
  --surface:#141C2B;
  --surface-2:#1A2434;
  --surface-3:#212D40;
  --border:#2A3648;
  --border-strong:#3D4C63;
  --border-input:#5D708A;    /* 3.37:1 on dark surface */
  --scrim:rgba(0,0,0,.66);

  --fg:#E9EEF6;
  --fg-2:#AAB8CC;
  --fg-3:#8494AA;

  --e1:0 1px 2px rgba(0,0,0,.4);
  --e2:0 1px 3px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.35);
  --e3:0 4px 12px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.4);
  --e4:0 12px 40px rgba(0,0,0,.65);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* elements with the hidden attribute stay hidden even when a class gives them display:flex */
[hidden]{display:none !important}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--fg);
  font-size:var(--t-base);
  line-height:1.5;
  overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
input,select,textarea,button{font-family:inherit;font-size:var(--t-base);color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.015em;line-height:1.25}
a{color:var(--secondary);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--primary);color:var(--on-primary)}

/* every number that can change uses tabular figures so columns never jitter */
.num,table.tbl td,table.tbl th,.stat .val,.totals,.kv dd,.rx input,.rx td{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}

/* visible focus for keyboard users, invisible for mouse/touch */
:focus{outline:none}
:focus-visible{
  outline:3px solid var(--secondary);
  outline-offset:2px;
  border-radius:var(--r-sm);
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* icons: one family, aligned to text, never squashed */
.ic{flex:0 0 auto;display:inline-block;vertical-align:-.2em}

/* ------------------------------------------------------------------ shell */
/* relative + clip: nothing inside the app can make the page itself scroll */
#app{display:flex;flex-direction:column;height:100%;overflow:hidden;overflow:clip;position:relative}
.shell{flex:1;min-height:0;display:flex;position:relative}

/* the shop's own header, full width — colours and text come from Settings › Shop header */
.shophead{
  --shop-bg:#4F46E5;--shop-fg:#FFFFFF;
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:10px var(--s5);
  background:var(--shop-bg);
  background-image:linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,0) 60%);
  color:var(--shop-fg);
}
.sh-logo{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.sh-logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.sh-logo.no-img{background:transparent;box-shadow:inset 0 0 0 2px currentColor}
.sh-text{min-width:0}
.sh-title{font-size:22px;font-weight:750;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-sub{font-size:var(--t-sm);line-height:1.35;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.shophead-preview{border-radius:var(--r-lg);padding:10px var(--s4)}
@media(max-width:640px){
  .shophead{min-height:56px;padding:8px var(--s4)}
  .sh-title{font-size:18px}
  .sh-logo{width:38px;height:38px;border-radius:10px}
}
.color-in{display:flex;align-items:center;gap:var(--s2);min-height:48px;padding:3px 10px 3px 3px;border:1px solid var(--border-input);border-radius:var(--r);background:var(--surface)}
.color-in input[type="color"]{width:56px;min-width:56px;height:40px;min-height:40px;padding:0;border:none;border-radius:var(--r-sm);background:none;cursor:pointer}
.color-in .mono{font-size:var(--t-sm);color:var(--fg-2)}
.swatches{display:flex;flex-wrap:wrap;gap:var(--s2)}
.swatch{width:56px;height:44px;border-radius:var(--r);border:1px solid var(--border);font-weight:750;font-size:var(--t-md);cursor:pointer}
.swatch.on{outline:3px solid var(--secondary);outline-offset:2px}

.sidebar{
  width:248px;flex:0 0 248px;background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.brand{
  padding:var(--s4);display:flex;align-items:center;gap:var(--s3);
  border-bottom:1px solid var(--border);min-height:72px;
}
.brand .logo{
  width:40px;height:40px;border-radius:var(--r);
  background:var(--primary);color:var(--on-primary);
  display:grid;place-items:center;flex:0 0 auto;
}
html[data-theme="dark"] .brand .logo{background:var(--primary-soft);color:var(--primary)}
.brand .nm{font-weight:650;font-size:var(--t-md);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .sb{font-size:var(--t-xs);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

.nav{flex:1;overflow-y:auto;padding:var(--s3) var(--s2) var(--s6);-webkit-overflow-scrolling:touch}
.nav-sec{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg-3);padding:var(--s4) var(--s3) var(--s2);
}
.nav-item{
  display:flex;align-items:center;gap:var(--s3);padding:0 var(--s3);
  min-height:46px;border-radius:var(--r-sm);
  color:var(--fg-2);font-weight:550;font-size:var(--t-md);
  cursor:pointer;user-select:none;margin-bottom:2px;
  border:none;background:none;width:100%;text-align:left;
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  position:relative;
}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item:active{background:var(--surface-3)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:650}
.nav-item.active::before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--primary);
}
.nav-item .badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;
  min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-full);
  display:inline-flex;align-items:center;justify-content:center;
}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  min-height:68px;flex:0 0 auto;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);
}
.hamburger{display:none}
.searchwrap{flex:1;position:relative;max-width:520px}
.searchwrap input{
  width:100%;height:44px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--surface-2);
  padding:0 var(--s4) 0 42px;outline:none;font-size:var(--t-md);
  transition:border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.searchwrap input::placeholder{color:var(--fg-3)}
.searchwrap input:focus{border-color:var(--secondary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-soft)}
.searchwrap .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--fg-3);pointer-events:none;display:flex}
.topbar .spacer{flex:1}

.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--s5)}
.view-head{display:flex;align-items:flex-start;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s5)}
.view-head h1{font-size:var(--t-2xl)}
.view-head .sub{color:var(--fg-2);font-size:var(--t-md);margin-top:3px}
.view-head .actions{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.view-head .actions input[type="date"]{
  min-height:44px;border-radius:var(--r);border:1px solid var(--border-input);
  background:var(--surface);padding:0 var(--s3);color:var(--fg);outline:none;
  font-variant-numeric:tabular-nums;
}
.view-head .actions input[type="date"]:focus{border-color:var(--secondary);box-shadow:0 0 0 3px var(--primary-soft)}

/* ---------------------------------------------------------------- buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:44px;padding:0 var(--s4);border-radius:var(--r);
  border:1px solid var(--border-input);
  background:var(--surface);color:var(--fg);
  font-weight:600;font-size:var(--t-md);cursor:pointer;white-space:nowrap;
  transition:background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease),
             box-shadow var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:hover{background:var(--surface-2);border-color:var(--fg-3)}
.btn:active{transform:scale(.97);background:var(--surface-3)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-primary:active{background:var(--primary-hover)}
.btn-ok{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .btn-ok{color:#08131F}
.btn-ok:hover{filter:brightness(.94)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
html[data-theme="dark"] .btn-danger{color:#1a0d0d}
.btn-danger:hover{filter:brightness(.94)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--fg);border-color:transparent}
.btn-sm{min-height:38px;padding:0 var(--s3);font-size:var(--t-sm);border-radius:var(--r-sm);gap:6px}
.btn-lg{min-height:56px;padding:0 var(--s6);font-size:var(--t-lg);font-weight:650}
.btn-block{width:100%}
.btn-icon{min-height:44px;width:44px;padding:0}
.btn-sm.btn-icon{min-height:38px;width:38px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* ------------------------------------------------------------ cards, grid */
.grid{display:grid;gap:var(--s4)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--e1)}
.card-pad{padding:var(--s5)}
.card-head{
  padding:var(--s4) var(--s5);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:var(--s3);min-height:60px;
}
.card-head h3{font-size:var(--t-base);font-weight:650}
.card-head .actions{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap}
.card-body{padding:var(--s5)}

/* KPI tile — the number is the hero, everything else supports it */
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--s4) var(--s5);box-shadow:var(--e1);position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:var(--s1);
}
.stat .lbl{
  font-size:var(--t-sm);color:var(--fg-2);font-weight:600;
  display:flex;align-items:center;gap:6px;letter-spacing:.01em;
}
.stat .lbl .ic{color:var(--fg-3)}
.stat .val{font-size:var(--t-2xl);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.stat .hint{font-size:var(--t-xs);color:var(--fg-3);line-height:1.4}
.stat .strip{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.stat.tap{cursor:pointer;transition:box-shadow var(--dur) var(--ease), transform var(--dur-fast) var(--ease)}
.stat.tap:hover{box-shadow:var(--e2)}
.stat.tap:active{transform:scale(.99)}
.stat.s-ok .strip{background:var(--accent)}     .stat.s-ok .val{color:var(--accent)}
.stat.s-warn .strip{background:var(--warn)}     .stat.s-warn .val{color:var(--warn)}
.stat.s-danger .strip{background:var(--danger)} .stat.s-danger .val{color:var(--danger)}
.stat.s-info .strip{background:var(--info)}     .stat.s-info .val{color:var(--info)}
.stat.s-brand .strip{background:var(--primary)}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.qa button{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s2);cursor:pointer;font-weight:600;font-size:var(--t-sm);color:var(--fg);
  box-shadow:var(--e1);padding:var(--s3);
  transition:background var(--dur-fast) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur-fast) var(--ease);
}
.qa button:hover{background:var(--surface-2);box-shadow:var(--e2)}
.qa button:active{transform:scale(.97)}
.qa button .ic{color:var(--primary)}
.qa button .qi{
  width:44px;height:44px;border-radius:var(--r);background:var(--primary-soft);
  display:grid;place-items:center;
}

/* ---------------------------------------------------------------- tables */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--t-md)}
table.tbl th{
  text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fg-3);font-weight:700;padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);
  position:sticky;top:0;z-index:1;
}
table.tbl td{padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tbody tr.clickable{cursor:pointer;transition:background var(--dur-fast) var(--ease)}
table.tbl tbody tr.clickable:hover{background:var(--surface-2)}
table.tbl tbody tr.clickable:active{background:var(--surface-3)}
table.tbl .num{text-align:right;white-space:nowrap}
table.tbl .mono{font-family:var(--mono);font-size:var(--t-sm)}
table.tbl tfoot td{
  padding:var(--s3) var(--s4);font-weight:700;
  border-top:2px solid var(--border-strong);background:var(--surface-2);
}

.empty{padding:var(--s10) var(--s5);text-align:center;color:var(--fg-3)}
.empty .eic{
  width:56px;height:56px;border-radius:var(--r-lg);background:var(--surface-3);
  color:var(--fg-3);display:grid;place-items:center;margin:0 auto var(--s3);
}
.empty .t{font-weight:650;color:var(--fg-2);font-size:var(--t-base)}
.empty .d{font-size:var(--t-md);margin-top:var(--s1);max-width:38ch;margin-left:auto;margin-right:auto}

/* ----------------------------------------------------------------- forms */
.frm{display:grid;gap:var(--s4)}
.frm .row{display:grid;gap:var(--s4)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:var(--t-sm);font-weight:600;color:var(--fg-2)}
.f label .req{color:var(--danger);margin-left:2px}
.f input,.f select,.f textarea{
  min-height:var(--tap);border-radius:var(--r);border:1px solid var(--border-input);
  background:var(--surface);padding:0 var(--s3);outline:none;width:100%;color:var(--fg);
  transition:border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.f textarea{min-height:96px;padding:var(--s3);resize:vertical;line-height:1.55}
.f input::placeholder,.f textarea::placeholder{color:var(--fg-3)}
.f input:focus,.f select:focus,.f textarea:focus{
  border-color:var(--secondary);box-shadow:0 0 0 3px var(--primary-soft);
}
.f input[readonly]{background:var(--surface-3);color:var(--fg-2)}
.f .help{font-size:var(--t-xs);color:var(--fg-3);line-height:1.45}
.f .err{font-size:var(--t-sm);color:var(--danger);font-weight:600;display:flex;align-items:center;gap:5px}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--danger)}
.f.bad input:focus,.f.bad select:focus{box-shadow:0 0 0 3px var(--danger-soft)}

.switch{position:relative;display:flex;align-items:center;gap:var(--s3);cursor:pointer;user-select:none;min-height:var(--tap)}
/* the hidden checkbox stays inside its label. Placed against the page it made the page taller than the
   screen, and tapping the switch scrolled the whole app up, leaving an empty band at the bottom. */
.switch input{position:absolute;left:0;top:50%;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.switch .track{
  width:48px;height:28px;border-radius:var(--r-full);background:var(--border-input);
  position:relative;transition:background var(--dur) var(--ease);flex:0 0 auto;
}
.switch .track::after{
  content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:transform var(--dur) var(--ease);box-shadow:var(--e1);
}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:3px solid var(--secondary);outline-offset:2px}
.switch .lb{font-weight:600;font-size:var(--t-md)}

/* ------------------------------------------------------------ chips/pills */
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.chip{
  min-height:40px;padding:0 var(--s4);border-radius:var(--r-full);
  border:1px solid var(--border-input);background:var(--surface);
  display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:600;
  cursor:pointer;color:var(--fg-2);white-space:nowrap;
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.chip:hover{background:var(--surface-2);color:var(--fg)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* status pills always pair colour with a word — never colour alone */
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-full);
  font-size:var(--t-xs);font-weight:700;white-space:nowrap;line-height:1.5;
}
.p-ok{background:var(--accent-soft);color:var(--accent)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-danger{background:var(--danger-soft);color:var(--danger)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-brand{background:var(--primary-soft);color:var(--primary)}
.p-mute{background:var(--surface-3);color:var(--fg-2)}

/* ----------------------------------------------------------------- modal */
.modal-bg{
  position:fixed;inset:0;background:var(--scrim);
  display:flex;align-items:center;justify-content:center;padding:var(--s4);
  z-index:var(--z-modal);animation:fade var(--dur) var(--ease);
}
.modal{
  background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--e4);
  width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;
  overflow:hidden;animation:rise var(--dur) var(--ease);
}
.modal.wide{max-width:960px}
.modal.narrow{max-width:460px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(12px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.modal-head{
  padding:var(--s4) var(--s5);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:var(--s3);flex:0 0 auto;
}
.modal-head h3{font-size:var(--t-lg);font-weight:650}
.modal-head .x{
  margin-left:auto;width:40px;height:40px;border-radius:var(--r-sm);border:none;
  background:var(--surface-2);cursor:pointer;color:var(--fg-2);
  display:grid;place-items:center;transition:background var(--dur-fast) var(--ease);
}
.modal-head .x:hover{background:var(--surface-3);color:var(--fg)}
.modal-body{padding:var(--s5);overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.modal-foot{
  padding:var(--s4) var(--s5);border-top:1px solid var(--border);
  display:flex;gap:var(--s3);justify-content:flex-end;flex:0 0 auto;
  background:var(--surface-2);flex-wrap:wrap;
}
.modal-foot .left{margin-right:auto}

/* ----------------------------------------------------------------- toast */
#toasts{
  position:fixed;left:50%;transform:translateX(-50%);bottom:var(--s6);
  z-index:var(--z-toast);display:flex;flex-direction:column;gap:var(--s2);
  align-items:center;pointer-events:none;width:max-content;max-width:92vw;
}
.toast{
  background:var(--fg);color:var(--bg);padding:var(--s3) var(--s5);border-radius:var(--r);
  font-weight:600;font-size:var(--t-md);box-shadow:var(--e4);
  animation:rise var(--dur) var(--ease);display:flex;align-items:center;gap:var(--s2);
}
.toast.ok{background:var(--accent);color:#fff}
.toast.err{background:var(--danger);color:#fff}
.toast.warn{background:var(--warn);color:#fff}

/* ---------------------------------------------------------------- banner */
.banner{
  display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s4);
  border-radius:var(--r-lg);margin-bottom:var(--s4);
  border:1px solid var(--border);background:var(--surface);box-shadow:var(--e1);flex-wrap:wrap;
}
.banner .ic{margin-top:1px;color:var(--fg-3)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.banner.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.banner.warn .ic,.banner.danger .ic,.banner.ok .ic{color:inherit}
.banner .tx{flex:1;font-weight:600;font-size:var(--t-md);min-width:200px;line-height:1.45}
.banner .tx small{display:block;font-weight:450;opacity:.9;font-size:var(--t-sm);margin-top:3px;line-height:1.5}
.banner .btn{align-self:center}

/* ------------------------------------------------------------------ misc */
.muted{color:var(--fg-2)}
.dim{color:var(--fg-3)}
.tiny{font-size:var(--t-xs)}
.sm{font-size:var(--t-sm)}
.b{font-weight:650}
.mono{font-family:var(--mono)}
.right{text-align:right}.center{text-align:center}.nowrap{white-space:nowrap}
.mt8{margin-top:var(--s2)}.mt12{margin-top:var(--s3)}.mt16{margin-top:var(--s4)}.mt24{margin-top:var(--s6)}
.mb8{margin-bottom:var(--s2)}.mb12{margin-bottom:var(--s3)}.mb16{margin-bottom:var(--s4)}
.flex{display:flex}.aic{align-items:center}.jcb{justify-content:space-between}
.gap8{gap:var(--s2)}.gap12{gap:var(--s3)}.wrap{flex-wrap:wrap}
.hr{height:1px;background:var(--border);margin:var(--s5) 0;border:0}
.pos{color:var(--accent)}.neg{color:var(--danger)}
.avatar{
  width:40px;height:40px;border-radius:var(--r);background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;font-weight:700;flex:0 0 auto;font-size:var(--t-md);
}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s5);font-size:var(--t-md)}
.kv dt{color:var(--fg-2);font-weight:500}
.kv dd{margin:0;font-weight:600;text-align:right}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* prescription grid */
.rx{width:100%;border-collapse:collapse;font-size:var(--t-md)}
.rx th,.rx td{border:1px solid var(--border);padding:0;text-align:center}
.rx th{
  background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--fg-3);padding:var(--s2) var(--s1);font-weight:700;
}
.rx td:first-child,.rx th:first-child{
  background:var(--surface-2);font-weight:650;padding:var(--s2);width:72px;
  font-size:var(--t-sm);color:var(--fg-2);
}
.rx input{
  width:100%;min-height:48px;border:none;background:transparent;text-align:center;
  outline:none;font-size:var(--t-base);padding:0 2px;color:var(--fg);
}
.rx input:focus{background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--secondary)}

/* invoice line items */
.li,.li-head{display:grid;grid-template-columns:1fr 92px 124px 116px 132px 48px;gap:var(--s2);align-items:center}
.li{padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.li:last-of-type{border-bottom:none}
.li-head{
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);
  font-weight:700;padding-bottom:var(--s2);border-bottom:1px solid var(--border);
}
.li input,.li select{
  min-height:46px;border-radius:var(--r-sm);border:1px solid var(--border-input);
  background:var(--surface);padding:0 var(--s2);width:100%;outline:none;color:var(--fg);
  font-variant-numeric:tabular-nums;
}
.li input:focus,.li select:focus{border-color:var(--secondary);box-shadow:0 0 0 3px var(--primary-soft)}
.li .rm{
  min-height:46px;width:46px;border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--surface-2);color:var(--danger);cursor:pointer;
  display:grid;place-items:center;transition:background var(--dur-fast) var(--ease);
}
.li .rm:hover{background:var(--danger-soft)}
.li .nm{font-weight:600;font-size:var(--t-md);line-height:1.3}
.li .nm small{display:block;color:var(--fg-3);font-weight:450;font-size:var(--t-xs);margin-top:2px}

.totals{display:grid;gap:var(--s2);font-size:var(--t-md);max-width:400px;margin-left:auto}
.totals .r{display:flex;justify-content:space-between;gap:var(--s5);align-items:baseline}
.totals .r.big{
  font-size:var(--t-xl);font-weight:700;padding-top:var(--s3);
  border-top:2px solid var(--border-strong);margin-top:var(--s1);
}
.totals .r.due{color:var(--danger);font-weight:700}

/* search results */
.sresults{
  position:absolute;top:52px;left:0;right:0;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--e3);
  max-height:66vh;overflow-y:auto;z-index:200;-webkit-overflow-scrolling:touch;
}
.sres{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);cursor:pointer;border-bottom:1px solid var(--border)}
.sres:last-child{border-bottom:none}
.sres:hover,.sres:focus-visible{background:var(--surface-2)}
.sres .t{font-weight:600;font-size:var(--t-md)}
.sres .d{font-size:var(--t-sm);color:var(--fg-3);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.sres .rt{margin-left:auto;text-align:right}
.sgroup{
  padding:var(--s2) var(--s4) 5px;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--fg-3);background:var(--surface-2);
}

/* picker list */
.picklist{
  max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--border);border-radius:var(--r);margin-top:var(--s3);
}
.pick{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);cursor:pointer;min-height:60px}
.pick:last-child{border-bottom:none}
.pick:hover{background:var(--surface-2)}
.pick:active{background:var(--surface-3)}
.pick .t{font-weight:600;font-size:var(--t-md)}
.pick .d{font-size:var(--t-sm);color:var(--fg-3)}
.pick .rt{margin-left:auto;text-align:right}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{
  padding:0 var(--s4);min-height:50px;display:inline-flex;align-items:center;gap:var(--s2);
  border:none;background:none;cursor:pointer;font-weight:600;font-size:var(--t-md);
  color:var(--fg-2);border-bottom:2.5px solid transparent;white-space:nowrap;
  transition:color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:900}
.spin{
  width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* lock screen */
.lock{position:fixed;inset:0;background:var(--bg);z-index:800;display:grid;place-items:center;padding:var(--s5)}
.lock .box{width:100%;max-width:340px;text-align:center}
.lock .dots{display:flex;gap:var(--s3);justify-content:center;margin:var(--s6) 0}
.lock .dot{width:14px;height:14px;border-radius:50%;background:var(--border-strong);transition:background var(--dur-fast) var(--ease)}
.lock .dot.on{background:var(--primary)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.keypad button{
  min-height:66px;border-radius:var(--r-lg);border:1px solid var(--border);
  background:var(--surface);font-size:var(--t-xl);font-weight:600;cursor:pointer;color:var(--fg);
  transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.keypad button:hover{background:var(--surface-2)}
.keypad button:active{background:var(--surface-3);transform:scale(.96)}

/* ---------------------------------------------------------------- print */
#print-root{display:none}
@media print{
  body{background:#fff}
  #app,#toasts,.modal-bg{display:none !important}
  #print-root{display:block !important}
  @page{margin:12mm}
}
.pr{font-family:var(--font);color:#000;max-width:190mm;margin:0 auto}
.pr h1{font-size:19pt;margin:0}
.pr .ph{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px}
.pr .pt{font-size:14pt;font-weight:700;margin:14px 0 8px}
.pr table{width:100%;border-collapse:collapse;font-size:10pt;margin-bottom:12px}
.pr th,.pr td{border:1px solid #999;padding:6px 8px;text-align:left}
.pr th{background:#eee;font-size:9pt;text-transform:uppercase}
.pr .num{text-align:right;font-variant-numeric:tabular-nums}
.pr .tot{display:flex;justify-content:flex-end}
.pr .tot table{width:auto;min-width:250px}
.pr .foot{margin-top:22px;font-size:9pt;color:#333;border-top:1px solid #999;padding-top:8px}
.pr .sign{margin-top:38px;display:flex;justify-content:space-between;font-size:10pt}

/* ----------------------------------------------------------- responsive */
@media(max-width:1240px){ .g5{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(max-width:1080px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .li,.li-head{grid-template-columns:1fr 78px 108px 100px 116px 46px;gap:6px;font-size:var(--t-sm)}
}
@media(max-width:900px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:var(--z-nav);transform:translateX(-100%);
    transition:transform var(--dur) var(--ease);box-shadow:var(--e4);
  }
  .sidebar.open{transform:none}
  .hamburger{display:inline-flex}
  .g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qa{grid-template-columns:repeat(3,minmax(0,1fr))}
  .view{padding:var(--s4)}
  .li,.li-head{grid-template-columns:1fr 72px 100px}
  .li .d3,.li-head .d3{display:none}
  .li .rm{grid-column:3;justify-self:end}
}
@media(max-width:640px){
  .g2,.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qa{grid-template-columns:repeat(2,minmax(0,1fr))}
  .totals{max-width:none}
  .view-head h1{font-size:var(--t-xl)}
  .card-body,.card-pad{padding:var(--s4)}
  table.tbl th,table.tbl td{padding:var(--s3)}
}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:var(--z-scrim);display:none}
.scrim.on{display:block;animation:fade var(--dur) var(--ease)}
@media(min-width:901px){.scrim{display:none !important}}


/* ------------------------------------------------- sticky bill action bar
   Billing is the one thing done dozens of times a day. The running total and
   the Save action stay pinned to the bottom so they are never scrolled away. */
.billbar{
  position:sticky;bottom:0;z-index:20;margin:var(--s5) calc(var(--s5) * -1) calc(var(--s5) * -1);
  padding:var(--s3) var(--s5);
  background:var(--surface);border-top:1px solid var(--border);
  box-shadow:0 -4px 20px rgba(15,23,42,.08);
  display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
}
html[data-theme="dark"] .billbar{box-shadow:0 -4px 20px rgba(0,0,0,.45)}
.billbar .bb-tot{display:flex;flex-direction:column;gap:1px;min-width:120px}
.billbar .bb-tot .l{font-size:var(--t-xs);color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.billbar .bb-tot .v{font-size:var(--t-2xl);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.billbar .bb-due{display:flex;flex-direction:column;gap:1px;min-width:100px}
.billbar .bb-due .l{font-size:var(--t-xs);color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.billbar .bb-due .v{font-size:var(--t-lg);font-weight:700;line-height:1.2}
.billbar .bb-due .v.owed{color:var(--danger)}
.billbar .bb-due .v.clear{color:var(--accent)}
.billbar .bb-actions{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap}
.billbar .bb-count{font-size:var(--t-sm);color:var(--fg-2);font-weight:600}
@media(max-width:640px){
  .billbar{gap:var(--s3);padding:var(--s3) var(--s4)}
  .billbar .bb-actions{width:100%;margin-left:0}
  .billbar .bb-actions .btn{flex:1}
  .billbar .bb-tot .v{font-size:var(--t-xl)}
}
/* leave room so the bar never hides the last row */
.view.has-billbar{padding-bottom:0}
/* page padding shrinks to 16px on narrow screens — the bar must pull out by the same amount */
@media(max-width:900px){.billbar{margin:var(--s4) calc(var(--s4) * -1) calc(var(--s4) * -1);padding:var(--s3) var(--s4)}}


/* ------------------------------------------------ touch target expansion
   Dense tables need compact controls, but a finger needs 44px. These keep
   the visual size small while extending the tappable area to meet the
   minimum — the standard way to satisfy both. */
.btn-sm{position:relative}
.btn-sm::after{
  content:"";position:absolute;left:0;right:0;top:50%;
  transform:translateY(-50%);height:44px;
}
.chip{position:relative}
.chip::after{
  content:"";position:absolute;left:0;right:0;top:50%;
  transform:translateY(-50%);height:44px;
}
/* inline links inside data tables are real tap targets */
table.tbl a{
  position:relative;display:inline-block;padding:4px 0;font-weight:600;
}
table.tbl a::after{content:"";position:absolute;inset:-11px -8px}
table.tbl a:hover{text-decoration:underline}

/* the removal button on an invoice line is small on purpose — expand its reach */
.li .rm{position:relative}
.li .rm::after{content:"";position:absolute;inset:-2px -6px}

/* =========================================================== New Bill — one-screen billing
   Wide screens (tablet landscape, laptop): customer and items on the left; bill total, payment
   and Save on the right, always in view. Narrow screens: the same cards stacked
   (customer → items → payment) with the sticky bill bar at the bottom. */
.pos-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.pos-title{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;min-width:0}
.pos-title h1{font-size:var(--t-2xl)}
.pos-head #nsclear{margin-left:auto}
.pos{display:flex;flex-direction:column;gap:var(--s4)}
.pos > .card{padding:var(--s4)}
.pos-sec{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);min-height:22px}
.pos-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.pos-hint{font-size:var(--t-sm);color:var(--fg-3)}
.pos-count{margin-left:auto;font-size:var(--t-sm);color:var(--fg-2);font-weight:600}

.search-box{position:relative;display:flex;align-items:center;flex:1;min-width:0}
.search-box .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fg-3);display:flex;pointer-events:none}
.search-box input{
  width:100%;min-height:52px;border-radius:var(--r);border:1px solid var(--border-input);background:var(--surface);
  padding:0 var(--s3) 0 44px;font-size:var(--t-md);outline:none;color:var(--fg);
  transition:border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.search-box input::placeholder{color:var(--fg-3)}
.search-box input:focus{border-color:var(--secondary);box-shadow:0 0 0 3px var(--primary-soft)}
.search-row{display:flex;gap:var(--s2);align-items:stretch}
.search-row .btn{min-height:52px;flex:0 0 auto}

/* product results, quick add, the items on the bill */
.pres-list{display:grid;gap:6px}
.pres-list:not(:empty){margin-top:var(--s3)}
.pres{
  display:flex;align-items:center;gap:var(--s3);width:100%;min-height:62px;padding:8px 10px 8px var(--s3);
  border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--fg);
  text-align:left;font:inherit;cursor:pointer;transition:background var(--dur-fast) var(--ease);
}
.pres:hover{background:var(--surface-2)}
.pres:active{background:var(--surface-3)}
.pres-main{display:flex;flex-direction:column;flex:1;min-width:0}
.pres-main .t{font-weight:600;font-size:var(--t-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pres-main .d{font-size:var(--t-sm);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pres-rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto}
.pres-add{width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:0 0 auto}
.pres-none{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;
  padding:var(--s3);border:1px dashed var(--border-input);border-radius:var(--r);color:var(--fg-2);font-size:var(--t-md);
}
/* one row that scrolls sideways, so the items list keeps its room */
.pos-quick{display:flex;gap:var(--s2);align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:4px 2px 8px}
.pos-quick > *{flex:0 0 auto}
.pos-quick .pos-hint{white-space:nowrap}
.pos-quick:not(:empty){margin-top:var(--s2)}
.pos-quick .qn{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.pos-quick .chip b{color:var(--fg);font-weight:700}

.cart{margin-top:var(--s3)}
.cart-empty{padding:var(--s8) var(--s4);text-align:center;color:var(--fg-3);border:1px dashed var(--border);border-radius:var(--r-lg)}
.cart-empty .eic{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto var(--s3);color:var(--fg-3)}
.cart-empty .t{font-weight:650;color:var(--fg-2);font-size:var(--t-base)}
.cart-empty .d{font-size:var(--t-md);margin:4px auto 0;max-width:40ch}

.cl{border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s3);background:var(--surface)}
.cl + .cl{margin-top:var(--s2)}
.cl-flash{animation:cl-flash 1.4s var(--ease)}
@keyframes cl-flash{0%,35%{background:var(--primary-soft);border-color:var(--secondary)}100%{background:var(--surface);border-color:var(--border)}}
.cl-top{display:flex;align-items:flex-start;gap:var(--s3)}
.cl-name{flex:1;min-width:0;font-weight:650;font-size:var(--t-md);line-height:1.3;overflow-wrap:anywhere}
.cl-name small{display:block;margin-top:2px;font-weight:450;font-size:var(--t-xs);color:var(--fg-3)}
.cl-amt{font-weight:700;font-size:var(--t-md);white-space:nowrap;padding-top:1px}
.cl-rm{
  position:relative;width:40px;height:40px;margin:-8px -8px 0 0;flex:0 0 auto;border:none;background:none;
  border-radius:var(--r-sm);color:var(--fg-3);display:grid;place-items:center;cursor:pointer;
}
.cl-rm::after{content:"";position:absolute;inset:-2px}
.cl-rm:hover{background:var(--danger-soft);color:var(--danger)}
.cl-ctl{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2)}
.cl-x{color:var(--fg-3);font-weight:600}
.cl-ctl .link-btn{margin-left:auto}
.qty{display:inline-flex;align-items:stretch;border:1px solid var(--border-input);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.qty button{width:44px;min-height:44px;border:none;background:var(--surface-2);color:var(--fg);font-size:22px;font-weight:600;line-height:1;cursor:pointer}
.qty button:not(:disabled):active{background:var(--surface-3)}
.qty button:disabled{color:var(--fg-3);opacity:.45;cursor:default}
.qty input{
  width:52px;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--surface);
  color:var(--fg);text-align:center;font-size:var(--t-md);font-weight:700;outline:none;-moz-appearance:textfield;
}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money-in{display:inline-flex;align-items:center;min-height:44px;padding-left:10px;border:1px solid var(--border-input);border-radius:var(--r);background:var(--surface)}
.money-in > span{color:var(--fg-3);font-weight:600}
.money-in input{width:104px;min-height:42px;padding:0 8px 0 4px;border:none;outline:none;background:transparent;color:var(--fg);font-size:var(--t-md);font-variant-numeric:tabular-nums}
.qty:focus-within,.money-in:focus-within{border-color:var(--secondary);box-shadow:0 0 0 3px var(--primary-soft)}
.cl-disc{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--fg-2);font-weight:600}
.cl-disc input,.cl-disc select,.pay-disc-row input,.pay-disc-row select,.rx-mini select{
  min-height:44px;border:1px solid var(--border-input);border-radius:var(--r-sm);background:var(--surface);color:var(--fg);padding:0 8px;outline:none;
}
.cl-disc input{width:84px}
.cl-disc input:focus,.cl-disc select:focus,.pay-disc-row input:focus,.pay-disc-row select:focus,.rx-mini select:focus{
  border-color:var(--secondary);box-shadow:0 0 0 3px var(--primary-soft);
}
.link-btn{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 6px;border:none;background:none;border-radius:var(--r-sm);
  color:var(--secondary);font-size:var(--t-sm);font-weight:650;cursor:pointer;
}
.link-btn:hover{background:var(--surface-2)}
.link-btn.danger{color:var(--danger)}

/* customer + prescription */
.cust-chip{display:flex;align-items:center;gap:var(--s3)}
.cust-chip .avatar{width:48px;height:48px}
.cust-main{flex:1;min-width:0}
.cust-main .t{font-weight:650;font-size:var(--t-md);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust-main .d{font-size:var(--t-sm);color:var(--fg-3)}
.cust-due{margin-top:4px}
.cres-list{display:grid;gap:4px}
.cres-list:not(:empty){margin-top:6px}
.cres{
  display:flex;align-items:center;gap:var(--s3);width:100%;min-height:54px;padding:6px var(--s3);
  border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--fg);text-align:left;font:inherit;cursor:pointer;
}
.cres:hover{background:var(--surface-2)}
.cres .avatar{width:36px;height:36px;font-size:13px}
.cres-main{display:flex;flex-direction:column;flex:1;min-width:0}
.cres-main .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cres-main .d{font-size:var(--t-sm);color:var(--fg-3);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.cres-new{border-style:dashed;color:var(--secondary);font-weight:650}
.cres-none{padding:2px 2px 0}
.walkin{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2);color:var(--fg-2);font-size:var(--t-md)}
.walkin .link-btn{margin-left:auto}
.rx-mini{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--border);min-width:0}
.rx-mini-head{display:flex;align-items:center;gap:var(--s2);min-height:32px;font-weight:650;font-size:var(--t-md)}
.rx-mini-head > .link-btn,.rx-mini-head > .rx-acts{margin-left:auto;display:inline-flex}
.rx-empty{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-top:4px}
.rx-mini select{width:100%;margin-top:6px}
.rx-mini .rxpick-line{margin-top:6px}

/* bill total + payment */
.sum{display:grid;gap:6px;font-size:var(--t-md)}
.sum .r{display:flex;justify-content:space-between;gap:var(--s3);color:var(--fg-2)}
.sum .r .num{color:var(--fg);font-weight:600}
.sum .r .num.neg{color:var(--danger)}
.sum-total{
  display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin-top:4px;padding-top:var(--s3);
  border-top:2px solid var(--border-strong);font-size:var(--t-2xl);font-weight:750;letter-spacing:-.02em;
}
#ns-paybox > .link-btn{margin:var(--s2) 0 0 -6px}
.pay-disc{margin-top:var(--s3)}
.pay-disc > label,.paid-row > label{display:block;margin-bottom:4px;font-size:var(--t-sm);font-weight:600;color:var(--fg-2)}
.pay-disc-row{display:flex;gap:var(--s2);align-items:center}
.pay-disc-row input{flex:1;min-width:0}
.pay-disc-row select{width:64px}
.pay-sec{margin-top:var(--s4)}
.pm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.pm-grid .chip{justify-content:center;min-height:46px;padding:0 6px;border-radius:var(--r)}
.pm-grid .chip .ic{color:inherit}
.paid-row{margin-top:var(--s3)}
.paid-in{display:flex;gap:var(--s2);align-items:center}
.money-in.lg{flex:1;min-width:0;min-height:52px}
.money-in.lg input{width:100%;min-height:50px;font-size:var(--t-lg);font-weight:700}
.paid-in .chip{min-height:52px;border-radius:var(--r)}
.split-list{display:grid;gap:var(--s2)}
.split-row{display:flex;align-items:center;gap:var(--s2)}
.split-row select{
  flex:0 0 104px;min-height:44px;border:1px solid var(--border-input);border-radius:var(--r-sm);
  background:var(--surface);color:var(--fg);padding:0 6px;outline:none;
}
.split-row select:focus{border-color:var(--secondary);box-shadow:0 0 0 3px var(--primary-soft)}
.split-row .money-in{flex:1;min-width:0}
.split-row .money-in input{width:100%}
.split-row .chip{min-height:44px}
.split-row .cl-rm{width:34px;height:34px;margin:0;flex:0 0 auto}
.iv-totals .r.split{font-size:12px;color:var(--ivmute);margin-top:-4px}
.due-line{
  display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-top:var(--s3);
  padding:10px var(--s3);border-radius:var(--r);font-size:var(--t-md);font-weight:700;
}
.due-line:empty{display:none}
.due-line > span:first-child{display:inline-flex;align-items:center;gap:6px}
.due-line.owed{background:var(--danger-soft);color:var(--danger)}
.due-line.clear{background:var(--accent-soft);color:var(--accent)}
.due-line.change{background:var(--surface-2);color:var(--fg)}
.pay-actions{display:none}
.more{margin-top:var(--s4);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.more > summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s4);min-height:54px;font-weight:600;background:var(--surface-2);
}
.more > summary::-webkit-details-marker{display:none}
.more .more-hint{color:var(--fg-3);font-weight:500;font-size:var(--t-sm);margin-left:auto;text-align:right}
.more .chev{transition:transform var(--dur) var(--ease);color:var(--fg-3)}
.more[open] .chev{transform:rotate(180deg)}
.more-body{padding:var(--s4)}

/* the one-screen bill layout needs a tall window too — on a short screen it would squeeze
   the item list down to a sliver, so the normal scrolling layout is used instead */
@media(min-width:1180px) and (min-height:720px){
  .view.pos-view{display:flex;flex-direction:column;overflow:hidden;padding-bottom:var(--s4)}
  .view.pos-view .billbar{display:none}
  .pos{
    flex:1;min-height:0;display:grid;gap:var(--s4);
    grid-template-columns:minmax(0,1fr) minmax(340px,390px);
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"cust pay" "items pay";
  }
  .pos-cust{grid-area:cust;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s4);max-height:min(46vh,340px);overflow-y:auto}
  .pos-cust .rx-mini{margin-top:0;padding:0 0 0 var(--s4);border-top:none;border-left:1px solid var(--border)}
  .pos-items{grid-area:items;min-height:0;display:flex;flex-direction:column}
  .items-scroll{flex:1;min-height:190px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--s2) * -1);padding:0 var(--s2) 2px}
  .pos > .pos-pay{grid-area:pay;min-height:0;display:flex;flex-direction:column;padding:0}
  .pay-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--s4)}
  .pay-actions{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2);padding:var(--s3) var(--s4);border-top:1px solid var(--border)}
  .pay-actions .btn{min-height:56px}
}

.rx-hist .rx-cl{display:block;margin-top:3px}
.rx-hist td{vertical-align:middle}
.rx-hist tr.on td{background:var(--primary-soft)}
/* on a tablet the powers matter more than the prescription number */
@media(max-width:900px){
  .rx-hist th:nth-child(2),.rx-hist td:nth-child(2){display:none}
  .rx-hist td{white-space:normal}
  .rx-hist .rx-x{display:block}
}

/* ============================================== the app's own date calendar */
.dt-in{cursor:pointer;background:var(--surface)}
.dtp{
  position:fixed;z-index:450;width:312px;max-width:calc(100vw - 16px);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--e3);padding:var(--s3);
}
.dtp-type{display:flex;gap:6px;align-items:center}
.dtp-type input{
  flex:1;min-width:0;height:42px;text-align:center;font-size:var(--t-md);font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.06em;
}
.dtp-type .btn{height:42px}
.dtp-msg{font-size:var(--t-sm);color:var(--danger);font-weight:600;margin-top:6px}
.dtp-main{margin-top:var(--s2)}
.dtp-head{display:flex;align-items:center;gap:6px}
.dtp-nav{
  width:40px;height:40px;flex:0 0 auto;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);color:var(--fg-2);display:grid;place-items:center;cursor:pointer;
}
.dtp-nav:hover{background:var(--surface-2);color:var(--fg)}
.dtp-nav .flip{transform:rotate(180deg)}
.dtp-lbl{
  flex:1;min-height:40px;border:none;background:var(--surface-2);border-radius:var(--r-sm);
  font:inherit;font-weight:700;color:var(--fg);cursor:pointer;
}
.dtp-lbl:hover{background:var(--surface-3)}
.dtp-body{margin-top:var(--s2)}
.dtp-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.dtp-week span{text-align:center;font-size:11px;font-weight:700;color:var(--fg-3)}
.dtp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dtp-grid.m{grid-template-columns:repeat(3,1fr);gap:6px}
.dtp-grid.y{grid-template-columns:repeat(4,1fr);gap:6px}
.dtp-day,.dtp-cell{
  min-height:40px;border:1px solid transparent;border-radius:var(--r-sm);background:none;
  font:inherit;color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums;
}
.dtp-cell{min-height:44px;font-weight:600}
.dtp-day:hover,.dtp-cell:hover{background:var(--surface-2)}
.dtp-day.today{border-color:var(--secondary);font-weight:700}
.dtp-day.on,.dtp-cell.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700}
.dtp-day:disabled{color:var(--fg-3);opacity:.4;cursor:default}
.dtp-foot{display:flex;gap:var(--s2);margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--border)}
.dtp-foot .btn{flex:1;justify-content:center}

/* ======================================================= customer CSV import */
.csv-cols th,.csv-cols td{white-space:nowrap;font-size:var(--t-sm)}
.imp-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s2)}
.imp-stat{border:1px solid var(--border);border-radius:var(--r);padding:var(--s3);background:var(--surface-2)}
.imp-stat b{display:block;font-size:var(--t-xl);font-weight:750;letter-spacing:-.01em}
.imp-stat span{font-size:var(--t-sm);color:var(--fg-2)}
.imp-notes{margin:var(--s3) 0 0;padding-left:20px;line-height:1.6}

/* ======================================================= customer picker */
.pc-top{display:flex;gap:var(--s2);align-items:stretch}
.pc-top .f{flex:1}
.pc-top .btn{min-height:var(--tap)}
/* footer buttons keep their own height (flex would stretch the small walk-in button) */
.modal-foot{align-items:center}
.modal-foot .btn-walk{color:var(--fg-2);min-height:36px;padding:0 var(--s3);font-size:var(--t-sm)}

/* ====================================================== invoice document
   The invoice is paper: it stays light in dark mode on purpose. */
.iv-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s5);align-items:start}
/* the bill is a fixed-width document: keep the side cards beside it only when the
   column is genuinely wide enough, otherwise they squeeze and clip it */
@media(max-width:1500px){.iv-wrap{grid-template-columns:1fr}}
.iv-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.iv-side .card + .card{margin-top:var(--s4)}
.iv{
  --ivn:#1E3A5F;--ivn2:#2E5F96;--ivink:#0F172A;--ivmute:#5C6B80;--ivline:#E6EBF1;--ivsoft:#F5F8FB;
  background:#fff;color:var(--ivink);border-radius:18px;box-shadow:0 4px 12px rgba(15,23,42,.08),0 16px 40px rgba(15,23,42,.08);
  overflow:hidden;border:1px solid #E1E7EF;max-width:860px;width:100%;margin:0 auto;font-variant-numeric:tabular-nums;
}
.iv-top{
  position:relative;overflow:hidden;background:linear-gradient(135deg,var(--ivn) 0%,var(--ivn2) 100%);color:#fff;
  padding:30px 34px 26px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
}
.iv-top::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.iv-shop{display:flex;gap:16px;align-items:center;min-width:0;position:relative;z-index:1}
.iv-logo{width:78px;height:78px;border-radius:18px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:0 0 auto;overflow:hidden;color:#fff}
.iv-logo.has-img{background:#fff}
.iv-logo img{width:100%;height:100%;object-fit:contain}
.iv-logo.has-img img{padding:6px}
.iv-shopname{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.iv-shopmeta{font-size:13px;opacity:.9;margin-top:4px;line-height:1.5;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.iv-dot{opacity:.6}
.iv-doc{text-align:right;margin-left:auto;position:relative;z-index:1}
.iv-title{font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;opacity:.88}
.iv-no{display:inline-block;margin-top:8px;font-size:18px;font-weight:800;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.18)}
.iv-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--ivsoft);border-bottom:1px solid var(--ivline)}
.iv-strip > div{padding:12px 34px}
.iv-strip > div + div{border-left:1px solid var(--ivline)}
.iv-strip .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ivmute);font-weight:700}
.iv-strip .v{font-size:14px;font-weight:700;margin-top:3px}
.iv-body{padding:26px 34px 30px}
.iv-parties{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.iv-card{border:1px solid var(--ivline);border-radius:14px;padding:14px 16px}
.iv-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ivmute);font-weight:700}
.iv-name{font-size:18px;font-weight:800;margin-top:6px}
.iv-meta{font-size:13px;color:#4A5568;margin-top:4px;line-height:1.5}
.iv-amount{background:var(--ivsoft);text-align:right}
.iv-big{font-size:28px;font-weight:800;color:var(--ivn);margin-top:4px;letter-spacing:-.01em}
.iv-meta.is-due{color:#C81E1E;font-weight:700}
.iv-meta.is-paid{color:#047857;font-weight:700}
.iv-status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em}
.iv-status.is-paid{background:#E3F5EE;color:#047857}
.iv-status.is-part{background:#FDF2E2;color:#B45309}
.iv-status.is-unpaid{background:#FDEAEA;color:#C81E1E}
.iv-status.is-cancelled{background:#EAEFF5;color:#4A5568}
.iv-sectitle{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ivn);flex-wrap:wrap}
.iv-sectitle small{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ivmute);margin-left:auto}
.iv-rx{margin-top:20px;border:1px solid #D9E4F2;background:linear-gradient(180deg,#F1F6FD,#FFFFFF);border-radius:14px;padding:14px 16px}
.iv-rxsub{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ivmute);margin-top:12px;text-transform:uppercase}
.iv-rx table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px;margin-top:6px}
.iv-rx th{font-size:11px;color:var(--ivmute);text-align:center;font-weight:700;letter-spacing:.06em;padding:2px 4px}
.iv-rx th:first-child{text-align:left}
.iv-rx td{text-align:center;padding:9px 4px;background:#fff;border-top:1px solid var(--ivline);border-bottom:1px solid var(--ivline);font-weight:600}
.iv-rx td:first-child{text-align:left;border-left:1px solid var(--ivline);border-radius:10px 0 0 10px;padding-left:12px;color:var(--ivn);font-weight:800}
.iv-rx td:last-child{border-right:1px solid var(--ivline);border-radius:0 10px 10px 0}
.iv-items{width:100%;border-collapse:separate;border-spacing:0;margin-top:20px;font-size:14px;border:1px solid var(--ivline);border-radius:14px;overflow:hidden}
.iv-items th{

}
.iv-items td{padding:12px;border-top:1px solid var(--ivline);vertical-align:top}

.iv-items .c{width:34px;color:var(--ivmute);text-align:center}
.iv-items .n{text-align:right;white-space:nowrap}

.iv-items .it-row{display:flex;align-items:flex-start;gap:10px}
.iv-items .it-img{width:40px;height:40px;flex:0 0 auto;border-radius:7px;object-fit:cover;border:1px solid var(--ivline);background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.iv-items .it-txt{min-width:0}
.iv-sum{display:flex;justify-content:space-between;gap:24px;margin-top:20px;flex-wrap:wrap;align-items:flex-start}

.iv-totals .paid{color:#047857;font-weight:700}

.iv-owe{margin-top:16px;padding:10px 14px;border-radius:12px;background:#FDEAEA;color:#C81E1E;font-size:13px;font-weight:700}
.iv-foot{

}
.iv-thanks{font-size:17px;font-weight:800;color:var(--ivn)}
.iv-sign{font-size:12px;color:var(--ivmute);text-align:right}
.iv-sign b{display:block;margin-top:26px;border-top:1px solid #CBD4E1;padding-top:6px;color:var(--ivink);font-size:13px}
.iv-bottom{height:8px;background:linear-gradient(90deg,var(--ivn),var(--ivn2),#3AA0D8)}
@media(max-width:640px){

  .iv-parties{grid-template-columns:1fr}
  .iv-amount{text-align:left}
  .iv-doc{text-align:left;margin-left:0}
}

/* the shop's own stationery: faint frames behind the whole bill */
.iv-pattern{background-image:url("data:image/svg+xml,<svg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22150%22%20height=%22150%22%20viewBox=%220%200%20150%20150%22><g%20fill=%22none%22%20stroke=%22%231E3A5F%22%20stroke-opacity=%220.055%22%20stroke-width=%222.6%22%20stroke-linecap=%22round%22><circle%20cx=%2226%22%20cy=%2234%22%20r=%2212%22/><circle%20cx=%2260%22%20cy=%2234%22%20r=%2212%22/><path%20d=%22M38%2031c4-5%208-5%2012%200%22/><path%20d=%22M14%2030%205%2024%22/><path%20d=%22M72%2030%2081%2024%22/><circle%20cx=%22101%22%20cy=%22109%22%20r=%2212%22/><circle%20cx=%22135%22%20cy=%22109%22%20r=%2212%22/><path%20d=%22M113%20106c4-5%208-5%2012%200%22/><path%20d=%22M89%20105%2080%2099%22/><path%20d=%22M147%20105%20156%2099%22/></g></svg>");background-repeat:repeat;background-position:0 0}

/* invoice actions — WhatsApp green darkened to keep white text at 5.4:1 */
.iv-actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
.guide{margin:var(--s4) 0 0;padding-left:22px;line-height:1.6}

.logo-pick{display:flex;gap:var(--s4);align-items:center}

.btn-wa{background:#0E7A41;border-color:#0E7A41;color:#fff}
.wa-alt{padding:var(--s3);border:1px dashed var(--border);border-radius:var(--r);background:var(--surface-2)}

.wa-steps{display:grid;gap:var(--s2)}
.wa-step{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3);border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2)}

@media print{

  #print-root .iv, #print-root .iv *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ================================================== save problem bar
   Shown when a save fails; stays until a save succeeds. */
.savebar{
  display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);flex:0 0 auto;

}
.savebar[hidden]{display:none}
.savebar .tx{flex:1;line-height:1.4}

/* ======================================================== long lists */
.more-rows{
  display:flex;align-items:center;justify-content:center;gap:var(--s3);flex-wrap:wrap;
  padding:var(--s4);border-top:1px solid var(--border);color:var(--fg-2);font-size:var(--t-sm);
}

/* ============================================ prescription on the bill */
.rxpick-head{display:flex;align-items:center;gap:var(--s2)}
.rxpick-head .ic{color:var(--primary)}
.imp-bills{border:1px solid var(--border);border-radius:var(--r);padding:var(--s3) var(--s4);background:var(--surface-2)}

.bk-when .r{display:flex;justify-content:space-between;gap:var(--s3);padding:3px 0;font-size:var(--t-sm);flex-wrap:wrap}
.bill-who{margin-top:var(--s3)}
.bill-who .f label{font-size:var(--t-sm)}
.cl-name .cl-nm{
  width:100%;border:1px solid transparent;background:transparent;font-weight:600;font-size:var(--t-md);
  padding:2px 4px;margin:-2px -4px 0;border-radius:8px;color:var(--fg);
}
.cl-name .cl-nm:hover{border-color:var(--border)}
.cl-name .cl-nm:focus{border-color:var(--primary);background:var(--surface)}

.paid-already{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:var(--s3)}
.paid-already .r{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);font-size:var(--t-md)}
.paid-already .num{font-size:var(--t-lg)}
.chg-list{margin:6px 0 0;padding-left:18px;font-size:var(--t-sm);line-height:1.55}
.chg-list li{margin:2px 0}
.edit-row{padding:10px 0}
.edit-row.bordered{border-top:1px solid var(--border)}

.rxpick-line{
  margin-top:var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r);background:var(--surface-2);
  border:1px solid var(--border);font-weight:600;font-size:var(--t-md);font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;white-space:pre-line;
}
.modal-foot .btn-left{color:var(--fg-2);min-height:36px;padding:0 var(--s3);font-size:var(--t-sm)}

/* Size/colour variant picker on the New Bill screen */
.vpick { display:grid; gap:8px; }
.vpick-b { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border:1.5px solid var(--line,#e2e6ef); border-radius:10px; background:#fff; cursor:pointer; text-align:left; }
.vpick-b:hover { border-color:var(--brand,#4f46e5); }
.vpick-l { font-weight:650; }
.vpick-s { font-size:.85em; color:var(--muted,#5b6478); }
.vpick-out { opacity:.55; }
.vpick-out .vpick-s { color:#dc2626; }

/* ===== Guided tour (52-tour.js) ======================================== */
.tour-dim{position:fixed;inset:0;z-index:460;background:transparent}
.tour-root.centered .tour-dim{background:rgba(2,6,23,.72)}
.tour-ring{position:fixed;z-index:461;border:2.5px solid var(--primary);border-radius:12px;
  box-shadow:0 0 0 9999px rgba(2,6,23,.72);pointer-events:none;
  transition:left .18s var(--ease,ease),top .18s var(--ease,ease),width .18s var(--ease,ease),height .18s var(--ease,ease)}
.tour-card{position:fixed;z-index:462;width:320px;max-width:calc(100vw - 24px);
  background:var(--surface,#fff);color:var(--text,#0f172a);border:1px solid var(--border,#e2e6ef);
  border-radius:16px;padding:18px 18px 14px;box-shadow:0 18px 50px rgba(2,6,23,.35);
  transition:left .18s var(--ease,ease),top .18s var(--ease,ease)}
.tour-hd{font-size:1.12rem;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.tour-tx{font-size:.95rem;line-height:1.5;color:var(--muted,#5b6478)}
.tour-ft{display:flex;align-items:center;gap:10px;margin-top:16px}
.tour-skip{background:none;border:0;color:var(--muted,#5b6478);font-size:.86rem;cursor:pointer;padding:6px 2px}
.tour-skip:hover{color:var(--text,#0f172a);text-decoration:underline}
.tour-dots{display:flex;gap:5px;margin:0 auto;align-items:center}
.tour-dot{width:6px;height:6px;border-radius:50%;background:var(--border,#cbd3e1)}
.tour-dot.on{background:var(--primary);transform:scale(1.25)}
.tour-nav{display:flex;gap:8px}
@media (max-width:560px){
  .tour-card{width:calc(100vw - 24px)}
  .tour-ft{flex-wrap:wrap}
  .tour-dots{order:3;width:100%;margin:4px 0 0;justify-content:center}
}

/* ===== POS cashier screen (43b-pos.js) ================================= */
.pos-wrap{display:grid;grid-template-columns:1fr 370px;gap:16px;align-items:start}
.pos-left{min-width:0}
.pos-search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:0 12px;height:52px;position:relative}
.pos-search .si{color:var(--fg-3);display:flex}
.pos-search input{flex:1;height:100%;border:0;background:transparent;font-size:16px;color:var(--text);outline:none}
.pos-cats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pos-tile{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;transition:transform .08s ease,border-color .15s,box-shadow .15s}
.pos-tile:hover{border-color:var(--primary);box-shadow:0 6px 18px -10px rgba(79,70,229,.5)}
.pos-tile:active{transform:scale(.97)}
.pos-tile.out{opacity:.55}
.pos-tile-img{width:100%;height:76px;border-radius:10px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary);overflow:hidden}
.pos-tile-img img{width:100%;height:100%;object-fit:cover}
.pos-tile-name{font-weight:650;font-size:14px;line-height:1.25;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.pos-tile-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pos-tile-price{font-weight:800;color:var(--text)}
.pos-tile-stock{font-size:11px;font-weight:700;color:var(--fg-3);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:1px 8px}
.pos-tile-stock.out{color:var(--danger)}
.pos-none{padding:40px;text-align:center;color:var(--fg-3)}

.pos-right{position:sticky;top:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100vh - 150px);overflow:hidden}
.pos-cart-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pos-cust{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--text);cursor:pointer;min-width:0}
.pos-cust span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-clear{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--danger);font-size:13px;font-weight:600;cursor:pointer}
.pos-lines{flex:1;overflow-y:auto;padding:6px 10px}
.pos-empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--fg-3);padding:48px 16px;text-align:center}
.pos-line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.pos-line:last-child{border-bottom:0}
.pos-line-name{font-weight:650;font-size:14px;color:var(--text)}
.pos-line-rate{font-size:12px;color:var(--fg-3)}
.pos-qty{display:inline-flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.pos-qty button{width:34px;height:34px;border:0;background:var(--bg);color:var(--text);font-size:19px;font-weight:700;cursor:pointer}
.pos-qty button:active{background:var(--primary-soft)}
.pos-qty span{min-width:30px;text-align:center;font-weight:700}
.pos-line-amt{font-weight:800;min-width:66px;text-align:right}
.pos-foot{padding:12px 14px;border-top:1px solid var(--line)}
.pos-foot-r{display:flex;justify-content:space-between;font-size:13px;color:var(--fg-2);margin-bottom:8px}
.pos-charge{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px;padding:0 18px;border:0;border-radius:13px;background:var(--primary);color:#fff;font-size:17px;font-weight:700;cursor:pointer;transition:background .15s,transform .08s}
.pos-charge:hover{background:var(--primary-hover)}
.pos-charge:active{transform:scale(.98)}
.pos-charge:disabled{opacity:.5;cursor:not-allowed}
.pos-charge-t{font-size:20px}
.pos-charge-t.bump{animation:posbump .3s ease}
@keyframes posbump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}

/* payment sheet */
.pos-pay-total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--fg-2);margin-bottom:14px}
.pos-pay-total b{font-size:28px;color:var(--text)}
.pos-methods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pos-m{height:46px;border:1.5px solid var(--border);border-radius:11px;background:var(--surface);font-weight:650;color:var(--text);cursor:pointer}
.pos-m.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.pos-quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pos-change{margin-top:12px;padding:12px;border-radius:11px;background:var(--primary-soft);color:var(--text);font-size:15px}
.pos-change b{font-size:18px}
.pos-change.short{background:var(--danger-soft);color:var(--danger)}

/* variant + customer pickers */
.pos-vpick{display:grid;gap:8px}
.pos-vbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:11px;background:var(--surface);cursor:pointer;font-weight:650;color:var(--text)}
.pos-vbtn:hover{border-color:var(--primary)}
.pos-vbtn.out{opacity:.5}
.pos-cres{margin-top:10px;display:grid;gap:6px;max-height:300px;overflow:auto}
.pos-cres-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left}
.pos-cres-row:hover{border-color:var(--primary)}

/* mobile floating cart bar */
.pos-fab{display:none}
@media (max-width:900px){
  .pos-wrap{grid-template-columns:1fr}
  .pos-right{display:none}
  .pos-fab{display:flex;align-items:center;justify-content:space-between;gap:12px;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;height:56px;padding:0 18px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;font-size:15px;box-shadow:0 12px 30px -8px rgba(79,70,229,.6);cursor:pointer}
  .pos-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}

/* "More options" collapsible in the product form */
.pos-more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.pos-more>summary{cursor:pointer;font-weight:650;color:var(--primary);list-style:none;padding:6px 0;user-select:none}
.pos-more>summary::-webkit-details-marker{display:none}
.pos-more>summary::before{content:"+ ";font-weight:800}
.pos-more[open]>summary::before{content:"– "}

<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="print-root"></div>
<div class="loading" id="boot"><div style="text-align:center"><div class="spin" style="margin:0 auto"></div>
<div style="margin-top:14px;color:#5a6a7d;font-weight:600">Loading…</div></div></div>

<script>

/* ===== 00-util.js ===== */
/* =========================================================================
   00-util.js — helpers used everywhere
   ========================================================================= */
var App = window.App || {};
window.App = App;

App.APP_VERSION = '1.25.0';
App.SCHEMA_VERSION = 2;   /* bump when data shape changes; see 10-store migrations */

/* ---------- ids ---------- */
App.uid = function (prefix) {
  var t = Date.now().toString(36);
  var r = Math.random().toString(36).slice(2, 8);
  return (prefix || 'id') + '_' + t + r;
};

/* ---------- safety checks for data that came from a file ----------
   Ids the app creates look like "cus_mtx3k2a9". Anything else is refused,
   because ids are written into page attributes. */
App.SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
App.safeId = function (v) { return typeof v === 'string' && App.SAFE_ID.test(v) ? v : ''; };

/* only genuine embedded pictures may reach an <img src> */
App.safeImg = function (v) {
  return typeof v === 'string' && v.length < 6000000 &&
    /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=\s]+$/.test(v) ? v : '';
};

/* colours typed or picked in Settings: only #RRGGBB is accepted */
App.safeColor = function (v, fallback) {
  return typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v) ? v.toUpperCase() : fallback;
};
/* WCAG contrast ratio of two #RRGGBB colours (1 to 21); 4.5 or more is easy to read */
App.contrast = function (a, b) {
  function lum(h) {
    var c = [1, 3, 5].map(function (i) {
      var v = parseInt(h.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  var l1 = lum(a), l2 = lum(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
};

/* ---------- dates ---------- */
App.today = function () { return App.dstr(new Date()); };

App.dstr = function (d) {                  /* Date -> 'YYYY-MM-DD' (local) */
  if (!d) return '';
  if (typeof d === 'string') return d.slice(0, 10);
  var m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
};

App.nowISO = function () { return new Date().toISOString(); };

App.fmtDate = function (s) {               /* 'YYYY-MM-DD' -> '01 Sep 2026' */
  if (!s) return '—';
  var p = String(s).slice(0, 10).split('-');
  if (p.length !== 3) return App.esc(s);
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return App.esc(p[2] + ' ' + (M[parseInt(p[1], 10) - 1] || p[1]) + ' ' + p[0]);
};

App.fmtDateTime = function (iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d)) return App.esc(String(iso));
  var h = d.getHours(), mi = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return App.fmtDate(App.dstr(d)) + ', ' + h + ':' + (mi < 10 ? '0' : '') + mi + ' ' + ap;
};

App.monthName = function (m) {
  return ['January','February','March','April','May','June','July','August','September','October','November','December'][m - 1] || '';
};

App.monthOf = function (dateStr) { return String(dateStr || '').slice(0, 7); };  /* YYYY-MM */
App.yearOf  = function (dateStr) { return String(dateStr || '').slice(0, 4); };

App.addDays = function (dateStr, n) {
  var d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + n);

    catch (e) { res = 'ERROR ' + (e && e.message ? e.message : e); }

  var nl = text.indexOf('\n'), first = nl >= 0 ? text.slice(0, nl) : text;
  var count = function (ch) { return first.split(ch).length - 1; };

  if (count('\t') > count(',') && count('\t') >= count(';')) delim = '\t';
  else if (count(';') > count(',')) delim = ';';

  while (i < n) {
    var ch = text.charAt(i);
    if (quoted) {
      if (ch === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
        quoted = false; i++; continue;
      }
      start = i;
      while (i < n && text.charAt(i) !== '"') i++;
      field += text.slice(start, i);
      continue;
    }
    if (ch === '"' && field === '') { quoted = true; i++; continue; }
    if (ch === delim) { row.push(field); field = ''; i++; continue; }
    if (ch === '\n' || ch === '\r') {
      row.push(field); rows.push(row); row = []; field = '';
      i += (ch === '\r' && text.charAt(i + 1) === '\n') ? 2 : 1;
      continue;
    }
    start = i;
    while (i < n) {
      var c2 = text.charAt(i);
      if (c2 === delim || c2 === '\n' || c2 === '\r') break;
      i++;
    }
    field += text.slice(start, i);
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
};

App.toCSV = function (rows) {
  return rows.map(function (r) {
    return r.map(function (c) {
      var s = (c === null || c === undefined) ? '' : String(c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\r\n');
};

/* ---------- bytes ---------- */
App.bytes = function (n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
};

/* ---------- debounce ---------- */
App.debounce = function (fn, ms) {
  var t;
  return function () {
    var a = arguments, c = this;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(c, a); }, ms || 200);
  };
};

/* the app frame never scrolls as a whole — only the page area inside it does.
   If the browser ever scrolls the window (e.g. to reveal a focused element), put it back. */
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('scroll', function () {
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
  }, { passive: true });
}

/* =========================================================================
   10-store.js — local persistence, schema, migrations, atomic writes
   No server. No cloud. Data lives on this device only.

   Storage strategy
   ----------------
   The complete dataset is held in memory as one plain object (App.db) and
   written to local storage as ONE value inside ONE transaction. That makes
   every save atomic by construction: either the whole new state lands, or
   the previous state stays untouched. A half-written sale cannot exist.

   Driver order:   IndexedDB  ->  localStorage  ->  memory-only (warns loudly)
   Safety copies:  'main' (current)  +  'main_prev' (last known-good)
   ========================================================================= */
