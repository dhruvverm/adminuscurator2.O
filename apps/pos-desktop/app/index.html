        if (clBrand) {
          ctx.textAlign = 'left'; font(ctx, '600', 23); ctx.fillStyle = C.mute;
          ctx.fillText(fit(ctx, 'Lens: ' + clBrand, IW - 88), P + 44, y + 470);
        }
      }
      y += bh;
    }

    /* ---- items ---- */
    y += 28;
    var QTY = P + 564, RATE = P + 744, AMT = R - 28, NX = P + 76, NW = 440;
    var rows = s.items.map(function (it) {
      font(ctx, '700', 26);
      var lines = wrap(ctx, it.name, NW);
      if (lines.length > 3) { lines = lines.slice(0, 3); lines[2] = fit(ctx, lines[2] + '…', NW); }
      var sub = [it.sku, App.n(it.discountAmount) ? 'Discount −' + App.money(it.discountAmount) : ''].filter(Boolean).join('  ·  ');
      return { it: it, lines: lines, sub: sub, h: 44 + (lines.length - 1) * 34 + (sub ? 32 : 0) + 26 };
    });
    var headH = 60, tableH = headH + rows.reduce(function (a, r) { return a + r.h; }, 0);
    ctx.save();
    rr(ctx, P, y, IW, tableH, 22); ctx.clip();
    ctx.fillStyle = C.head; ctx.fillRect(P, y, IW, headH);
    var rowY = y + headH;
    rows.forEach(function (r, i) {
      if (i % 2 === 1) { ctx.fillStyle = C.zebra; ctx.fillRect(P, rowY, IW, r.h); }
      ctx.fillStyle = C.line; ctx.fillRect(P, rowY, IW, 2);
      r.y = rowY; rowY += r.h;
    });
    ctx.restore();
    rr(ctx, P + 1, y + 1, IW - 2, tableH - 2, 22); ctx.lineWidth = 2; ctx.strokeStyle = C.line; ctx.stroke();

    font(ctx, '800', 17); spacing(ctx, 2); ctx.fillStyle = C.navy;
    ctx.textAlign = 'center'; ctx.fillText('#', P + 38, y + 38);
    ctx.textAlign = 'left'; ctx.fillText('ITEM', NX, y + 38);
    ctx.textAlign = 'right'; ctx.fillText('QTY', QTY, y + 38); ctx.fillText('RATE', RATE, y + 38); ctx.fillText('AMOUNT', AMT, y + 38);
    spacing(ctx, 0);

    rows.forEach(function (r, i) {
      var it = r.it, base = r.y + 44;
      font(ctx, '600', 22); ctx.fillStyle = C.mute; ctx.textAlign = 'center'; ctx.fillText(String(i + 1), P + 38, base);
      font(ctx, '700', 26); ctx.fillStyle = C.ink; ctx.textAlign = 'left';
      r.lines.forEach(function (l, j) { ctx.fillText(l, NX, base + j * 34); });
      if (r.sub) { font(ctx, '400', 20); ctx.fillStyle = C.mute; ctx.fillText(fit(ctx, r.sub, NW), NX, base + (r.lines.length - 1) * 34 + 32); }
      ctx.textAlign = 'right'; font(ctx, '400', 25); ctx.fillStyle = C.ink2;
      ctx.fillText(String(App.n(it.qty)), QTY, base);
      ctx.fillText(App.money(it.rate), RATE, base);
      font(ctx, '700', 26); ctx.fillStyle = C.ink; ctx.fillText(App.money(it.amount), AMT, base);
    });
    y += tableH;

    /* ---- note (left) + totals (right) ---- */
    y += 32;
    var top = y, TXL = R - 420, noteBottom = top;
    if (s.notes) {
      font(ctx, '400', 22);
      var nl = wrap(ctx, s.notes, 344);
      if (nl.length > 8) { nl = nl.slice(0, 8); nl[7] = fit(ctx, nl[7] + '…', 344); }
      var nh = 78 + nl.length * 32;
      rr(ctx, P, top, 400, nh, 20); ctx.fillStyle = C.note; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = C.noteLine; ctx.stroke();
      ctx.textAlign = 'left'; label(ctx, 'NOTE', P + 28, top + 44, C.amber);
      font(ctx, '400', 22); ctx.fillStyle = C.ink2;
      nl.forEach(function (l, i) { ctx.fillText(l, P + 28, top + 84 + i * 32); });
      noteBottom = top + nh;
    }
    function row(lbl, val, color, weight) {
      font(ctx, weight || '400', 25); ctx.fillStyle = color || C.ink2; ctx.textAlign = 'left'; ctx.fillText(lbl, TXL + 8, y + 30);
      font(ctx, weight || '600', 25); ctx.fillStyle = color || C.ink; ctx.textAlign = 'right'; ctx.fillText(val, R - 8, y + 30);
      y += 46;
    }
    row('Subtotal', App.money(s.subtotal));
    if (App.n(s.totalDiscount)) row('Discount', '−' + App.money(s.totalDiscount));
    if (App.n(s.taxAmount)) row('GST ' + App.n(s.taxPercent) + '%' + (s.taxInclusive ? ' (incl.)' : ''), App.money(s.taxAmount));
    if (App.n(s.roundOff)) row('Round off', App.money(s.roundOff));
    y += 8;
    rr(ctx, TXL, y, R - TXL, 80, 20); ctx.fillStyle = C.navy; ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'left'; font(ctx, '800', 30); ctx.fillText('Total', TXL + 26, y + 51);
    ctx.textAlign = 'right'; sizeToFit(ctx, '800', 36, App.money(s.total), R - TXL - 150);
    ctx.fillText(App.money(s.total), R - 26, y + 53);
    y += 92;
    row('Paid', App.money(d.paid), C.green, '700');
    if (s.paymentSplit && s.paymentSplit.length > 1) {
      font(ctx, '400', 20); ctx.fillStyle = C.mute; ctx.textAlign = 'right';
      ctx.fillText(s.paymentSplit.map(function (p) { return p.method + ' ' + App.money(p.amount); }).join('   ·   '), R - 8, y + 4);
      y += 30;
    }
    if (d.due > 0.5) row('Balance due', App.money(d.due), C.red, '800');
    y = Math.max(y, noteBottom);

    if (d.c && d.outstanding > d.due + 0.5) {
      y += 24;
      rr(ctx, P, y, IW, 68, 18); ctx.fillStyle = C.redSoft; ctx.fill();
      font(ctx, '700', 24); ctx.fillStyle = C.red; ctx.textAlign = 'left';
      ctx.fillText('Total outstanding on all bills: ' + App.money(d.outstanding), P + 28, y + 43);
      y += 68;
    }

    /* ---- thank-you footer ---- */
    y += 40;
    font(ctx, '800', 32);
    var thanks = wrap(ctx, set.invoiceFooterNote || 'Thank you for your visit!', 560).slice(0, 2);
    var textH = 130 + (thanks.length - 1) * 42, fh = Math.max(160, textH), off = (fh - textH) / 2;
    rr(ctx, P, y, IW, fh, 22); ctx.fillStyle = C.soft; ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = C.navy;
    thanks.forEach(function (l, i) { ctx.fillText(l, P + 30, y + off + 56 + i * 42); });
    font(ctx, '400', 22); ctx.fillStyle = C.ink2;
    ctx.fillText('We look forward to seeing you again.', P + 30, y + off + 96 + (thanks.length - 1) * 42);
    ctx.textAlign = 'right'; font(ctx, '400', 20); ctx.fillStyle = C.mute;
    ctx.fillText(fit(ctx, 'For ' + set.shopName, 320), R - 30, y + 46);
    ctx.fillStyle = C.sign; ctx.fillRect(R - 330, y + fh - 58, 300, 2);
    font(ctx, '700', 21); ctx.fillStyle = C.ink; ctx.fillText('Authorised signature', R - 30, y + fh - 26);
    y += fh + 40;

    var bg = ctx.createLinearGradient(0, 0, W, 0);
    bg.addColorStop(0, C.navy); bg.addColorStop(0.6, C.navy2); bg.addColorStop(1, C.sky);
    ctx.fillStyle = bg; ctx.fillRect(0, y, W, 14);
    y += 14;

    var out = document.createElement('canvas');
    out.width = Math.round(W * k); out.height = Math.round(Math.min(y, H) * k);
    out.getContext('2d').drawImage(cv, 0, 0);

  };

  INV.toPNG = function (saleId) {
    var cv = INV.toCanvas(saleId, 1);

  /* ---------------- files in the browser ---------------- */
  function saveBlob(bytes, name, mime) {
    var url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }
  function saveDataUrl(dataUrl, name) {
    var a = document.createElement('a');
    a.href = dataUrl; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  /* wait for the logo, then give the toast a moment to appear before the heavy drawing */
  function later(fn) {
    INV.whenReady(function () { setTimeout(fn, 40); });
  }

  /* ---------------- WhatsApp ---------------- */
  var busy = false;

  INV.sendWhatsApp = function (saleId, onDone) {
    var d = INV.data(saleId);
    if (!d || busy) return;
    var num = App.waNumber(d.mobile);
    if (num) start(num); else askNumber(d, start);

    function start(number) {
      busy = true;
      var chatFirst = App.native() && d.set.whatsappOpenChatFirst !== false;
      App.toast(chatFirst ? 'Opening WhatsApp…' : 'Preparing the invoice…');
      later(function () {
        try { go(number); } finally { busy = false; }
      });
    }

    function go(number) {
      d = INV.data(saleId);                    /* the number may have just been saved */
      var asPdf = d.set.whatsappSendAs !== 'image';
      var caption = INV.message(d, false);
      var nat = App.native();

      if (nat) {
        /* Attaching a file with the number only reaches chats WhatsApp already knows. Opening the
           chat by number first works for any WhatsApp number — nothing needs saving in contacts. */
        if (d.set.whatsappOpenChatFirst !== false && typeof nat.openWhatsAppText === 'function') {
          var first = nat.openWhatsAppText(number, caption);
          if (first === 'NO_WHATSAPP') return noApp();
          if (!ok(first)) { App.toast(first || 'Could not open WhatsApp', 'err', 6000); return; }
          done(number);
          attachStep(saleId, number);
          return;
        }
        var r = '', how = '';
        if (asPdf && typeof nat.shareFileToWhatsApp === 'function') {
          var pdf = attempt(function () { return App.bytesToBase64(INV.toPDF(saleId)); });
          if (pdf) { r = nat.shareFileToWhatsApp(pdf, INV.pdfName(d), 'application/pdf', number, caption); how = 'pdf'; }
        }
        if (r === 'NO_WHATSAPP') return noApp();
        if (!ok(r) && typeof nat.shareImageToWhatsApp === 'function') {
          var png = attempt(function () { return INV.toPNG(saleId).split(',')[1]; });
          if (png) { r = nat.shareImageToWhatsApp(png, INV.fileName(d), number, caption); how = 'image'; }
        }
        if (r === 'NO_WHATSAPP') return noApp();
        if (!ok(r) && typeof nat.openWhatsAppText === 'function') {
          r = nat.openWhatsAppText(number, INV.message(d, true)); how = 'text';
        }
        if (ok(r)) {
          done(number);
          App.toast({
            pdf: 'WhatsApp is opening with the invoice PDF attached — just tap Send',
            image: 'WhatsApp is opening with the invoice picture — just tap Send',
            text: 'WhatsApp is opening with the invoice message — just tap Send'
          }[how], 'ok', 5000);
          return;
        }
        App.toast(r && r !== 'NO_WHATSAPP' ? r : 'Could not open WhatsApp', 'err', 6000);
        return;
      }

      /* browser: a web page is not allowed to put a file into WhatsApp, so save the file,
         open the customer's chat with the message, and show how to attach it */
      var file = asPdf ? INV.pdfName(d) : INV.fileName(d);
      var saved = attempt(function () {
        if (asPdf) saveBlob(INV.toPDF(saleId), file, 'application/pdf');
        else saveDataUrl(INV.toPNG(saleId), file);
        return true;
      });
      var url = 'https://wa.me/' + number + '?text=' + encodeURIComponent(INV.message(d, true));
      var w = attempt(function () { return window.open(url, '_blank'); });
      done(number);
      attachGuide({ file: saved ? file : '', pdf: asPdf, number: number, url: url, opened: !!w });
    }

    function ok(r) { return !!r && r.indexOf('OK') === 0; }
    function noApp() { App.toast('WhatsApp is not installed on this tablet', 'err', 5000); }
    function done(number) {
      d.s.whatsappOpenedAt = App.nowISO();
      d.s.whatsappTo = number;
      App.store.touch();
      if (onDone) onDone();
    }
  };

  /* Copy the invoice picture, then open the customer's chat, so it can be pasted there.

  function copyPictureThenChat(saleId, number, done) {

  function sendFileNow(saleId, number) {
    var nat = App.native();

      try {

        if (!(r && r.indexOf('OK') === 0) && typeof nat.shareImageToWhatsApp === 'function') {
          var png = attempt(function () { return INV.toPNG(saleId).split(',')[1]; });

        else App.toast(r || 'Could not prepare the invoice', 'err', 6000);

  function attachGuide(o) {
    var kind = o.pdf ? 'PDF' : 'picture';
    UI.modal({
      title: 'Attach the invoice ' + kind,

        (o.file

        { label: 'Done', class: 'btn-primary', onClick: function (a) { a.close(); } }

    });

  function askNumber(d, cb) {

        UI.formHTML([{ k: 'wa', label: 'WhatsApp number', type: 'tel', required: true, span: 2,
          attrs: 'inputmode="tel" autocomplete="tel"',
          help: '10-digit mobile number. The country code (+' +
            (String(d.set.whatsappCountryCode || '91').replace(/\D/g, '') || '91') + ') is added for you.' }], 1) +
        (canSave ? '<label class="switch mt12"><input type="checkbox" name="savec" checked><span class="track"></span>' +
          '<span class="lb">Save this number to ' + App.esc(d.c.name) + '\'s profile</span></label>' : ''),
      buttons: [

            if (!d.s.customerMobile) { d.s.customerMobile = typed; App.store.touch(); }

          } }

  INV.savePDF = function (saleId) {

/* ===== 38-pdf.js ===== */
/* =========================================================================
   38-pdf.js — a real PDF of the invoice, made on the device.
   No library, no internet. The page holds the invoice picture (JPEG), so the
   ₹ sign, Hindi names and the design print exactly as they look on screen.
   ========================================================================= */
(function () {
  'use strict';

  function ascii(str) {
    var a = new Uint8Array(str.length);
    for (var i = 0; i < str.length; i++) a[i] = str.charCodeAt(i) & 0xff;
    return a;
  }
  function num(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function pdfString(s) {
    return String(s || '').replace(/[^\x20-\x7e]/g, '?').replace(/([\\()])/g, '\\$1');
  }

  App.base64ToBytes = function (b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };
  App.bytesToBase64 = function (bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };

  /* One page: A4 width. Short invoices sit at the top of an A4 page; long ones get a taller page. */
  App.pdfFromJpeg = function (jpeg, pxW, pxH, title) {
    var W = 595.28, A4H = 841.89;
    var drawH = W * pxH / pxW, H = Math.max(A4H, drawH);
    var parts = [], offsets = [], size = 0;
    function add(bytes) { parts.push(bytes); size += bytes.length; }
    function obj(n, body) { offsets[n] = size; add(ascii(n + ' 0 obj\n' + body + '\nendobj\n')); }

    add(ascii('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n'));
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + num(W) + ' ' + num(H) + '] ' +
           '/Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
    offsets[4] = size;
    add(ascii('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + pxW + ' /Height ' + pxH +
              ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n'));
    add(jpeg);
    add(ascii('\nendstream\nendobj\n'));
    var draw = 'q ' + num(W) + ' 0 0 ' + num(drawH) + ' 0 ' + num(H - drawH) + ' cm /Im0 Do Q';
    obj(5, '<< /Length ' + draw.length + ' >>\nstream\n' + draw + '\nendstream');
    obj(6, '<< /Title (' + pdfString(title) + ') /Producer (Adminuscurator) >>');

    var xref = size, table = 'xref\n0 7\n0000000000 65535 f \n';
    for (var i = 1; i <= 6; i++) table += ('0000000000' + offsets[i]).slice(-10) + ' 00000 n \n';
    add(ascii(table + 'trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n' + xref + '\n%%EOF\n'));

    var out = new Uint8Array(size), at = 0;
    parts.forEach(function (p) { out.set(p, at); at += p.length; });
    return out;
  };

  App.Invoice.pdfName = function (d) {
    return 'Invoice_' + String(d.s.invoiceNo || 'bill').replace(/[^A-Za-z0-9_-]/g, '_') + '.pdf';
  };

  /* invoice → PDF bytes (drawn at double size so text stays sharp when printed or zoomed) */
  App.Invoice.toPDF = function (saleId) {
    var d = App.Invoice.data(saleId);
    if (!d) return null;
    var cv = App.Invoice.toCanvas(saleId, 2);
    var jpeg = App.base64ToBytes(cv.toDataURL('image/jpeg', 0.9).split(',')[1]);
    return App.pdfFromJpeg(jpeg, cv.width, cv.height, d.title + ' ' + d.s.invoiceNo);
  };
})();

/* =========================================================================
   40-dashboard.js — daily accounting summary + quick actions
   ========================================================================= */
(function () {
  'use strict';
  var UI = App.UI, M = App.M;

  UI.route('dashboard', function (view, r) {
    var date = r.query.d || App.today();
    var s = M.summary(date, date);
    var isToday = date === App.today();
    var low = M.lowStock();
    var outMap = M.outstandingMap();
    var totalOut = M.totalOutstanding();
    var custWithDues = Object.keys(outMap).filter(function (k) { return outMap[k] > 0.5; }).length;

    var html = '';

    /* ---- backup reminder ---- */
    html += '<div id="dash-banners"></div>';

    /* ---- head ---- */
    html +=
      '<div class="view-head">' +
        '<div><h1>' + (isToday ? 'Today\'s Summary' : App.fmtDate(date) + ' Summary') + '</h1>' +
        '<div class="sub">' + App.esc(App.db.settings.shopName) + ' · ' + App.fmtDate(date) + '</div></div>' +
        '<div class="actions">' +
          '<input type="date" id="dashdate" aria-label="Show summary for this date" value="' + date + '">' +
          (isToday ? '' : '<button class="btn" id="dashtoday">' + App.icon('restore', 17) + '<span>Today</span></button>') +
        '</div>' +
      '</div>';

    /* ---- quick actions ---- */
    html +=
      '<div class="qa mb16">' +
        qa('/sale/new', 'receipt', 'New Bill') +
        qa('/customers?new=1', 'user', 'New Customer') +
        qa('/products?new=1', 'box', 'Add Product') +
        qa('/expenses?new=1', 'trendDown', 'Add Expense') +
        qa('/payments?new=1', 'wallet', 'Receive Payment') +
        qa('/reports', 'chart', 'Reports') +
        qa('/backup', 'shield', 'Backup') +
        qa('/backup?tab=restore', 'restore', 'Restore') +
      '</div>';

    /* ---- today's numbers ---- */
    html += '<div class="grid g4 mb16">' +
      stat('Sales', App.money0(s.totalSales), s.invoiceCount + ' invoice' + (s.invoiceCount === 1 ? '' : 's'), 'brand', "/sales?d=" + date, 'receipt') +
      stat('Collection', App.money0(s.collected), 'Cash ' + App.money0(s.cashIn) + ' · UPI ' + App.money0(s.upiIn), 'ok', "/payments?d=" + date, 'wallet') +
      stat('Expenses', App.money0(s.totalExpenses), s.expenses.length + ' entries', 'warn', "/expenses?d=" + date, 'trendDown') +
      stat('Profit', App.money0(s.netProfit), 'Gross ' + App.money0(s.grossProfit) + ' − expenses', s.netProfit >= 0 ? 'ok' : 'danger', '', 'chart') +
      '</div>';

    /* ---- payment split ---- */
    html +=
      '<div class="grid g2 mb16" style="grid-template-columns:1.15fr .85fr">' +
        '<div class="card">' +
          '<div class="card-head"><h3>How money came in (' + App.fmtDate(date) + ')</h3></div>' +
          '<div class="card-body"><div class="grid g4" style="gap:10px">' +
            mini('Cash', s.collectionByMethod['Cash']) +
            mini('UPI', s.collectionByMethod['UPI']) +
            mini('Card', s.collectionByMethod['Card']) +
            mini('Bank', s.collectionByMethod['Bank Transfer']) +
          '</div>' +
          '<div class="hr"></div>' +
          '<dl class="kv">' +
            '<dt>Total bill amount</dt><dd>' + App.money(s.totalSales) + '</dd>' +
            '<dt>Collected today</dt><dd class="pos">' + App.money(s.collected) + '</dd>' +
            '<dt>Credit given (today)</dt><dd class="' + (s.creditGiven > 0 ? 'neg' : '') + '">' + App.money(s.creditGiven) + '</dd>' +
            '<dt>Discount given</dt><dd>' + App.money(s.discountGiven) + '</dd>' +
            (App.db.settings.taxEnabled ? '<dt>Tax collected</dt><dd>' + App.money(s.taxCollected) + '</dd>' : '') +
            '<dt>Cash in hand (today)</dt><dd>' + App.money(s.cashInHand) + '</dd>' +
          '</dl></div>' +
        '</div>' +
        '<div class="grid" style="gap:14px;align-content:start">' +
          stat('Total Customers', String(M.customers().length), M.customers().length ? '+' + s.newCustomers + ' today' : 'None yet', 'info', '/customers', 'users') +
          stat('Total Outstanding', App.money0(totalOut), custWithDues + ' customer' + (custWithDues === 1 ? '' : 's'), totalOut > 0 ? 'danger' : 'ok', '/reports?r=outstanding', 'rupee') +
          stat('Stock Items', String(M.products().length), 'Value ' + App.money0(M.stockValue()), 'brand', '/products', 'box') +
          stat('Low Stock', String(low.length), low.length ? 'Time to reorder' : 'All good', low.length ? 'warn' : 'ok', '/products?f=low', 'alert') +
        '</div>' +
      '</div>';

    /* ---- low stock warning ---- */
    if (low.length) {
      html += '<div class="banner warn mb16">' + App.icon('alert', 20) + '' +
        '<div class="tx">' + low.length + ' product' + (low.length === 1 ? ' is' : 's are') + ' running out of stock' +
        '<small>' + App.esc(low.slice(0, 4).map(function (p) { return p.name + ' (' + App.n(p.stock) + ')'; }).join(', ')) +
        (low.length > 4 ? ' +' + (low.length - 4) + ' more' : '') + '</small></div>' +
        '<button class="btn btn-sm" data-go="/products?f=low">View</button></div>';
    }

    /* ---- recent lists ---- */
    html += '<div class="grid g2">';

    /* recent sales */
    var recent = M.sales().slice().sort(function (a, b) { return b.createdAt > a.createdAt ? 1 : -1; }).slice(0, 8);
    html += '<div class="card"><div class="card-head"><h3>Recent Sales</h3>' +
      '<div class="actions"><button class="btn btn-sm" data-go="/sales">View all</button></div></div>';
    if (!recent.length) html += UI.empty('receipt', 'No bills yet', 'Tap + New Bill to create your first bill');
    else {
      html += '<div class="tablewrap"><table class="tbl"><tbody>' + recent.map(function (s2) {
        var paid = M.salePaid(s2.id), due = App.round2(s2.total - paid);
        return '<tr class="clickable" data-go="/sale/' + s2.id + '">' +
          '<td><div class="b">' + App.esc(s2.customerName || 'Walk-in') + '</div>' +
          '<div class="tiny dim mono">' + App.esc(s2.invoiceNo) + ' · ' + App.fmtDate(s2.date) + '</div></td>' +
          '<td class="num right"><div class="b">' + App.money(s2.total) + '</div>' +
          (s2.status === 'cancelled' ? '<span class="pill p-mute">Cancelled</span>' :
            due > 0.5 ? '<span class="pill p-danger">Due ' + App.money(due) + '</span>' : '<span class="pill p-ok">Paid</span>') +
          '</td></tr>';
      }).join('') + '</tbody></table></div>';
    }
    html += '</div>';

    /* recent payments */
    var rp = M.payments().slice().sort(function (a, b) { return b.createdAt > a.createdAt ? 1 : -1; }).slice(0, 8);
    html += '<div class="card"><div class="card-head"><h3>Recent Payments</h3>' +
      '<div class="actions"><button class="btn btn-sm" data-go="/payments">View all</button></div></div>';
    if (!rp.length) html += UI.empty('wallet', 'No payments yet', '');
    else {
      html += '<div class="tablewrap"><table class="tbl"><tbody>' + rp.map(function (p) {
        var c = p.customerId ? M.find('customers', p.customerId) : null;
        return '<tr' + (c ? ' class="clickable" data-go="/customer/' + c.id + '"' : '') + '>' +
          '<td><div class="b">' + App.esc(c ? c.name : 'Walk-in') + '</div>' +
          '<div class="tiny dim">' + App.fmtDate(p.date) + ' · ' + App.esc(p.method) + '</div></td>' +
          '<td class="num right"><span class="b pos">' + App.money(p.amount) + '</span></td></tr>';
      }).join('') + '</tbody></table></div>';
    }
    html += '</div></div>';

    view.innerHTML = html;

    /* ---- wiring ---- */
    App.el('#dashdate', view).addEventListener('change', function () {
      UI.go('/dashboard?d=' + this.value);
    });
    var tb = App.el('#dashtoday', view);
    if (tb) tb.addEventListener('click', function () { UI.go('/dashboard'); });

    App.Backup.renderBanner(App.el('#dash-banners', view));
  });

  function qa(route, icon, label) {
    return '<button data-go="' + route + '" aria-label="' + App.esc(label) + '">' +
      '<span class="qi">' + App.icon(icon, 22) + '</span><span>' + App.esc(label) + '</span></button>';
  }

  function stat(label, val, hint, kind, route, icon) {
    return '<div class="stat s-' + kind + (route ? ' tap" data-go="' + route : '') + '">' +
      '<div class="strip"></div>' +
      '<div class="lbl">' + (icon ? App.icon(icon, 15) : '') + App.esc(label) + '</div>' +
      '<div class="val">' + val + '</div>' +
      '<div class="hint">' + App.esc(hint) + '</div></div>';
  }

  function mini(label, v) {
    return '<div style="background:var(--surface-2);border-radius:11px;padding:11px">' +
      '<div class="tiny muted b">' + App.esc(label) + '</div>' +
      '<div class="b num" style="font-size:17px;margin-top:3px">' + App.money0(v) + '</div></div>';
  }

  /* global click delegation for data-go */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go]');
    if (!t) return;
    if (e.target.closest('[data-go] [data-go]') && e.target.closest('[data-go]') !== t) return;
    UI.go(t.getAttribute('data-go'));
  });
})();

/* =========================================================================
   41-customers.js — customer list, add/edit form, full profile, prescriptions

(function () {
  'use strict';
  var UI = App.UI, M = App.M;

  /* ================= LIST ================= */
  UI.route('customers', function (view, r) {
    var q = r.query.q || '';
    var filter = r.query.f || '';
    var SHOW = UI.shown(r);
    var out = M.outstandingMap();

    var list = M.customers();
    if (q) {
      var nq = App.norm(q);
      list = list.filter(function (c) {
        return App.norm(c.name + ' ' + c.mobile + ' ' + c.altMobile + ' ' + c.code + ' ' + c.email).indexOf(nq) >= 0;
      });

    if (filter === 'due') list = list.filter(function (c) { return App.n(out[c.id]) > 0.5; });
    list.sort(function (a, b) { return App.norm(a.name) > App.norm(b.name) ? 1 : -1; });

    var dueCount = M.customers().filter(function (c) { return App.n(out[c.id]) > 0.5; }).length;

    var html =
      '<div class="view-head">' +
        '<div><h1>Customers</h1><div class="sub">' + M.customers().length + ' registered · ' + dueCount + ' with dues</div></div>' +
        '<div class="actions">' +
          '<button class="btn" id="cimport">' + App.icon('file', 18) + '<span>Import</span></button>' +
          '<button class="btn" id="cexport">' + App.icon('download', 18) + '<span>Export CSV</span></button>' +
          '<button class="btn btn-primary" id="cnew">+ New Customer</button>' +
        '</div>' +
      '</div>' +
      '<div class="flex gap8 wrap mb16">' +
        '<div style="flex:1;min-width:220px"><input id="cq" value="' + App.esc(q) + '" placeholder="Search by name or mobile..." style="width:100%;height:46px;border-radius:11px;border:1px solid var(--border);background:var(--surface);padding:0 14px;color:var(--text)"></div>' +
        '<div class="chips">' +
          '<button class="chip ' + (filter ? '' : 'on') + '" data-f="">All (' + M.customers().length + ')</button>' +
          '<button class="chip ' + (filter === 'due' ? 'on' : '') + '" data-f="due">With dues (' + dueCount + ')</button>' +
        '</div>' +
      '</div>';

    html += '<div class="card">';
    if (!list.length) {
      html += UI.empty('users', q ? 'No customers found' : 'No customers yet',
        q ? 'Try a different name or number' : 'Add your first customer, or bring in your list with Import CSV',
        q ? '' : '+ New Customer', 'newcust');
    } else {
      html += '<div class="tablewrap"><table class="tbl"><thead><tr>' +
        '<th>Customer</th><th>Mobile</th><th class="right">Invoices</th>' +
        '<th class="right">Total Purchased</th><th class="right">Due</th><th>Last Visit</th><th></th>' +
        '</tr></thead><tbody>';
      list.slice(0, SHOW).forEach(function (c) {
        var st = M.customerStats(c.id);
        html += '<tr class="clickable" data-id="' + c.id + '">' +
          '<td><div class="flex aic gap12"><div class="avatar">' + App.esc(App.initials(c.name)) + '</div>' +
          '<div><div class="b">' + App.esc(c.name) + '</div><div class="tiny dim mono">' + App.esc(c.code) + '</div></div></div></td>' +
          '<td class="mono">' + App.esc(c.mobile || '—') + '</td>' +
          '<td class="num right">' + st.invoices + '</td>' +
          '<td class="num right">' + App.money(st.billed) + '</td>' +
          '<td class="num right">' + (st.outstanding > 0.5
            ? '<span class="pill p-danger">' + App.money(st.outstanding) + '</span>'
            : st.outstanding < -0.5
              ? '<span class="pill p-info">Advance ' + App.money(-st.outstanding) + '</span>'
              : '<span class="pill p-ok">Clear</span>') + '</td>' +

          '<td class="right nowrap"><button class="btn btn-sm" data-bill="' + c.id + '">Bill</button></td>' +
          '</tr>';
      });
      html += '</tbody></table></div>';
      html += UI.moreRows(Math.min(SHOW, list.length), list.length);

      var f = App.el('#cq');
      if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    }, 260));

    App.on(view, 'click', '.chip[data-f]', function () {
      UI.go('/customers?' + (q ? 'q=' + encodeURIComponent(q) + '&' : '') + 'f=' + this.getAttribute('data-f'));

      UI.go('/customer/' + this.getAttribute('data-id'));
    });

      e.stopPropagation();
      UI.go('/sale/new?c=' + this.getAttribute('data-bill'));
    });
    App.el('#cnew', view).addEventListener('click', function () { App.customerForm(null); });
    App.on(view, 'click', '[data-act="newcust"]', function () { App.customerForm(null); });
    App.el('#cexport', view).addEventListener('click', function () { App.CustomerCSV.exportRegister(list); });
    App.el('#cimport', view).addEventListener('click', function () { App.CustomerCSV.importDialog(); });

    if (r.query.new) App.customerForm(null);
  });

  /* ================= FORM ================= */
  App.customerForm = function (id, onSaved) {
    var c = id ? M.find('customers', id) : null;
    var fields = [
      { k: 'name', label: 'Full name', required: true, value: c ? c.name : '', span: 2, attrs: 'autocapitalize="words"' },
      { k: 'mobile', label: 'Mobile number', type: 'tel', value: c ? c.mobile : '', attrs: 'inputmode="numeric"' },
      { k: 'altMobile', label: 'Alternate number', type: 'tel', value: c ? c.altMobile : '', attrs: 'inputmode="numeric"' },
      { k: 'address', label: 'Address', type: 'textarea', value: c ? c.address : '', span: 2 },
      { k: 'dob', label: 'Date of birth (optional)', type: 'date', value: c ? c.dob : '' },
      { k: 'email', label: 'Email (optional)', type: 'email', value: c ? c.email : '' },
      { k: 'code', label: 'Customer ID', value: c ? c.code : M.nextCustomerCode(true), help: 'Generated automatically' },
      { k: 'registeredOn', label: 'Registration date', type: 'date', value: c ? (c.registeredOn || App.dstr(c.createdAt)) : App.today() },
      { k: 'notes', label: 'Notes', type: 'textarea', value: c ? c.notes : '', span: 2 }
    ];

    var m = UI.modal({
      title: c ? 'Edit customer' : 'New Customer',
      body: UI.formHTML(fields),
      buttons: [
        { label: 'Cancel', onClick: function (a) { a.close(); } },
        { label: c ? 'Save' : 'Add', class: 'btn-primary', onClick: function (a) {
            UI.clearErrors(a.el);
            var d = UI.readForm(a.el);
            if (!d.name.trim()) return UI.markError(a.el, 'name', 'Name is required');
            if (d.mobile && !/^[0-9+\-\s()]{6,20}$/.test(d.mobile.trim()))
              return UI.markError(a.el, 'mobile', 'That mobile number does not look right');

            /* duplicate mobile guard */
            if (d.mobile.trim()) {
              var dup = M.customers().filter(function (x) {
                return x.mobile && x.mobile.replace(/\D/g, '') === d.mobile.replace(/\D/g, '') && x.id !== (c && c.id);
              })[0];
              if (dup && !a._dupOk) {
                UI.confirm({
                  title: 'This number already exists',

            }
            a.close();
            App.toast(c ? 'Customer updated' : 'Customer added', 'ok');
            if (onSaved) onSaved(saved);

          } }
      ]
    });
    return m;
  };

        '</div>' +
        '<div class="actions">' +
          (c.mobile ? '<a class="btn" href="tel:' + App.esc(c.mobile) + '">' + App.icon('phone', 18) + ' Call</a>' : '') +
          '<button class="btn" id="cedit">' + App.icon('pencil', 18) + ' Edit</button>' +
          '<button class="btn btn-ok" id="crecv">' + App.icon('wallet', 18) + ' Payment</button>' +
          '<button class="btn btn-primary" data-go="/sale/new?c=' + id + '">' + App.icon('receipt', 18) + ' New Bill</button>' +
        '</div>' +

      '<div class="stat s-info"><div class="strip"></div><div class="lbl">Total Purchased</div><div class="val">' + App.money0(st.billed) + '</div><div class="hint">Lifetime</div></div>' +
      '<div class="stat s-ok"><div class="strip"></div><div class="lbl">Total Paid</div><div class="val">' + App.money0(st.paid) + '</div><div class="hint">All payments</div></div>' +
      '<div class="stat s-' + (st.outstanding > 0.5 ? 'danger' : 'ok') + '"><div class="strip"></div><div class="lbl">Outstanding</div><div class="val">' + App.money0(st.outstanding) + '</div>' +
      '<div class="hint">' + (st.outstanding > 0.5 ? 'Amount receivable' : st.outstanding < -0.5 ? 'Advance on account' : 'Settled') + '</div></div>' +
      '</div>';

    /* what they have bought — the last few bills, with the rest one tap away */
    var bills = M.customerSales(c.id);
    html += '<div class="card mb16" id="billsnow"><div class="card-head"><h3>' + App.icon('receipt', 18) +
      '<span>Bills</span></h3><div class="actions">' +
        (bills.length > 5 ? '<button class="btn btn-sm" id="billsall">All ' + bills.length + '</button>' : '') +
        '<button class="btn btn-sm btn-primary" data-go="/sale/new?c=' + id + '">' + App.icon('plus', 16) + '<span>New bill</span></button>' +
      '</div></div><div class="card-body">' +
      (bills.length
        ? salesTable(bills.slice().sort(function (a, b) { return (a.date + a.createdAt) > (b.date + b.createdAt) ? -1 : 1; }).slice(0, 5))
        : '<div class="sm muted">No bills yet for ' + App.esc(c.name) + '.</div>') +
      '</div></div>';

    /* what they have paid */
    var pays = M.customerPayments(c.id).slice().sort(function (a, b) {
      return (a.date + a.createdAt) > (b.date + b.createdAt) ? -1 : 1;
    });
    html += '<div class="card mb16" id="paysnow"><div class="card-head"><h3>' + App.icon('wallet', 18) +
      '<span>Payments</span></h3><div class="actions">' +
        (pays.length > 5 ? '<button class="btn btn-sm" id="paysall">All ' + pays.length + '</button>' : '') +
        (st.outstanding > 0.5 ? '<button class="btn btn-sm btn-ok" id="paysrecv">' + App.icon('wallet', 16) + '<span>Receive</span></button>' : '') +
      '</div></div><div class="card-body">' +
      (pays.length ? paymentsTable(pays.slice(0, 5)) : '<div class="sm muted">No payments received yet.</div>') +
      (st.outstanding > 0.5
        ? '<div class="sm mt12"><span class="muted">Still to collect:</span> <b class="neg">' + App.money(st.outstanding) + '</b></div>'
        : pays.length ? '<div class="sm mt12 muted">All bills are settled.</div>' : '') +
      '</div></div>';

    /* contact block */
    html += '<div class="grid g2 mb16" style="grid-template-columns:1fr 1fr">' +
      '<div class="card card-pad"><dl class="kv">' +
        '<dt>Mobile</dt><dd class="mono">' + App.esc(c.mobile || '—') + '</dd>' +
        '<dt>Alternate number</dt><dd class="mono">' + App.esc(c.altMobile || '—') + '</dd>' +
        '<dt>Email</dt><dd>' + App.esc(c.email || '—') + '</dd>' +
        '<dt>Date of birth</dt><dd>' + (c.dob ? App.fmtDate(c.dob) : '—') + '</dd>' +
        '<dt>Registered</dt><dd>' + App.fmtDate(c.registeredOn || App.dstr(c.createdAt)) + '</dd>' +
      '</dl></div>' +
      '<div class="card card-pad">' +
        '<div class="tiny b muted mb8">ADDRESS</div><div class="sm">' + (App.esc(c.address) || '<span class="dim">—</span>').replace(/\n/g, '<br>') + '</div>' +
        '<div class="hr"></div>' +
        '<div class="tiny b muted mb8">NOTES</div><div class="sm">' + (App.esc(c.notes) || '<span class="dim">—</span>').replace(/\n/g, '<br>') + '</div>' +
      '</div>' +
    '</div>';

    html += '<div class="card"><div class="tabs">' +
      t('invoices', 'Invoices (' + st.invoices + ')', tab) +
      t('payments', 'Payments', tab) +
      '</div><div id="ctab"></div></div>';

    view.innerHTML = html;

    var billBox = App.el('#billsnow', view);
    App.on(billBox, 'click', '[data-print]', function (e) {
      e.stopPropagation();
      App.printInvoice(this.getAttribute('data-print'));
    });
    var billsAll = App.el('#billsall', billBox);
    if (billsAll) billsAll.addEventListener('click', function () {
      history.replaceState(null, '', '#/customer/' + id + '?t=invoices');
      UI.render();
    });

    var payBox = App.el('#paysnow', view);
    var paysAll = App.el('#paysall', payBox);
    if (paysAll) paysAll.addEventListener('click', function () {
      history.replaceState(null, '', '#/customer/' + id + '?t=payments');
      UI.render();
    });
    var paysRecv = App.el('#paysrecv', payBox);
    if (paysRecv) paysRecv.addEventListener('click', function () { App.paymentForm({ customerId: id }); });

    App.el('#cedit', view).addEventListener('click', function () { App.customerForm(id); });
    App.el('#crecv', view).addEventListener('click', function () { App.paymentForm({ customerId: id }); });
    App.on(view, 'click', '.tab[data-t]', function () {
      history.replaceState(null, '', '#/customer/' + id + '?t=' + this.getAttribute('data-t'));
      UI.render();
    });

    drawTab(App.el('#ctab', view), c, tab);
  });

  function t(k, label, cur) {
    return '<button class="tab ' + (cur === k ? 'on' : '') + '" data-t="' + k + '">' + label + '</button>';
  }

  function drawTab(el, c, tab) {
    if (tab === 'invoices') {
      var sales = M.customerSales(c.id);
      if (!sales.length) { el.innerHTML = UI.empty('receipt', 'No invoices yet', 'Create this customer\'s first bill'); return; }
      el.innerHTML = salesTable(sales);
      App.on(el, 'click', '[data-print]', function (e) {
        e.stopPropagation();
        App.printInvoice(this.getAttribute('data-print'));
      });

    } else if (tab === 'payments') {
      var pays = M.customerPayments(c.id);
      var head = '<div class="card-head"><h3>Payment history</h3><div class="actions">' +
        '<button class="btn btn-sm btn-ok" id="tabrecv">+ Receive payment</button></div></div>';
      if (!pays.length) { el.innerHTML = head + UI.empty('wallet', 'No payments yet', ''); }
      else {
        var running = App.sum(M.customerSales(c.id), function (s) { return s.total; });
        var rows = pays.slice().sort(function (a, b) { return (a.date + a.createdAt) > (b.date + b.createdAt) ? -1 : 1; });
        var bal = running;
        var body = rows.map(function (p) {
          var before = bal;
          bal = App.round2(bal - p.amount);
          return '<tr>' +
            '<td class="sm">' + App.fmtDate(p.date) + '<div class="tiny dim">' + App.fmtDateTime(p.createdAt).split(', ')[1] + '</div></td>' +
            '<td><span class="pill p-brand">' + App.esc(p.method) + '</span>' + (p.atInvoice ? ' <span class="tiny dim">with the bill</span>' : '') + '</td>' +
            '<td class="sm dim">' + App.esc(p.note || '—') + '</td>' +
            '<td class="num right pos b">' + App.money(p.amount) + '</td>' +
            '<td class="num right dim sm">' + App.money(before) + ' → ' + App.money(bal) + '</td>' +
            '<td class="right">' + (p.atInvoice ? '' : '<button class="btn btn-sm" data-delpay="' + p.id + '">' + App.icon('trash', 18) + '<span>Delete</span></button>') + '</td></tr>';
        }).join('');
        el.innerHTML = head + '<div class="tablewrap"><table class="tbl"><thead><tr>' +
          '<th>Date</th><th>Method</th><th>Note</th><th class="right">Amount</th><th class="right">Due (before → after)</th><th></th>' +
          '</tr></thead><tbody>' + body + '</tbody>' +
          '<tfoot><tr><td colspan="3">Total diya</td><td class="num right pos">' + App.money(App.sum(pays, function (p) { return p.amount; })) + '</td><td colspan="2"></td></tr></tfoot>' +
          '</table></div>';
      }
      var b = App.el('#tabrecv', el);
      if (b) b.addEventListener('click', function () { App.paymentForm({ customerId: c.id }); });
      App.on(el, 'click', '[data-delpay]', function () {
        var pid = this.getAttribute('data-delpay');
        UI.confirm({ title: 'Delete this payment?', message: 'This payment will be removed and the customer\'s outstanding will go up. You can restore it from Trash.', danger: true, okLabel: 'Delete' })
          .then(function (ok) { if (ok) { M.softDelete('payments', pid); App.toast('Payment deleted'); UI.render(); } });
      });

    }
  }

  /* the money they have paid, newest first */
  function paymentsTable(pays) {
    return '<div class="tablewrap"><table class="tbl"><thead><tr>' +
      '<th>Date</th><th>Method</th><th>Note</th><th class="right">Amount</th>' +
      '</tr></thead><tbody>' + pays.map(function (p) {
        return '<tr><td class="sm nowrap">' + App.fmtDate(p.date) + '</td>' +
          '<td><span class="pill p-brand">' + App.esc(p.method) + '</span>' +
            (p.atInvoice ? ' <span class="tiny dim">with the bill</span>' : '') + '</td>' +
          '<td class="sm dim">' + App.esc(p.note || '—') + '</td>' +
          '<td class="num right pos b">' + App.money(p.amount) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  /* the customer's bills, newest first — used on the page and in the Invoices tab */
  function salesTable(sales) {
    return '<div class="tablewrap"><table class="tbl"><thead><tr>' +
      '<th>Invoice</th><th>Date</th><th>Items</th><th class="right">Total</th><th class="right">Paid</th><th class="right">Due</th><th></th>' +
      '</tr></thead><tbody>' + sales.slice().sort(function (a, b) {
        return (a.date + a.createdAt) > (b.date + b.createdAt) ? -1 : 1;
      }).map(function (s) {
        var paid = M.salePaid(s.id), due = App.round2(s.total - paid);
        return '<tr class="clickable" data-go="/sale/' + s.id + '">' +
          '<td class="mono b">' + App.esc(s.invoiceNo) + (s.status === 'cancelled' ? ' <span class="pill p-mute">Cancelled</span>' : '') + '</td>' +
          '<td class="sm">' + App.fmtDate(s.date) + '</td>' +
          '<td class="sm dim">' + s.items.length + ' item' + (s.items.length === 1 ? '' : 's') +
            (s.items.length ? '<div class="tiny dim">' + App.esc(s.items.map(function (i) { return i.name; }).join(', ')).slice(0, 80) + '</div>' : '') + '</td>' +
          '<td class="num right b">' + App.money(s.total) + '</td>' +
          '<td class="num right pos">' + App.money(paid) + '</td>' +
          '<td class="num right">' + (due > 0.5 ? '<span class="neg b">' + App.money(due) + '</span>' : '<span class="pill p-ok">Paid</span>') + '</td>' +
          '<td class="right"><button class="btn btn-sm" data-print="' + s.id + '">' + App.icon('printer', 18) + '<span>Print</span></button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  /* one line per visit: the old powers and the new one side by side */
  function powerText(e) {
    e = e || {};
    var main = (App.pw(e.sph) || '—') + (e.cyl ? ' / ' + App.pw(e.cyl) : '') + (e.axis ? ' × ' + App.esc(e.axis) : '');
    var extra = [e.add ? 'Add ' + App.pw(e.add) : '', e.pd ? 'PD ' + App.esc(e.pd) : ''].filter(Boolean).join(' · ');
    return main + (extra ? ' <span class="rx-x dim tiny">' + extra + '</span>' : '');
  }

  /* one eye of a contact lens power, for the compact history table */
  function clText(e) {
    e = e || {};
    var main = (App.pw(e.sph) || '—') + (e.cyl ? ' / ' + App.pw(e.cyl) : '') + (e.axis ? ' × ' + App.esc(e.axis) : '');
    var extra = [e.bc ? 'BC ' + App.esc(e.bc) : '', e.dia ? 'DIA ' + App.esc(e.dia) : ''].filter(Boolean).join(' · ');
    return main + (extra ? ' ' + extra : '');
  }

  function rxHistory(rxs) {
    return '<div class="tiny b muted mt16 mb8">ALL POWERS — NEWEST FIRST</div>' +
      '<div class="tablewrap"><table class="tbl rx-hist"><thead><tr>' +
        '<th>Date</th><th>No.</th><th>Right eye (OD)</th><th>Left eye (OS)</th><th></th>' +
      '</tr></thead><tbody>' +
      rxs.map(function (r, i) {
        return '<tr' + (i === 0 ? ' class="on"' : '') + '>' +
          '<td class="sm b nowrap">' + App.fmtDate(r.date) + (i === 0 ? ' <span class="pill p-ok">Latest</span>' : '') + '</td>' +
          '<td class="mono tiny dim">' + App.esc(r.code || '—') + '</td>' +
          '<td class="sm num">' + powerText(r.od) + (M.hasCl(r) ? '<span class="rx-cl dim tiny">CL ' + clText(r.cl.od) + '</span>' : '') + '</td>' +
          '<td class="sm num">' + powerText(r.os) + (M.hasCl(r) ? '<span class="rx-cl dim tiny">CL ' + clText(r.cl.os) + '</span>' : '') + '</td>' +
          '<td class="right nowrap">' +
            '<button class="btn btn-sm" data-rxprint="' + r.id + '" aria-label="Print this prescription">' + App.icon('printer', 16) + '</button> ' +
            '<button class="btn btn-sm" data-rxedit="' + r.id + '" aria-label="Edit this prescription">' + App.icon('pencil', 16) + '</button>' +
          '</td></tr>';
      }).join('') +
      '</tbody></table></div>';
  }

  /* Print / Edit / Delete on any prescription card */
  function wireRxActions(root, customerId) {
    App.on(root, 'click', '[data-rxedit]', function () { App.rxForm(customerId, this.getAttribute('data-rxedit')); });
    App.on(root, 'click', '[data-rxprint]', function () { App.printRx(this.getAttribute('data-rxprint')); });
    App.on(root, 'click', '[data-rxdel]', function () {
      var rid = this.getAttribute('data-rxdel');
      UI.confirm({ title: 'Delete this prescription?', message: 'It is usually better to keep old prescriptions on record. You can restore this from Trash.', danger: true, okLabel: 'Delete' })
        .then(function (ok) { if (ok) { M.softDelete('prescriptions', rid); App.toast('Deleted'); UI.render(); } });
    });
  }

  function eyeRow(lbl, e) {
    return '<tr><td>' + lbl + '</td>' +
      '<td class="num" style="padding:9px">' + (App.pw(e.sph) || '—') + '</td>' +
      '<td class="num" style="padding:9px">' + (App.pw(e.cyl) || '—') + '</td>' +
      '<td class="num" style="padding:9px">' + App.esc(e.axis || '—') + '</td>' +
      '<td class="num" style="padding:9px">' + (App.pw(e.add) || '—') + '</td>' +
      '<td class="num" style="padding:9px">' + App.esc(e.pd || '—') + '</td></tr>';
  }

  function clRow(lbl, e) {
    e = e || {};
    return '<tr><td>' + lbl + '</td>' +
      '<td class="num" style="padding:9px">' + (App.pw(e.sph) || '—') + '</td>' +
      '<td class="num" style="padding:9px">' + (App.pw(e.cyl) || '—') + '</td>' +
      '<td class="num" style="padding:9px">' + App.esc(e.axis || '—') + '</td>' +
      '<td class="num" style="padding:9px">' + App.esc(e.bc || '—') + '</td>' +
      '<td class="num" style="padding:9px">' + App.esc(e.dia || '—') + '</td></tr>';
  }

  function rxCard(rx, latest) {
    return '<div style="border:1px solid var(--border);border-radius:12px;overflow:hidden">' +
      '<div class="flex aic gap8 wrap" style="padding:11px 13px;background:var(--surface-2);border-bottom:1px solid var(--border)">' +
        '<span class="b">' + App.fmtDate(rx.date) + '</span>' +
        (rx.code ? '<span class="pill p-brand mono">' + App.esc(rx.code) + '</span>' : '') +
        (latest ? '<span class="pill p-ok">Latest</span>' : '') +
        (rx.doctor ? '<span class="sm dim">Dr. ' + App.esc(rx.doctor) + '</span>' : '') +
        (rx.followUpDate ? '<span class="pill p-info">Next: ' + App.fmtDate(rx.followUpDate) + '</span>' : '') +
        '<span style="margin-left:auto"></span>' +
        '<button class="btn btn-sm" data-rxprint="' + rx.id + '">' + App.icon('printer', 18) + '<span>Print</span></button>' +
        '<button class="btn btn-sm" data-rxedit="' + rx.id + '">' + App.icon('pencil', 18) + '<span>Edit</span></button>' +
        '<button class="btn btn-sm" data-rxdel="' + rx.id + '">' + App.icon('trash', 18) + '<span>Delete</span></button>' +
      '</div>' +
      (M.hasCl(rx) ? '<div class="tiny b muted" style="padding:10px 13px 0">SPECTACLES</div>' : '') +
      '<div class="scroll-x"><table class="rx"><thead><tr><th></th><th>SPH</th><th>CYL</th><th>AXIS</th><th>ADD</th><th>PD</th></tr></thead>' +
      '<tbody>' + eyeRow('R (OD)', rx.od) + eyeRow('L (OS)', rx.os) + '</tbody></table></div>' +
      (M.hasCl(rx) ?
        '<div class="tiny b muted" style="padding:12px 13px 0;border-top:1px solid var(--border)">CONTACT LENS' +
          (rx.cl.brand ? ' — <span class="dim">' + App.esc(rx.cl.brand) + '</span>' : '') + '</div>' +
        '<div class="scroll-x"><table class="rx"><thead><tr><th></th><th>SPH</th><th>CYL</th><th>AXIS</th><th>BC</th><th>DIA</th></tr></thead>' +
        '<tbody>' + clRow('R (OD)', rx.cl.od) + clRow('L (OS)', rx.cl.os) + '</tbody></table></div>' : '') +
      (rx.notes ? '<div class="sm" style="padding:11px 13px;border-top:1px solid var(--border)"><span class="dim">Note:</span> ' + App.esc(rx.notes) + '</div>' : '') +
      (App.safeImg(rx.image) ? '<div style="padding:11px 13px;border-top:1px solid var(--border)"><img src="' + App.esc(App.safeImg(rx.image)) + '\" style="max-width:100%;border-radius:9px;max-height:340px"></div>' : '') +
      '</div>';
  }

  /* ================= PRESCRIPTION FORM ================= */
  /* opts.onSaved(record): called after saving to the customer.
     opts.draft (object or true) + opts.onData(data): a prescription just for one bill — nothing is saved to a customer. */
  App.rxForm = function (customerId, rxId, opts) {
    opts = opts || {};
    var draft = opts.draft ? (typeof opts.draft === 'object' ? opts.draft : {}) : null;
    var rx = rxId ? M.find('prescriptions', rxId) : null;
    var prev = !rx && !draft ? M.latestRx(customerId) : null;
    var od = rx ? rx.od : draft ? (draft.od || {}) : (prev ? prev.od : {});
    var os = rx ? rx.os : draft ? (draft.os || {}) : (prev ? prev.os : {});
    var from = rx || draft || prev || null;           /* where the powers were copied from */
    var cl = (from && from.cl) || {};
    var clOn = M.hasCl(from);

    function inp(eye, k, v) {
      return '<td><input name="' + eye + '_' + k + '" value="' + App.esc(v || '') + '" inputmode="decimal" autocomplete="off"></td>';
    }
    function row(lbl, eye, e) {
      return '<tr><td>' + lbl + '</td>' + inp(eye, 'sph', e.sph) + inp(eye, 'cyl', e.cyl) +
        inp(eye, 'axis', e.axis) + inp(eye, 'add', e.add) + inp(eye, 'pd', e.pd) + '</tr>';
    }
    function clRowIn(lbl, eye, e) {
      e = e || {};
      return '<tr><td>' + lbl + '</td>' + inp(eye, 'sph', e.sph) + inp(eye, 'cyl', e.cyl) +
        inp(eye, 'axis', e.axis) + inp(eye, 'bc', e.bc) + inp(eye, 'dia', e.dia) + '</tr>';
    }

    var body =
      '<div class="scroll-x"><table class="rx"><thead><tr><th></th><th>SPH</th><th>CYL</th><th>AXIS</th><th>ADD</th><th>PD</th></tr></thead>' +
      '<tbody>' + row('R (OD)', 'od', od) + row('L (OS)', 'os', os) + '</tbody></table></div>' +
      (prev ? '<div class="banner mt12">' + App.icon('info', 20) + '<div class="tx">Previous prescription (' + App.fmtDate(prev.date) + ') has been copied in — change it if needed</div></div>' : '') +
      '<label class="switch mt16"><input type="checkbox" name="clOn" id="rxclon"' + (clOn ? ' checked' : '') + '>' +
        '<span class="track"></span><span class="lb">Contact lens power</span></label>' +
      '<div id="rxclbox" class="mt12"' + (clOn ? '' : ' hidden') + '>' +
        '<div class="scroll-x"><table class="rx"><thead><tr><th></th><th>SPH</th><th>CYL</th><th>AXIS</th><th>BC</th><th>DIA</th></tr></thead>' +
        '<tbody>' + clRowIn('R (OD)', 'clod', cl.od) + clRowIn('L (OS)', 'clos', cl.os) + '</tbody></table></div>' +
        '<div class="f mt12"><label for="rxclbrand">Lens brand or type (optional)</label>' +
        '<input id="rxclbrand" name="cl_brand" value="' + App.esc((cl.brand) || '') + '" autocomplete="off" placeholder="e.g. Bausch &amp; Lomb monthly"></div>' +
      '</div>' +
      '<div class="mt16">' + UI.formHTML([
        { k: 'date', label: 'Prescription date', type: 'date', value: rx ? rx.date : draft ? (draft.date || App.today()) : App.today(), required: true },
        { k: 'doctor', label: 'Doctor\'s name', value: rx ? rx.doctor : draft ? (draft.doctor || '') : '' }
      ].concat(draft ? [] : [
        { k: 'followUpDate', label: 'Next check-up (optional)', type: 'date', value: rx ? rx.followUpDate : '' },
        { k: 'notes', label: 'Notes', type: 'textarea', value: rx ? rx.notes : '', span: 2 }
      ])) + '</div>' +
      '<div class="f mt12"><label>Prescription photo (optional)</label>' +
      '<input type="file" id="rximg" accept="image/*" style="height:auto;padding:11px">' +
      '<div class="help">' + (App.store.driver === 'ls'
        ? 'This device has limited storage (about 5 MB total), and photos use most of it. Add them only when you really need one.'
        : 'The photo is stored on this device only. Keep it small so your backup file stays light.') + '</div>' +
      '<div id="rximgprev" class="mt8">' + (rx && App.safeImg(rx.image) ? '<img src=\"' + App.esc(App.safeImg(rx.image)) + '\" style="max-width:100%;max-height:200px;border-radius:9px"><button class="btn btn-sm mt8" id="rximgdel">Remove photo</button>' : '') + '</div></div>';

    if (draft) body = body.slice(0, body.indexOf('<div class="f mt12"><label>Prescription photo'));   /* no photo for a one-bill prescription */
    var imageData = rx ? App.safeImg(rx.image) : '';

    var m = UI.modal({
      title: draft ? 'Eye prescription for this bill' : rx ? 'Edit prescription' : 'New prescription',
      size: 'wide',
      body: body,
      buttons: [
        { label: 'Cancel', onClick: function (a) { a.close(); } },
        { label: draft ? 'Use on this bill' : 'Save', class: 'btn-primary', onClick: function (a) {
            var d = UI.readForm(a.el);
            var data = {
              customerId: customerId,
              date: d.date || App.today(),
              doctor: d.doctor,
              notes: d.notes,
              followUpDate: d.followUpDate,
              image: imageData,
              od: { sph: d.od_sph, cyl: d.od_cyl, axis: d.od_axis, add: d.od_add, pd: d.od_pd },
              os: { sph: d.os_sph, cyl: d.os_cyl, axis: d.os_axis, add: d.os_add, pd: d.os_pd },
              cl: d.clOn ? {
                od: { sph: d.clod_sph, cyl: d.clod_cyl, axis: d.clod_axis, bc: d.clod_bc, dia: d.clod_dia },
                os: { sph: d.clos_sph, cyl: d.clos_cyl, axis: d.clos_axis, bc: d.clos_bc, dia: d.clos_dia },
                brand: d.cl_brand
              } : null
            };
            if (draft) { a.close(); if (opts.onData) opts.onData(data); return; }
            var saved = rx ? M.rxUpdate(rx.id, data) : M.rxCreate(data);
            a.close();
            App.toast('Prescription saved', 'ok');
            if (opts.onSaved) opts.onSaved(saved);
            UI.render();
          } }
      ]
    });

    var clBox = App.el('#rxclbox', m.el), clSwitch = App.el('#rxclon', m.el);
    if (clSwitch) clSwitch.addEventListener('change', function () {
      clBox.hidden = !this.checked;
      if (this.checked) { var f = App.el('input', clBox); if (f) f.focus(); }
    });

    var rximgInput = App.el('#rximg', m.el);
    if (rximgInput) rximgInput.addEventListener('change', function () {
      var f = this.files[0];
      if (!f) return;
      if (f.size > 8 * 1024 * 1024) { App.toast('That photo is too large. Please choose one under 8 MB.', 'err'); this.value = ''; return; }
      App.shrinkImage(f, 1000, 0.72).then(function (dataUrl) {
        if (!App.safeImg(dataUrl) || dataUrl.length > 2500000) { App.toast('This photo could not be used. Please choose a JPG or PNG photo.', 'err', 5000); return; }
        imageData = dataUrl;
        App.el('#rximgprev', m.el).innerHTML = '<img src="' + App.esc(dataUrl) + '" style="max-width:100%;max-height:200px;border-radius:9px"><button class="btn btn-sm mt8" id="rximgdel">Remove photo</button>';
      });
    });
    App.on(m.el, 'click', '#rximgdel', function () {
      imageData = '';
      App.el('#rximgprev', m.el).innerHTML = '';
      App.el('#rximg', m.el).value = '';
    });
  };

  /* shrink images before storing so backups stay small */
  App.shrinkImage = function (file, maxDim, quality) {
    return new Promise(function (res) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cv = document.createElement('canvas');
          cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          try { res(cv.toDataURL('image/jpeg', quality)); }
          catch (e) { res(fr.result); }
        };
        img.onerror = function () { res(fr.result); };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  };

  /* ================= PRINT PRESCRIPTION ================= */
  App.printRx = function (rxId) {
    var rx = M.find('prescriptions', rxId);
    if (!rx) return;
    var c = M.find('customers', rx.customerId);
    var s = App.db.settings;
    function r(lbl, e) {
      return '<tr><td><b>' + lbl + '</b></td><td class="num">' + (App.pw(e.sph) || '—') + '</td><td class="num">' + (App.pw(e.cyl) || '—') +
        '</td><td class="num">' + App.esc(e.axis || '—') + '</td><td class="num">' + (App.pw(e.add) || '—') + '</td><td class="num">' + App.esc(e.pd || '—') + '</td></tr>';
    }
    function cr(lbl, e) {
      e = e || {};
      return '<tr><td><b>' + lbl + '</b></td><td class="num">' + (App.pw(e.sph) || '—') + '</td><td class="num">' + (App.pw(e.cyl) || '—') +
        '</td><td class="num">' + App.esc(e.axis || '—') + '</td><td class="num">' + App.esc(e.bc || '—') + '</td><td class="num">' + App.esc(e.dia || '—') + '</td></tr>';
    }
    UI.print(
      '<div class="ph"><div><h1>' + App.esc(s.shopName) + '</h1>' +
      '<div>' + App.esc(s.address || '').replace(/\n/g, '<br>') + '</div>' +
      '<div>' + App.esc(s.phone || '') + '</div></div>' +
      '<div style="text-align:right"><div class="pt" style="margin:0">PRESCRIPTION</div>' +
      (rx.code ? '<div><b>' + App.esc(rx.code) + '</b></div>' : '') +
      '<div>Date: ' + App.fmtDate(rx.date) + '</div></div></div>' +
      '<table><tr><td style="width:50%"><b>Name:</b> ' + App.esc(c ? c.name : '') + '<br><b>ID:</b> ' + App.esc(c ? c.code : '') + '</td>' +
      '<td><b>Mobile:</b> ' + App.esc(c ? c.mobile : '') + '<br><b>Doctor:</b> ' + App.esc(rx.doctor || '—') + '</td></tr></table>' +
      (M.hasCl(rx) ? '<p style="margin:10px 0 2px"><b>Spectacles</b></p>' : '') +
      '<table><thead><tr><th></th><th>SPH</th><th>CYL</th><th>AXIS</th><th>ADD</th><th>PD</th></tr></thead>' +
      '<tbody>' + r('Right (OD)', rx.od) + r('Left (OS)', rx.os) + '</tbody></table>' +
      (M.hasCl(rx) ?
        '<p style="margin:14px 0 2px"><b>Contact lens</b>' + (rx.cl.brand ? ' — ' + App.esc(rx.cl.brand) : '') + '</p>' +
        '<table><thead><tr><th></th><th>SPH</th><th>CYL</th><th>AXIS</th><th>BC</th><th>DIA</th></tr></thead>' +
        '<tbody>' + cr('Right (OD)', rx.cl.od) + cr('Left (OS)', rx.cl.os) + '</tbody></table>' : '') +
      (rx.notes ? '<p><b>Notes:</b> ' + App.esc(rx.notes) + '</p>' : '') +
      (rx.followUpDate ? '<p><b>Next check-up:</b> ' + App.fmtDate(rx.followUpDate) + '</p>' : '') +
      '<div class="sign"><div>Customer signature</div><div>For ' + App.esc(s.shopName) + '</div></div>'
    );
  };
})();


/* ===== 41b-customers-csv.js ===== */
/* =========================================================================
   41b-customers-csv.js — import and export the customer list as a CSV.
   A plain spreadsheet: one row per customer. Opens in Excel / Google Sheets.
   Columns: Customer ID, Name, Mobile, Alternate, Email, Address, Date of birth,
   Notes, plus read-only totals on export (Invoices / Purchased / Paid / Due).
   Public API (used by 41-customers.js): X.exportRegister(list), X.importDialog().
   ========================================================================= */
(function () {
  'use strict';
  var App = window.App, M = App.M, UI = App.UI;
  var X = {};
  App.CustomerCSV = X;

  /* ---------------- export ---------------- */
  X.exportRegister = function (list) {
    list = list && list.length ? list : M.customers();
    var rows = [['Customer ID', 'Name', 'Mobile', 'Alternate', 'Email', 'Address',
      'Date of birth', 'Notes', 'Invoices', 'Total purchased', 'Total paid', 'Outstanding', 'Registered']];
    list.slice().sort(function (a, b) { return App.norm(a.name) > App.norm(b.name) ? 1 : -1; })
      .forEach(function (c) {
        var st = M.customerStats(c.id);
        rows.push([c.code || '', c.name || '', c.mobile || '', c.altMobile || '', c.email || '',
          App.oneLine ? App.oneLine(c.address) : (c.address || '').replace(/\n/g, ' '), c.dob || '',
          (c.notes || '').replace(/\n/g, ' '),
          st.invoices, App.n(st.billed), App.n(st.paid), App.round2(st.outstanding),
          c.registeredOn || App.dstr(c.createdAt)]);
      });
    var ok = App.download('customers_' + App.today() + '.csv', '﻿' + App.toCSV(rows), 'text/csv');
    if (ok !== false) App.toast(list.length + ' customer' + (list.length === 1 ? '' : 's') + ' exported', 'ok');
  };

  /* ---------------- import ---------------- */
  /* find a column index by any of several header names */
  function col(headers, names) {
    for (var i = 0; i < headers.length; i++) {
      var h = App.norm(headers[i]);
      for (var j = 0; j < names.length; j++) if (h === App.norm(names[j])) return i;
    }
    return -1;
  }

  function readRows(rows) {
    if (!rows || !rows.length) return { rows: [], err: 'The file is empty.' };
    var headers = rows[0].map(function (x) { return String(x == null ? '' : x); });
    var iName = col(headers, ['name', 'customer', 'customer name', 'full name']);
    if (iName < 0) return { rows: [], err: 'Could not find a "Name" column. The first row should be the column headings.' };
    var iMob = col(headers, ['mobile', 'phone', 'mobile number', 'phone number', 'contact', 'contact no.', 'contact number']);
    var iAlt = col(headers, ['alternate', 'alternate number', 'alt', 'alt mobile', 'other number']);
    var iEmail = col(headers, ['email', 'e-mail', 'email id']);
    var iAddr = col(headers, ['address', 'addr']);
    var iDob = col(headers, ['date of birth', 'dob', 'birthday']);
    var iNotes = col(headers, ['notes', 'note', 'remarks']);
    var iCode = col(headers, ['customer id', 'id', 'code', 'customer code']);
    var get = function (r, i) { return i >= 0 && i < r.length ? String(r[i] == null ? '' : r[i]).trim() : ''; };

    var out = [];
    for (var k = 1; k < rows.length; k++) {
      var r = rows[k];
      if (!r || !r.length) continue;
      var name = get(r, iName);
      if (!name) continue;
      out.push({
        name: name, mobile: get(r, iMob), altMobile: get(r, iAlt), email: get(r, iEmail),
        address: get(r, iAddr), dob: get(r, iDob), notes: get(r, iNotes), code: get(r, iCode)
      });
    }
    return { rows: out };
  }

  /* a customer already on file? match on mobile first, then exact name */
  function existing(rec) {
    var all = M.customers();
    if (rec.mobile) {
      var mob = rec.mobile.replace(/\D/g, '');
      if (mob) {
        var byMob = all.filter(function (c) { return c.mobile && c.mobile.replace(/\D/g, '') === mob; });
        if (byMob.length) return byMob[0];
      }
    }
    var nm = App.norm(rec.name);
    var byName = all.filter(function (c) { return App.norm(c.name) === nm; });
    return byName.length ? byName[0] : null;
  }

  X.importDialog = function () {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,text/csv,text/plain';
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () { preview(String(reader.result || '')); };
      reader.onerror = function () { App.toast('Could not read that file', 'err'); };
      reader.readAsText(file);
    });
    input.click();
  };

  function preview(text) {
    var parsed;
    try { parsed = App.parseCSV(text); } catch (e) { App.toast('That does not look like a CSV file', 'err'); return; }
    var res = readRows(parsed);
    if (res.err) { UI.modal({ title: 'Import customers', size: 'narrow', body: '<div class="sm">' + App.esc(res.err) + '</div>' }); return; }
    var recs = res.rows;
    if (!recs.length) { UI.modal({ title: 'Import customers', size: 'narrow', body: '<div class="sm">No customer rows were found in the file.</div>' }); return; }

    var toAdd = [], dupes = 0;
    recs.forEach(function (rec) { if (existing(rec)) dupes++; else toAdd.push(rec); });

    var sample = toAdd.slice(0, 8).map(function (r) {
      return '<tr><td>' + App.esc(r.name) + '</td><td class="mono">' + App.esc(r.mobile || '—') + '</td>' +
        '<td class="sm dim">' + App.esc(App.oneLine ? App.oneLine(r.address) : r.address) + '</td></tr>';
    }).join('');

    var body =
      '<div class="sm mb12">Found <b>' + recs.length + '</b> row' + (recs.length === 1 ? '' : 's') + '. ' +
        '<b>' + toAdd.length + '</b> new customer' + (toAdd.length === 1 ? '' : 's') + ' will be added' +
        (dupes ? ', <b>' + dupes + '</b> already on file (skipped)' : '') + '.</div>' +
      (toAdd.length
        ? '<div class="tablewrap" style="max-height:260px;overflow:auto"><table class="tbl"><thead><tr>' +
            '<th>Name</th><th>Mobile</th><th>Address</th></tr></thead><tbody>' + sample +
            (toAdd.length > 8 ? '<tr><td colspan="3" class="sm dim">…and ' + (toAdd.length - 8) + ' more</td></tr>' : '') +
            '</tbody></table></div>'
        : '<div class="sm muted">Nothing new to add — every row matches a customer you already have.</div>');

    UI.modal({
      title: 'Import customers',
      size: 'wide',
      body: body,
      buttons: [
        { label: 'Cancel', onClick: function (a) { a.close(); } }
      ].concat(toAdd.length ? [{
        label: 'Add ' + toAdd.length + ' customer' + (toAdd.length === 1 ? '' : 's'),
        class: 'btn-primary',
        onClick: function (a) {
          toAdd.forEach(function (rec) {
            M.customerCreate({
              name: rec.name, mobile: rec.mobile, altMobile: rec.altMobile, email: rec.email,
              address: rec.address, dob: rec.dob, notes: rec.notes
              /* the Customer ID is always generated fresh so imports never clash */
            });
          });
          App.store.saveNow();
          a.close();
          App.toast(toAdd.length + ' customer' + (toAdd.length === 1 ? '' : 's') + ' added', 'ok');
          UI.render();
        }
      }] : [])
    });
  }
})();


/* ===== 41c-spreadsheet.js ===== */
/* =========================================================================
   41c-spreadsheet.js — open an Excel file in the app itself, with no library
   and no internet:
     .xls   Excel 97-2003 / WPS  (the shop register format)
     .xlsx  Excel 2007 and newer (unzipped by the browser)
   Returns the first sheet that has data as rows of text — exactly the shape
   App.parseCSV returns — so the customer import treats both the same.
   ========================================================================= */
(function () {
  'use strict';
  var S = {};
  App.Spreadsheet = S;

  function u16(b, p) { return b[p] | (b[p + 1] << 8); }
  function u32(b, p) { return (b[p] | (b[p + 1] << 8) | (b[p + 2] << 16)) + b[p + 3] * 16777216; }
  function chars(b, at, n, high) {
    var out = '', k;
    if (high) { for (k = 0; k < n; k++) out += String.fromCharCode(u16(b, at + k * 2)); }
    else { for (k = 0; k < n; k++) out += String.fromCharCode(b[at + k]); }
    return out;
  }
  /* Excel keeps dates as a number of days; show them the way the register does */
  function fromSerial(x) {
    var d = new Date(Math.round((x - 25569) * 86400000));
    return isFinite(d.getTime()) ? d.getUTCDate() + '.' + (d.getUTCMonth() + 1) + '.' + d.getUTCFullYear() : '';
  }
  function numText(x, isDate) {
    if (!isFinite(x)) return '';
    if (isDate) { var s = fromSerial(x); if (s) return s; }
    if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
    return String(Math.round(x * 1e10) / 1e10);
  }
  function dateFormat(code) {
    var s = String(code || '').replace(/"[^"]*"/g, '').replace(/\[[^\]]*\]/g, '');
    return /[dmy]/i.test(s);
  }
  function builtInDate(id) { return (id >= 14 && id <= 22) || (id >= 45 && id <= 47); }

  S.kindOf = function (bytes) {
    if (bytes.length > 8 && bytes[0] === 0xD0 && bytes[1] === 0xCF && bytes[2] === 0x11 && bytes[3] === 0xE0) return 'xls';
    if (bytes.length > 4 && bytes[0] === 0x50 && bytes[1] === 0x4B && (bytes[2] === 3 || bytes[2] === 5 || bytes[2] === 7)) return 'xlsx';
    return '';
  };

  /* buffer (ArrayBuffer) -> Promise of rows */
  S.read = function (buffer) {
    var bytes = new Uint8Array(buffer);
    var kind = S.kindOf(bytes);
    try {
      if (kind === 'xls') return Promise.resolve(readXls(bytes));
      if (kind === 'xlsx') return readXlsx(bytes);
    } catch (e) { return Promise.reject(e); }
    return Promise.reject(new Error('This file is not an Excel file'));
  };

  /* ---------------- .xls : compound file + BIFF8 records ---------------- */
  function readXls(bytes) {
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.length);
    var ssz = 1 << dv.getUint16(30, true), msz = 1 << dv.getUint16(32, true);
    var nFat = dv.getUint32(44, true), dirStart = dv.getUint32(48, true);
    var miniCutoff = dv.getUint32(56, true), miniStart = dv.getUint32(60, true);
    var difStart = dv.getUint32(68, true), nDif = dv.getUint32(72, true);
    var at = function (sec) { return 512 + sec * ssz; };
    var difat = [], i, j;
    for (i = 0; i < 109; i++) difat.push(dv.getUint32(76 + i * 4, true));
    var s = difStart, guard = 0;
    while (s < 0xFFFFFFFA && nDif-- > 0 && guard++ < 10000) {
      var base = at(s), per = ssz / 4 - 1;
      for (i = 0; i < per; i++) difat.push(dv.getUint32(base + i * 4, true));
      s = dv.getUint32(base + per * 4, true);
    }
    var fat = [];
    for (i = 0; i < nFat && i < difat.length; i++) {
      if (difat[i] >= 0xFFFFFFFA) continue;
      var b = at(difat[i]);
      for (j = 0; j < ssz / 4; j++) fat.push(dv.getUint32(b + j * 4, true));
    }
    function chain(start, table) {
      var out = [], c = start, seen = {};
      while (c < 0xFFFFFFFA && !seen[c] && out.length < 2000000) { seen[c] = 1; out.push(c); c = table[c]; }
      return out;
    }
    function stream(start, size) {
      var secs = chain(start, fat), out = new Uint8Array(secs.length * ssz), p = 0;
      secs.forEach(function (sec) { out.set(bytes.subarray(at(sec), at(sec) + ssz), p); p += ssz; });
      return size ? out.subarray(0, size) : out;
    }
    var dir = stream(dirStart, 0), entries = [];
    for (i = 0; i + 128 <= dir.length; i += 128) {
      var nl = u16(dir, i + 64), name = '';
      for (j = 0; j + 2 <= Math.max(0, nl - 2); j += 2) name += String.fromCharCode(u16(dir, i + j));
      entries.push({ name: name, start: u32(dir, i + 116), size: u32(dir, i + 120) });
    }
    var wb = null;
    entries.forEach(function (e) { if (!wb && (e.name === 'Workbook' || e.name === 'Book')) wb = e; });
    if (!wb) throw new Error('No sheet found in this Excel file');
    var wbs;
    if (wb.size < miniCutoff) {                       /* small file: lives in the mini stream */
      var mf = stream(miniStart, 0), miniFat = [];
      for (i = 0; i + 4 <= mf.length; i += 4) miniFat.push(u32(mf, i));
      var mini = stream(entries[0].start, entries[0].size);
      var secs = chain(wb.start, miniFat);
      wbs = new Uint8Array(secs.length * msz);
      var p = 0;
      secs.forEach(function (sec) { wbs.set(mini.subarray(sec * msz, sec * msz + msz), p); p += msz; });
      wbs = wbs.subarray(0, wb.size);
    } else {
      wbs = stream(wb.start, wb.size);
    }
    return biff(wbs);
  }

  function xlString(b, p) { var cch = u16(b, p), fl = b[p + 2]; return chars(b, p + 3, cch, fl & 1); }

  function biff(st) {
    var sdv = new DataView(st.buffer, st.byteOffset, st.length);
    var recs = [], p = 0;
    while (p + 4 <= st.length) { recs.push([u16(st, p), p + 4, u16(st, p + 2)]); p += 4 + u16(st, p + 2); }

    var sst = [], fmts = {}, xfs = [], sheets = [], i;
    for (i = 0; i < recs.length; i++) {
      var t = recs[i][0], a = recs[i][1];
      if (t === 0x00FC) {
        var chunks = [[a, recs[i][2]]], j = i + 1;
        while (j < recs.length && recs[j][0] === 0x003C) { chunks.push([recs[j][1], recs[j][2]]); j++; }
        sst = readSST(st, chunks);
        i = j - 1;
      } else if (t === 0x041E) { fmts[u16(st, a)] = xlString(st, a + 2); }
      else if (t === 0x00E0) { xfs.push(u16(st, a + 2)); }
      else if (t === 0x0085) {
        var cch = st[a + 6], fl = st[a + 7];
        sheets.push({ pos: u32(st, a), hidden: (st[a + 4] & 3) !== 0, name: chars(st, a + 8, cch, fl & 1) });
      }
    }
    function isDate(xf) {
      var f = xfs[xf];
      return f === undefined ? false : (builtInDate(f) || (f >= 164 && dateFormat(fmts[f])));
    }

    var visible = sheets.filter(function (x) { return !x.hidden; });
    var start = sheets.length ? (visible[0] || sheets[0]).pos : -1;
    var cells = {}, maxR = -1, maxC = -1, inSheet = start < 0, pending = null;
    function put(r, c, v) {
      if (v === '' || v === null || v === undefined) return;
      (cells[r] = cells[r] || {})[c] = String(v);
      if (r > maxR) maxR = r;
      if (c > maxC) maxC = c;
    }
    for (i = 0; i < recs.length; i++) {
      var rt = recs[i][0], o = recs[i][1], len = recs[i][2];
      if (!inSheet) { if (rt === 0x0809 && o - 4 === start) inSheet = true; continue; }
      if (rt === 0x000A) break;                                   /* end of this sheet */
      if (rt === 0x00FD) put(u16(st, o), u16(st, o + 2), sst[u32(st, o + 6)] || '');
      else if (rt === 0x0204) put(u16(st, o), u16(st, o + 2), xlString(st, o + 6));
      else if (rt === 0x0203) put(u16(st, o), u16(st, o + 2), numText(sdv.getFloat64(o + 6, true), isDate(u16(st, o + 4))));
      else if (rt === 0x027E) put(u16(st, o), u16(st, o + 2), numText(rk(u32(st, o + 6)), isDate(u16(st, o + 4))));
      else if (rt === 0x00BD) {
        var row = u16(st, o), c0 = u16(st, o + 2), n = (len - 6) / 6;
        for (var k = 0; k < n; k++) {
          var q = o + 4 + k * 6;
          put(row, c0 + k, numText(rk(u32(st, q + 2)), isDate(u16(st, q))));
        }
      } else if (rt === 0x0006) {
        var fr = u16(st, o), fc = u16(st, o + 2);
        if (st[o + 12] === 0xFF && st[o + 13] === 0xFF) {
          if (st[o + 6] === 0) pending = [fr, fc];
          else if (st[o + 6] === 1) put(fr, fc, st[o + 8] ? 'TRUE' : 'FALSE');
        } else put(fr, fc, numText(sdv.getFloat64(o + 6, true), isDate(u16(st, o + 4))));
      } else if (rt === 0x0207 && pending) { put(pending[0], pending[1], xlString(st, o)); pending = null; }
    }
    return grid(cells, maxR, maxC);
