  });

  function freshDraft(customerId) {
    var st = App.db.settings;
    var c = customerId ? M.find('customers', customerId) : null;
    return {
      date: App.today(),
      customer: c,
      customerName: c ? c.name : '',
      customerMobile: c ? c.mobile : '',
      prescriptionId: '',
      rxChoice: 'auto',     /* 'auto' = latest saved one, a record id, 'draft' = typed for this bill, 'none' */
      rxDraft: null,
      items: [],
      billDiscount: 0,
      billDiscountType: '₹',
      taxEnabled: !!st.taxEnabled,
      taxInclusive: !!st.taxInclusive,
      taxPercent: App.n(st.taxPercentDefault),
      roundOff: true,
      paymentMethod: 'Cash',
      split: null,           /* [{method, amount}] while the bill is paid in parts */
      paidNow: 0,
      paidTouched: false,
      notes: '',
      /* screen-only state (never saved on the bill) */
      query: '',
      custQuery: '',
      discOpen: [],
      billDiscOpen: false,
      moreOpen: false,
      flash: null
    };
  }

  /* retail bills never carry an eye prescription */
  function chosenRx() { return null; }

  /* one readable line: R −1.50 −0.50 ×90 Add +1.00 · L … */
  function rxLine(rx) {
    function eye(e) {
      e = e || {};
      return [App.pw(e.sph) || '—', e.cyl ? App.pw(e.cyl) : '', e.axis ? '×' + e.axis : '', e.add ? 'Add ' + App.pw(e.add) : '',
              e.pd ? 'PD ' + e.pd : ''].filter(Boolean).join(' ');
    }
    function clEye(e) {
      e = e || {};
      return [App.pw(e.sph) || '—', e.cyl ? App.pw(e.cyl) : '', e.axis ? '×' + e.axis : '',
              e.bc ? 'BC ' + e.bc : '', e.dia ? 'DIA ' + e.dia : ''].filter(Boolean).join(' ');
    }
    return 'R  ' + eye(rx.od) + '     L  ' + eye(rx.os) +
      (M.hasCl(rx) ? '\n' + 'Contact lens   R  ' + clEye(rx.cl.od) + '     L  ' + clEye(rx.cl.os) : '');
  }

  var PM_LABEL = { 'Cash': 'Cash', 'UPI': 'UPI', 'Card': 'Card', 'Bank Transfer': 'Bank', 'Other': 'Other' };
  var PM_ICON = { 'Cash': 'wallet', 'UPI': 'phone', 'Card': 'card', 'Bank Transfer': 'building', 'Other': 'tag' };

  /* true when the two-column layout is showing (the items list then scrolls on its own) */
  function isWide() {
    var sc = App.el('.items-scroll');
    return !!sc && getComputedStyle(sc).overflowY === 'auto';
  }
  function hasMouse() { return !!(window.matchMedia && window.matchMedia('(pointer: fine)').matches); }

  function countText() {
    var n = S.items.length, units = App.sum(S.items, function (i) { return App.n(i.qty); });
    return n ? n + (n === 1 ? ' item' : ' items') + (units !== n ? ' · ' + units + ' pieces' : '') : '';
  }

  /* ================= NEW BILL — everything on one screen =================
     Wide screens: customer + items on the left; total, payment and Save on the right.
     Narrow screens: the same cards stacked, with the sticky bill bar at the bottom. */
  /* the same working state as a new bill, filled in from a bill already made */
  function draftFromSale(s) {
    var d = freshDraft(s.customerId || '');
    d.editId = s.id;
    d.invoiceNo = s.invoiceNo;
    d.date = s.date;
    d.customerName = s.customerName || '';
    d.customerMobile = s.customerMobile || '';
    d.items = (s.items || []).map(function (l) {
      return { productId: l.productId || '', sku: l.sku || '', name: l.name, qty: App.n(l.qty),
        rate: App.n(l.rate), costPrice: App.n(l.costPrice), discount: App.n(l.discount),
        discountType: l.discountType || '₹' };
    });
    d.billDiscount = App.n(s.billDiscountRaw);
    d.billDiscountType = s.billDiscountType || '₹';
    d.billDiscOpen = App.n(s.billDiscountRaw) > 0;
    d.taxEnabled = !!s.taxEnabled;
    d.taxInclusive = !!s.taxInclusive;
    d.taxPercent = App.n(s.taxPercent);
    d.roundOff = s.roundOff !== false;
    d.notes = s.notes || '';
    if (s.prescriptionId) { d.rxChoice = s.prescriptionId; }
    else if (s.prescription) { d.rxChoice = 'draft'; d.rxDraft = s.prescription; }
    else { d.rxChoice = 'none'; }
    /* money received with the bill can be corrected here; money taken later is only shown */
    var pays = M.payments().filter(function (p) { return p.saleId === s.id; });
    d.paid = pays.filter(function (p) { return p.atInvoice; })
      .map(function (p) { return { method: p.method || 'Cash', amount: App.n(p.amount) }; });
    d.paidLater = pays.filter(function (p) { return !p.atInvoice; })
      .map(function (p) { return { date: p.date, method: p.method || 'Cash', amount: App.n(p.amount) }; });
    d.paidTouched = true;
    d.paidNow = paidAllTotal(d);
    return d;
  }

  /* what the bill has been paid, in the edit screen: the lines being corrected plus anything taken later */
  function paidRowsTotal(st) { return App.round2(App.sum((st || S).paid || [], function (p) { return App.n(p.amount); })); }
  function paidLaterTotal(st) { return App.round2(App.sum((st || S).paidLater || [], function (p) { return App.n(p.amount); })); }
  function paidAllTotal(st) { return App.round2(paidRowsTotal(st) + paidLaterTotal(st)); }

  function newSale(view, r) {
    var editId = r.query.edit || '';
    if (editId) {
      var ex = M.find('sales', editId);
      if (!ex) { App.toast('That bill was not found', 'err'); UI.go('/sales'); return; }
      if (ex.status === 'cancelled') { App.toast('A cancelled bill cannot be changed', 'err', 4000); UI.go('/sale/' + editId); return; }
      if (!S || S.editId !== editId) S = draftFromSale(ex);
    } else if (S && S.editId) {
      S = freshDraft(r.query.c);          /* left the edit behind */
    }
    if (!editId && (!S || r.query.reset || (r.query.c && (!S.customer || S.customer.id !== r.query.c)))) {
      S = freshDraft(r.query.c);
    }
    if (!S.discOpen) S.discOpen = [];
    /* 'Pay later' is no longer offered: credit = choose a customer and take less (or Nothing) */
    if (S.paymentMethod === 'Credit') { S.paymentMethod = 'Cash'; S.paidTouched = false; }
    /* forget ?reset / ?c once used — otherwise any redraw (after saving a new customer or
       prescription) would wipe the bill being made */
    if (r.query.reset || r.query.c) {
      try { history.replaceState(null, '', '#/sale/new' + (editId ? '?edit=' + encodeURIComponent(editId) : '')); } catch (e) { /* ignore */ }
    }

    view.classList.add('pos-view', 'has-billbar');
    view.innerHTML =
      '<div class="pos-head">' +
        '<button class="btn btn-icon" data-go="' + (S.editId ? '/sale/' + S.editId : '/dashboard') + '" aria-label="Back">' + App.icon('arrowLeft', 20) + '</button>' +
        '<div class="pos-title"><h1>' + (S.editId ? 'Edit bill' : 'New Bill') + '</h1>' +
          '<span class="pill p-brand mono">' + App.esc(S.editId ? S.invoiceNo : M.nextInvoiceNo(true)) + '</span></div>' +
        (S.editId
          ? '<button class="btn btn-ghost" id="nsdiscard" type="button">' + App.icon('x', 17) + '<span>Discard changes</span></button>'
          : '<button class="btn btn-ghost" id="nsclear" type="button">' + App.icon('restore', 17) + '<span>Start over</span></button>') +
      '</div>' +
      (S.editId ? '<div class="banner mb16">' + App.icon('info', 20) + '<div class="tx">You are correcting a bill that is already made' +
        '<small>The invoice number stays the same. Stock is adjusted by the difference, and the version you are replacing is kept on the bill.</small></div></div>' : '') +
      '<div class="pos">' +
        '<section class="card pos-cust" id="ns-customer" aria-label="Customer"></section>' +
        '<section class="card pos-items" aria-label="Items on this bill">' +
          '<div class="pos-sec"><span class="pos-label">Items</span><span class="pos-count" id="ns-count"></span></div>' +
          '<div class="search-row">' +
            '<div class="search-box"><span class="si">' + App.icon('search', 19) + '</span>' +
              '<input id="nsq" type="search" autocomplete="off" enterkeyhint="search" ' +
                'placeholder="Search product name or SKU, or scan barcode" aria-label="Find a product to add"></div>' +
            '<button class="btn" id="nscustom" type="button">' + App.icon('pencil', 17) + '<span>Custom item</span></button>' +
          '</div>' +
          '<div class="items-scroll">' +
            '<div class="pres-list" id="ns-results"></div>' +
            '<div class="pos-quick" id="ns-quick"></div>' +
            '<div class="cart" id="ns-items"></div>' +
          '</div>' +
        '</section>' +
        '<section class="card pos-pay" aria-label="Bill total and payment">' +
          '<div class="pay-scroll"><div id="ns-sum"></div><div id="ns-paybox"></div></div>' +
          '<div class="pay-actions" id="ns-actions"></div>' +
        '</section>' +
      '</div>' +
      '<div class="billbar" id="ns-bar"></div>';

    drawCustomer();
    drawItems();
    drawResults();
    drawPayBox();
    refresh();

    var q = App.el('#nsq', view);
    q.value = S.query || '';
    q.addEventListener('input', App.debounce(function () { S.query = q.value; drawResults(); }, 110));
    q.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        /* barcode scanners type the code and press Enter */
        e.preventDefault();
        var hit = findProducts(q.value)[0];
        if (hit) { addProduct(hit); q.value = ''; S.query = ''; }
        else S.query = q.value;
        drawResults();
      } else if (e.key === 'Escape') {
        q.value = ''; S.query = ''; drawResults();
      }
    });
    App.el('#nscustom', view).addEventListener('click', function () { customItem(''); });
    var clearBtn = App.el('#nsclear', view);
    if (clearBtn) clearBtn.addEventListener('click', function () {
      UI.confirm({ title: 'Start this bill again?', message: 'Everything you have entered on this bill will be cleared.', danger: true, okLabel: 'Start over' })
        .then(function (ok) { if (ok) { S = freshDraft(); UI.render(); } });
    });
    var discardBtn = App.el('#nsdiscard', view);
    if (discardBtn) discardBtn.addEventListener('click', function () {
      UI.confirm({ title: 'Discard these changes?', message: 'The bill will stay exactly as it is now.', danger: true, okLabel: 'Discard' })
        .then(function (ok) { if (!ok) return; var id = S.editId; S = null; UI.go('/sale/' + id); });
    });
    /* with a mouse and keyboard start typing straight away; on a tablet don't pop the keyboard up */
    if (hasMouse() && !S.items.length && (!document.activeElement || document.activeElement === document.body)) q.focus();
  }

  /* ---------------- customer + prescription ---------------- */
  function setCustomer(c) {
    S.customer = c || null;
    S.customerName = c ? c.name : '';
    S.customerMobile = c ? c.mobile : '';
    S.prescriptionId = '';
    S.rxChoice = 'auto';
    S.custQuery = '';
    drawCustomer();
    refresh();
  }

    var el = App.el('#ns-customer');
    if (!el) return;
    var c = S.customer;

    if (c) {
      var st = M.customerStats(c.id);
      h += '<div class="cust-chip">' +
        '<div class="avatar">' + App.esc(App.initials(c.name)) + '</div>' +
        '<div class="cust-main"><div class="t">' + App.esc(c.name) + '</div>' +
          '<div class="d">' + App.esc([c.mobile || 'No mobile number', c.code].filter(Boolean).join(' · ')) + '</div>' +
          (st.outstanding > 0.5 ? '<span class="pill p-danger cust-due">Old due ' + App.money(st.outstanding) + '</span>' : '') +
        '</div>' +
        '<button type="button" class="btn btn-sm" id="ncchange">Change</button>' +
      '</div>';
    } else {
      h += '<div class="search-box"><span class="si">' + App.icon('search', 18) + '</span>' +
          '<input id="ncq" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search name or mobile number" ' +
            'aria-label="Find a saved customer" value="' + App.esc(S.custQuery || '') + '"></div>' +
        '<div class="cres-list" id="nc-results"></div>' +
        '<div class="walkin">' + App.icon('walk', 18) + '<span>Walk-in customer</span>' +
          '<button type="button" class="link-btn" id="ncnew">' + App.icon('plus', 16) + '<span>New customer</span></button></div>';
    }
    /* the name printed on this bill: fix a spelling here without touching the customer's record */
    if (S.editId || !c) {
      h += '<div class="bill-who">' +
        '<div class="row" style="grid-template-columns:1fr 1fr">' +
          '<div class="f"><label for="nsbname">Name on this bill</label>' +
            '<input type="text" id="nsbname" autocomplete="off" value="' + App.esc(S.customerName || '') + '" ' +
              'placeholder="' + App.esc(c ? c.name : 'Walk-in customer') + '"></div>' +
          '<div class="f"><label for="nsbmob">Mobile on this bill</label>' +
            '<input type="tel" id="nsbmob" inputmode="numeric" autocomplete="off" value="' + App.esc(S.customerMobile || '') + '" ' +
              'placeholder="' + App.esc(c ? (c.mobile || 'none') : 'none') + '"></div>' +
        '</div>' +
        '<div class="help">' + (c ? 'Printed on this bill only. To change it everywhere, open the customer.'
                                  : 'Optional — leave empty for "Walk-in customer".') + '</div>' +
      '</div>';
    }

    h += '</div>';
    el.innerHTML = h;

    var bn = App.el('#nsbname', el), bm = App.el('#nsbmob', el);
    if (bn) bn.addEventListener('input', function () { S.customerName = this.value; });
    if (bm) bm.addEventListener('input', function () { S.customerMobile = this.value; });

    var chg = App.el('#ncchange', el);
    if (chg) chg.addEventListener('click', function () {
      setCustomer(null);
      var inp = App.el('#ncq');
      if (inp) inp.focus();
    });
    var cq = App.el('#ncq', el);
    if (cq) {
      cq.addEventListener('input', App.debounce(function () { S.custQuery = cq.value; drawCustResults(); }, 120));
      cq.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        S.custQuery = cq.value;
        drawCustResults();
        var first = App.el('#nc-results [data-cust]');
        if (first) first.click();
      });
      drawCustResults();
    }
    var nw = App.el('#ncnew', el);
    if (nw) nw.addEventListener('click', function () { newCustomer(''); });
    wireRx(el);
  }

  function drawCustResults() {
    var box = App.el('#nc-results');
    if (!box) return;
    var text = String(S.custQuery || '').trim();
    if (!text) { box.innerHTML = ''; return; }
    var q = App.norm(text), owed = M.outstandingMap();
    var list = M.customers().filter(function (c) {
      return App.norm(c.name + ' ' + c.mobile + ' ' + c.altMobile + ' ' + c.code).indexOf(q) >= 0;
    }).slice(0, 5);
    box.innerHTML = list.map(function (c) {
      var o = App.n(owed[c.id]);
      return '<button type="button" class="cres" data-cust="' + App.esc(c.id) + '">' +
        '<span class="avatar">' + App.esc(App.initials(c.name)) + '</span>' +
        '<span class="cres-main"><span class="t">' + App.esc(c.name) + '</span>' +
          '<span class="d">' + App.esc(c.code + ' · ' + (App.oneLine(c.address) || c.mobile || 'No address')) + '</span></span>' +
        (o > 0.5 ? '<span class="pill p-danger">Due ' + App.money(o) + '</span>' : '') +
      '</button>';
    }).join('') +
    (list.length ? '' : '<div class="sm muted cres-none">No saved customer matches “' + App.esc(text) + '”</div>') +
    '<button type="button" class="cres cres-new" id="ncnew2">' + App.icon('plus', 18) +
      '<span>Add “' + App.esc(text) + '” as a new customer</span></button>';
    App.els('[data-cust]', box).forEach(function (b) {
      b.addEventListener('click', function () { setCustomer(M.find('customers', this.getAttribute('data-cust'))); });
    });

  /* the normal customer form; what was typed in the search goes into the name or mobile box */
  function newCustomer(text) {
    App.customerForm(null, function (c) { if (c) setCustomer(c); });
    if (!text) return;
    var all = App.els('.modal-bg'), m = all[all.length - 1];
    var f = m && App.el(/^[+\d][\d\s-]{5,}$/.test(text) ? '[name="mobile"]' : '[name="name"]', m);
    if (f && !f.value) f.value = text;
  }

  function rxBlock(c) {
    var rxs = c ? M.customerRx(c.id) : [];
    var chosen = chosenRx();
    var head = '<div class="rx-mini-head">' + App.icon('eye', 17) + '<span>Eye prescription</span>';
    var h = '<div class="rx-mini">';
    if (c && rxs.length) {
      h += head + '<button type="button" class="link-btn" id="nsnewrx">' + App.icon('plus', 15) + '<span>New</span></button></div>' +
        '<select id="nsrx" aria-label="Prescription printed on the invoice">' +
          rxs.map(function (rx, i) {
            var on = (S.rxChoice === 'auto' && i === 0) || S.rxChoice === rx.id;
            return '<option value="' + App.esc(rx.id) + '"' + (on ? ' selected' : '') + '>' + App.fmtDate(rx.date) +
              (i === 0 ? ' (latest)' : '') + (rx.doctor ? ' — Dr. ' + App.esc(rx.doctor) : '') + '</option>';
          }).join('') +
          '<option value="none"' + (S.rxChoice === 'none' ? ' selected' : '') + '>Don\'t print a prescription</option>' +
        '</select>';
    } else if (chosen) {
      h += head + '<span class="rx-acts">' +
          '<button type="button" class="link-btn" id="nstyperx">' + App.icon('pencil', 15) + '<span>Edit</span></button>' +
          '<button type="button" class="link-btn danger" id="nsrxclear">' + App.icon('x', 15) + '<span>Remove</span></button>' +
        '</span></div>';
    } else if (c) {
      h += head + '</div><div class="rx-empty"><span class="sm muted">None saved for ' + App.esc(c.name) + '</span>' +
        '<button type="button" class="btn btn-sm" id="nsnewrx">' + App.icon('plus', 15) + '<span>Add</span></button></div>';
    } else {
      h += head + '</div><div class="rx-empty"><span class="sm muted">Optional — prints on the invoice</span>' +
        '<button type="button" class="btn btn-sm" id="nstyperx">' + App.icon('plus', 15) + '<span>Add</span></button></div>';
    }
    if (chosen) h += '<div class="rxpick-line">' + App.esc(rxLine(chosen)) + '</div>';
    return h + '</div>';
  }

  function wireRx(el) {
    var sel = App.el('#nsrx', el);
    if (sel) sel.addEventListener('change', function () {
      var v = this.value, latest = M.customerRx(S.customer.id)[0];
      S.rxChoice = v === 'none' ? 'none' : (latest && latest.id === v ? 'auto' : v);
      drawCustomer();
    });
    var nrx = App.el('#nsnewrx', el);
    if (nrx) nrx.addEventListener('click', function () {
      /* the form re-renders this screen after saving; the bill being made stays intact */
      App.rxForm(S.customer.id, null, { onSaved: function () { S.rxChoice = 'auto'; } });
    });
    var trx = App.el('#nstyperx', el);
    if (trx) trx.addEventListener('click', function () {
      App.rxForm('', null, { draft: S.rxDraft || true, onData: function (data) { S.rxDraft = data; S.rxChoice = 'draft'; drawCustomer(); } });
    });
    var crx = App.el('#nsrxclear', el);
    if (crx) crx.addEventListener('click', function () { S.rxDraft = null; S.rxChoice = 'auto'; drawCustomer(); });
  }

  /* ---------------- items ---------------- */
  function lineAmount(it) {
    var gross = App.round2(App.n(it.qty) * App.n(it.rate));
    var d = it.discountType === '%' ? App.round2(gross * App.n(it.discount) / 100) : App.round2(App.n(it.discount));
    return App.round2(gross - Math.min(d, gross));
  }

  /* every typed word must match; an exact barcode/SKU comes first, then names that start with the text */
  function findProducts(text) {
    var words = App.norm(text).split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    var raw = String(text).trim().toLowerCase();
    var hits = [];
    M.products().forEach(function (p) {
      var hay = App.norm([p.name, p.sku, p.brand, p.model, p.barcode, p.category].filter(Boolean).join(' '));
      for (var i = 0; i < words.length; i++) if (hay.indexOf(words[i]) < 0) return;
      var exact = String(p.barcode || '').toLowerCase() === raw || String(p.sku || '').toLowerCase() === raw;
      hits.push({ p: p, rank: exact ? 0 : App.norm(p.name).indexOf(words[0]) === 0 ? 1 : 2 });
    });
    hits.sort(function (a, b) { return a.rank - b.rank || String(a.p.name).localeCompare(String(b.p.name)); });
    return hits.slice(0, 8).map(function (h) { return h.p; });
  }

  /* best sellers from recent bills, topped up with the newest products */
  function quickProducts() {
    var live = M.products();
    if (!live.length) return [];
    var byId = {}, count = {};
    live.forEach(function (p) { byId[p.id] = p; });
    var sales = M.sales();
    for (var i = sales.length - 1, seen = 0; i >= 0 && seen < 300; i--, seen++) {
      if (sales[i].status === 'cancelled') continue;
      (sales[i].items || []).forEach(function (it) {
        if (it.productId && byId[it.productId]) count[it.productId] = (count[it.productId] || 0) + App.n(it.qty);
      });
    }
    var top = Object.keys(count).sort(function (a, b) { return count[b] - count[a]; }).map(function (id) { return byId[id]; });
    if (top.length < 6) {
      live.slice().sort(function (a, b) { return String(b.createdAt || '') > String(a.createdAt || '') ? 1 : -1; })
        .forEach(function (p) { if (top.length < 6 && top.indexOf(p) < 0) top.push(p); });
    }
    return top.slice(0, 6);
  }

  function addVariantLine(p, v) {
    var vid = v ? v.id : '';
    var label = v ? M.variantLabel(v) : '';
    var at = -1;
    S.items.forEach(function (it, n) { if (it.productId === p.id && (it.variantId || '') === vid) at = n; });
    if (at >= 0) S.items[at].qty = App.n(S.items[at].qty) + 1;
    else {
      S.items.push({ productId: p.id, variantId: vid, variantLabel: label, sku: (v && v.sku) || p.sku,
        name: p.name, qty: 1, rate: App.n(p.sellPrice), costPrice: App.n(p.costPrice),
        discount: 0, discountType: '₹', stock: v ? App.n(v.stock) : App.n(p.stock) });
      at = S.items.length - 1;
    }
    S.flash = at;
    drawItems();
    refresh();
    if (!isWide()) App.toast('Added to the bill · ' + countText(), 'ok', 1500);
  }

  function addProduct(p) {
    var vs = (p.variants || []).filter(function (v) { return true; });
    if (vs.length <= 1) { addVariantLine(p, vs[0] || null); return; }
    /* more than one size/colour — let the user pick */
    var body = '<div class="vpick">' + vs.map(function (v) {
      var out = App.n(v.stock) <= 0;
      return '<button type="button" class="vpick-b' + (out ? ' vpick-out' : '') + '" data-vid="' + v.id + '">' +
        '<span class="vpick-l">' + App.esc(M.variantLabel(v)) + '</span>' +
        '<span class="vpick-s">' + App.n(v.stock) + ' in stock</span></button>';
    }).join('') + '</div>';
    var m = UI.modal({ title: 'Choose size / colour — ' + App.esc(p.name), size: 'narrow', body: body,
      buttons: [{ label: 'Close', onClick: function (a) { a.close(); } }] });
    App.on(m.el, 'click', '[data-vid]', function () {
      var v = M.productVariant(p, this.getAttribute('data-vid'));
      m.close(); addVariantLine(p, v);
    });
  }

  /* things not in the product list (alterations, charges, one-off items) */
  function customItem(name) {
    var m = UI.modal({
      title: 'Custom item',
      size: 'narrow',
      body: '<p class="sm muted" style="margin:0 0 12px">For anything not in your product list — alterations, a charge, or a one-off item.</p>' +
        UI.formHTML([
          { k: 'name', label: 'Item name', required: true, span: 2, value: name || '' },
          { k: 'qty', label: 'Quantity', type: 'number', value: 1, attrs: 'inputmode="numeric" step="1" min="1"' },
          { k: 'rate', label: 'Price (₹)', type: 'number', value: '', attrs: 'inputmode="decimal" step="0.01" min="0"' },
          { k: 'costPrice', label: 'Your cost (₹, optional)', type: 'number', value: '', attrs: 'inputmode="decimal" step="0.01" min="0"', span: 2 }
        ]),
      buttons: [
        { label: 'Cancel', onClick: function (a) { a.close(); } },
        { label: 'Add to bill', class: 'btn-primary', icon: 'plus', onClick: function (a) {
            UI.clearErrors(a.el);
            var d = UI.readForm(a.el);
            if (!String(d.name || '').trim()) return UI.markError(a.el, 'name', 'Type the item name');
            S.items.push({ productId: '', sku: '', name: d.name.trim(), qty: App.n(d.qty) > 0 ? App.n(d.qty) : 1,
              rate: Math.max(0, App.n(d.rate)), costPrice: Math.max(0, App.n(d.costPrice)), discount: 0, discountType: '₹' });
            S.flash = S.items.length - 1;
            a.close();
            var q = App.el('#nsq');
            if (q && q.value) { q.value = ''; S.query = ''; drawResults(); }
            drawItems(); refresh();
          } }
      ]
    });
    var f = App.el(name ? '[name="rate"]' : '[name="name"]', m.el);
    if (f) setTimeout(function () { f.focus(); }, 60);
  }

  function drawResults() {
    var box = App.el('#ns-results'), quick = App.el('#ns-quick');
    if (!box || !quick) return;
    var text = String(S.query || '').trim();
    if (!text) {
      box.innerHTML = '';
      var top = quickProducts();
      quick.innerHTML = top.length ? '<span class="pos-hint">Quick add</span>' + top.map(function (p) {
        return '<button type="button" class="chip" data-add="' + App.esc(p.id) + '">' +
          '<span class="qn">' + App.esc(p.name) + '</span><b class="num">' + App.money(p.sellPrice) + '</b></button>';
      }).join('') : '';
    } else {
      quick.innerHTML = '';
      var list = findProducts(text);
      box.innerHTML = list.length ? list.map(function (p) {
        var stock = App.n(p.stock), low = stock <= App.n(p.minStock);
        return '<button type="button" class="pres" data-add="' + App.esc(p.id) + '">' +
          '<span class="pres-main"><span class="t">' + App.esc(p.name) + '</span>' +
            '<span class="d">' + App.esc([p.sku, p.brand, p.category].filter(Boolean).join(' · ')) + '</span></span>' +
          '<span class="pres-rt"><span class="b num">' + App.money(p.sellPrice) + '</span>' +
            '<span class="tiny ' + (low ? 'neg' : 'dim') + '">' + (stock > 0 ? stock + ' in stock' : 'Out of stock') + '</span></span>' +
          '<span class="pres-add" aria-hidden="true">' + App.icon('plus', 20) + '</span>' +
        '</button>';
      }).join('') :
        '<div class="pres-none"><span>No product matches “' + App.esc(text) + '”</span>' +
          '<button type="button" class="btn btn-sm" id="nsascustom">' + App.icon('pencil', 16) + '<span>Add as custom item</span></button></div>';
      var asc = App.el('#nsascustom', box);
      if (asc) asc.addEventListener('click', function () { customItem(text); });
    }
    [box, quick].forEach(function (root) {
      App.els('[data-add]', root).forEach(function (b) {
        b.addEventListener('click', function () {
          var p = M.find('products', this.getAttribute('data-add'));
          if (!p) return;
          addProduct(p);
          var q = App.el('#nsq');
          if (q && q.value) {
            q.value = ''; S.query = '';
            if (hasMouse()) q.focus(); else q.blur();
          }
          drawResults();
        });
      });
    });
  }

  function drawItems() {
    var el = App.el('#ns-items'), cnt = App.el('#ns-count');
    if (!el) return;
    if (cnt) cnt.textContent = countText();
    if (!S.items.length) {
      el.innerHTML = '<div class="cart-empty"><div class="eic">' + App.icon('box', 26) + '</div>' +
        '<div class="t">No items yet</div><div class="d">' +
        (M.products().length ? 'Search above, or tap a product under Quick add.'
                             : 'No products are saved yet. Add them in Products &amp; Stock, or tap Custom item.') +
        '</div></div>';
      return;
    }
    el.innerHTML = S.items.map(function (it, i) {
      var p = it.productId ? M.find('products', it.productId) : null;
      var pv = (p && it.variantId) ? M.productVariant(p, it.variantId) : (p && p.variants && p.variants[0]);
      var avail = pv ? App.n(pv.stock) : (p ? App.n(p.stock) : 0);
      var qty = App.n(it.qty);
      var short = p && avail < qty;
      var disc = App.n(it.discount) > 0 || S.discOpen[i];
      return '<div class="cl' + (S.flash === i ? ' cl-flash' : '') + '" data-i="' + i + '">' +
        '<div class="cl-top">' +
          '<div class="cl-name"><input type="text" class="cl-nm" data-k="name" value="' + App.esc(it.name) + '" aria-label="Item name">' +
            '<small>' + App.esc(it.variantLabel ? it.variantLabel : (it.sku || 'Custom item')) +
            (p ? ' · ' + avail + ' in stock' : '') +
            (short ? ' · <span class="neg b">not enough stock</span>' : '') + '</small></div>' +
          '<div class="cl-amt num" data-amt>' + App.money(lineAmount(it)) + '</div>' +
          '<button type="button" class="cl-rm" data-rm aria-label="Remove ' + App.esc(it.name) + '">' + App.icon('trash', 18) + '</button>' +
        '</div>' +
        '<div class="cl-ctl">' +
          '<div class="qty" role="group" aria-label="Quantity">' +
            '<button type="button" data-step="-1" aria-label="One less"' + (qty <= 1 ? ' disabled' : '') + '>−</button>' +
            '<input type="number" data-k="qty" value="' + qty + '" inputmode="numeric" step="1" min="1" aria-label="Quantity">' +
            '<button type="button" data-step="1" aria-label="One more">+</button>' +
          '</div>' +
          '<span class="cl-x" aria-hidden="true">×</span>' +
          '<label class="money-in"><span aria-hidden="true">₹</span>' +
            '<input type="number" data-k="rate" value="' + App.n(it.rate) + '" inputmode="decimal" step="0.01" min="0" aria-label="Price for one"></label>' +
          (disc
            ? '<div class="cl-disc"><span>Discount</span>' +
                '<input type="number" data-k="discount" value="' + App.n(it.discount) + '" inputmode="decimal" step="0.01" min="0" aria-label="Discount on this item">' +
                '<select data-k="discountType" aria-label="Discount type"><option' + (it.discountType === '%' ? '' : ' selected') + '>₹</option>' +
                '<option' + (it.discountType === '%' ? ' selected' : '') + '>%</option></select></div>'
            : '<button type="button" class="link-btn" data-disc>' + App.icon('tag', 15) + '<span>Discount</span></button>') +
        '</div>' +
      '</div>';
    }).join('');

    /* listeners go onto the fresh nodes (delegation would stack stale handlers on every redraw) */
    function at(node) { var row = node.closest('[data-i]'); return { row: row, i: App.n(row.getAttribute('data-i')) }; }
    App.els('input[data-k]', el).forEach(function (inp) {
      inp.addEventListener('input', function () {
        var x = at(this), k = this.getAttribute('data-k');
        S.items[x.i][k] = k === 'name' ? this.value : App.n(this.value);
        if (k === 'name') { refresh(); return; }
        App.el('[data-amt]', x.row).textContent = App.money(lineAmount(S.items[x.i]));
        if (k === 'qty') {
          App.el('[data-step="-1"]', x.row).disabled = App.n(this.value) <= 1;
          var cnt2 = App.el('#ns-count'); if (cnt2) cnt2.textContent = countText();
        }
        refresh();
      });
      if (inp.getAttribute('data-k') === 'qty') inp.addEventListener('change', function () {
        if (App.n(this.value) < 1) { S.items[at(this).i].qty = 1; drawItems(); refresh(); }
      });
    });
    App.els('select[data-k]', el).forEach(function (sel) {
      sel.addEventListener('change', function () {
        var x = at(this);
        S.items[x.i].discountType = this.value;
        App.el('[data-amt]', x.row).textContent = App.money(lineAmount(S.items[x.i]));
        refresh();
      });
    });
    App.els('[data-step]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var it = S.items[at(this).i];
        it.qty = Math.max(1, App.n(it.qty) + App.n(this.getAttribute('data-step')));
        drawItems(); refresh();
      });
    });
    App.els('[data-rm]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var i = at(this).i;
        S.items.splice(i, 1);
        S.discOpen.splice(i, 1);
        drawItems(); refresh();
      });
    });
    App.els('[data-disc]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var i = at(this).i;
        S.discOpen[i] = true;
        drawItems();
        var f = App.el('[data-i="' + i + '"] [data-k="discount"]', el);
        if (f) { f.focus(); f.select(); }
      });
    });
    if (S.flash !== null && S.flash !== undefined) {
      var fl = App.el('[data-i="' + S.flash + '"]', el);
      if (fl && isWide() && fl.scrollIntoView) fl.scrollIntoView({ block: 'nearest' });
      S.flash = null;
    }
  }

  /* ---------------- total + payment ---------------- */
  function drawPayBox() {
    var box = App.el('#ns-paybox');
    if (!box) return;
    var bdOpen = S.billDiscOpen || App.n(S.billDiscount) > 0;
    var extras = [];
    if (S.taxEnabled) extras.push('GST ' + App.n(S.taxPercent) + '%');
    if (S.date !== App.today()) extras.push(App.fmtDate(S.date));
    if (!S.roundOff) extras.push('No round off');
    if (S.notes) extras.push('Note');

    box.innerHTML =
      (bdOpen
        ? '<div class="pay-disc"><label for="nsbd">Discount on the whole bill</label><div class="pay-disc-row">' +
            '<input type="number" id="nsbd" value="' + App.n(S.billDiscount) + '" inputmode="decimal" step="0.01" min="0">' +
            '<select id="nsbdt" aria-label="Discount type"><option' + (S.billDiscountType === '%' ? '' : ' selected') + '>₹</option>' +
              '<option' + (S.billDiscountType === '%' ? ' selected' : '') + '>%</option></select>' +
            '<button type="button" class="btn btn-icon btn-ghost" id="nsbdx" aria-label="Remove the bill discount">' + App.icon('x', 18) + '</button>' +
          '</div></div>'
        : '<button type="button" class="link-btn" id="nsbdopen">' + App.icon('tag', 16) + '<span>Add discount on bill</span></button>') +
      '<div class="pos-sec pay-sec"><span class="pos-label">Payment</span>' +
        (S.editId ? '' : '<button type="button" class="link-btn" id="nssplit">' + App.icon(S.split ? 'wallet' : 'card', 15) +
        '<span>' + (S.split ? 'One method' : 'Split payment') + '</span></button>') + '</div>' +
      (S.editId ? paidAlreadyBox() : S.split ? splitRows() :
        '<div class="pm-grid" role="radiogroup" aria-label="Payment method">' +
          M.PAY_METHODS.filter(function (m) { return m !== 'Credit'; }).map(function (m) {
            var on = S.paymentMethod === m;
            return '<button type="button" class="chip' + (on ? ' on' : '') + '" role="radio" aria-checked="' + on + '" data-pm="' + App.esc(m) + '">' +
              App.icon(PM_ICON[m] || 'tag', 16) + '<span>' + App.esc(PM_LABEL[m] || m) + '</span></button>';
          }).join('') +
        '</div>' +
        '<div class="paid-row"><label for="nspaid">Amount received</label><div class="paid-in">' +
          '<label class="money-in lg"><span aria-hidden="true">₹</span>' +
            '<input type="number" id="nspaid" value="' + App.n(S.paidNow) + '" inputmode="decimal" step="0.01" min="0"></label>' +
          '<button type="button" class="chip" data-paid="full">Full</button>' +
          '<button type="button" class="chip" data-paid="zero">Nothing</button>' +
        '</div></div>') +
      '<div class="due-line" id="nsdue"></div>' +
      '<div class="banner warn mt8" id="nswarn" hidden>' + App.icon('alert', 20) +
        '<div class="tx">Choose a customer to give credit<small>A walk-in bill must be paid in full.</small></div></div>' +
      '<details class="more" id="nsmore"' + (S.moreOpen ? ' open' : '') + '><summary>' + App.icon('sliders', 18) +
        '<span>More options</span><span class="more-hint">' + App.esc(extras.length ? extras.join(' · ') : 'Date, GST, note') + '</span>' +
        App.icon('chevronD', 18, 'chev') + '</summary>' +
        '<div class="more-body frm">' +
          '<div class="f"><label for="nsdate">Bill date</label><input type="date" id="nsdate" value="' + S.date + '"></div>' +
          (S.editId ? '<div class="f"><label for="nsno">Bill number</label>' +
            '<input type="text" id="nsno" autocomplete="off" value="' + App.esc(S.invoiceNo || '') + '">' +
            '<div class="help">Must not be the same as another bill.</div></div>' : '') +
          '<label class="switch"><input type="checkbox" id="nstax"' + (S.taxEnabled ? ' checked' : '') + '><span class="track"></span><span class="lb">Add GST to this bill</span></label>' +
          (S.taxEnabled ?
            '<div class="row" style="grid-template-columns:1fr 1fr">' +
              '<div class="f"><label for="nstaxp">GST %</label><input type="number" id="nstaxp" value="' + App.n(S.taxPercent) + '" inputmode="decimal" step="0.01" min="0"></div>' +
              '<div class="f"><label for="nstaxi">GST is</label><select id="nstaxi">' +
                '<option value="0"' + (S.taxInclusive ? '' : ' selected') + '>Added on top</option>' +
                '<option value="1"' + (S.taxInclusive ? ' selected' : '') + '>Included in price</option></select></div>' +
            '</div>' : '') +
          '<label class="switch"><input type="checkbox" id="nsround"' + (S.roundOff ? ' checked' : '') + '><span class="track"></span><span class="lb">Round off to the nearest rupee</span></label>' +
          '<div class="f"><label for="nsnotes">Note on the bill</label>' +
            '<textarea id="nsnotes" rows="2" placeholder="e.g. Lenses ready on Saturday">' + App.esc(S.notes) + '</textarea></div>' +
        '</div></details>';

    function markMethod(m) {
      App.els('[data-pm]', box).forEach(function (x) {
        var on = x.getAttribute('data-pm') === m;
        x.classList.toggle('on', on);
        x.setAttribute('aria-checked', on);
      });
    }
    var bdo = App.el('#nsbdopen', box);
    if (bdo) bdo.addEventListener('click', function () {
      S.billDiscOpen = true;
      drawPayBox();
      var f = App.el('#nsbd'); if (f) { f.focus(); f.select(); }
    });
    var bd = App.el('#nsbd', box);
    if (bd) {
      bd.addEventListener('input', function () { S.billDiscount = Math.max(0, App.n(this.value)); S.paidTouched = false; refresh(); });
      App.el('#nsbdt', box).addEventListener('change', function () { S.billDiscountType = this.value; S.paidTouched = false; refresh(); });
      App.el('#nsbdx', box).addEventListener('click', function () {
        S.billDiscount = 0; S.billDiscOpen = false; S.paidTouched = false;
        drawPayBox(); refresh();
      });
    }
    App.els('.split-row[data-p]', box).forEach(function (rowEl) {
      var i = App.n(rowEl.getAttribute('data-p'));
      App.el('[data-pm-row]', rowEl).addEventListener('change', function () { S.paid[i].method = this.value; refresh(); });
      App.el('[data-pa-row]', rowEl).addEventListener('input', function () { S.paid[i].amount = Math.max(0, App.n(this.value)); refresh(); });
      App.el('[data-pd-row]', rowEl).addEventListener('click', function () { S.paid.splice(i, 1); drawPayBox(); refresh(); });
    });
    var padd = App.el('#nspaidadd', box);
    if (padd) padd.addEventListener('click', function () {
      var left = Math.max(0, App.round2(M.calcSale(S.items, S).total - paidAllTotal()));
      S.paid.push({ method: 'Cash', amount: left });
      drawPayBox(); refresh();
    });
    var pfull = App.el('#nspaidfull', box);
    if (pfull) pfull.addEventListener('click', function () {
      var total = M.calcSale(S.items, S).total, later = paidLaterTotal();
      S.paid = [{ method: (S.paid[0] && S.paid[0].method) || 'Cash', amount: Math.max(0, App.round2(total - later)) }];
      drawPayBox(); refresh();
    });

    var splitBtn = App.el('#nssplit', box);
    if (splitBtn) splitBtn.addEventListener('click', function () {
      if (S.split) { S.split = null; S.paidTouched = false; }
      else {
        S.split = [{ method: S.paymentMethod || 'Cash', amount: App.n(S.paidNow) || M.calcSale(S.items, S).total }];
        S.paidTouched = true;
      }
      drawPayBox(); refresh();
    });
    var splitAdd = App.el('#nssplitadd', box);
    if (splitAdd) splitAdd.addEventListener('click', function () {
      var used = S.split.map(function (p) { return p.method; });
      var next = M.PAY_METHODS.filter(function (m) { return m !== 'Credit' && used.indexOf(m) < 0; })[0];
      if (!next) return;
      S.split.push({ method: next, amount: Math.max(0, App.round2(M.calcSale(S.items, S).total - splitTotal())) });
      drawPayBox(); refresh();
    });
    App.els('.split-row[data-s]', box).forEach(function (rowEl) {
      var i = App.n(rowEl.getAttribute('data-s'));
      App.el('[data-sm]', rowEl).addEventListener('change', function () { S.split[i].method = this.value; drawPayBox(); refresh(); });
      App.el('[data-sa]', rowEl).addEventListener('input', function () { S.split[i].amount = Math.max(0, App.n(this.value)); refresh(); });
      App.el('[data-srest]', rowEl).addEventListener('click', function () {
        var others = App.round2(splitTotal() - App.n(S.split[i].amount));
        S.split[i].amount = Math.max(0, App.round2(M.calcSale(S.items, S).total - others));
        drawPayBox(); refresh();
      });
      App.el('[data-sdel]', rowEl).addEventListener('click', function () {
        S.split.splice(i, 1);
        if (!S.split.length) { S.split = null; S.paidTouched = false; }
        drawPayBox(); refresh();
      });
    });

    App.els('[data-pm]', box).forEach(function (b) {
      b.addEventListener('click', function () {
        var m = this.getAttribute('data-pm');
        S.paymentMethod = m;
        markMethod(m);
        refresh();
      });
    });
    var paidInput = App.el('#nspaid', box);
    if (paidInput) paidInput.addEventListener('input', function () {
      S.paidTouched = true;
      S.paidNow = Math.max(0, App.n(this.value));
      refresh();
    });
    App.els('[data-paid]', box).forEach(function (b) {
      b.addEventListener('click', function () {
        if (this.getAttribute('data-paid') === 'full') {
          S.paidTouched = false;                       /* follows the total from now on */
        } else {
          S.paidTouched = true;
          S.paidNow = 0;
        }
        refresh();
      });
    });
    App.el('#nsmore', box).addEventListener('toggle', function () { S.moreOpen = this.open; });
    var noBox = App.el('#nsno', box);
    if (noBox) noBox.addEventListener('input', function () { S.invoiceNo = this.value; });
    App.el('#nsdate', box).addEventListener('change', function () { S.date = this.value || App.today(); drawPayBox(); refresh(); });
    App.el('#nstax', box).addEventListener('change', function () { S.taxEnabled = this.checked; S.paidTouched = false; drawPayBox(); refresh(); });
    var tp = App.el('#nstaxp', box);
    if (tp) tp.addEventListener('change', function () { S.taxPercent = Math.max(0, App.n(this.value)); S.paidTouched = false; drawPayBox(); refresh(); });
    var ti = App.el('#nstaxi', box);
    if (ti) ti.addEventListener('change', function () { S.taxInclusive = this.value === '1'; S.paidTouched = false; drawPayBox(); refresh(); });
    App.el('#nsround', box).addEventListener('change', function () { S.roundOff = this.checked; S.paidTouched = false; drawPayBox(); refresh(); });
    App.el('#nsnotes', box).addEventListener('input', function () { S.notes = this.value; });
  }

  /* on an edit: the money taken with the bill, which can be corrected line by line */
  function paidAlreadyBox() {
    var rows = S.paid || [], used = rows.map(function (p) { return p.method; });
    return '<div class="paid-already">' +
      '<div class="r"><span>Received with this bill</span><span class="num b">' + App.money(paidRowsTotal()) + '</span></div>' +
      (rows.length
        ? '<div class="split-list">' + rows.map(function (p, i) {
            return '<div class="split-row" data-p="' + i + '">' +
              '<select data-pm-row aria-label="How it was paid">' +
                M.PAY_METHODS.filter(function (mth) { return mth !== 'Credit'; }).map(function (mth) {
                  return '<option value="' + App.esc(mth) + '"' + (mth === p.method ? ' selected' : '') + '>' + App.esc(PM_LABEL[mth] || mth) + '</option>';
                }).join('') +
              '</select>' +
              '<label class="money-in"><span aria-hidden="true">₹</span>' +
                '<input type="number" data-pa-row value="' + App.n(p.amount) + '" inputmode="decimal" step="0.01" min="0" aria-label="Amount received"></label>' +
              '<button type="button" class="cl-rm" data-pd-row aria-label="Remove this payment line">' + App.icon('x', 16) + '</button>' +
            '</div>';
          }).join('') + '</div>'
        : '<div class="sm muted">Nothing was received with this bill.</div>') +
      '<div class="flex gap8 wrap mt8">' +
        '<button type="button" class="link-btn" id="nspaidadd">' + App.icon('plus', 15) + '<span>Add a payment line</span></button>' +
        '<button type="button" class="link-btn" id="nspaidfull">' + App.icon('check', 15) + '<span>Received in full</span></button>' +
      '</div>' +
      ((S.paidLater || []).length
        ? '<div class="sm muted mt8">Received later, not changed here: ' +
            S.paidLater.map(function (p) { return App.money(p.amount) + ' ' + p.method + ' on ' + App.fmtDate(p.date); }).join(' · ') + '</div>'
        : '') +
    '</div>';
  }

  function splitTotal() {
    return App.round2(App.sum(S.split || [], function (p) { return App.n(p.amount); }));
  }

  /* one line per method while the bill is paid in parts */
  function splitRows() {
    var used = S.split.map(function (p) { return p.method; });
    var spare = M.PAY_METHODS.filter(function (m) { return m !== 'Credit' && used.indexOf(m) < 0; });
    return '<div class="split-list">' +
      S.split.map(function (p, i) {
        return '<div class="split-row" data-s="' + i + '">' +
          '<select data-sm aria-label="Payment method">' +
            M.PAY_METHODS.filter(function (m) { return m !== 'Credit' && (m === p.method || used.indexOf(m) < 0); })
              .map(function (m) {
                return '<option value="' + App.esc(m) + '"' + (m === p.method ? ' selected' : '') + '>' + App.esc(PM_LABEL[m] || m) + '</option>';
              }).join('') +
          '</select>' +
          '<label class="money-in"><span aria-hidden="true">₹</span>' +
            '<input type="number" data-sa value="' + App.n(p.amount) + '" inputmode="decimal" step="0.01" min="0" aria-label="Amount paid by ' + App.esc(p.method) + '"></label>' +
          '<button type="button" class="chip" data-srest>Rest</button>' +
          '<button type="button" class="cl-rm" data-sdel aria-label="Remove this payment line">' + App.icon('x', 16) + '</button>' +
        '</div>';
      }).join('') +
      (spare.length ? '<button type="button" class="link-btn" id="nssplitadd">' + App.icon('plus', 15) + '<span>Add another method</span></button>' : '') +
    '</div>';
  }

  /* recompute the totals and update everything that shows them — never rebuilds a field being typed in */
  function refresh() {
    var calc = M.calcSale(S.items, S);
    if (S.editId) S.paidNow = paidAllTotal();
    else if (S.split) S.paidNow = splitTotal();
    else if (!S.paidTouched) S.paidNow = calc.total;
    var diff = App.round2(calc.total - App.n(S.paidNow));
    var due = Math.max(0, diff);

    var sum = App.el('#ns-sum');
    if (sum) {
      var row = function (label, value, cls) {
        return '<div class="r"><span>' + label + '</span><span class="num' + (cls ? ' ' + cls : '') + '">' + value + '</span></div>';
      };
      sum.innerHTML = '<div class="pos-sec"><span class="pos-label">Bill total</span></div><div class="sum">' +
        row('Items total', App.money(calc.subtotal)) +
        (calc.itemDiscount ? row('Item discounts', '− ' + App.money(calc.itemDiscount), 'neg') : '') +
        (calc.billDiscount ? row('Discount on bill', '− ' + App.money(calc.billDiscount), 'neg') : '') +
        (S.taxEnabled ? row('GST ' + App.n(S.taxPercent) + '%' + (S.taxInclusive ? ' (included)' : ''),
          (S.taxInclusive ? '' : '+ ') + App.money(calc.taxAmount)) : '') +
        (calc.roundOff ? row('Round off', App.money(calc.roundOff)) : '') +
        '<div class="sum-total"><span>Total</span><span class="num" id="nstotal">' + App.money(calc.total) + '</span></div></div>';
    }
    var paid = App.el('#nspaid');
    if (paid && document.activeElement !== paid) paid.value = App.n(S.paidNow);

    var dl = App.el('#nsdue');
    if (dl) {
      if (!S.items.length) { dl.className = 'due-line'; dl.innerHTML = ''; }
      else if (diff > 0.5) { dl.className = 'due-line owed'; dl.innerHTML = '<span>Balance due</span><span class="num">' + App.money(diff) + '</span>'; }
      else if (diff < -0.5) { dl.className = 'due-line change'; dl.innerHTML = '<span>' + (S.editId ? 'Refund due' : 'Give back change') + '</span><span class="num">' + App.money(-diff) + '</span>'; }
      else { dl.className = 'due-line clear'; dl.innerHTML = '<span>' + App.icon('checkCircle', 17) + 'Fully paid</span><span class="num">' + App.money(0) + '</span>'; }
    }
    var warn = App.el('#nswarn');
    if (warn) warn.hidden = !(diff > 0.5 && !S.customer);

    var btns = '<button type="button" class="btn btn-lg" data-save="print">' + App.icon('printer', 19) + '<span>Save &amp; print</span></button>' +
      '<button type="button" class="btn btn-ok btn-lg" data-save="bill">' + App.icon('check', 19) +
      '<span>' + (S.editId ? 'Save changes' : 'Save bill') + '</span></button>';
    var acts = App.el('#ns-actions'), bar = App.el('#ns-bar');
    if (acts) acts.innerHTML = btns;
    if (bar) bar.innerHTML =
      '<div class="bb-tot"><span class="l">Total</span><span class="v">' + App.money(calc.total) + '</span></div>' +
      '<div class="bb-due"><span class="l">Balance due</span><span class="v ' + (due > 0.5 ? 'owed' : 'clear') + '">' + App.money(due) + '</span></div>' +
      '<div class="bb-actions">' + btns + '</div>';
    [acts, bar].forEach(function (root) {
      if (root) App.els('[data-save]', root).forEach(function (b) {
        b.addEventListener('click', function () { save(this.getAttribute('data-save') === 'print'); });
      });
    });
  }

  function save(withPrint) {
    if (!S.items.length) {
      App.toast('Add a product first', 'err');
      var q = App.el('#nsq'); if (q) q.focus();
      return;
    }
    var calc = M.calcSale(S.items, S);
    var due = App.round2(calc.total - App.n(S.paidNow));
    if (due > 0.5 && !S.customer) {
      App.toast('Choose a customer to give credit, or take the full amount', 'err', 4500);
      var cq = App.el('#ncq'); if (cq) cq.focus();
      return;
    }

    if (S.editId) return saveEdit(withPrint, calc);

    function commit(allowNeg) {
      var d = {
        date: S.date,
        customerId: S.customer ? S.customer.id : '',
        customerName: billName(),
        customerMobile: String(S.customerMobile || '').trim() || (S.customer ? S.customer.mobile : ''),
        prescriptionId: (function () { var x = chosenRx(); return x && x.id && S.customer ? x.id : ''; })(),
        prescription: chosenRx(),
        items: S.items,
        billDiscount: S.billDiscount, billDiscountType: S.billDiscountType,
        taxEnabled: S.taxEnabled, taxInclusive: S.taxInclusive, taxPercent: S.taxPercent,
        roundOff: S.roundOff,
        paymentMethod: S.paymentMethod,
        payments: S.split,
        paidNow: S.paidNow,
        notes: S.notes,
        allowNegativeStock: allowNeg
      };
      try {
        var sale = M.saleCreate(d);
        S = null;
        UI.go('/sale/' + sale.id + '?new=1');
        if (withPrint) setTimeout(function () { App.printInvoice(sale.id); }, 400);
      } catch (e) {
        if (e.code === 'LOW_STOCK') {
          UI.confirm({
            title: 'Not enough stock',
            html: 'These items do not have enough stock:<br><br><b>' + App.esc(e.problems.join('<br>')).replace(/&lt;br&gt;/g, '<br>') +
                  '</b><br><br>Create the bill anyway? (stock will go negative)',
            okLabel: 'Yes, create the bill', danger: true
          }).then(function (ok) { if (ok) commit(true); });
        } else {
          App.toast(e.message, 'err', 4000);
        }
      }
    }
    commit(false);
  }

  /* the name this bill should print */
  function billName() {
    var typedName = String(S.customerName || '').trim();
    if (typedName) return typedName;
    return S.customer ? S.customer.name : 'Walk-in';
  }

  /* ---------------- saving a correction ---------------- */
  function editData(reason, allowNeg) {
    return {
      date: S.date,
      invoiceNo: String(S.invoiceNo || '').trim(),
      customerId: S.customer ? S.customer.id : '',
      customerName: billName(),
      customerMobile: String(S.customerMobile || '').trim(),
      prescriptionId: (function () { var x = chosenRx(); return x && x.id && S.customer ? x.id : ''; })(),
      prescription: chosenRx(),
      items: S.items,
      payments: S.paid || [],
      billDiscount: S.billDiscount, billDiscountType: S.billDiscountType,
      taxEnabled: S.taxEnabled, taxInclusive: S.taxInclusive, taxPercent: S.taxPercent,
      roundOff: S.roundOff,
      notes: S.notes,
      reason: reason,
      allowNegativeStock: allowNeg
    };
  }

  function saveEdit(withPrint, calc) {
    var sale = M.find('sales', S.editId);
    if (!sale) { App.toast('That bill was not found', 'err'); return; }
    var rxNow = chosenRx();
    var after = {
      items: calc.lines, total: calc.total, date: S.date,
      invoiceNo: String(S.invoiceNo || '').trim(), received: paidAllTotal(),
      customerMobile: String(S.customerMobile || '').trim(),
      customerName: billName(),
      billDiscountRaw: App.n(S.billDiscount), billDiscountType: S.billDiscountType,
      taxEnabled: S.taxEnabled, taxPercent: App.n(S.taxPercent), notes: S.notes,
      prescription: rxNow ? { code: rxNow.code || '', date: rxNow.date || '' } : null
    };
    var before = Object.assign({}, sale, { received: M.salePaid(sale.id) });
    var changes = M.saleChanges(before, after);
    if (!changes.length) { App.toast('Nothing has changed on this bill', 'warn', 3500); return; }

    var m = UI.modal({
      title: 'Save these changes?',
      size: 'narrow',
      body: '<div class="sm muted mb8">Invoice <b>' + App.esc(sale.invoiceNo) + '</b></div>' +
        '<ul class="chg-list">' + changes.map(function (c) { return '<li>' + App.esc(c) + '</li>'; }).join('') + '</ul>' +
        '<div class="f mt16"><label for="edrsn">Reason for the change (optional)</label>' +
          '<input id="edrsn" autocomplete="off" placeholder="e.g. wrong price entered"></div>' +
        '<div class="sm muted mt8">The invoice number stays the same and the version you are replacing is kept on the bill.</div>',
      buttons: [
        { label: 'Cancel', onClick: function (a) { a.close(); } },
        { label: 'Save changes', class: 'btn-primary', onClick: function (a) {
            var f = App.el('#edrsn', a.el);
            var reason = f ? f.value : '';
            a.close();
            commitEdit(reason, false, withPrint);
          } }
      ]
    });
    setTimeout(function () { var f = App.el('#edrsn', m.el); if (f) f.focus(); }, 80);
  }

  function commitEdit(reason, allowNeg, withPrint) {
    var id = S.editId;
    try {
      M.saleUpdate(id, editData(reason, allowNeg));
      S = null;
      UI.go('/sale/' + id + '?edited=1');
      if (withPrint) setTimeout(function () { App.printInvoice(id); }, 400);
    } catch (e) {
      if (e.code === 'NUMBER_TAKEN') {
        App.toast(e.message, 'err', 6000);
      } else if (e.code === 'LOW_STOCK') {
        UI.confirm({
          title: 'Not enough stock',
          html: 'These items do not have enough stock:<br><br><b>' + App.esc(e.problems.join('<br>')).replace(/&lt;br&gt;/g, '<br>') +
                '</b><br><br>Save the change anyway? (stock will go negative)',
          okLabel: 'Yes, save it', danger: true
        }).then(function (ok) { if (ok) commitEdit(reason, true, withPrint); });
      } else {
        App.toast(e.message, 'err', 4000);
      }
    }
  }

  /* choose, add or remove the prescription printed on a saved invoice */
  function invoiceRxDialog(s, d) {
    var rxs = d.c ? M.customerRx(d.c.id) : [];
    var body = '<p class="sm muted" style="margin:0 0 12px">Choose the prescription to print on invoice ' + App.esc(s.invoiceNo) + '.</p>' +
      (rxs.length
        ? '<div class="picklist" style="margin-top:0">' + rxs.map(function (rx, i) {
            return '<div class="pick" data-rx="' + App.esc(rx.id) + '"><div><div class="t">' + App.fmtDate(rx.date) +
              (i === 0 ? ' · latest' : '') + (rx.doctor ? ' · Dr. ' + App.esc(rx.doctor) : '') + '</div>' +
              '<div class="d">' + App.esc(rxLine(rx)) + '</div></div></div>';
          }).join('') + '</div>'
        : '<div class="empty" style="padding:20px"><div class="t">' +
            (d.c ? 'No prescriptions saved for ' + App.esc(d.c.name) + ' yet' : 'Walk-in bill — type the prescription for this invoice') +
          '</div></div>');
    var buttons = [];
    if (d.rx) buttons.push({ label: 'Remove from invoice', icon: 'x', class: 'btn-sm btn-ghost btn-left', onClick: function (a) {
      M.setSalePrescription(s.id, null); a.close(); App.toast('Prescription removed from the invoice'); UI.render();
    } });
    buttons.push({ spacer: true });
    buttons.push({ label: 'Cancel', onClick: function (a) { a.close(); } });
    buttons.push(d.c
      ? { label: 'New prescription', icon: 'plus', class: 'btn-primary', onClick: function (a) {
          a.close();
          App.rxForm(d.c.id, null, { onSaved: function (rec) { M.setSalePrescription(s.id, rec); } });
        } }
      : { label: d.rx ? 'Edit prescription' : 'Type prescription', icon: 'pencil', class: 'btn-primary', onClick: function (a) {
          a.close();
          App.rxForm('', null, { draft: d.rx || true, onData: function (data) {
            M.setSalePrescription(s.id, data);
            App.toast('Prescription added to the invoice', 'ok');
            UI.render();
          } });
        } });
    var m = UI.modal({ title: 'Eye prescription on the invoice', body: body, buttons: buttons });
    App.on(m.el, 'click', '[data-rx]', function () {
      M.setSalePrescription(s.id, M.find('prescriptions', this.getAttribute('data-rx')));
      m.close();
      App.toast('Prescription added to the invoice', 'ok');
      UI.render();
    });
  }

  /* ================= INVOICE — shown right after saving, and from the sales list ================= */
  function saleDetail(view, id, r) {
    var s = M.find('sales', id);
    if (!s) { view.innerHTML = '<div class="card card-pad">Invoice not found. <a href="#/sales">Back to sales</a></div>'; return; }
    var isNew = !!(r && r.query && r.query.new === '1');
    var justEdited = !!(r && r.query && r.query.edited === '1');
    var edits = Array.isArray(s.edits) ? s.edits : [];
    var d = App.Invoice.data(id);
    var pays = M.payments().filter(function (p) { return p.saleId === s.id; });
    var profit = M.saleProfit(s);
    var cancelled = s.status === 'cancelled';

    var html =
      '<div class="view-head">' +
        '<div class="flex aic gap12"><button class="btn btn-icon" data-go="' + (isNew ? '/dashboard' : '/sales') + '" aria-label="Back">' + App.icon('arrowLeft', 20) + '</button>' +
        '<div><h1>Invoice ' + App.esc(s.invoiceNo) + (edits.length ? ' <span class="pill p-info">Corrected</span>' : '') + '</h1>' +
        '<div class="sub">' + App.esc(d.name) + ' · ' + App.fmtDate(s.date) + '</div></div></div>' +
        '<div class="actions">' +
          (isNew ? '<button class="btn btn-primary" data-go="/sale/new?reset=1">' + App.icon('plus', 18) + '<span>New bill</span></button>' : '') +
        '</div></div>';

    if (isNew) {
      html += '<div class="banner ok">' + App.icon('checkCircle', 20) + '<div class="tx">Bill saved' +
        '<small>Send the invoice PDF to the customer on WhatsApp, print it, or start the next bill.</small></div></div>';
    }
    if (justEdited) {
      html += '<div class="banner ok">' + App.icon('checkCircle', 20) + '<div class="tx">Bill corrected' +
        '<small>The invoice number has not changed. Send or print it again so the customer has the corrected copy.</small></div></div>';
    }
    if (cancelled) {
      html += '<div class="banner danger">' + App.icon('alert', 20) + '<div class="tx">This bill was cancelled' +
        (s.cancelReason ? ' — ' + App.esc(s.cancelReason) : '') +
        '<small>The stock was added back and the payments on this bill were removed.</small></div></div>';
    }

    html += '<div class="iv-actions">' +
      (!cancelled ? '<button class="btn btn-wa btn-lg" id="ivwa">' + App.icon('send', 20) + '<span>Send on WhatsApp</span></button>' : '') +
      '<button class="btn btn-lg" id="ivprint">' + App.icon('printer', 20) + '<span>Print</span></button>' +
      '<button class="btn btn-lg" id="ivpdf">' + App.icon('file', 20) + '<span>Save PDF</span></button>' +
      '<button class="btn btn-lg" id="ivimg">' + App.icon('image', 20) + '<span>Save picture</span></button>' +
      (!cancelled ? '<button class="btn btn-lg" id="ivedit">' + App.icon('pencil', 20) + '<span>Edit bill</span></button>' : '') +
      '</div>';
    if (s.whatsappOpenedAt) {
      html += '<div class="iv-sent mb16">' + App.icon('check', 16) +
        '<span>Opened in WhatsApp for +' + App.esc(s.whatsappTo || '') + ' · ' + App.fmtDateTime(s.whatsappOpenedAt) + '</span></div>';
    } else if (!cancelled && !d.mobile) {
      html += '<div class="iv-sent mb16">' + App.icon('info', 16) + '<span>No mobile number on this bill — you will be asked for one.</span></div>';
    }

    html += '<div class="iv-wrap"><div class="iv-scroll">' + App.Invoice.html(id) + '</div><aside class="iv-side">';

    html += '<div class="card"><div class="card-head"><h3>Payment</h3></div><div class="card-body">' +
      '<div class="totals" style="max-width:none">' +
        '<div class="r"><span class="muted">Bill total</span><span class="num">' + App.money(s.total) + '</span></div>' +
        '<div class="r"><span class="muted">Paid</span><span class="num pos">' + App.money(d.paid) + '</span></div>' +
        (d.refund
          ? '<div class="r big due"><span>To be returned</span><span class="num">' + App.money(d.refund) + '</span></div>'
          : '<div class="r big' + (d.due > 0.5 ? ' due' : '') + '"><span>Balance due</span><span class="num">' + App.money(d.due) + '</span></div>') +
      '</div>' +
      (d.due > 0.5 && !cancelled ? '<button class="btn btn-ok btn-block mt16" id="sdpay">' + App.icon('wallet', 18) + '<span>Receive payment</span></button>' : '') +
      (pays.length
        ? '<div class="hr"></div>' + pays.map(function (p) {
            return '<div class="flex jcb aic gap12 sm" style="padding:6px 0"><span>' + App.fmtDate(p.date) + ' · ' + App.esc(p.method) + '</span>' +
              '<span class="b pos num">' + App.money(p.amount) + '</span></div>';
          }).join('')
        : '<div class="sm muted mt12">No payment received yet.</div>') +
      '</div></div>';

    html += '<div class="card"><div class="card-head"><h3>Eye prescription</h3></div><div class="card-body">' +
      (d.rx
        ? '<div class="sm muted">' + (d.rx.date ? App.fmtDate(d.rx.date) : 'Typed for this bill') + (d.rx.doctor ? ' · Dr. ' + App.esc(d.rx.doctor) : '') + '</div>' +
          '<div class="rxpick-line">' + App.esc(rxLine(d.rx)) + '</div>'
        : '<div class="sm muted">No prescription on this invoice.</div>') +
      (!cancelled ? '<button class="btn btn-block mt12" id="ivrx" type="button">' + App.icon('eye', 18) +
        '<span>' + (d.rx ? 'Change prescription' : 'Add prescription') + '</span></button>' : '') +
      '</div></div>';

    if (edits.length) {
      var versions = edits.map(function (e) { return e.before; })
        .concat([Object.assign({}, s, { received: M.salePaid(s.id) })]);
      html += '<div class="card"><div class="card-head"><h3>Changes to this bill</h3>' +
        '<span class="pill">' + edits.length + '</span></div><div class="card-body">';
      for (var vi = edits.length - 1; vi >= 0; vi--) {
        var lines = M.saleChanges(versions[vi], versions[vi + 1]);
        html += '<div class="edit-row' + (vi < edits.length - 1 ? ' bordered' : '') + '">' +
          '<div class="sm b">' + App.fmtDateTime(edits[vi].at) + '</div>' +
          (edits[vi].reason ? '<div class="sm">' + App.esc(edits[vi].reason) + '</div>' : '') +
          '<ul class="chg-list">' + (lines.length
            ? lines.map(function (c) { return '<li>' + App.esc(c) + '</li>'; }).join('')
            : '<li class="muted">No difference recorded</li>') + '</ul></div>';
      }
      html += '</div></div>';
    }

    html += '<div class="card"><div class="card-head"><h3>Details</h3></div><div class="card-body"><dl class="kv">' +
      '<dt>Customer</dt><dd>' + (d.c ? '<a href="#/customer/' + d.c.id + '">' + App.esc(d.c.name) + '</a>' : App.esc(d.name)) + '</dd>' +
      (s.imported === 'register'
        ? '<dt>Profit on this bill</dt><dd class="muted">Not known — the register has no cost prices</dd>' +
          '<dt>From the register</dt><dd class="mono sm">' + App.esc(s.registerText || '') + '</dd>' +
          (s.registerDates ? '<dt>Register dates</dt><dd class="sm">' + App.esc(s.registerDates) + ' <span class="muted">(this bill\'s date was matched by the app)</span></dd>' : '')
        : '<dt>Profit on this bill</dt><dd class="' + (profit >= 0 ? 'pos' : 'neg') + '">' + App.money(profit) + '</dd>') +
      '<dt>Bill created</dt><dd>' + App.fmtDateTime(s.createdAt) + '</dd>' +
      (s.editedAt ? '<dt>Last corrected</dt><dd>' + App.fmtDateTime(s.editedAt) + '</dd>' : '') +
      '</dl>' +
      (!cancelled ? '<div class="hr"></div><button class="btn btn-ghost btn-block" id="sdcancel" style="color:var(--danger)">' +
        App.icon('trash', 18) + '<span>Cancel this bill</span></button>' : '') +
      '</div></div>';

    html += '</aside></div>';
    view.innerHTML = html;

    var wa = App.el('#ivwa', view);
    if (wa) wa.addEventListener('click', function () { App.Invoice.sendWhatsApp(s.id, function () { UI.render(); }); });
    App.el('#ivprint', view).addEventListener('click', function () { App.printInvoice(s.id); });
    App.el('#ivpdf', view).addEventListener('click', function () { App.Invoice.savePDF(s.id); });
    App.el('#ivimg', view).addEventListener('click', function () { App.Invoice.saveImage(s.id); });
    var eb = App.el('#ivedit', view);
    if (eb) eb.addEventListener('click', function () { UI.go('/sale/new?edit=' + s.id); });
    var rxb = App.el('#ivrx', view);
    if (rxb) rxb.addEventListener('click', function () { invoiceRxDialog(s, d); });
    var pb = App.el('#sdpay', view);
    if (pb) pb.addEventListener('click', function () {
      App.paymentForm({ customerId: s.customerId, saleId: s.id, amount: d.due });
    });
    var cb = App.el('#sdcancel', view);
    if (cb) cb.addEventListener('click', function () {
      UI.confirmTyped({
        title: 'Cancel this bill?',
        word: 'CANCEL',
        html: 'Invoice <b>' + App.esc(s.invoiceNo) + '</b> (' + App.money(s.total) + ') will be cancelled.<br><br>' +
              '• All stock will be added back<br>• The ' + pays.length + ' payment(s) on this bill will be removed<br>' +
              '• The record stays in your history (nothing is deleted)',
        okLabel: 'Cancel the bill'
      }).then(function (ok) {
        if (!ok) return;
        M.saleCancel(s.id, 'Cancelled by user');
        App.toast('Bill cancelled');
        UI.render();
      });
    });
  }
})();


/* ===== 43b-pos.js ===== */
/* ============================================================================
   43b-pos.js — the POS cashier screen (route '/pos', the app's home).
   A fast, touch-first counter: tap product tiles to build a cart on the right,
   then Charge. Produces a normal sale via M.saleCreate, so inventory, GST,
   reports and backup all stay in sync. Search box doubles as a barcode field.
   ========================================================================== */
(function () {
  'use strict';
  var App = window.App, M = App.M, UI = App.UI;

  /* in-memory cart, kept across re-renders of the screen */
  var C = { lines: [], customer: null, q: '', cat: '' };

  function taxOpts() {
    var s = App.db.settings;
    return {
      taxEnabled: !!s.taxEnabled, taxInclusive: !!s.taxInclusive,
      taxPercent: App.n(s.taxPercentDefault), roundOff: true
    };
  }
  function calc() { return M.calcSale(C.lines, taxOpts()); }
  function count() { return C.lines.reduce(function (n, l) { return n + App.n(l.qty); }, 0); }

  /* ---------- cart operations ---------- */
  function keyOf(pid, vid) { return pid + '::' + (vid || ''); }

  function addLine(p, v) {
    var vid = v ? v.id : '';
    var line = C.lines.filter(function (l) { return keyOf(l.productId, l.variantId) === keyOf(p.id, vid); })[0];
    if (line) { line.qty = App.round2(App.n(line.qty) + 1); }
    else {
      C.lines.push({
        productId: p.id, variantId: vid,
        variantLabel: (v && p.variants && p.variants.length > 1) ? M.variantLabel(v) : '',
        name: p.name, rate: App.n(p.sellPrice), qty: 1, img: App.safeImg(p.image) || ''
      });
    }
    drawCart();
    flashTotal();
  }

  function addProduct(p) {
    var vs = (p.variants || []).filter(function (v) { return true; });
    if (vs.length > 1) { pickVariant(p, vs); return; }
    addLine(p, vs[0] || null);
  }

  function pickVariant(p, vs) {
    UI.modal({
      title: p.name, size: 'narrow',
      body: '<div class="pos-vpick">' + vs.map(function (v) {
        var st = App.n(v.stock);
        return '<button type="button" class="pos-vbtn' + (st <= 0 ? ' out' : '') + '" data-v="' + v.id + '">' +
          '<span>' + App.esc(M.variantLabel(v) || 'Standard') + '</span>' +
          '<span class="dim">' + (st <= 0 ? 'Out of stock' : st + ' in stock') + '</span></button>';
      }).join('') + '</div>',
      footer: false
    });
    var back = App.el('.modal-bg:last-child') || document.querySelector('.modal-bg');
    App.on(back, 'click', '[data-v]', function () {
      var v = M.productVariant(p, this.getAttribute('data-v'));
      if (v) addLine(p, v);
      var close = back.querySelector('[data-close]'); if (close) close.click();
    });
  }

  function setQty(i, qty) {
    qty = App.round2(qty);
    if (qty <= 0) C.lines.splice(i, 1); else C.lines[i].qty = qty;
    drawCart();
  }
  function clearCart() { C.lines = []; C.customer = null; drawCart(); }

  /* ---------- the screen ---------- */
  UI.route('pos', function (view) {
    C.q = ''; /* fresh search each visit, keep the cart */
    view.innerHTML =
      '<div class="pos-wrap">' +
        '<section class="pos-left">' +
          '<div class="pos-search"><span class="si">' + App.icon('search', 18) + '</span>' +
            '<input id="posq" type="search" autocomplete="off" enterkeyhint="done" placeholder="Search or scan a product…">' +
            '<button class="btn btn-sm" id="posnewp" title="Add a product">' + App.icon('plus', 16) + '</button>' +
          '</div>' +
          '<div class="pos-cats" id="poscats"></div>' +
          '<div class="pos-grid" id="posgrid"></div>' +
        '</section>' +
        '<aside class="pos-right" id="poscart"></aside>' +
      '</div>' +
      /* mobile floating bar */
      '<button class="pos-fab" id="posfab" hidden></button>';

    var q = App.el('#posq', view);
    q.addEventListener('input', App.debounce(function () { C.q = q.value; drawGrid(); }, 120));
    q.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var hit = barcodeHit(q.value) || soleHit(q.value);
      if (hit) { addProduct(hit); q.value = ''; C.q = ''; drawGrid(); }
    });
    App.el('#posnewp', view).addEventListener('click', function () {
      App.productForm(null, function () { drawGrid(); });
    });
    App.el('#posfab', view).addEventListener('click', openCartSheet);

    drawCats(); drawGrid(); drawCart();
  });

  function barcodeHit(text) {
    text = String(text || '').trim(); if (!text) return null;
    return M.products().filter(function (p) {
      if (p.barcode && p.barcode === text) return true;
      return (p.variants || []).some(function (v) { return v.barcode && v.barcode === text; });
    })[0] || null;
  }
  function soleHit(text) {
    var list = filtered(text, '');
    return list.length === 1 ? list[0] : null;
  }

  function filtered(q, cat) {
    var list = M.products();
    if (cat) list = list.filter(function (p) { return p.category === cat; });
    var nq = App.norm(String(q || ''));
    if (nq) list = list.filter(function (p) { return App.norm(p.name + ' ' + (p.sku || '') + ' ' + (p.category || '')).indexOf(nq) >= 0; });
    return list.sort(function (a, b) { return App.norm(a.name) > App.norm(b.name) ? 1 : -1; });
  }

  function drawCats() {
    var box = App.el('#poscats'); if (!box) return;
    var cats = M.CATEGORIES.filter(function (c) { return M.products().some(function (p) { return p.category === c; }); });
    box.innerHTML = '<button class="chip ' + (C.cat ? '' : 'on') + '" data-c="">All</button>' +
      cats.map(function (c) { return '<button class="chip ' + (C.cat === c ? 'on' : '') + '" data-c="' + App.esc(c) + '">' + App.esc(c) + '</button>'; }).join('');
    App.on(box, 'click', '[data-c]', function () { C.cat = this.getAttribute('data-c'); drawCats(); drawGrid(); });
  }

  function drawGrid() {
    var grid = App.el('#posgrid'); if (!grid) return;
    var list = filtered(C.q, C.cat);
    if (!M.products().length) {
      grid.innerHTML = UI.empty('box', 'No products yet', 'Tap + to add the items you sell', '+ Add product', 'posadd');
      App.on(grid, 'click', '[data-act="posadd"]', function () { App.productForm(null, function () { drawGrid(); }); });
      return;
    }
    if (!list.length) { grid.innerHTML = '<div class="pos-none">No products match “' + App.esc(C.q || C.cat) + '”.</div>'; return; }
    grid.innerHTML = list.map(function (p) {
      var st = M.productStock(p), out = st <= 0;
      var img = App.safeImg(p.image);
      return '<button type="button" class="pos-tile' + (out ? ' out' : '') + '" data-p="' + p.id + '">' +
        '<span class="pos-tile-img">' + (img ? '<img src="' + App.esc(img) + '" alt="">' : App.icon('box', 22)) + '</span>' +
        '<span class="pos-tile-name">' + App.esc(p.name) + '</span>' +
        '<span class="pos-tile-foot"><span class="pos-tile-price">' + App.money0(p.sellPrice) + '</span>' +
          '<span class="pos-tile-stock' + (out ? ' out' : '') + '">' + (out ? 'Out' : st) + '</span></span>' +
      '</button>';
    }).join('');
    App.on(grid, 'click', '[data-p]', function () {
      var p = M.find('products', this.getAttribute('data-p')); if (p) addProduct(p);
    });
  }

  function drawCart() {
    var box = App.el('#poscart');
    var fab = App.el('#posfab');
    if (!box) return;
    var c = calc();
    var hasItems = C.lines.length > 0;

    var rows = C.lines.map(function (l, i) {
      return '<div class="pos-line">' +
        '<div class="pos-line-main"><div class="pos-line-name">' + App.esc(l.name) +
          (l.variantLabel ? ' <span class="dim">· ' + App.esc(l.variantLabel) + '</span>' : '') + '</div>' +
          '<div class="pos-line-rate">' + App.money(l.rate) + ' each</div></div>' +
        '<div class="pos-qty"><button type="button" data-dec="' + i + '">−</button>' +
          '<span>' + App.n(l.qty) + '</span>' +
          '<button type="button" data-inc="' + i + '">+</button></div>' +
        '<div class="pos-line-amt">' + App.money(App.round2(l.qty * l.rate)) + '</div>' +
      '</div>';
    }).join('');

    box.innerHTML =
      '<div class="pos-cart-head">' +
        '<button type="button" class="pos-cust" id="poscust">' + App.icon('user', 18) +
          '<span>' + (C.customer ? App.esc(C.customer.name) : 'Walk-in customer') + '</span></button>' +
        (hasItems ? '<button type="button" class="pos-clear" id="posclear">' + App.icon('trash', 16) + ' Clear</button>' : '') +
      '</div>' +
      '<div class="pos-lines">' + (hasItems ? rows : '<div class="pos-empty">' + App.icon('receipt', 30) + '<div>Tap a product to start a bill</div></div>') + '</div>' +
      '<div class="pos-foot">' +
        (c.taxAmount ? '<div class="pos-foot-r"><span>Tax (' + App.n(c.taxPercent) + '%)</span><span>' + App.money(c.taxAmount) + '</span></div>' : '') +
        '<button type="button" class="pos-charge" id="poscharge"' + (hasItems ? '' : ' disabled') + '>' +
          '<span class="pos-charge-l">Charge</span><span class="pos-charge-t">' + App.money(c.total) + '</span></button>' +
      '</div>';

    App.on(box, 'click', '[data-inc]', function () { setQty(+this.getAttribute('data-inc'), App.n(C.lines[+this.getAttribute('data-inc')].qty) + 1); });
    App.on(box, 'click', '[data-dec]', function () { var i = +this.getAttribute('data-dec'); setQty(i, App.n(C.lines[i].qty) - 1); });
    var clr = App.el('#posclear', box); if (clr) clr.addEventListener('click', clearCart);
    App.el('#poscust', box).addEventListener('click', pickCustomer);
    var ch = App.el('#poscharge', box); if (ch) ch.addEventListener('click', charge);

    if (fab) {
      if (hasItems) { fab.hidden = false; fab.innerHTML = '<span>' + count() + ' item' + (count() === 1 ? '' : 's') + '</span><span>' + App.money(c.total) + ' · View cart</span>'; }
      else fab.hidden = true;
    }
  }

  function flashTotal() {
    var el = App.el('.pos-charge-t'); if (!el) return;
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }

  /* ---------- customer ---------- */
  function pickCustomer() {
    var inputId = 'poscq';
    var m = UI.modal({
      title: 'Customer for this bill', size: 'wide',
      body: '<input id="' + inputId + '" placeholder="Search name or mobile…" autocomplete="off" ' +
        'style="width:100%;height:46px;border-radius:11px;border:1px solid var(--border);background:var(--surface);padding:0 14px;color:var(--text)">' +
        '<div id="poscres" class="pos-cres"></div>',
      buttons: [
        { label: C.customer ? 'Remove customer' : 'Walk-in', onClick: function (a) { C.customer = null; a.close(); drawCart(); } },
        { label: '+ New customer', class: 'btn-primary', onClick: function (a) { a.close(); App.customerForm(null, function (c) { if (c) { C.customer = c; drawCart(); } }); } }
      ]
    });
    var inp = App.el('#' + inputId, m.el), res = App.el('#poscres', m.el);
    function draw() {
      var txt = inp.value.trim();
      if (!txt) { res.innerHTML = ''; return; }
      var nq = App.norm(txt);
      var list = M.customers().filter(function (c) { return App.norm(c.name + ' ' + c.mobile).indexOf(nq) >= 0; }).slice(0, 6);
      res.innerHTML = list.map(function (c) {
        return '<button type="button" class="pos-cres-row" data-id="' + c.id + '"><b>' + App.esc(c.name) + '</b>' +
          '<span class="dim">' + App.esc(c.mobile || c.code) + '</span></button>';
      }).join('') || '<div class="dim sm" style="padding:10px">No match</div>';
    }
    inp.addEventListener('input', App.debounce(draw, 120));
    App.on(res, 'click', '[data-id]', function () { C.customer = M.find('customers', this.getAttribute('data-id')); m.close(); drawCart(); });
    setTimeout(function () { inp.focus(); }, 60);
  }

  function openCartSheet() {
    /* on mobile the cart is a slide-up sheet reusing the same markup */
