/* ===== 48-backup.js ===== */
/* =========================================================================
   48-backup.js — JSON backup, automatic daily backup, restore, trash
   The whole point of this file: your data must survive a dead tablet.
   ========================================================================= */
(function () {
  'use strict';
  var UI = App.UI, M = App.M;
  var B = {};
  App.Backup = B;

  var VAULT = 'backup_vault';       /* older versions kept every in-app copy in this one list */
  var VAULT_INDEX = 'backup_vault_index'; /* the list of copies; each copy has its own slot */
  function copyKey(id) { return 'bk_' + id; }
  function meta(x) { return { id: x.id, date: x.date, at: x.at, size: x.size, auto: !!x.auto, tag: x.tag || '' }; }
  var LASTAUTO = 'last_auto_backup';/* 'YYYY-MM-DD' (kept for older versions) */
  var LASTAUTO_AT = 'last_auto_backup_at'; /* exact time of the last automatic backup */

  /* ------------------------------------------------------------------
     Backup timing, chosen in Settings
     ------------------------------------------------------------------ */
  var EVERY = {
    hour1:  { label: 'Every hour',    hours: 1 },
    hour2:  { label: 'Every 2 hours', hours: 2 },
    hour4:  { label: 'Every 4 hours', hours: 4 },
    hour12: { label: 'Twice a day',   hours: 12 },
    day:    { label: 'Once a day',    hours: 24 },
    week:   { label: 'Once a week',   hours: 168 }
  };
  B.EVERY = EVERY;
  B.DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  function everyOf(st) { return EVERY[st.backupEvery] ? st.backupEvery : 'day'; }
  function timeOf(st) {
    var m = /^(\d{1,2}):(\d{2})/.exec(String(st.backupTime || ''));
    return { h: m ? Math.min(23, +m[1]) : 20, m: m ? Math.min(59, +m[2]) : 0 };
  }

  /* the latest moment a backup was due, at or before `now` */
  B.lastSlot = function (now, st) {
    st = st || App.db.settings;
    var every = everyOf(st), t = timeOf(st);
    var at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), t.h, t.m, 0, 0);
    if (every === 'week') {
      var day = Math.max(0, Math.min(6, Math.round(App.n(st.backupDay))));
      at.setDate(at.getDate() - ((at.getDay() - day + 7) % 7));
      if (at > now) at.setDate(at.getDate() - 7);
      return at;
    }
    var step = EVERY[every].hours * 3600000;
    return new Date(at.getTime() + Math.floor((now - at) / step) * step);
  };

  /* the next time a backup is due after `now` */
  B.nextSlot = function (now, st) {
    st = st || App.db.settings;
    var last = B.lastSlot(now, st);
    if (everyOf(st) === 'week') { var n = new Date(last.getTime()); n.setDate(n.getDate() + 7); return n; }
    return new Date(last.getTime() + EVERY[everyOf(st)].hours * 3600000);
  };

  B.scheduleText = function (st) {
    st = st || App.db.settings;
    var every = everyOf(st), t = timeOf(st);
    var clock = App.clock(t.h, t.m);
    if (every === 'day') return 'Once a day at ' + clock;
    if (every === 'week') return 'Every ' + B.DAYS[Math.max(0, Math.min(6, Math.round(App.n(st.backupDay))))] + ' at ' + clock;
    if (every === 'hour12') return 'Twice a day, at ' + clock + ' and ' + App.clock((t.h + 12) % 24, t.m);
    return EVERY[every].label + ', counting from ' + clock;
  };

  /* when the last automatic backup happened (null if never) */
  B.lastAutoAt = function () {
    return App.store.kvGet(LASTAUTO_AT).then(function (iso) {
      if (iso) return new Date(iso);
      return App.store.kvGet(LASTAUTO).then(function (d) {
        if (!d) return null;
        var x = new Date(d + 'T00:00:00');                  /* older versions kept only the date */
        x.dateOnly = true;
        return x;
      });
    }).catch(function () { return null; });
  };
  var DIRHANDLE = 'backup_dir';     /* File System Access handle, where supported */

  /* ------------------------------------------------------------------
     Build the backup object. Flat + versioned, exactly as documented.
     ------------------------------------------------------------------ */
  B.build = function () {
    var d = App.db;
    return {
      backupVersion: d.schemaVersion,
      backupDate: App.today(),
      generatedAt: App.nowISO(),
      appVersion: App.APP_VERSION,
      appName: 'Adminuscurator',
      shopName: d.settings.shopName,
      counts: {
        customers: M.live(d.customers).length,
        prescriptions: M.live(d.prescriptions).length,
        products: M.live(d.products).length,
        suppliers: M.live(d.suppliers).length,
        sales: M.live(d.sales).length,
        payments: M.live(d.payments).length,
        purchases: M.live(d.purchases).length,
        expenses: M.live(d.expenses).length,
        stockMoves: d.stockMoves.length
      },
      createdAt: d.createdAt,
      updatedAt: d.updatedAt,
      settings: d.settings,
      counters: d.counters,
      customers: d.customers,
      prescriptions: d.prescriptions,
      suppliers: d.suppliers,
      products: d.products,
      sales: d.sales,
      payments: d.payments,
      purchases: d.purchases,
      expenses: d.expenses,
      stockMoves: d.stockMoves,
      trash: d.trash,
      backupsIndex: d.backupsIndex
    };
  };

  /* Every part of the data, including any part added in a later version — nothing is left out
     just because this list was not updated. */
  var buildNamed = B.build;
  B.build = function () {
    var out = buildNamed();
    Object.keys(App.db).forEach(function (k) {
      if (!(k in out) && k !== 'emptiedAt') out[k] = App.db[k];
    });
    return out;
  };

  /* what a backup holds, counted from the data itself (for the screen) */
  B.contents = function (d) {
    d = d || App.db;
    var live = function (k) { return (d[k] || []).filter(function (x) { return !x.deletedAt; }); };
    var sales = live('sales');
    var s = d.settings || {};
    return [
      ['Customers', live('customers').length, 'with addresses, phone numbers and notes'],
      ['Bills', sales.length, sales.filter(function (x) { return x.edits && x.edits.length; }).length + ' corrected (with their history), ' +
        sales.filter(function (x) { return x.status === 'cancelled'; }).length + ' cancelled'],
      ['Payments', live('payments').length, 'including split payments'],
      ['Products', live('products').length, (function () {
        var n = live('products').filter(function (p) { return p.image; }).length;
        return 'with stock, prices and ' + n + ' photo' + (n === 1 ? '' : 's');
      })()],
      ['Stock records', (d.stockMoves || []).length, 'every stock in and out'],
      ['Suppliers', live('suppliers').length, ''],
      ['Purchases', live('purchases').length, ''],
      ['Expenses', live('expenses').length, ''],
      ['Trash', (d.trash || []).length, 'deleted items you can still restore'],
      ['Settings', '✓', [s.logo ? 'logo' : '', 'shop details', 'bill numbering', 'GST', 'shop header colours',
        'WhatsApp message', 'backup timing'].filter(Boolean).join(', ')]
    ];
  };

  /* readable layout for small shops; a large shop's file stays compact (same data, a third smaller) */
  B.json = function () {
    var b = B.build(), compact = JSON.stringify(b);
    return compact.length > 4 * 1048576 ? compact : JSON.stringify(b, null, 2);
  };
  /* in-app copies skip the indentation — about a third smaller, same data */
  B.compact = function () { return JSON.stringify(B.build()); };

  B.filename = function (tag) {
    return 'backup_' + App.today() + (tag ? '_' + tag : '') + '.json';
  };

  /* ------------------------------------------------------------------
     Vault — automatic copies kept inside the app
     ------------------------------------------------------------------ */
  /* One-time move from the old single list: each copy into its own slot, so listing the backups
     or adding one never has to load every copy into memory at once. */
  var vaultReady = null;
  function vaultInit() {
    if (vaultReady) return vaultReady;
    vaultReady = App.store.kvGet(VAULT_INDEX).then(function (idx) {
      if (Array.isArray(idx)) return idx;
      return App.store.kvGet(VAULT).then(function (old) {
        old = Array.isArray(old) ? old : [];
        var index = old.map(meta);
        return old.reduce(function (chain, x) {
          return chain.then(function () { return App.store.kvPut(copyKey(x.id), x.json); });
        }, Promise.resolve())
          .then(function () { return App.store.kvPut(VAULT_INDEX, index); })
          .then(function () { return old.length ? App.store.kvDel(VAULT) : null; })
          .then(function () { return index; });
      });
    }).catch(function (e) { vaultReady = null; throw e; });
    return vaultReady;
  }

  /* the list of copies (date, size, type) — without the copies themselves */
  B.getVault = function () {
    return vaultInit().then(function () { return App.store.kvGet(VAULT_INDEX); })
      .then(function (v) { return Array.isArray(v) ? v : []; });
  };

  /* one copy's backup text */
  B.vaultCopy = function (id) { return App.store.kvGet(copyKey(id)); };

  B.addToVault = function (auto, tag) {
    var json = B.compact();
    var entry = { id: App.uid('bk'), date: App.today(), at: App.nowISO(), size: json.length, auto: !!auto, tag: tag || '' };
    return B.getVault().then(function (v) {
      var drop = [];
      /* one automatic backup per day; manual snapshots always kept */
      if (auto) v = v.filter(function (x) { if (x.auto && x.date === entry.date) { drop.push(x.id); return false; } return true; });
      v.unshift(entry);
      var keep = Math.max(3, App.n(App.db.settings.keepBackups) || 10);
      v.slice(keep).forEach(function (x) { drop.push(x.id); });
      v = v.slice(0, keep);
      /* the copy first, then the list, then clearing old copies — a stop half-way loses nothing */
      return App.store.kvPut(copyKey(entry.id), json)
        .then(function () { return App.store.kvPut(VAULT_INDEX, v); })
        .then(function () { return Promise.all(drop.map(function (id) { return App.store.kvDel(copyKey(id)); })); })
        .then(function () {
          App.db.backupsIndex = v.map(meta);
          App.store.touch();
          return entry;
        });
    });
  };

  B.deleteFromVault = function (id) {
    return B.getVault().then(function (v) {
      v = v.filter(function (x) { return x.id !== id; });
      return App.store.kvPut(VAULT_INDEX, v)
        .then(function () { return App.store.kvDel(copyKey(id)); })
        .then(function () {
          App.db.backupsIndex = v.map(meta);
          App.store.touch();
        });
    });
  };

  /* ------------------------------------------------------------------
     Folder auto-save (Chrome/Edge desktop). Silently skipped elsewhere.
     ------------------------------------------------------------------ */
  B.canPickFolder = function () { return typeof window.showDirectoryPicker === 'function'; };

  B.chooseFolder = function () {
    if (!B.canPickFolder()) return Promise.reject(new Error('This browser does not support choosing a folder'));
    return window.showDirectoryPicker({ mode: 'readwrite', startIn: 'documents' }).then(function (h) {
      return App.store.kvPut(DIRHANDLE, h).then(function () { return h; });
    });
  };

  B.getFolder = function () {
    if (!B.canPickFolder()) return Promise.resolve(null);
    return App.store.kvGet(DIRHANDLE).then(function (h) {
      if (!h) return null;
      if (!h.queryPermission) return null;
      return h.queryPermission({ mode: 'readwrite' }).then(function (p) {
        if (p === 'granted') return h;
        return null;
      }).catch(function () { return null; });
    }).catch(function () { return null; });
  };

  B.writeToFolder = function (handle, name, text) {
    return handle.getFileHandle(name, { create: true }).then(function (fh) {
      return fh.createWritable();
    }).then(function (w) {
      return w.write(text).then(function () { return w.close(); });
    });
  };

  /* ------------------------------------------------------------------
     Automatic backup — runs whenever the chosen time has come.
     force = true backs up now, whatever the schedule says.
     ------------------------------------------------------------------ */
  var dailyBusy = false;
  B.runDaily = function (force) {
    if (dailyBusy || !App.db || (!App.db.settings.autoBackup && !force)) return Promise.resolve(null);
    dailyBusy = true;
    return B.lastAutoAt().then(function (last) {
      var now = new Date();
      var due = force || !last || last < B.lastSlot(now) ||
                last.getTime() > now.getTime() + 5 * 60000;      /* the clock was set back */
      if (!due) return null;
      return B.addToVault(true).then(function (entry) {
        return App.store.kvPut(LASTAUTO_AT, now.toISOString()).then(function () {
          return App.store.kvPut(LASTAUTO, App.today());
        }).then(function () {
          var pretty = B.json();            /* the file people keep stays human-readable */
          var nat = App.native();
          if (nat) {
            var r;
            try { r = nat.saveFile(B.filename(), pretty); } catch (e) { r = ''; }
            if (r && r.indexOf('OK') === 0) {
              /* delete older automatic files so Downloads cannot fill the tablet */
              if (typeof nat.pruneBackups === 'function') {
                try { nat.pruneBackups(Math.max(3, Math.round(App.n(App.db.settings.keepBackupFiles)) || 14)); } catch (e) {}
              }
              return App.store.kvPut('last_file_backup', App.today())
                .then(function () { return { entry: entry, wroteFile: true, where: 'Downloads' }; });
            }
            return { entry: entry, wroteFile: false };
          }
          return B.getFolder().then(function (h) {
            if (!h) return { entry: entry, wroteFile: false };
            return B.writeToFolder(h, B.filename(), pretty)
              .then(function () { return App.store.kvPut('last_file_backup', App.today()); })
              .then(function () { return { entry: entry, wroteFile: true, where: 'your folder' }; })
              .catch(function () { return { entry: entry, wroteFile: false }; });
          });
        });
      });
    }).then(function (res) { dailyBusy = false; return res; },
            function () { dailyBusy = false; return null; });
  };

  /* Called at start, whenever the app comes back on screen, and every minute while it is
     open — so a backup that fell due while the tablet was off runs as soon as it is opened. */
  B.autoTick = function () {
    return B.runDaily().then(function (res) {
      if (res && res.entry) {
        App.toast(res.wroteFile ? 'Automatic backup saved to ' + res.where : 'Automatic backup created', 'ok', 3000);
      }
      return res;
    });
  };

  /* banner shown on the dashboard until today's backup is saved out */
  B.renderBanner = function (el) {
    if (!el) return;
    el.innerHTML = '<div data-b="space"></div><div data-b="backup"></div>';
    var spaceEl = el.querySelector('[data-b="space"]'), backupEl = el.querySelector('[data-b="backup"]');

    /* warn well before the tablet is full, not after a save has already failed */
    if (navigator.storage && navigator.storage.estimate && App.store.driver === 'idb') {
      navigator.storage.estimate().then(function (est) {
        if (!est || !est.quota || est.usage / est.quota < 0.85) return;
        spaceEl.innerHTML = '<div class="banner danger">' + App.icon('alert', 20) +
          '<div class="tx">This tablet is almost out of space for the app' +
          '<small>Saving may soon stop working. Delete old photos, videos or unused apps, and keep your backup files on Google Drive.</small></div></div>';
      }).catch(function () {});
    }

    App.store.kvGet('last_file_backup').then(function (lastFile) {
      var days = lastFile ? App.daysBetween(lastFile, App.today()) : 999;
      if (days < 1) return;
      var msg = lastFile
        ? 'Your last backup file was saved ' + days + ' day' + (days === 1 ? '' : 's') + ' ago (' + lastFile + ')'
        : 'You have not saved a backup file yet';
      backupEl.innerHTML = '<div class="banner ' + (days > 3 ? 'danger' : 'warn') + '">' + App.icon('shield', 20) +
        '<div class="tx">' + App.esc(msg) +
        '<small>If the tablet breaks, only a saved file can bring your data back. One tap saves it.</small></div>' +
        '<button class="btn btn-sm btn-primary" id="bkNow">Save a backup now</button>' +
        '<button class="btn btn-sm" data-go="/backup">Backup screen</button></div>';
      var btn = App.el('#bkNow', backupEl);
      if (btn) btn.addEventListener('click', function () { B.exportNow(); });
    });
  };

  /* ------------------------------------------------------------------
     Export
     ------------------------------------------------------------------ */
  B.exportNow = function (tag) {
    var json = B.json();
    App.download(B.filename(tag), json);
    App.store.kvPut('last_file_backup', App.today());
    B.addToVault(false, tag || 'manual');
    App.toast('Backup file downloaded', 'ok', 3200);
    return json;
  };

  /* ------------------------------------------------------------------
     Import / Restore
     ------------------------------------------------------------------ */
  B.validate = function (text) {
    var data;
    try { data = JSON.parse(text); }
    catch (e) { throw new Error('This file could not be read — the JSON is damaged. Your existing data is untouched.'); }
    if (!data || typeof data !== 'object' || Array.isArray(data))
      throw new Error('This does not look like a backup file.');

    /* accept flat exports and any {data:{...}} wrapper */
    if (data.data && typeof data.data === 'object' && !data.customers) data = data.data;

    var known = ['customers','products','sales','payments','expenses','prescriptions','suppliers','purchases'];
    var hasAny = known.some(function (k) { return Array.isArray(data[k]); });
    if (!hasAny) throw new Error('No shop data was found in this file (no customers, products or sales).');

    var v = App.n(data.backupVersion || data.schemaVersion) || 1;
    if (v > App.SCHEMA_VERSION)
      throw new Error('This backup is from a newer version (' + v + '). Please update the software first, then restore.');

    data.schemaVersion = v;
    return data;
  };

  B.previewOf = function (data) {
    function n(k) { return Array.isArray(data[k]) ? data[k].filter(function (x) { return !x.deletedAt; }).length : 0; }
    return {
      customers: n('customers'), prescriptions: n('prescriptions'), products: n('products'),
      suppliers: n('suppliers'), sales: n('sales'), payments: n('payments'),
      purchases: n('purchases'), expenses: n('expenses'),
      date: data.backupDate || (data.generatedAt || '').slice(0, 10) || '—',
      shop: (data.settings && data.settings.shopName) || data.shopName || '—',
      version: data.backupVersion || data.schemaVersion || 1,
      appVersion: data.appVersion || '—'
    };
  };

  B.restore = function (data) {
    /* safety net: current state is snapshotted before it is replaced */
    return B.addToVault(false, 'pre-restore').then(function () {
      return App.store.replace(data);
    });
  };

  /* ------------------------------------------------------------------
     SCREEN
     ------------------------------------------------------------------ */
  UI.route('backup', function (view, r) {
    var tab = r.query.tab || 'backup';

    var html =
      '<div class="view-head"><div><h1>Backup & Restore</h1>' +
      '<div class="sub">All your data lives on this device only — saving a file is what actually protects it</div></div></div>';

    html += '<div class="card mb16"><div class="tabs">' +
      '<button class="tab ' + (tab === 'backup' ? 'on' : '') + '" data-tab="backup">Take backup</button>' +
      '<button class="tab ' + (tab === 'restore' ? 'on' : '') + '" data-tab="restore">Restore</button>' +
      '<button class="tab ' + (tab === 'history' ? 'on' : '') + '" data-tab="history">Backup history</button>' +
      '<button class="tab ' + (tab === 'trash' ? 'on' : '') + '" data-tab="trash">Trash</button>' +
      '</div><div id="bktab"></div></div>';

    view.innerHTML = html;
    App.on(view, 'click', '[data-tab]', function () {
      UI.go('/backup?tab=' + this.getAttribute('data-tab'));
    });

    var el = App.el('#bktab', view);
    if (tab === 'backup') drawBackup(el);
    else if (tab === 'restore') drawRestore(el);
    else if (tab === 'history') drawHistory(el);
    else drawTrash(el);
  });

        '<small>' + (pr.level === 'danger'

          : pr.level === 'warn'

        '</small></div></div>';
    }

    el.innerHTML =
      '<div class="card-body">' +
        pressureBanner +
        '<div class="grid g4 mb16">' +
          cnt('Customers', M.customers().length) +
          cnt('Products', M.products().length) +
          cnt('Invoices', M.sales().length) +
          cnt('Payments', M.payments().length) +

          cnt('Purchases', M.purchases().length) +

        '</div>' +

        '<div class="banner ok mb8">' + App.icon('shield', 20) + '<div class="tx">The backup file holds everything in the app' +
        '<small>One file rebuilds the whole shop on this or any other tablet. Here is what goes into it right now:</small></div></div>' +

        '<div class="grid g2 mb16">' +

          '<button class="btn btn-lg" id="bkcopy">' + App.icon('clipboard', 18) + ' Copy backup text</button>' +
        '</div>' +
        '<div class="sm muted mb16">If the download does not work on your device, use <b>Copy backup text</b> ' +

        '<div class="sm muted mb16">' + (d.settings.autoBackup ? '<b>' + App.esc(B.scheduleText()) + '</b>. ' : '') +
        'Change the timing in <a href="#/settings">Settings</a>. ' +
        'The last ' + App.n(d.settings.keepBackups) + ' days of backups are kept inside the app — see the "Backup history" tab.</div>' +

        (App.native()
          ? '<div class="banner ok mb16">' + App.icon('checkCircle', 20) + '<div class="tx">Daily file backup is automatic on this device' +
            '<small>At each backup time the app writes <b>backup_YYYY-MM-DD.json</b> into your <b>Downloads</b> folder by itself (one file per day, updated by later backups that day). ' +
            'Copy that file to Google Drive or a pen drive once a week and your shop is safe.</small></div></div>'
          : B.canPickFolder()
          ? '<div class="card card-pad mb16" style="background:var(--surface-2)">' +
            '<div class="b mb8">' + App.icon('folder', 18) + ' Save to a folder automatically (recommended)</div>' +
            '<div class="sm muted mb12">Choose a folder once (Documents, Downloads or a pen drive) and the daily backup file will be written there automatically, with nothing to tap.</div>' +
            '<div id="bkfolder"></div></div>'
          : '<div class="banner mb16">' + App.icon('info', 20) + '<div class="tx">Automatic folder saving is not available in this browser' +
            '<small>So every day or two, tap "Download backup file" above to save a copy. It goes to your Downloads folder, and from there you can move it to a pen drive or send it to yourself.</small></div></div>') +

        '<div class="hr"></div>' +
        '<div class="banner danger">' + App.icon('alert', 20) + '<div class="tx">One important thing' +
        '<small>Do not keep the backup file only on this tablet. Once a week, copy it to a pen drive, laptop or email it to yourself. If the tablet is lost or breaks, that file is the only thing that can bring your data back.</small></div></div>' +
      '</div>';

    App.el('#bkexport', el).addEventListener('click', function () { B.exportNow(); UI.render(); });
    App.el('#bkcopy', el).addEventListener('click', function () {

        App.store.kvPut('last_file_backup', App.today());
        B.addToVault(false, 'copied');
        App.toast('Backup copied — now paste it somewhere safe', 'ok', 4000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).then(done).catch(function () { manual(json); });
      } else { manual(json); }

      function manual(text) {
        /* clipboard blocked (common on file:// pages) — show it for manual copy */
        var m = UI.modal({
          title: 'Copy this text',
          size: 'wide',
          body: '<div class="sm muted mb12">Tap inside, select all, and copy. Paste it into Google Keep, ' +

        });
        var ta = App.el('#bkta', m.el);
        ta.value = text;
        ta.focus(); ta.select();
      }

    App.el('#bkview', el).addEventListener('click', function () {

        title: 'Backup file (first 4000 characters)',
        size: 'wide',

          '<pre class="mono tiny" style="white-space:pre-wrap;background:var(--surface-2);padding:14px;border-radius:11px;max-height:52vh;overflow:auto">' +
          App.esc(json.slice(0, 4000)) + (json.length > 4000 ? '\n\n… (' + App.bytes(json.length - 4000) + ' more' + ')' : '') + '</pre>',
        buttons: [{ label: 'Close', onClick: function (a) { a.close(); } }]
      });
    });
    App.el('#bkauto', el).addEventListener('change', function () {
      App.db.settings.autoBackup = this.checked;
      App.store.touch();
      App.toast(this.checked ? 'Automatic backup on' : 'Automatic backup off');
    });

    var fel = App.el('#bkfolder', el);
    if (fel) {
      B.getFolder().then(function (h) {
        fel.innerHTML = h
          ? '<div class="flex aic gap12 wrap"><span class="pill p-ok">' + App.icon('check', 18) + ' Folder set: ' + App.esc(h.name) + '</span>' +
            '<button class="btn btn-sm" id="bkfch">Change</button>' +
            '<button class="btn btn-sm btn-primary" id="bkfnow">Save to that folder now</button></div>'
          : '<button class="btn btn-primary" id="bkfch">' + App.icon('folder', 18) + ' Choose folder</button>';
        var ch = App.el('#bkfch', fel);
        if (ch) ch.addEventListener('click', function () {
          B.chooseFolder().then(function (h2) {
            return B.writeToFolder(h2, B.filename(), B.json()).then(function () {
              App.store.kvPut('last_file_backup', App.today());
              App.toast('Folder set, and the first file has been saved', 'ok', 3500);
              UI.render();
            });
          }).catch(function (e) {
            if (e && e.name === 'AbortError') return;
            App.toast(e.message || 'Could not set the folder', 'err');
          });
        });
        var nw = App.el('#bkfnow', fel);
        if (nw) nw.addEventListener('click', function () {
          B.getFolder().then(function (h3) {
            if (!h3) { App.toast('Folder permission was lost, please choose it again', 'err'); return; }
            return B.writeToFolder(h3, B.filename(), B.json()).then(function () {
              App.store.kvPut('last_file_backup', App.today());
              B.addToVault(false, 'folder');
              App.toast('Backup saved to your folder', 'ok');
            });
          }).catch(function (e) { App.toast('Could not save: ' + e.message, 'err'); });
        });
      });
    }
  }

  function cnt(l, v) {
    return '<div class="stat s-brand"><div class="strip"></div><div class="lbl">' + l + '</div>' +
      '<div class="val" style="font-size:21px">' + v + '</div></div>';
  }

  /* ---------- tab: restore ---------- */
  function drawRestore(el) {
    el.innerHTML =
      '<div class="card-body">' +
        '<div class="banner warn mb16">' + App.icon('alert', 20) + '<div class="tx">What restore does' +
        '<small>The data in the backup file will replace the data on this device. Everything currently here will be removed. ' +
        'Don\'t worry — your current data is saved to a safety copy automatically before the restore runs.</small></div></div>' +

        '<div class="card card-pad" style="background:var(--surface-2);text-align:center">' +
          '<div class="eic" style="width:64px;height:64px;margin:0 auto 12px">' + App.icon('folder', 30) + '</div>' +
          '<div class="b mt8" style="font-size:17px">Choose a backup JSON file</div>' +
          '<div class="sm muted mt8 mb16">For example: backup_2026-09-01.json</div>' +
          '<input type="file" id="rsfile" accept=".json,application/json" style="display:none">' +
          '<button class="btn btn-primary btn-lg" id="rspick">Choose file</button>' +
          '<div class="sm muted mt16">Backed up by copying the text instead?</div>' +
          '<button class="btn mt8" id="rspaste">' + App.icon('clipboard', 18) + ' Paste backup text</button>' +
        '</div>' +

        '<div id="rsresult" class="mt16"></div>' +

        '<div class="hr"></div>' +
        '<h3 class="mb12">Danger zone</h3>' +
        '<div class="banner danger">' + App.icon('trash', 20) + '<div class="tx">Erase all data' +
        '<small>The app will go back to brand new. Only do this if you were testing and now want a clean start.</small></div>' +
        '<button class="btn btn-sm btn-danger" id="rswipe">Erase everything</button></div>' +
      '</div>';

    var fileInput = App.el('#rsfile', el);
    App.el('#rspick', el).addEventListener('click', function () { fileInput.click(); });

    fileInput.addEventListener('change', function () {
      var f = this.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { handleFile(f, String(fr.result), el); };
      fr.onerror = function () { App.toast('The file could not be read', 'err'); };
      fr.readAsText(f);
      fileInput.value = '';
    });

    App.el('#rspaste', el).addEventListener('click', function () {
      var m = UI.modal({
        title: 'Paste backup text',
        size: 'wide',
        body: '<div class="sm muted mb12">Paste the backup text you saved earlier, then tap Check.</div>' +
              '<textarea id="rsta" placeholder=\'{ "backupVersion": 1, ... }\' ' +
              'style="width:100%;height:40vh;font-family:var(--mono);font-size:11px;border:1px solid var(--border);' +
              'border-radius:11px;padding:12px;background:var(--surface-2);color:var(--text)"></textarea>',
        buttons: [
          { label: 'Cancel', onClick: function (a) { a.close(); } },
          { label: 'Check', class: 'btn-primary', onClick: function (a) {
              var txt = App.el('#rsta', a.el).value.trim();
              if (!txt) { App.toast('Nothing pasted yet', 'err'); return; }
              a.close();
              handleFile({ name: 'pasted backup', size: txt.length }, txt, el);
            } }
        ]
      });
      setTimeout(function () { var t = App.el('#rsta', m.el); if (t) t.focus(); }, 80);
    });

    App.el('#rswipe', el).addEventListener('click', function () {
      UI.confirmTyped({
        title: 'Erase all data?',
        word: 'DELETE',
        html: '<b>This cannot be undone.</b><br><br>Every customer, invoice, product and payment will be erased.<br><br>' +
              'Download a backup file first.',
        okLabel: 'Erase everything'
      }).then(function (ok) {
        if (!ok) return;
        B.addToVault(false, 'pre-wipe').then(function () {
          return App.store.reset();
        }).then(function () {
          App.toast('All data erased');
          UI.applyTheme();
          UI.go('/dashboard');
        });
      });
    });
  }

  function handleFile(file, text, el) {
    var out = App.el('#rsresult', el);
    var data;
    try { data = B.validate(text); }
    catch (e) {
      out.innerHTML = '<div class="banner danger">' + App.icon('alert', 20) + '<div class="tx">There is a problem with this file' +
        '<small>' + App.esc(e.message) + '</small></div></div>' +
        '<div class="sm muted mt8">Your existing data is completely safe — nothing has changed.</div>';
      App.toast('This file cannot be restored', 'err');
      return;
    }

    var checked = App.checkData(data);     /* repair a copy first — nothing on this device changes yet */
    data = checked.data;
    var p = B.previewOf(data);
    var cur = {
      customers: M.customers().length, products: M.products().length, sales: M.sales().length,
      payments: M.payments().length, prescriptions: M.live(App.db.prescriptions).length,
      expenses: M.expenses().length, purchases: M.purchases().length, suppliers: M.suppliers().length
    };

    function rowFor(k, label) {
      var a = cur[k], b = p[k];
      return '<tr><td>' + label + '</td><td class="num right dim">' + a + '</td>' +
        '<td class="num right b">' + b + '</td>' +
        '<td class="num right ' + (b > a ? 'pos' : b < a ? 'neg' : 'dim') + '">' + (b - a >= 0 ? '+' : '') + (b - a) + '</td></tr>';
    }

    out.innerHTML =
      '<div class="banner ok">' + App.icon('checkCircle', 20) + '<div class="tx">File read successfully — it can be restored' +
      '<small>' + App.esc(file.name) + ' · ' + App.bytes(file.size) + '</small></div></div>' +
      (checked.notes.length ? '<div class="banner warn mt12">' + App.icon('alert', 20) + '<div class="tx">' +
        checked.notes.length + (checked.notes.length === 1 ? ' problem was' : ' problems were') + ' found in this file and will be repaired' +
        '<small>' + checked.notes.map(function (n) { return '• ' + App.esc(n); }).join('<br>') + '</small></div></div>' : '') +
      '<div class="card card-pad mt12">' +
        '<dl class="kv mb16">' +
          '<dt>Backup date</dt><dd>' + App.fmtDate(p.date) + '</dd>' +
          '<dt>Shop name</dt><dd>' + App.esc(p.shop) + '</dd>' +
          '<dt>Backup version</dt><dd>' + p.version + (App.n(p.version) < App.SCHEMA_VERSION ? ' (older — it will be upgraded automatically)' : '') + '</dd>' +
          '<dt>App version</dt><dd>' + App.esc(p.appVersion) + '</dd>' +
        '</dl>' +
        '<div class="tablewrap"><table class="tbl"><thead><tr><th>Data</th><th class="right">Abhi</th>' +
        '<th class="right">In file</th><th class="right">Difference</th></tr></thead><tbody>' +
        rowFor('customers', 'Customers') +
        rowFor('products', 'Products') + rowFor('sales', 'Invoices') +
        rowFor('payments', 'Payments') + rowFor('expenses', 'Expenses') +
        rowFor('purchases', 'Purchases') + rowFor('suppliers', 'Suppliers') +
        '</tbody></table></div>' +
        '<div class="flex gap12 mt16 wrap">' +
          '<button class="btn btn-danger btn-lg" id="rsgo" style="flex:1">' + App.icon('restore', 18) + ' Restore this backup</button>' +
          '<button class="btn btn-lg" id="rscancel">Not now</button>' +
        '</div>' +
      '</div>';

    App.el('#rscancel', out).addEventListener('click', function () { out.innerHTML = ''; });
    App.el('#rsgo', out).addEventListener('click', function () {
      UI.confirmTyped({
        title: 'Confirm restore',
        word: 'RESTORE',
        html: 'Your current data (<b>' + cur.customers + ' customers, ' + cur.sales + ' invoices</b>) will be removed and ' +
              'the data from <b>' + App.fmtDate(p.date) + '</b> will take its place.<br><br>' +
              'Your current data will be kept as a safety copy (look in the Backup history tab).',
        okLabel: 'Restore'
      }).then(function (ok) {
        if (!ok) return;
        App.toast('Restoring...');
        B.restore(data).then(function () {
          UI.applyTheme();
          App.toast('Restore complete', 'ok', 4000);
          UI.go('/dashboard');
        }).catch(function (e) {
          App.toast('Restore failed: ' + e.message, 'err', 6000);
        });
      });
    });
  }

  /* ---------- tab: history ---------- */
  function drawHistory(el) {

    B.getVault().then(function (v) {

                : '<span class="pill p-info">' + App.esc(b.tag || 'Manual') + '</span>') + '</td>' +
              '<td class="num right">' + App.bytes(b.size) + '</td>' +
              '<td class="right nowrap">' +

  /* logos keep their transparency (PNG); photo-like pictures become a small JPEG on white */
  function readLogo(file) {
    return new Promise(function (resolve, reject) {
      var okType = file && (/^image\/(png|jpe?g|webp)$/.test(file.type || '') || /\.(png|jpe?g|webp)$/i.test(file.name || ''));
      if (!okType) return reject(new Error('Please choose a PNG or JPG picture'));
      if (file.size > 8 * 1024 * 1024) return reject(new Error('This picture is too large — choose one under 8 MB'));
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('Could not read this picture')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('This picture could not be opened')); };
        img.onload = function () {
          var k = Math.min(1, 400 / Math.max(img.width, img.height));
          var cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          var out = cv.toDataURL('image/png');
          if (out.length > 300000) {
            var cj = document.createElement('canvas');
            cj.width = cv.width; cj.height = cv.height;
            var c2 = cj.getContext('2d');
            c2.fillStyle = '#FFFFFF'; c2.fillRect(0, 0, cj.width, cj.height); c2.drawImage(cv, 0, 0);
            out = cj.toDataURL('image/jpeg', 0.9);
          }
          out = App.safeImg(out);
          if (out) resolve(out); else reject(new Error('This picture could not be used'));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

        App.toast('Settings saved', 'ok');

  function setPin() {
    UI.modal({
      title: 'Set a PIN',
      size: 'narrow',
      dismissable: false,
      body: UI.formHTML([
        { k: 'pin1', label: '4-6 digit PIN', type: 'password', attrs: 'inputmode="numeric" maxlength="6" autocomplete="new-password"', span: 2 },
        { k: 'pin2', label: 'Re-enter PIN', type: 'password', attrs: 'inputmode="numeric" maxlength="6" autocomplete="new-password"', span: 2 }
      ], 1) +
      '<div class="banner warn mt12">' + App.icon('alert', 20) + '<div class="tx">Remember this PIN' +
      '<small>If you forget it, you will have to reinstall and restore from a backup file to get in.</small></div></div>',
      buttons: [
        { label: 'Cancel', onClick: function (a) { a.close(); UI.render(); } },
        { label: 'Set a PIN', class: 'btn-primary', onClick: function (a) {
            var d = UI.readForm(a.el);
            UI.clearErrors(a.el);
            if (!/^\d{4,6}$/.test(d.pin1)) return UI.markError(a.el, 'pin1', 'Enter a 4 to 6 digit number');
            if (d.pin1 !== d.pin2) return UI.markError(a.el, 'pin2', 'The two PINs do not match');
            App.db.settings.pinEnabled = true;
            App.db.settings.pinHash = App.hashPin(d.pin1);
            App.store.touch(); App.store.saveNow();
            a.close();
            App.toast('PIN lock is now on', 'ok');
            UI.render();
          } }
      ]
    });
  }

  /* ---------------- lock screen ---------------- */
  App.showLock = function (onOk) {
    var entered = '';
    var lock = App.h('div', { class: 'lock' });
    lock.innerHTML =
      '<div class="box">' +
        '<div class="eic" style="width:64px;height:64px;margin:0 auto 12px">' + App.icon('lock', 30) + '</div>' +
        '<h2 class="mt12">' + App.esc(App.db.settings.shopName) + '</h2>' +
        '<div class="muted sm">Enter your PIN</div>' +
        '<div class="dots" id="lkdots"></div>' +
        '<div class="keypad">' +
          [1,2,3,4,5,6,7,8,9].map(function (n) { return '<button data-k="' + n + '">' + n + '</button>'; }).join('') +
          '<button data-k="clear">C</button><button data-k="0">0</button><button data-k="back" aria-label="Delete last digit">' + App.icon('arrowLeft', 20) + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(lock);

    function dots() {
      App.el('#lkdots', lock).innerHTML = '';
      for (var i = 0; i < 6; i++) {
        App.el('#lkdots', lock).appendChild(App.h('div', { class: 'dot' + (i < entered.length ? ' on' : '') }));
      }
    }
    dots();

    App.on(lock, 'click', '[data-k]', function () {
      var k = this.getAttribute('data-k');
      if (k === 'clear') entered = '';
      else if (k === 'back') entered = entered.slice(0, -1);
      else if (entered.length < 6) entered += k;
      dots();
      if (entered.length >= 4 && App.hashPin(entered) === App.db.settings.pinHash) {
        document.body.removeChild(lock);
        onOk();
      } else if (entered.length === 6) {
        setTimeout(function () {
          entered = ''; dots();
          App.toast('Wrong PIN', 'err');
        }, 180);
      }
    });

    document.addEventListener('keydown', function h(e) {
      if (!lock.parentNode) { document.removeEventListener('keydown', h); return; }
      if (/^\d$/.test(e.key)) { var b = App.el('[data-k="' + e.key + '"]', lock); if (b) b.click(); }
      else if (e.key === 'Backspace') App.el('[data-k="back"]', lock).click();
    });
  };
})();


/* ===== 52-tour.js ===== */
/* ============================================================================
   52-tour.js — First-run guided tour.
   A short spotlight walkthrough that highlights the main parts of the app the
   first time it is opened, and can be replayed any time from Settings.

   • App.tour.start(force)  — run the tour. Without force it does nothing if it
                              has already been completed once (settings.tourDone).
   • App.tour.available()   — true if there is anything to show.

   The tour is self-contained: it reads the live shell, so steps whose target
   is missing in a given app (e.g. Appointments, which only the services app
   has) are skipped automatically. No per-app configuration is needed.
   ========================================================================== */
(function () {
  'use strict';
  var App = window.App;
  var UI = App.UI;

  var PAD = 6;              /* padding around the highlighted element */
  var GAP = 14;             /* gap between the element and the tip card */

  /* Each step points at a CSS selector (or is a centered message with no
     target). `text` may be a string or a function(el) -> string so a step can
     name the thing it is pointing at using the live label. */
  var STEPS = [
    {
      center: true,
      title: 'Welcome 👋',
      text: 'Here is a quick 60-second tour of the main screens. You can skip it ' +
            'any time and replay it later from Settings.'
    },
    {
      sel: '.nav-item[data-nav="dashboard"]',
      title: 'Dashboard',
      text: 'Your day at a glance — today’s sales, money still to collect and ' +
            'anything that needs attention.'
    },
    {
      sel: '.topbar .btn-primary[data-go="/sale/new"]',
      altSel: '.nav-item[data-nav="sale"]',
      title: 'Make a bill',
      text: 'This is where most of your day happens. Tap here to make a new bill ' +
            'in seconds.'
    },
    {
      sel: '.nav-item[data-nav="products"]',
      title: function (el) { return navLabel(el, 'Products'); },
      text: function (el) {
        var l = navLabel(el, 'products').toLowerCase();
        return 'Add everything you ' + (l.indexOf('service') >= 0 ? 'offer' : 'sell') +
               ' here, with prices. Bills pick from this list.';
      }
    },
    {
      sel: '.nav-item[data-nav="customers"]',
      title: 'Customers',
      text: 'Keep a record of your customers and track udhaar (money owed to you).'
    },
    {
      sel: '.nav-item[data-nav="appointments"]',
      title: 'Appointments',
      text: 'Book and keep track of upcoming appointments for your customers.'
    },
    {
      sel: '.nav-item[data-nav="reports"]',
      title: 'Reports',
      text: 'See your sales, profit and GST clearly — by day, month or year.'
    },
    {
      sel: '.nav-item[data-nav="backup"]',
      title: 'Backup & Restore',
      text: 'The most important screen. Back up your data regularly so your ' +
            'business is always safe, even if the device is lost.'
    },
    {
      sel: '#gsearch',
      title: 'Search anything',
      text: 'Find any bill, customer or product instantly. On a computer, press ' +
            'Ctrl/⌘ + K.'
    },
    {
      center: true,
      title: 'You’re all set 🎉',
      text: 'That’s the whole app. Start by adding a product or making your ' +
            'first bill. You can replay this tour any time from Settings.'
    }
  ];

  function navLabel(el, fallback) {
    try {
      var span = el && el.querySelector('span');
      var t = span && span.textContent.trim();
      return t || fallback;
    } catch (e) { return fallback; }
  }

  function isMobileLayout() {
    var h = App.el('#hamb');
    try { return h && getComputedStyle(h).display !== 'none'; } catch (e) { return false; }
  }
  function sidebarOpen() {
    var sb = App.el('.sidebar');
    return sb && sb.classList.contains('open');
  }
  function openSidebar() {
    var sb = App.el('.sidebar'), sc = App.el('.scrim');
    if (sb) sb.classList.add('open');
    if (sc) sc.classList.add('on');
  }

  var state = null;   /* { steps, i, root, openedSidebar } */

  App.tour = {
    available: function () { return resolve().length > 1; },

    start: function (force) {
      if (!App.db) return;
      var s = App.db.settings || {};
      if (!force && s.tourDone) return;
      if (state) return;                 /* already running */
      if (document.querySelector('.modal-bg')) {   /* don't fight a modal */
        setTimeout(function () { App.tour.start(force); }, 500);
        return;
      }
      var steps = resolve();
      if (!steps.length) return;
      state = { steps: steps, i: 0, openedSidebar: false };
      build();
      show(0);
      window.addEventListener('resize', onResize);
      window.addEventListener('keydown', onKey, true);
    },

    finish: function () { done(false); }
  };

  /* Build the list of steps that actually have something to point at. */
  function resolve() {
    return STEPS.filter(function (st) {
      if (st.center) return true;
      return !!(App.el(st.sel) || (st.altSel && App.el(st.altSel)));
    });
  }

  function build() {
    var root = document.createElement('div');
    root.className = 'tour-root';
    root.innerHTML =
      '<div class="tour-dim"></div>' +
      '<div class="tour-ring" hidden></div>' +
      '<div class="tour-card" role="dialog" aria-live="polite">' +
        '<div class="tour-hd"></div>' +
        '<div class="tour-tx"></div>' +
        '<div class="tour-ft">' +
          '<button type="button" class="tour-skip">Skip tour</button>' +
          '<div class="tour-dots"></div>' +
          '<div class="tour-nav">' +
            '<button type="button" class="btn btn-sm tour-back">Back</button>' +
            '<button type="button" class="btn btn-sm btn-primary tour-next">Next</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(root);
    state.root = root;

    root.querySelector('.tour-skip').addEventListener('click', function () { done(false); });
    root.querySelector('.tour-back').addEventListener('click', function () { show(state.i - 1); });
    root.querySelector('.tour-next').addEventListener('click', function () {
      if (state.i >= state.steps.length - 1) done(true);
      else show(state.i + 1);
    });
    /* clicking the dim area around the spotlight does nothing (prevents
       accidental taps leaking through to the app). */
    root.querySelector('.tour-dim').addEventListener('click', function (e) { e.stopPropagation(); });
  }

  function show(i) {
    if (!state) return;
    i = Math.max(0, Math.min(i, state.steps.length - 1));
    state.i = i;
    var st = state.steps[i];
    var root = state.root;
    var el = st.center ? null : (App.el(st.sel) || (st.altSel && App.el(st.altSel)));

    /* On a phone the menu is hidden off-screen; open it so nav targets are
       visible, then let it settle before measuring. */
    if (el && el.closest('.sidebar') && isMobileLayout() && !sidebarOpen()) {
      openSidebar();
      state.openedSidebar = true;
      setTimeout(function () { if (state && state.i === i) layout(st, el); }, 260);
    }

    /* content */
    root.querySelector('.tour-hd').textContent = valueOf(st.title, el) || '';
    root.querySelector('.tour-tx').textContent = valueOf(st.text, el) || '';
    root.querySelector('.tour-back').style.visibility = i === 0 ? 'hidden' : '';
    var next = root.querySelector('.tour-next');
    next.textContent = i >= state.steps.length - 1 ? 'Done' : 'Next';
    root.querySelector('.tour-dots').innerHTML = state.steps.map(function (_, k) {
      return '<span class="tour-dot' + (k === i ? ' on' : '') + '"></span>';
    }).join('');

    if (el && el.scrollIntoView) {
      try { el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
    }
    layout(st, el);
  }

  function valueOf(v, el) { return typeof v === 'function' ? v(el) : v; }

  function layout(st, el) {
    if (!state) return;
    var root = state.root;
    var ring = root.querySelector('.tour-ring');
    var card = root.querySelector('.tour-card');
    var vw = window.innerWidth, vh = window.innerHeight;

    if (!el) {                       /* centered message */
      ring.hidden = true;
      root.classList.add('centered');
      card.style.left = Math.round((vw - card.offsetWidth) / 2) + 'px';
      card.style.top = Math.round((vh - card.offsetHeight) / 2) + 'px';
      return;
    }
    root.classList.remove('centered');

    var r = el.getBoundingClientRect();
    var x = r.left - PAD, y = r.top - PAD, w = r.width + PAD * 2, h = r.height + PAD * 2;
    ring.hidden = false;
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    ring.style.width = w + 'px';
    ring.style.height = h + 'px';

    /* place the card: below the element if it fits, otherwise above, otherwise
       beside it. Then clamp inside the viewport. */
    var cw = card.offsetWidth, ch = card.offsetHeight;
    var top, left = r.left + r.width / 2 - cw / 2;
    if (r.bottom + GAP + ch <= vh) top = r.bottom + GAP;
    else if (r.top - GAP - ch >= 0) top = r.top - GAP - ch;
    else { top = Math.max(8, (vh - ch) / 2); left = r.right + GAP; }
    left = Math.max(8, Math.min(left, vw - cw - 8));
    top = Math.max(8, Math.min(top, vh - ch - 8));
    card.style.left = Math.round(left) + 'px';
    card.style.top = Math.round(top) + 'px';
  }

  function onResize() { if (state) { var st = state.steps[state.i]; show(state.i); } }
  function onKey(e) {
    if (!state) return;
    if (e.key === 'Escape') { e.preventDefault(); done(false); }
    else if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); state.root.querySelector('.tour-next').click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (state.i > 0) show(state.i - 1); }
  }

  function done(completed) {
    if (!state) return;
    window.removeEventListener('resize', onResize);
    window.removeEventListener('keydown', onKey, true);
    if (state.openedSidebar && UI.closeSidebar) { try { UI.closeSidebar(); } catch (e) {} }
    if (state.root && state.root.parentNode) state.root.parentNode.removeChild(state.root);
    state = null;
    try {
      App.db.settings.tourDone = true;
      App.store.touch(); App.store.saveNow();
    } catch (e) {}
    if (completed) App.toast('Tour finished — enjoy! You can replay it from Settings.', 'ok', 4000);
  }
})();

    { k: 'suppliers', i: 'building', l: 'Suppliers' },
    { g: 'Accounts' },
    { k: 'reports',   i: 'chart', l: 'Reports' },
    { g: 'Safety' },
    { k: 'backup',    i: 'shield', l: 'Backup & Restore' },
    { k: 'settings',  i: 'sliders', l: 'Settings' }
  ];

  /* ---------------- the shop's own header across the top ---------------- */
  UI.shopHeaderHTML = function (title, sub, logo) {
    logo = App.safeImg(logo);
    return '<div class="sh-logo' + (logo ? '' : ' no-img') + '">' +
        (logo ? '<img src="' + App.esc(logo) + '" alt="">' : App.brandMark(24)) + '</div>' +
      '<div class="sh-text"><div class="sh-title">' + App.esc(title || 'Adminuscurator') + '</div>' +
        (sub ? '<div class="sh-sub">' + App.esc(sub) + '</div>' : '') + '</div>';
  };

  UI.renderShopHeader = function () {
    var el = App.el('#shophead');
    if (!el || !App.db) return;
    var s = App.db.settings;
    var title = String(s.headerTitle || '').trim() || s.shopName || 'Adminuscurator';
    el.hidden = s.headerShow === false;
    el.style.setProperty('--shop-bg', App.safeColor(s.headerBg, '#1E3A5F'));
    el.style.setProperty('--shop-fg', App.safeColor(s.headerFg, '#FFFFFF'));
    el.innerHTML = UI.shopHeaderHTML(title, String(s.headerTagline || '').trim(), s.logo);
    document.title = title;
  };

  function buildShell() {
    var s = App.db.settings;
    var nav = NAV.map(function (n) {
      if (n.g) return '<div class="nav-sec">' + App.esc(n.g) + '</div>';
      return '<button class="nav-item" data-nav="' + n.k + '" data-go="' + (n.href || '/' + n.k) + '">' +
        App.icon(n.i, 20) + '<span>' + App.esc(n.l) + '</span>' +
        (n.badge ? '<span class="badge" style="display:none">0</span>' : '') + '</button>';
    }).join('');

    App.el('#app').innerHTML =
      '<div class="scrim"></div>' +
      '<header class="shophead" id="shophead" role="banner"></header>' +
      '<div class="shell">' +
      '<aside class="sidebar">' +
        '<nav class="nav" aria-label="Main menu">' + nav + '</nav>' +
      '</aside>' +
      '<div class="main">' +
        '<header class="topbar">' +
          '<button class="btn btn-icon hamburger" id="hamb" aria-label="Open menu">' + App.icon('menu', 20) + '</button>' +
          '<div class="searchwrap">' +
            '<span class="si">' + App.icon('search', 18) + '</span>' +
            '<input id="gsearch" placeholder="Customer, mobile, bill number, product..." autocomplete="off">' +
            '<div class="sresults" id="gres" style="display:none"></div>' +
          '</div>' +
          '<div class="spacer"></div>' +
          '<button class="btn btn-icon" id="themebtn" title="Switch light or dark" aria-label="Switch light or dark mode">' +
            App.icon(s.theme === 'dark' ? 'sun' : 'moon', 20) + '</button>' +
          '<button class="btn btn-primary" data-go="/sale/new">' + App.icon('plus', 18) + '<span>New Bill</span></button>' +
        '</header>' +
        '<div class="savebar" id="savebar" role="alert" hidden></div>' +
        '<main class="view" id="view"></main>' +
      '</div>' +
      '</div>';
    UI.renderShopHeader();

    App.el('#hamb').addEventListener('click', function () {
      App.el('.sidebar').classList.toggle('open');
      App.el('.scrim').classList.toggle('on');
    });
    App.el('.scrim').addEventListener('click', UI.closeSidebar);
    App.el('#themebtn').addEventListener('click', function () {
      UI.toggleTheme();
      this.innerHTML = App.icon(App.db.settings.theme === 'dark' ? 'sun' : 'moon', 20);
    });

    wireSearch();
  }

  function wireSearch() {
    var input = App.el('#gsearch');
    var box = App.el('#gres');

    function hide() { box.style.display = 'none'; }

    input.addEventListener('input', App.debounce(function () {
      var q = this.value.trim();
      if (q.length < 2) { hide(); return; }
      var res = App.M.search(q, 24);
      if (!res.length) {
        box.innerHTML = '<div class="empty" style="padding:26px"><div class="t">No results</div>' +
          '<div class="d">"' + App.esc(q) + '" did not match any record</div></div>';
        box.style.display = '';
        return;
      }
      var groups = App.groupBy(res, function (r) { return r.type; });
      var titles = { customer: 'Customers', product: 'Products', sale: 'Invoices', supplier: 'Suppliers' };
      var html = '';
      ['customer','sale','product','supplier'].forEach(function (t) {
        if (!groups[t]) return;
        html += '<div class="sgroup">' + titles[t] + '</div>';
        html += groups[t].map(function (r) {
          var right = '';
          if (t === 'customer') {
            var st = App.M.customerStats(r.id);
            right = st.outstanding > 0.5 ? '<span class="pill p-danger">' + App.money(st.outstanding) + '</span>' : '';
          } else if (t === 'product') {
            right = '<span class="b">' + App.money(r.obj.sellPrice) + '</span>';
          } else if (t === 'sale') {
            right = '<span class="b">' + App.money(r.obj.total) + '</span>';
          }
          return '<div class="sres" data-t="' + t + '" data-id="' + r.id + '">' +
            '<div style="min-width:0"><div class="t">' + App.esc(r.title) + '</div>' +
            '<div class="d">' + App.esc(r.sub) + '</div></div>' +
            '<div class="rt">' + right + '</div></div>';
        }).join('');
      });
      box.innerHTML = html;
      box.style.display = '';
    }, 160));

    App.on(box, 'click', '.sres', function () {
      var t = this.getAttribute('data-t'), id = this.getAttribute('data-id');
      input.value = ''; hide();
      if (t === 'customer') UI.go('/customer/' + id);
      else if (t === 'product') UI.go('/product/' + id);
      else if (t === 'sale') UI.go('/sale/' + id);
      else UI.go('/suppliers');
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('.searchwrap')) hide();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { this.value = ''; hide(); this.blur(); }
      if (e.key === 'Enter') {
        var first = App.el('.sres', box);
        if (first) first.click();
      }
    });

    /* keyboard shortcut for desktop use */
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); input.focus(); input.select(); }
    });
  }

  /* ---------------- startup ---------------- */
  function afterLoad(how) {
      UI.applyTheme();
      buildShell();

      /* a failed save shows a bar that stays until saving works again */
      App.store.onProblem = function (msg) {
        var bar = App.el('#savebar');
        if (!bar) return;
        bar.innerHTML = App.icon('alert', 20) + '<div class="tx">' + App.esc(msg) + '</div>' +
          '<button class="btn btn-sm" type="button" id="saveretry">Try again</button>';
        bar.hidden = false;
        App.el('#saveretry', bar).addEventListener('click', function () { App.store.saveNow(); });
      };
      App.store.onRecovered = function () {
        var bar = App.el('#savebar');
        if (bar) { bar.hidden = true; bar.innerHTML = ''; }
        App.toast('Saved — everything is stored again', 'ok', 4000);
      };
      if (/[?&]recovered=1/.test(location.search)) {
        history.replaceState(null, '', location.pathname + location.hash);
        setTimeout(function () { App.toast('The app restarted after running low on memory. Everything saved is safe.', 'warn', 7000); }, 600);
      }
      if (App.lastRepair && App.lastRepair.length) {
        setTimeout(function () { App.toast('Some damaged records were repaired automatically', 'warn', 6000); }, 900);
      }

      if (!location.hash) location.hash = '/pos';
      UI.render();

      if (App.migrated) App.store.saveNow();   /* keep an upgraded file upgraded */

      var boot = App.el('#boot');
      if (boot) boot.remove();

      if (how === 'recovered') {
        App.toast('Opened from the last known-good copy of your data', 'warn', 6000);
      }
      if (App.store.driver === 'memory') {
        App.toast('This browser cannot save data — please open in Chrome', 'err', 9000);
      }

      /* first run: nudge the user to set the shop name */
      if (how === 'new') {
        setTimeout(function () {
          UI.modal({
            title: 'Welcome',
            size: 'narrow',
            dismissable: false,
            body: '<div class="sm mb16">Before you start, enter your shop name — it will be printed on every bill.</div>' +
              UI.formHTML([{ k: 'shopName', label: 'Shop name', value: '', required: true, span: 2 },
                           { k: 'phone', label: 'Phone number', value: '', span: 2 }], 1),
            buttons: [
              { label: 'Later', onClick: function (a) { a.close(); } },
              { label: 'Get started', class: 'btn-primary', onClick: function (a) {
                  var d = UI.readForm(a.el);
                  if (d.shopName.trim()) App.db.settings.shopName = d.shopName.trim();
                  if (d.phone.trim()) App.db.settings.phone = d.phone.trim();
                  App.store.touch(); App.store.saveNow();
                  UI.renderShopHeader();
                  a.close();
                  UI.render();
                  App.toast('Done! Now add a customer or a product', 'ok', 4000);
                } }
            ]
          });
        }, 400);
      }

      /* first-run guided tour — waits for the welcome modal to close, then
         runs once (App.tour re-schedules itself while a modal is open). */
      if (App.tour) setTimeout(function () { App.tour.start(); }, 900);

      /* automatic daily backup */
      App.Backup.autoTick();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') App.Backup.autoTick();
      });
      setInterval(function () { App.Backup.autoTick(); }, 60 * 1000);   /* cheap: only reads one stored time */
      App.onResume = function () { App.Backup.autoTick(); };
  }

  /* Ask the device to treat this data as worth keeping. Without this, a browser or
     WebView is allowed to throw the whole database away to reclaim space. There is no
     prompt: the answer is yes or no, and it is remembered for this device. */
  function keepStorage() {
    try {
      if (!navigator.storage || !navigator.storage.persist) return;
      navigator.storage.persisted().then(function (already) {
        if (already) { App.store.persisted = true; return true; }
        return navigator.storage.persist().then(function (ok) { App.store.persisted = !!ok; return ok; });
      }).catch(function () {});
    } catch (e) {}
  }

  function boot() {
    if (App.db) return;
    if (App.license && App.license.required && App.license.required()) { App.license.guard(startBoot); return; }
    startBoot();
  }

  function startBoot() {
    keepStorage();
    App.store.init().then(function (how) {
      if (App.db.settings.pinEnabled && App.db.settings.pinHash) {
        var b = App.el('#boot');
        if (b) b.style.display = 'none';
        return new Promise(function (res) { App.showLock(function () { res(how); }); });
      }
      return how;
    }).then(afterLoad).catch(function (e) {
      document.body.innerHTML = '<div style="padding:40px;font-family:system-ui">' +
        '<h2>The app could not start</h2><p>' + App.esc(e.message) + '</p>' +
        '<p>Please reopen the browser. If it still does not work, keep your backup JSON file safe and open the app in Chrome.</p></div>';
      if (window.console) console.error(e);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
