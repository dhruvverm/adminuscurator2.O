    var m = UI.modal({ title: 'Current bill', size: 'wide', body: '<div id="poscartsheet"></div>', footer: false });
    var host = App.el('#poscartsheet', m.el);
    var orig = App.el('#poscart');
    /* render a cart clone into the sheet by temporarily pointing drawCart at it */
    host.innerHTML = orig ? orig.innerHTML : '';
    /* wire the sheet's buttons to the same handlers via event delegation */
    App.on(host, 'click', '[data-inc]', function () { var i = +this.getAttribute('data-inc'); setQty(i, App.n(C.lines[i].qty) + 1); host.innerHTML = App.el('#poscart').innerHTML; });
    App.on(host, 'click', '[data-dec]', function () { var i = +this.getAttribute('data-dec'); setQty(i, App.n(C.lines[i].qty) - 1); host.innerHTML = App.el('#poscart').innerHTML; });
    App.on(host, 'click', '#poscharge', function () { m.close(); charge(); });
    App.on(host, 'click', '#posclear', function () { clearCart(); m.close(); });
    App.on(host, 'click', '#poscust', function () { m.close(); pickCustomer(); });
  }

  /* ---------- charge / pay ---------- */
  var METHODS = ['Cash', 'UPI', 'Card', 'Bank'];
  function charge() {
    if (!C.lines.length) return;
    var c = calc();
    var pay = { method: 'Cash', tendered: c.total };
    var m = UI.modal({
      title: 'Take payment', size: 'wide',
      body: payBody(c, pay),
      buttons: [
        { label: 'Cancel', onClick: function (a) { a.close(); } },
        { label: 'Charge & print', class: 'btn-primary', onClick: function (a) { finish(c, pay, a, true); } },
        { label: 'Charge', onClick: function (a) { finish(c, pay, a, false); } }
      ]
    });
    wirePay(m.el, c, pay);
  }

  function payBody(c, pay) {
    return '<div class="pos-pay">' +
      '<div class="pos-pay-total"><span>Total</span><b>' + App.money(c.total) + '</b></div>' +
      '<div class="pos-methods" id="posmethods">' + METHODS.map(function (mth) {
        return '<button type="button" class="pos-m' + (mth === pay.method ? ' on' : '') + '" data-m="' + mth + '">' + mth + '</button>';
      }).join('') + '</div>' +
      '<div id="poscash">' + cashBlock(c, pay) + '</div>' +
    '</div>';
  }
  function cashBlock(c, pay) {
    if (pay.method !== 'Cash') return '<div class="sm dim" style="margin-top:6px">' + pay.method + ' — full amount ' + App.money(c.total) + '.</div>';
    var change = App.round2(App.n(pay.tendered) - c.total);
    var quick = [c.total, Math.ceil(c.total / 100) * 100, Math.ceil(c.total / 500) * 500].filter(function (v, i, a) { return a.indexOf(v) === i; });
    return '<label class="sm b" style="display:block;margin:12px 0 6px">Cash received</label>' +
      '<input id="postender" type="number" inputmode="decimal" value="' + App.n(pay.tendered) + '" ' +
        'style="width:100%;height:48px;border-radius:11px;border:1px solid var(--border);background:var(--surface);padding:0 14px;font-size:20px;font-weight:700;color:var(--text)">' +
      '<div class="pos-quick">' + quick.map(function (v) { return '<button type="button" class="chip" data-t="' + v + '">' + App.money0(v) + '</button>'; }).join('') + '</div>' +
      '<div class="pos-change ' + (change < -0.004 ? 'short' : '') + '">' + (change >= 0 ? 'Change to return <b>' + App.money(change) + '</b>' : 'Still due <b>' + App.money(-change) + '</b>') + '</div>';
  }
  function wirePay(root, c, pay) {
    App.on(root, 'click', '[data-m]', function () {
      pay.method = this.getAttribute('data-m');
      if (pay.method !== 'Cash') pay.tendered = c.total;
      App.els('[data-m]', root).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-m') === pay.method); });
      App.el('#poscash', root).innerHTML = cashBlock(c, pay);
      bindTender();
    });
    function bindTender() {
      var t = App.el('#postender', root);
      if (t) t.addEventListener('input', function () { pay.tendered = App.n(this.value); refreshChange(); });
      App.on(root, 'click', '[data-t]', function () { pay.tendered = App.n(this.getAttribute('data-t')); var tt = App.el('#postender', root); if (tt) tt.value = pay.tendered; refreshChange(); });
    }
    function refreshChange() {
      var el = App.el('.pos-change', root); if (!el) return;
      var change = App.round2(App.n(pay.tendered) - c.total);
      el.className = 'pos-change ' + (change < -0.004 ? 'short' : '');
      el.innerHTML = change >= 0 ? 'Change to return <b>' + App.money(change) + '</b>' : 'Still due <b>' + App.money(-change) + '</b>';
    }
    bindTender();
  }

  function finish(c, pay, api, print) {
    var paid = pay.method === 'Cash' ? Math.min(App.n(pay.tendered), c.total) : c.total;
    var d = Object.assign({
      items: C.lines.map(function (l) { return { productId: l.productId, variantId: l.variantId, variantLabel: l.variantLabel, name: l.name, qty: l.qty, rate: l.rate }; }),
      payments: [{ method: pay.method, amount: paid }],
      customerId: C.customer ? C.customer.id : '',
      customerName: C.customer ? C.customer.name : ''
    }, taxOpts());
    var sale;
    try { sale = M.saleCreate(d); }
    catch (e) {
      if (e.code === 'LOW_STOCK') {
        UI.confirm({ title: 'Not enough stock', message: e.problems.join('\n') + '\n\nSell anyway (stock will go negative)?', okLabel: 'Sell anyway' })
          .then(function (ok) { if (ok) { d.allowNegativeStock = true; try { sale = M.saleCreate(d); api.close(); done(sale, print); } catch (e2) { App.toast(e2.message, 'err', 6000); } } });
        return;
      }
      App.toast(e.message, 'err', 6000); return;
    }
    api.close(); done(sale, print);
  }

  function done(sale, print) {
    clearCart();
    App.store.saveNow();
    if (print) { App.printInvoice(sale.id); }
    else {
      App.toast('Bill ' + sale.invoiceNo + ' saved · ' + App.money(sale.total), 'ok', 4000);
    }
    /* back to a clean POS for the next customer */
    if (location.hash !== '#/pos') UI.go('/pos'); else { drawGrid(); drawCart(); }
    var q = App.el('#posq'); if (q) setTimeout(function () { q.focus(); }, 60);
  }
})();


/* ===== 44-payments.js ===== */
/* =========================================================================
   44-payments.js — credit collection: receive payment, payment history
   ========================================================================= */
(function () {
  'use strict';
  var UI = App.UI, M = App.M;

  UI.route('payments', function (view, r) {
    var d = r.query.d || '';
    var from = r.query.from || d || '';
    var to = r.query.to || d || '';
    var SHOW = UI.shown(r);

    var list = M.payments().slice();
    if (from) list = list.filter(function (p) { return p.date >= from; });
    if (to) list = list.filter(function (p) { return p.date <= to; });
    list.sort(function (a, b) { return (b.date + b.createdAt) > (a.date + a.createdAt) ? 1 : -1; });

    var total = App.sum(list, function (p) { return p.amount; });
    var byM = {};
    M.PAY_METHODS.forEach(function (m) { byM[m] = 0; });
    list.forEach(function (p) { byM[p.method] = App.round2(App.n(byM[p.method]) + App.n(p.amount)); });

    var html =
      '<div class="view-head"><div><h1>Payments</h1>' +
      '<div class="sub">' + list.length + ' entries · ' + App.money(total) + ' collect hua</div></div>' +
      '<div class="actions">' +
        '<button class="btn" id="pmexport">' + App.icon('download', 18) + ' CSV</button>' +
        '<button class="btn btn-primary" id="pmnew">+ Receive payment</button>' +
      '</div></div>';

    html += '<div class="card card-pad mb16"><div class="flex gap12 wrap aic">' +
      '<div class="f"><label>From</label><input type="date" id="pmfrom" value="' + from + '"></div>' +
      '<div class="f"><label>To</label><input type="date" id="pmto" value="' + to + '"></div>' +
      '<div class="f"><label>&nbsp;</label><button class="btn" id="pmclear">Clear</button></div>' +
      '<div class="chips" style="margin-left:auto">' +
        '<button class="chip" data-range="today">Today</button>' +
        '<button class="chip" data-range="week">7 days</button>' +
        '<button class="chip" data-range="month">This month</button>' +
      '</div></div></div>';

    html += '<div class="grid g5 mb16">' +
      M.PAY_METHODS.slice(0, 5).map(function (m) {
        return '<div class="stat s-brand"><div class="strip"></div><div class="lbl">' + App.esc(m) + '</div>' +
          '<div class="val" style="font-size:20px">' + App.money0(byM[m]) + '</div></div>';
      }).join('') + '</div>';

    html += '<div class="card">';
    if (!list.length) html += UI.empty('wallet', 'No payments found', 'Payments you receive from customers will appear here');
    else {
      html += '<div class="tablewrap"><table class="tbl"><thead><tr>' +
        '<th>Date</th><th>Customer</th><th>Invoice</th><th>Method</th><th>Note</th><th class="right">Amount</th><th></th>' +
        '</tr></thead><tbody>' + list.slice(0, SHOW).map(function (p) {
          var c = p.customerId ? M.find('customers', p.customerId) : null;
          var s = p.saleId ? M.find('sales', p.saleId) : null;
          return '<tr>' +
            '<td class="sm">' + App.fmtDate(p.date) + '</td>' +
            '<td>' + (c ? '<a href="#/customer/' + c.id + '" class="b">' + App.esc(c.name) + '</a>' : '<span class="dim">Walk-in</span>') + '</td>' +
            '<td class="mono sm">' + (s ? '<a href="#/sale/' + s.id + '">' + App.esc(s.invoiceNo) + '</a>' : '—') + '</td>' +
            '<td><span class="pill p-brand">' + App.esc(p.method) + '</span></td>' +
            '<td class="sm dim">' + App.esc(p.note || '—') + '</td>' +
            '<td class="num right b pos">' + App.money(p.amount) + '</td>' +
            '<td class="right">' + (p.atInvoice ? '<span class="tiny dim">with the bill</span>' : '<button class="btn btn-sm" data-del="' + p.id + '">' + App.icon('trash', 18) + '<span>Delete</span></button>') + '</td></tr>';
        }).join('') + '</tbody><tfoot><tr><td colspan="5">Total</td><td class="num right pos">' + App.money(total) + '</td><td></td></tr></tfoot></table></div>';
      html += UI.moreRows(Math.min(SHOW, list.length), list.length);
    }
    html += '</div>';

    view.innerHTML = html;
    UI.wireMore(view, SHOW);

    function apply(o) {
      var n = { from: App.el('#pmfrom', view).value, to: App.el('#pmto', view).value };
      for (var k in o) n[k] = o[k];
      var q = [];
      for (var k2 in n) if (n[k2]) q.push(k2 + '=' + n[k2]);
      UI.go('/payments' + (q.length ? '?' + q.join('&') : ''));
    }
    App.el('#pmfrom', view).addEventListener('change', function () { apply({}); });
    App.el('#pmto', view).addEventListener('change', function () { apply({}); });
    App.el('#pmclear', view).addEventListener('click', function () { UI.go('/payments'); });
    App.on(view, 'click', '[data-range]', function () {
      var k = this.getAttribute('data-range'), t = App.today();
      if (k === 'today') apply({ from: t, to: t });
      else if (k === 'week') apply({ from: App.addDays(t, -6), to: t });
      else apply({ from: t.slice(0, 8) + '01', to: t });
    });
    App.el('#pmnew', view).addEventListener('click', function () { App.paymentForm({}); });
    App.on(view, 'click', '[data-del]', function () {
      var id = this.getAttribute('data-del');
      UI.confirm({ title: 'Delete this payment?', message: 'The customer\'s outstanding amount will increase by this much. You can restore it from Trash.', danger: true, okLabel: 'Delete' })
        .then(function (ok) { if (ok) { M.softDelete('payments', id); App.toast('Deleted'); UI.render(); } });
    });
    App.el('#pmexport', view).addEventListener('click', function () {
      var rows = [['Date','Customer','Customer ID','Invoice','Method','Amount','Note']];
      list.forEach(function (p) {
        var c = p.customerId ? M.find('customers', p.customerId) : null;
        var s = p.saleId ? M.find('sales', p.saleId) : null;
        rows.push([p.date, c ? c.name : 'Walk-in', c ? c.code : '', s ? s.invoiceNo : '', p.method, p.amount, p.note]);
      });
      App.download('payments_' + App.today() + '.csv', App.toCSV(rows), 'text/csv');
      App.toast('CSV downloaded', 'ok');
    });

    if (r.query.new) App.paymentForm({});
  });

  /* ---------------- receive payment ---------------- */
  App.paymentForm = function (opts) {
    opts = opts || {};

    function open(customer) {
      var stats = customer ? M.customerStats(customer.id) : null;
      var dues = customer ? M.customerSales(customer.id).filter(function (s) {
        return s.status !== 'cancelled' && App.round2(s.total - M.salePaid(s.id)) > 0.5;
      }) : [];

      var saleOpts = [{ v: '', l: '— oldest dues first (general) —' }].concat(dues.map(function (s) {
        return { v: s.id, l: s.invoiceNo + ' — due ' + App.money(App.round2(s.total - M.salePaid(s.id))) };
      }));

      var body =
        (customer ?
          '<div class="banner ' + (stats.outstanding > 0.5 ? 'warn' : 'ok') + '">' + App.icon('user', 20) + '' +
          '<div class="tx">' + App.esc(customer.name) + ' — ' +
          (stats.outstanding > 0.5 ? 'Due <b>' + App.money(stats.outstanding) + '</b>' : 'Account is settled') +
          '<small>Total purchased ' + App.money(stats.billed) + ' · paid ' + App.money(stats.paid) + '</small></div>' +
          '<button class="btn btn-sm" id="pfchange">Change</button></div>'
          : '<div class="banner warn">' + App.icon('alert', 20) + '<div class="tx">Choose customer</div>' +
            '<button class="btn btn-sm btn-primary" id="pfchange">Choose</button></div>') +
        UI.formHTML([
          { k: 'amount', label: 'Amount received (₹)', type: 'number', required: true,
            value: opts.amount !== undefined ? App.round2(opts.amount) : (stats && stats.outstanding > 0 ? stats.outstanding : ''),
            attrs: 'inputmode="decimal" step="0.01" min="0"' },
          { k: 'method', label: 'Received via', type: 'select', options: M.PAY_METHODS.filter(function (m) { return m !== 'Credit'; }), value: 'Cash' },
          { k: 'date', label: 'Date', type: 'date', value: App.today() },
          { k: 'saleId', label: 'Against which bill', type: 'select', options: saleOpts, value: opts.saleId || '' },
          { k: 'note', label: 'Note (optional)', value: '', span: 2 }
        ]) +
        (customer && stats.outstanding > 0.5 ?
          '<div class="chips mt12">' +
            '<button class="chip" data-amt="' + stats.outstanding + '">Full ' + App.money(stats.outstanding) + '</button>' +
            '<button class="chip" data-amt="' + App.round2(stats.outstanding / 2) + '">Half</button>' +
          '</div>' : '') +
        '<div id="pfafter" class="mt16"></div>';

      var m = UI.modal({
        title: 'Receive payment',
        body: body,
        buttons: [
          { label: 'Cancel', onClick: function (a) { a.close(); } },
          { label: 'Save payment', icon: 'check', class: 'btn-ok', onClick: function (a) {
              UI.clearErrors(a.el);
              var d = UI.readForm(a.el);
              var amt = App.n(d.amount);
              if (amt <= 0) return UI.markError(a.el, 'amount', 'Enter an amount');
              if (!customer) { App.toast('Choose a customer first', 'err'); return; }
              try {
                M.paymentCreate({ customerId: customer.id, saleId: d.saleId, date: d.date, amount: amt, method: d.method, note: d.note });
                a.close();
                App.toast(App.money(amt) + ' payment recorded', 'ok');
                UI.render();
              } catch (e) { App.toast(e.message, 'err'); }
            } }
        ]
      });

      function preview() {
        var el = App.el('#pfafter', m.el);
        if (!el || !customer) return;
        var amt = App.n(App.el('[name="amount"]', m.el).value);
        var after = App.round2(stats.outstanding - amt);
        el.innerHTML = '<div class="totals" style="max-width:none">' +
          '<div class="r"><span class="muted">Currently due</span><span class="num">' + App.money(stats.outstanding) + '</span></div>' +
          '<div class="r"><span class="muted">This payment</span><span class="num pos">− ' + App.money(amt) + '</span></div>' +
          '<div class="r big"><span>Due after this</span><span class="num ' + (after > 0.5 ? 'neg' : 'pos') + '">' + App.money(after) + '</span></div>' +
          (after < -0.5 ? '<div class="tiny dim right">(will be kept as an advance)</div>' : '') +
          '</div>';
      }
      App.el('[name="amount"]', m.el).addEventListener('input', preview);
      App.on(m.el, 'click', '[data-amt]', function () {
        App.el('[name="amount"]', m.el).value = this.getAttribute('data-amt');
        preview();
      });
      App.on(m.el, 'change', '[name="saleId"]', function () {
        var s = M.find('sales', this.value);
        if (s) {
          App.el('[name="amount"]', m.el).value = App.round2(s.total - M.salePaid(s.id));
          preview();
        }
      });
      var chg = App.el('#pfchange', m.el);
      if (chg) chg.addEventListener('click', function () {
        m.close();
        UI.pickCustomer(function (c) { if (c) open(c); }, { allowWalkIn: false });
      });
      preview();
    }

    if (opts.customerId) open(M.find('customers', opts.customerId));
    else UI.pickCustomer(function (c) { if (c) open(c); }, { allowWalkIn: false });
  };
})();


/* ===== 45-expenses.js ===== */
/* =========================================================================
   45-expenses.js — shop expenses
   ========================================================================= */
(function () {
  'use strict';
  var UI = App.UI, M = App.M;

  UI.route('expenses', function (view, r) {
    var d = r.query.d || '';
    var from = r.query.from || d || App.today().slice(0, 8) + '01';
    var to = r.query.to || d || App.today();
    var cat = r.query.c || '';

    var list = M.expenses().filter(function (e) { return e.date >= from && e.date <= to; });
    if (cat) list = list.filter(function (e) { return e.category === cat; });
    list.sort(function (a, b) { return (b.date + b.createdAt) > (a.date + a.createdAt) ? 1 : -1; });

    var total = App.sum(list, function (e) { return e.amount; });
    var byCat = App.groupBy(list, function (e) { return e.category; });

    var html =
      '<div class="view-head"><div><h1>Expenses</h1>' +
      '<div class="sub">' + App.fmtDate(from) + ' to ' + App.fmtDate(to) + ' · ' + App.money(total) + ' spent</div></div>' +
      '<div class="actions"><button class="btn" id="exexport">' + App.icon('download', 18) + ' CSV</button>' +
      '<button class="btn btn-primary" id="exnew">+ Add expense</button></div></div>';

    html += '<div class="card card-pad mb16"><div class="flex gap12 wrap aic">' +
      '<div class="f"><label>From</label><input type="date" id="exfrom" value="' + from + '"></div>' +
      '<div class="f"><label>To</label><input type="date" id="exto" value="' + to + '"></div>' +
      '<div class="chips" style="margin-left:auto">' +
        '<button class="chip" data-range="today">Today</button>' +
        '<button class="chip" data-range="month">This month</button>' +
        '<button class="chip" data-range="year">This year</button>' +
      '</div></div></div>';

    html += '<div class="chips mb16">' +
      '<button class="chip ' + (cat ? '' : 'on') + '" data-c="">All</button>' +
      M.EXPENSE_CATEGORIES.map(function (c) {
        var t = App.sum((byCat[c] || []), function (e) { return e.amount; });
        return '<button class="chip ' + (cat === c ? 'on' : '') + '" data-c="' + App.esc(c) + '">' + App.esc(c) + (t ? ' · ' + App.money0(t) : '') + '</button>';
      }).join('') + '</div>';

    html += '<div class="card">';
    if (!list.length) html += UI.empty('trendDown', 'No expenses in this period', 'Add expenses like rent, electricity and salary here', '+ Add expense', 'exnew2');
    else {
      html += '<div class="tablewrap"><table class="tbl"><thead><tr>' +
        '<th>Date</th><th>Category</th><th>Description</th><th>Payment</th><th class="right">Amount</th><th></th></tr></thead><tbody>' +
        list.map(function (e) {
          return '<tr><td class="sm">' + App.fmtDate(e.date) + '</td>' +
            '<td><span class="pill p-warn">' + App.esc(e.category) + '</span></td>' +
            '<td>' + App.esc(e.description || '—') + (e.notes ? '<div class="tiny dim">' + App.esc(e.notes) + '</div>' : '') + '</td>' +
            '<td class="sm">' + App.esc(e.method) + '</td>' +
            '<td class="num right b neg">' + App.money(e.amount) + '</td>' +
            '<td class="right nowrap"><button class="btn btn-sm" data-edit="' + e.id + '">' + App.icon('pencil', 18) + '<span>Edit</span></button> ' +
            '<button class="btn btn-sm" data-del="' + e.id + '">' + App.icon('trash', 18) + '<span>Delete</span></button></td></tr>';
        }).join('') + '</tbody><tfoot><tr><td colspan="4">Total (' + list.length + ' entries)</td>' +
        '<td class="num right neg">' + App.money(total) + '</td><td></td></tr></tfoot></table></div>';
    }
    html += '</div>';

    view.innerHTML = html;

    function apply(o) {
      var n = { from: App.el('#exfrom', view).value, to: App.el('#exto', view).value, c: cat };
      for (var k in o) n[k] = o[k];
      var q = [];
      for (var k2 in n) if (n[k2]) q.push(k2 + '=' + encodeURIComponent(n[k2]));
      UI.go('/expenses' + (q.length ? '?' + q.join('&') : ''));
    }
    App.el('#exfrom', view).addEventListener('change', function () { apply({}); });
    App.el('#exto', view).addEventListener('change', function () { apply({}); });
    App.on(view, 'click', '.chip[data-c]', function () { apply({ c: this.getAttribute('data-c') }); });
    App.on(view, 'click', '[data-range]', function () {
      var k = this.getAttribute('data-range'), t = App.today();
      if (k === 'today') apply({ from: t, to: t });
      else if (k === 'month') apply({ from: t.slice(0, 8) + '01', to: t });
      else apply({ from: t.slice(0, 4) + '-01-01', to: t });
    });
    App.el('#exnew', view).addEventListener('click', function () { App.expenseForm(null); });
    App.on(view, 'click', '[data-act="exnew2"]', function () { App.expenseForm(null); });
    App.on(view, 'click', '[data-edit]', function () { App.expenseForm(this.getAttribute('data-edit')); });
    App.on(view, 'click', '[data-del]', function () {
      var id = this.getAttribute('data-del');
      UI.confirm({ title: 'Delete this expense?', message: 'You can restore it from Trash.', danger: true, okLabel: 'Delete' })
        .then(function (ok) { if (ok) { M.softDelete('expenses', id); App.toast('Deleted'); UI.render(); } });
    });
    App.el('#exexport', view).addEventListener('click', function () {
      var rows = [['Date','Category','Description','Payment Method','Amount','Notes']];
      list.forEach(function (e) { rows.push([e.date, e.category, e.description, e.method, e.amount, e.notes]); });
      rows.push(['','','','TOTAL', total, '']);
      App.download('expenses_' + from + '_to_' + to + '.csv', App.toCSV(rows), 'text/csv');
      App.toast('CSV downloaded', 'ok');
    });

    if (r.query.new) App.expenseForm(null);
  });

  App.expenseForm = function (id) {
    var e = id ? M.find('expenses', id) : null;
    UI.modal({
      title: e ? 'Edit expense' : 'New Expense',
      body: UI.formHTML([
        { k: 'amount', label: 'Amount (₹)', type: 'number', required: true, value: e ? e.amount : '', attrs: 'inputmode="decimal" step="0.01" min="0"' },
        { k: 'category', label: 'Category', type: 'select', options: M.EXPENSE_CATEGORIES, value: e ? e.category : 'Shop Rent' },
        { k: 'date', label: 'Date', type: 'date', value: e ? e.date : App.today() },
        { k: 'method', label: 'Paid via', type: 'select', options: M.PAY_METHODS.filter(function (m) { return m !== 'Credit'; }), value: e ? e.method : 'Cash' },
        { k: 'description', label: 'Description', value: e ? e.description : '', span: 2, placeholder: 'e.g. September rent' },
        { k: 'notes', label: 'Notes', type: 'textarea', value: e ? e.notes : '', span: 2 }
      ]),
      buttons: [
        { label: 'Cancel', onClick: function (a) { a.close(); } },
        { label: e ? 'Save' : 'Add', class: 'btn-primary', onClick: function (a) {
            UI.clearErrors(a.el);
            var d = UI.readForm(a.el);
            if (App.n(d.amount) <= 0) return UI.markError(a.el, 'amount', 'Enter an amount');
            try {
              if (e) M.expenseUpdate(e.id, d); else M.expenseCreate(d);
              a.close();
              App.toast(e ? 'Updated' : 'Expense added', 'ok');
              UI.render();
            } catch (er) { App.toast(er.message, 'err'); }
          } }
      ]
    });
  };
})();


/* ===== 46-purchases.js ===== */
/* =========================================================================
   46-purchases.js — stock kharidna (purchases) + suppliers
   ========================================================================= */
(function () {
  'use strict';
  var UI = App.UI, M = App.M;

  /* ================= PURCHASES ================= */
  UI.route('purchases', function (view, r) {
    var from = r.query.from || '', to = r.query.to || '';
    var list = M.purchases().slice();
    if (from) list = list.filter(function (p) { return p.date >= from; });
    if (to) list = list.filter(function (p) { return p.date <= to; });
    list.sort(function (a, b) { return (b.date + b.createdAt) > (a.date + a.createdAt) ? 1 : -1; });

    var active = list.filter(function (p) { return p.status !== 'cancelled'; });
    var total = App.sum(active, function (p) { return p.total; });
    var paid = App.sum(active, function (p) { return p.paid; });

    var html =
      '<div class="view-head"><div><h1>Purchases (Stock in)</h1>' +
      '<div class="sub">' + active.length + ' bills · ' + App.money(total) + ' · Owed to suppliers ' + App.money(total - paid) + '</div></div>' +
      '<div class="actions"><button class="btn" data-go="/suppliers">' + App.icon('building', 18) + ' Suppliers</button>' +
      '<button class="btn btn-primary" id="punew">+ New Purchase</button></div></div>';

    html += '<div class="card card-pad mb16"><div class="flex gap12 wrap">' +
      '<div class="f"><label>From</label><input type="date" id="pufrom" value="' + from + '"></div>' +
      '<div class="f"><label>To</label><input type="date" id="puto" value="' + to + '"></div>' +
      '<div class="f"><label>&nbsp;</label><button class="btn" id="puclear">Clear</button></div>' +
      '</div></div>';

    html += '<div class="card">';
    if (!list.length) html += UI.empty('truck', 'No purchases yet', 'Record new stock here when it arrives', '+ New Purchase', 'punew2');
    else {
      html += '<div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>Bill No</th><th>Supplier</th>' +
        '<th>Items</th><th class="right">Total</th><th class="right">Paid</th><th class="right">Due</th><th></th></tr></thead><tbody>' +
        list.map(function (p) {
          var sup = p.supplierId ? M.find('suppliers', p.supplierId) : null;
          var due = App.round2(p.total - p.paid);
          return '<tr class="clickable" data-id="' + p.id + '">' +
            '<td class="sm">' + App.fmtDate(p.date) + '</td>' +
            '<td class="mono">' + App.esc(p.billNo || '—') + (p.status === 'cancelled' ? ' <span class="pill p-mute">Cancelled</span>' : '') + '</td>' +
            '<td>' + App.esc(sup ? sup.name : '—') + '</td>' +
            '<td class="sm dim">' + p.items.length + ' items · ' + App.sum(p.items, function (i) { return i.qty; }) + ' units</td>' +
            '<td class="num right b">' + App.money(p.total) + '</td>' +
            '<td class="num right pos">' + App.money(p.paid) + '</td>' +
            '<td class="num right">' + (due > 0.5 ? '<span class="neg b">' + App.money(due) + '</span>' : '<span class="pill p-ok">Paid</span>') + '</td>' +
            '<td class="right">' + (p.status !== 'cancelled' ? '<button class="btn btn-sm" data-cancel="' + p.id + '">Cancel</button>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</div>';

    view.innerHTML = html;
    App.el('#punew', view).addEventListener('click', purchaseForm);
    App.on(view, 'click', '[data-act="punew2"]', purchaseForm);
    App.el('#puclear', view).addEventListener('click', function () { UI.go('/purchases'); });
    function apply() {
      var q = [];
      if (App.el('#pufrom', view).value) q.push('from=' + App.el('#pufrom', view).value);
      if (App.el('#puto', view).value) q.push('to=' + App.el('#puto', view).value);
      UI.go('/purchases' + (q.length ? '?' + q.join('&') : ''));
    }
    App.el('#pufrom', view).addEventListener('change', apply);
    App.el('#puto', view).addEventListener('change', apply);
    App.on(view, 'click', '[data-cancel]', function (e) {
      e.stopPropagation();
      var id = this.getAttribute('data-cancel');
      UI.confirm({ title: 'Cancel this purchase?', message: 'All stock from this bill will be taken back out.', danger: true, okLabel: 'Cancel it' })
        .then(function (ok) { if (ok) { M.purchaseCancel(id); App.toast('Purchase cancelled'); UI.render(); } });
    });
    App.on(view, 'click', 'tr[data-id]', function (e) {
      if (e.target.closest('[data-cancel]')) return;
      var p = M.find('purchases', this.getAttribute('data-id'));
      var sup = p.supplierId ? M.find('suppliers', p.supplierId) : null;
      UI.modal({
        title: 'Purchase ' + (p.billNo || ''),
        body: '<dl class="kv mb16"><dt>Date</dt><dd>' + App.fmtDate(p.date) + '</dd>' +
          '<dt>Supplier</dt><dd>' + App.esc(sup ? sup.name : '—') + '</dd>' +
          '<dt>Payment</dt><dd>' + App.esc(p.method) + '</dd>' +
          '<dt>Status</dt><dd>' + App.esc(p.status) + '</dd></dl>' +
          '<div class="tablewrap"><table class="tbl"><thead><tr><th>Item</th><th class="right">Qty</th><th class="right">Rate</th><th class="right">Amount</th></tr></thead><tbody>' +
          p.items.map(function (i) {
            return '<tr><td>' + App.esc(i.name) + '</td><td class="num right">' + i.qty + '</td>' +
              '<td class="num right">' + App.money(i.rate) + '</td><td class="num right b">' + App.money(i.amount) + '</td></tr>';
          }).join('') + '</tbody><tfoot><tr><td colspan="3">Total</td><td class="num right">' + App.money(p.total) + '</td></tr>' +
          '<tr><td colspan="3">Paid</td><td class="num right">' + App.money(p.paid) + '</td></tr></tfoot></table></div>' +
          (p.notes ? '<div class="mt12 sm"><b>Notes:</b> ' + App.esc(p.notes) + '</div>' : ''),
        buttons: [{ label: 'Close', onClick: function (a) { a.close(); } }]
      });
    });
  });

  function purchaseForm() {
    var items = [];
    var sups = [{ v: '', l: '— none —' }].concat(M.suppliers().map(function (s) { return { v: s.id, l: s.name }; }));

    var m = UI.modal({
      title: 'New Purchase (stock aaya)',
      size: 'wide',
      body: UI.formHTML([
        { k: 'date', label: 'Date', type: 'date', value: App.today() },
        { k: 'billNo', label: 'Supplier\'s bill no.', value: '' },
        { k: 'supplierId', label: 'Supplier', type: 'select', options: sups, value: '' },
        { k: 'method', label: 'Payment method', type: 'select', options: M.PAY_METHODS, value: 'Cash' }
      ], 2) +
      '<div class="hr"></div>' +
      '<div class="flex aic jcb mb12"><b>Items</b><button class="btn btn-sm btn-primary" id="puadd">+ Add product</button></div>' +
      '<div id="pulist"></div>' +
      '<div class="hr"></div>' +
      UI.formHTML([
        { k: 'paid', label: 'Paid to supplier (₹)', type: 'number', value: 0, attrs: 'inputmode="decimal" step="0.01" min="0"' },
        { k: 'notes', label: 'Notes', value: '' }
      ], 2) +
      '<div id="putot" class="mt12"></div>',
      buttons: [
        { label: 'Cancel', onClick: function (a) { a.close(); } },
        { label: 'Save purchase', icon: 'check', class: 'btn-primary', onClick: function (a) {
            if (!items.length) { App.toast('Add at least one product', 'err'); return; }
            var d = UI.readForm(a.el);
            try {
              M.purchaseCreate({ date: d.date, billNo: d.billNo, supplierId: d.supplierId, method: d.method,
                paid: d.paid, notes: d.notes, items: items });
              a.close();
              App.toast('Purchase saved and stock updated', 'ok');
              UI.render();
            } catch (e) { App.toast(e.message, 'err'); }
          } }
      ]
    });

    function draw() {
      var el = App.el('#pulist', m.el);
      if (!items.length) { el.innerHTML = '<div class="empty"><div class="t">No items yet</div></div>'; total(); return; }
      el.innerHTML = '<div class="li-head"><div>Item</div><div>Qty</div><div>Rate ₹</div><div class="d3">Amount</div><div class="d3"></div><div></div></div>' +
        items.map(function (it, i) {
          return '<div class="li" data-i="' + i + '">' +
            '<div><div class="nm">' + App.esc(it.name) + '<small>' + App.esc(it.sku || '') + '</small></div></div>' +
            '<div><input type="number" data-k="qty" value="' + it.qty + '" inputmode="numeric" step="1" min="1"></div>' +
            '<div><input type="number" data-k="rate" value="' + it.rate + '" inputmode="decimal" step="0.01" min="0"></div>' +
            '<div class="d3 right b num" style="align-self:center">' + App.money(App.n(it.qty) * App.n(it.rate)) + '</div>' +
            '<div class="d3"></div>' +
            '<div><button class="rm" data-rm="' + i + '" aria-label="Remove item">' + App.icon('x', 18) + '</button></div></div>';
        }).join('');
      total();
    }
    function total() {
      var t = App.sum(items, function (i) { return App.n(i.qty) * App.n(i.rate); });
      App.el('#putot', m.el).innerHTML = '<div class="totals"><div class="r big"><span>Purchase total</span><span class="num">' + App.money(t) + '</span></div></div>';
    }

    App.el('#puadd', m.el).addEventListener('click', function () {
      UI.pickProduct(function (p) {
        if (!p) { App.toast('Only products from your list can be added to a purchase. Create the product first.', 'warn', 3500); return; }
        var ex = null;
        items.forEach(function (i) { if (i.productId === p.id) ex = i; });
        if (ex) ex.qty = App.n(ex.qty) + 1;
        else items.push({ productId: p.id, sku: p.sku, name: p.name, qty: 1, rate: App.n(p.costPrice) || App.n(p.sellPrice) });
        draw();
      });
    });
    App.on(m.el, 'input', '#pulist input[data-k]', function () {
      var i = App.n(this.closest('[data-i]').getAttribute('data-i'));
      items[i][this.getAttribute('data-k')] = App.n(this.value);
      var row = this.closest('[data-i]');
      row.children[3].textContent = App.money(App.n(items[i].qty) * App.n(items[i].rate));
      total();
    });
    App.on(m.el, 'click', '#pulist [data-rm]', function () {
      items.splice(App.n(this.getAttribute('data-rm')), 1); draw();
    });
    draw();
  }

  /* ================= SUPPLIERS ================= */
  UI.route('suppliers', function (view) {
    var list = M.suppliers().slice().sort(function (a, b) { return App.norm(a.name) > App.norm(b.name) ? 1 : -1; });

    var html = '<div class="view-head"><div class="flex aic gap12">' +
      '<button class="btn btn-icon" data-go="/purchases" aria-label="Back to purchases">' + App.icon('arrowLeft', 20) + '</button>' +
      '<div><h1>Suppliers</h1><div class="sub">' + list.length + ' suppliers</div></div></div>' +
      '<div class="actions"><button class="btn btn-primary" id="supnew">+ New Supplier</button></div></div>';

    html += '<div class="card">';
    if (!list.length) html += UI.empty('building', 'No suppliers yet', 'Add the suppliers you buy stock from', '+ New Supplier', 'supnew2');
    else {
      html += '<div class="tablewrap"><table class="tbl"><thead><tr><th>Name</th><th>Phone</th><th>GSTIN</th>' +
        '<th class="right">Purchases</th><th class="right">Total</th><th class="right">Due</th><th></th></tr></thead><tbody>' +
        list.map(function (s) {
          var pur = M.purchases().filter(function (p) { return p.supplierId === s.id && p.status !== 'cancelled'; });
          var t = App.sum(pur, function (p) { return p.total; });
          var pd = App.sum(pur, function (p) { return p.paid; });
          return '<tr><td><div class="b">' + App.esc(s.name) + '</div>' +
            (s.address ? '<div class="tiny dim">' + App.esc(s.address) + '</div>' : '') + '</td>' +
            '<td class="mono">' + App.esc(s.phone || '—') + '</td>' +
            '<td class="mono sm">' + App.esc(s.gstin || '—') + '</td>' +
            '<td class="num right">' + pur.length + '</td>' +
            '<td class="num right">' + App.money(t) + '</td>' +
            '<td class="num right">' + (App.round2(t - pd) > 0.5 ? '<span class="neg b">' + App.money(t - pd) + '</span>' : '<span class="pill p-ok">Clear</span>') + '</td>' +
            '<td class="right nowrap"><button class="btn btn-sm" data-edit="' + s.id + '">' + App.icon('pencil', 18) + '<span>Edit</span></button> ' +
            '<button class="btn btn-sm" data-del="' + s.id + '">' + App.icon('trash', 18) + '<span>Delete</span></button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</div>';
    view.innerHTML = html;

    App.el('#supnew', view).addEventListener('click', function () { supForm(null); });
    App.on(view, 'click', '[data-act="supnew2"]', function () { supForm(null); });
    App.on(view, 'click', '[data-edit]', function () { supForm(this.getAttribute('data-edit')); });
    App.on(view, 'click', '[data-del]', function () {
      var id = this.getAttribute('data-del');
      UI.confirm({ title: 'Delete this supplier?', message: 'Existing purchase records will not be affected.', danger: true, okLabel: 'Delete' })
        .then(function (ok) { if (ok) { M.softDelete('suppliers', id); App.toast('Deleted'); UI.render(); } });
    });
  });

  function supForm(id) {
    var s = id ? M.find('suppliers', id) : null;
    UI.modal({
      title: s ? 'Edit supplier' : 'New Supplier',
      body: UI.formHTML([
        { k: 'name', label: 'Supplier name', required: true, value: s ? s.name : '', span: 2 },
        { k: 'phone', label: 'Phone', type: 'tel', value: s ? s.phone : '' },
        { k: 'email', label: 'Email', type: 'email', value: s ? s.email : '' },
        { k: 'gstin', label: 'GSTIN', value: s ? s.gstin : '' },
        { k: 'address', label: 'Address', value: s ? s.address : '' },
        { k: 'notes', label: 'Notes', type: 'textarea', value: s ? s.notes : '', span: 2 }
      ]),
      buttons: [
        { label: 'Cancel', onClick: function (a) { a.close(); } },
        { label: 'Save', class: 'btn-primary', onClick: function (a) {
            UI.clearErrors(a.el);
            var d = UI.readForm(a.el);
            if (!d.name.trim()) return UI.markError(a.el, 'name', 'Name is required');
            if (s) M.supplierUpdate(s.id, d); else M.supplierCreate(d);
            a.close(); App.toast('Saved', 'ok'); UI.render();
          } }
      ]
    });
  }
})();

    { k: 'profit',     n: 'Profit Report',          g: 'Money',     range: true },
    { k: 'collection', n: 'Payment Collection',     g: 'Money',     range: true },
    { k: 'expense',    n: 'Expense Report',         g: 'Money',     range: true },
    { k: 'purchase',   n: 'Purchase Report',        g: 'Money',     range: true },
    { k: 'gst',        n: 'GST / Tax Report',       g: 'Money',     range: true },
    { k: 'outstanding',n: 'Customer Outstanding',   g: 'Customers', range: false },
    { k: 'custhist',   n: 'Customer Purchase History', g: 'Customers', range: true },
    { k: 'stock',      n: 'Stock Report',           g: 'Stock',     range: false },
    { k: 'lowstock',   n: 'Low Stock Report',       g: 'Stock',     range: false },
    { k: 'stockledger',n: 'Stock Movement Ledger',  g: 'Stock',     range: true }
  ];

  UI.route('reports', function (view, r) {
    var key = r.query.r || 'daily';
    var def = REPORTS.filter(function (x) { return x.k === key; })[0] || REPORTS[0];
    var t = App.today();
    var from = r.query.from || t.slice(0, 8) + '01';
    var to = r.query.to || t;

    var groups = {};
    REPORTS.forEach(function (x) { (groups[x.g] = groups[x.g] || []).push(x); });

    var html =
      '<div class="view-head"><div><h1>Reports</h1><div class="sub">' + App.esc(def.n) +
      (def.range ? ' · ' + App.fmtDate(from) + ' to ' + App.fmtDate(to) : '') + '</div></div>' +
      '<div class="actions">' +
        '<button class="btn" id="rcsv">' + App.icon('download', 18) + ' CSV</button>' +
        '<button class="btn" id="rprint">' + App.icon('printer', 18) + ' Print / PDF</button>' +
      '</div></div>';

    html += '<div class="card card-pad mb16">';
    for (var g in groups) {
      html += '<div class="tiny b muted mb8" style="letter-spacing:.06em">' + g.toUpperCase() + '</div><div class="chips mb12">' +
        groups[g].map(function (x) {
          return '<button class="chip ' + (x.k === key ? 'on' : '') + '" data-r="' + x.k + '">' + App.esc(x.n) + '</button>';
        }).join('') + '</div>';
    }
    if (def.range) {
      html += '<div class="hr"></div><div class="flex gap12 wrap aic">' +
        '<div class="f"><label>From</label><input type="date" id="rfrom" value="' + from + '"></div>' +
        '<div class="f"><label>To</label><input type="date" id="rto" value="' + to + '"></div>' +
        '<div class="chips" style="margin-left:auto">' +
          '<button class="chip" data-range="today">Today</button>' +
          '<button class="chip" data-range="week">7 days</button>' +
          '<button class="chip" data-range="month">This month</button>' +
          '<button class="chip" data-range="lastmonth">Last month</button>' +
          '<button class="chip" data-range="year">This year</button>' +
          '<button class="chip" data-range="all">All time</button>' +
        '</div></div>';
    }
    html += '</div>';

    var rep = build(key, from, to);

    if (rep.cards && rep.cards.length) {
      html += '<div class="grid g4 mb16">' + rep.cards.map(function (c) {
        return '<div class="stat s-' + (c.k || 'brand') + '"><div class="strip"></div><div class="lbl">' + App.esc(c.l) + '</div>' +
          '<div class="val">' + c.v + '</div>' + (c.h ? '<div class="hint">' + App.esc(c.h) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    }

    html += '<div class="card"><div class="card-head"><h3>' + App.esc(rep.title) + '</h3>' +
      '<div class="actions"><span class="sm dim">' + rep.rows.length + ' rows</span></div></div>';
    if (!rep.rows.length) html += UI.empty('chart', 'No data for this period', 'Try a different date range or report');
    else {
      html += '<div class="tablewrap"><table class="tbl"><thead><tr>' +
        rep.cols.map(function (c) { return '<th class="' + (c.num ? 'right' : '') + '">' + App.esc(c.l) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        rep.rows.slice(0, 500).map(function (row) {
          return '<tr' + (row._go ? ' class="clickable" data-go="' + row._go + '"' : '') + '>' +
            rep.cols.map(function (c, i) {
              var v = row[i];
              return '<td class="' + (c.num ? 'num right' : '') + (c.b ? ' b' : '') + '">' + (v === undefined || v === null || v === '' ? '<span class="dim">—</span>' : v) + '</td>';
            }).join('') + '</tr>';
        }).join('') + '</tbody>' +
        (rep.foot ? '<tfoot><tr>' + rep.cols.map(function (c, i) {
          return '<td class="' + (c.num ? 'num right' : '') + '">' + (rep.foot[i] === undefined ? '' : rep.foot[i]) + '</td>';
        }).join('') + '</tr></tfoot>' : '') +
        '</table></div>' +
        (rep.rows.length > 500 ? '<div class=\"more-rows\"><span>Showing the first 500 of ' + rep.rows.length + ' rows — tap CSV to get every row.</span></div>' : '');
    }
    html += '</div>';

    view.innerHTML = html;

    App.on(view, 'click', '.chip[data-r]', function () {
      UI.go('/reports?r=' + this.getAttribute('data-r') + '&from=' + from + '&to=' + to);
    });
    function apply(f, t2) { UI.go('/reports?r=' + key + '&from=' + f + '&to=' + t2); }
    var ff = App.el('#rfrom', view);
    if (ff) {
      ff.addEventListener('change', function () { apply(this.value, to); });
      App.el('#rto', view).addEventListener('change', function () { apply(from, this.value); });
      App.on(view, 'click', '[data-range]', function () {
        var k = this.getAttribute('data-range'), td = App.today();
        if (k === 'today') apply(td, td);
        else if (k === 'week') apply(App.addDays(td, -6), td);
        else if (k === 'month') apply(td.slice(0, 8) + '01', td);
        else if (k === 'lastmonth') {
          var d = new Date(td + 'T12:00:00'); d.setDate(1); d.setMonth(d.getMonth() - 1);
          var s = App.dstr(d); d.setMonth(d.getMonth() + 1); d.setDate(0);
          apply(s, App.dstr(d));
        }
        else if (k === 'year') apply(td.slice(0, 4) + '-01-01', td);
        else apply('2000-01-01', td);
      });
    }

    App.el('#rcsv', view).addEventListener('click', function () {
      var rows = [[rep.title], ['Period', def.range ? from + ' to ' + to : App.today()], [],
        rep.cols.map(function (c) { return c.l; })];
      rep.rows.forEach(function (row) {
        rows.push(rep.cols.map(function (c, i) { return strip(row[i]); }));
      });
      if (rep.foot) rows.push(rep.cols.map(function (c, i) { return strip(rep.foot[i]); }));
      App.download(key + '_report_' + (def.range ? from + '_' + to : App.today()) + '.csv', App.toCSV(rows), 'text/csv');
      App.toast('CSV downloaded', 'ok');
    });

    App.el('#rprint', view).addEventListener('click', function () {
      var set = App.db.settings;
      var h = '<div class="ph"><div><h1>' + App.esc(set.shopName) + '</h1>' +
        (set.address ? '<div>' + App.esc(set.address).replace(/\n/g, '<br>') + '</div>' : '') + '</div>' +
        '<div style="text-align:right"><div class="pt" style="margin:0">' + App.esc(rep.title) + '</div>' +
        (def.range ? '<div>' + App.fmtDate(from) + ' — ' + App.fmtDate(to) + '</div>' : '<div>' + App.fmtDate(App.today()) + '</div>') +
        '</div></div>';
      if (rep.cards && rep.cards.length) {
        h += '<table><tr>' + rep.cards.map(function (c) {
          return '<td><b>' + App.esc(c.l) + '</b><br>' + c.v + '</td>';
        }).join('') + '</tr></table>';
      }
      h += '<table><thead><tr>' + rep.cols.map(function (c) { return '<th class="' + (c.num ? 'num' : '') + '">' + App.esc(c.l) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rep.rows.slice(0, 3000).map(function (row) {
          return '<tr>' + rep.cols.map(function (c, i) { return '<td class="' + (c.num ? 'num' : '') + '">' + (row[i] === undefined || row[i] === '' ? '—' : row[i]) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody>' +
        (rep.foot ? '<tfoot><tr>' + rep.cols.map(function (c, i) { return '<td class="' + (c.num ? 'num' : '') + '"><b>' + (rep.foot[i] || '') + '</b></td>'; }).join('') + '</tr></tfoot>' : '') +
        '</table>' +
        (rep.rows.length > 3000 ? '<p>Showing the first 3000 of ' + rep.rows.length + ' rows. The CSV export has every row.</p>' : '') + '<div class="foot">Report generated: ' + App.fmtDateTime(App.nowISO()) + ' · ' + App.esc(set.shopName) + '</div>';
      UI.print(h);
    });
  });

  function strip(v) {
    return String(v === undefined || v === null ? '' : v)
      .replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/₹/g, '').replace(/,/g, '').trim();
  }

  var C = {
    txt: function (l) { return { l: l }; },
    b: function (l) { return { l: l, b: true }; },
    num: function (l) { return { l: l, num: true }; }
  };

  /* ------------------------------------------------------------------ */
  function build(key, from, to) {
    switch (key) {

      case 'daily': {
        var rows = M.summaryByDay(from, to).map(function (d) {
          return [App.fmtDate(d.date), d.invoiceCount, App.money(d.totalSales), App.money(d.discountGiven),
            App.money(d.collected), App.money(d.cashIn), App.money(d.upiIn), App.money(d.totalExpenses),
            profitCell(d.netProfit)];
        });
        var tot = M.summary(from, to);
        return {
          title: 'Daily Sales Report',
          cols: [C.b('Date'), C.num('Invoices'), C.num('Sales'), C.num('Discount'), C.num('Collected'),
                 C.num('Cash'), C.num('UPI'), C.num('Expenses'), C.num('Profit')],
          rows: rows,
          foot: ['TOTAL', tot.invoiceCount, App.money(tot.totalSales), App.money(tot.discountGiven),
                 App.money(tot.collected), App.money(tot.cashIn), App.money(tot.upiIn),
                 App.money(tot.totalExpenses), profitCell(tot.netProfit)],
          cards: summaryCards(tot)
        };
      }

      case 'monthly': {
        var months = {};
        M.sales().filter(function (s) { return s.status !== 'cancelled' && s.date >= from && s.date <= to; })
          .forEach(function (s) { months[App.monthOf(s.date)] = 1; });
        M.expenses().filter(function (e) { return e.date >= from && e.date <= to; })
          .forEach(function (e) { months[App.monthOf(e.date)] = 1; });
        var keys = Object.keys(months).sort().reverse();
        var rows2 = keys.map(function (mk) {
          var f = mk + '-01';
          var d = new Date(mk + '-01T12:00:00'); d.setMonth(d.getMonth() + 1); d.setDate(0);
          var s = M.summary(f, App.dstr(d));
          return [App.monthName(App.n(mk.slice(5))) + ' ' + mk.slice(0, 4), s.invoiceCount,
            App.money(s.totalSales), App.money(s.collected), App.money(s.purchaseTotal),
            App.money(s.totalExpenses), App.money(s.grossProfit), profitCell(s.netProfit)];
        });
        var t2 = M.summary(from, to);
        return {
          title: 'Monthly Sales Report',
          cols: [C.b('Month'), C.num('Invoices'), C.num('Sales'), C.num('Collected'), C.num('Purchases'),
                 C.num('Expenses'), C.num('Gross Profit'), C.num('Net Profit')],
          rows: rows2,
          foot: ['TOTAL', t2.invoiceCount, App.money(t2.totalSales), App.money(t2.collected),
                 App.money(t2.purchaseTotal), App.money(t2.totalExpenses), App.money(t2.grossProfit), profitCell(t2.netProfit)],
          cards: summaryCards(t2)
        };
      }

      case 'yearly': {
        var years = {};
        M.sales().forEach(function (s) { if (s.status !== 'cancelled') years[App.yearOf(s.date)] = 1; });
        M.expenses().forEach(function (e) { years[App.yearOf(e.date)] = 1; });
        var yk = Object.keys(years).sort().reverse();
        var rows3 = yk.map(function (y) {
          var s = M.summary(y + '-01-01', y + '-12-31');
          return [y, s.invoiceCount, App.money(s.totalSales), App.money(s.collected),
            App.money(s.purchaseTotal), App.money(s.totalExpenses), App.money(s.grossProfit), profitCell(s.netProfit)];
        });
        return {
          title: 'Yearly Sales Report',
          cols: [C.b('Year'), C.num('Invoices'), C.num('Sales'), C.num('Collected'), C.num('Purchases'),
                 C.num('Expenses'), C.num('Gross Profit'), C.num('Net Profit')],
          rows: rows3,
          cards: []
        };
      }

      case 'invoices': {
        var list = M.sales().filter(function (s) { return s.date >= from && s.date <= to; })
          .sort(function (a, b) { return (b.date + b.createdAt) > (a.date + a.createdAt) ? 1 : -1; });
        var rows4 = list.map(function (s) {
          var paid = M.salePaid(s.id);
          var row = [App.esc(s.invoiceNo), App.fmtDate(s.date), App.esc(s.customerName || 'Walk-in'),
            s.items.length, App.esc(s.paymentMethod), App.money(s.subtotal), App.money(s.totalDiscount),
            App.money(s.taxAmount), App.money(s.total), App.money(paid),
            App.round2(s.total - paid) > 0.5 ? '<span class="neg b">' + App.money(s.total - paid) + '</span>' : '—',
            s.status === 'cancelled' ? '<span class="pill p-mute">Cancelled</span>' : '<span class="pill p-ok">OK</span>'];
          row._go = '/sale/' + s.id;
          return row;
        });
        var act = list.filter(function (s) { return s.status !== 'cancelled'; });
        return {
          title: 'Invoice-wise Sales',
          cols: [C.b('Invoice'), C.txt('Date'), C.txt('Customer'), C.num('Items'), C.txt('Method'),
                 C.num('Subtotal'), C.num('Discount'), C.num('Tax'), C.num('Total'), C.num('Paid'), C.num('Due'), C.txt('Status')],
          rows: rows4,
          foot: ['TOTAL', '', act.length + ' active', '', '',
            App.money(App.sum(act, function (s) { return s.subtotal; })),
            App.money(App.sum(act, function (s) { return s.totalDiscount; })),
            App.money(App.sum(act, function (s) { return s.taxAmount; })),
            App.money(App.sum(act, function (s) { return s.total; })),
            App.money(App.sum(act, function (s) { return M.salePaid(s.id); })),
            App.money(App.sum(act, function (s) { return s.total - M.salePaid(s.id); })), ''],
          cards: summaryCards(M.summary(from, to))
        };
      }

      case 'product': {
        var agg = {};
        M.sales().filter(function (s) { return s.status !== 'cancelled' && s.date >= from && s.date <= to; })
          .forEach(function (s) {
            s.items.forEach(function (i) {
              var k = i.productId || ('free:' + i.name);
              agg[k] = agg[k] || { name: i.name, sku: i.sku, qty: 0, amount: 0, cost: 0, cat: '' };
              agg[k].qty += App.n(i.qty);
              agg[k].amount += App.n(i.amount);
              agg[k].cost += App.n(i.costPrice) * App.n(i.qty);
              var p = i.productId ? M.find('products', i.productId) : null;
              if (p) agg[k].cat = p.category;
            });
          });
        var arr = Object.keys(agg).map(function (k) { return agg[k]; })
          .sort(function (a, b) { return b.amount - a.amount; });
        return {
          title: 'Product-wise Sales',
          cols: [C.b('Product'), C.txt('SKU'), C.txt('Category'), C.num('Qty Sold'), C.num('Sales'), C.num('Cost'), C.num('Profit')],
          rows: arr.map(function (a) {
            return [App.esc(a.name), App.esc(a.sku || '—'), App.esc(a.cat || '—'), App.round2(a.qty),
              App.money(a.amount), App.money(a.cost), profitCell(App.round2(a.amount - a.cost))];
          }),
          foot: ['TOTAL', '', '', App.sum(arr, function (a) { return a.qty; }),
            App.money(App.sum(arr, function (a) { return a.amount; })),
            App.money(App.sum(arr, function (a) { return a.cost; })),
            profitCell(App.round2(App.sum(arr, function (a) { return a.amount; }) - App.sum(arr, function (a) { return a.cost; })))],
          cards: []
        };
      }

      case 'category': {
        var cg = {};
        M.CATEGORIES.forEach(function (c) { cg[c] = { qty: 0, amount: 0, cost: 0 }; });
        cg['Other / Custom'] = { qty: 0, amount: 0, cost: 0 };
        M.sales().filter(function (s) { return s.status !== 'cancelled' && s.date >= from && s.date <= to; })
          .forEach(function (s) {
            s.items.forEach(function (i) {
              var p = i.productId ? M.find('products', i.productId) : null;
              var c = p ? p.category : 'Other / Custom';
              cg[c] = cg[c] || { qty: 0, amount: 0, cost: 0 };
              cg[c].qty += App.n(i.qty);
              cg[c].amount += App.n(i.amount);
              cg[c].cost += App.n(i.costPrice) * App.n(i.qty);
            });
          });
        var keys2 = Object.keys(cg).filter(function (k) { return cg[k].qty || cg[k].amount; });
        var grand = App.sum(keys2, function (k) { return cg[k].amount; });
        return {
          title: 'Category-wise Sales',
          cols: [C.b('Category'), C.num('Qty'), C.num('Sales'), C.num('Share %'), C.num('Cost'), C.num('Profit')],
          rows: keys2.sort(function (a, b) { return cg[b].amount - cg[a].amount; }).map(function (k) {
            return [App.esc(k), App.round2(cg[k].qty), App.money(cg[k].amount),
              grand ? App.round2(cg[k].amount / grand * 100) + '%' : '0%',
              App.money(cg[k].cost), profitCell(App.round2(cg[k].amount - cg[k].cost))];
          }),
          foot: ['TOTAL', App.sum(keys2, function (k) { return cg[k].qty; }), App.money(grand), '100%',
            App.money(App.sum(keys2, function (k) { return cg[k].cost; })),
            profitCell(App.round2(grand - App.sum(keys2, function (k) { return cg[k].cost; })))],
          cards: []
        };
      }

      case 'profit': {
        var s2 = M.summary(from, to);
        var byCat = App.groupBy(s2.expenses, function (e) { return e.category; });
        var rows5 = [
          ['<b>Sales (total bills)</b>', '', App.money(s2.totalSales)],
          ['&nbsp;&nbsp;less: Cost of goods sold', '', '− ' + App.money(App.round2(s2.totalSales - s2.taxCollected - s2.grossProfit))],
          (s2.taxCollected ? ['&nbsp;&nbsp;less: Tax collected (goes to govt)', '', '− ' + App.money(s2.taxCollected)] : null),
          ['<b>Gross Profit</b>', '', '<b>' + App.money(s2.grossProfit) + '</b>'],
          ['', '', ''],
          ['<b>Expenses</b>', '', '']
        ].filter(Boolean);
        Object.keys(byCat).sort().forEach(function (c) {
          rows5.push(['&nbsp;&nbsp;' + App.esc(c), byCat[c].length, '− ' + App.money(App.sum(byCat[c], function (e) { return e.amount; }))]);
        });
        rows5.push(['<b>Total Expenses</b>', s2.expenses.length, '<b>− ' + App.money(s2.totalExpenses) + '</b>']);
        rows5.push(['', '', '']);
        rows5.push(['<b>NET PROFIT</b>', '', '<b>' + profitCell(s2.netProfit) + '</b>']);
        return {
          title: 'Profit Report',
          cols: [C.txt('Head'), C.num('Count'), C.num('Amount')],
          rows: rows5,
          cards: [
            { l: 'Sales', v: App.money0(s2.totalSales), k: 'brand' },
            { l: 'Gross Profit', v: App.money0(s2.grossProfit), k: 'info', h: 'After cost' },
            { l: 'Expenses', v: App.money0(s2.totalExpenses), k: 'warn' },
            { l: 'Net Profit', v: App.money0(s2.netProfit), k: s2.netProfit >= 0 ? 'ok' : 'danger' }
          ]
        };
      }

      case 'collection': {
        var pays = M.payments().filter(function (p) { return p.date >= from && p.date <= to; })
          .sort(function (a, b) { return (b.date + b.createdAt) > (a.date + a.createdAt) ? 1 : -1; });
        var byM = {};
        pays.forEach(function (p) { byM[p.method] = App.round2(App.n(byM[p.method]) + App.n(p.amount)); });
        return {
          title: 'Payment Collection Report',
          cols: [C.txt('Date'), C.b('Customer'), C.txt('Invoice'), C.txt('Method'), C.txt('Note'), C.num('Amount')],
          rows: pays.map(function (p) {
            var c = p.customerId ? M.find('customers', p.customerId) : null;
            var s = p.saleId ? M.find('sales', p.saleId) : null;
            return [App.fmtDate(p.date), App.esc(c ? c.name : 'Walk-in'), App.esc(s ? s.invoiceNo : '—'),
              App.esc(p.method), App.esc(p.note || '—'), App.money(p.amount)];
          }),
          foot: ['TOTAL', pays.length + ' payments', '', '', '', App.money(App.sum(pays, function (p) { return p.amount; }))],
          cards: M.PAY_METHODS.filter(function (m) { return byM[m]; }).map(function (m) {
            return { l: m, v: App.money0(byM[m]), k: 'ok' };
          })
        };
      }

      case 'expense': {
        var exps = M.expenses().filter(function (e) { return e.date >= from && e.date <= to; });
        var g2 = App.groupBy(exps, function (e) { return e.category; });
        var total3 = App.sum(exps, function (e) { return e.amount; });
        return {
          title: 'Expense Report',
          cols: [C.b('Category'), C.num('Entries'), C.num('Amount'), C.num('Share %')],
          rows: Object.keys(g2).sort(function (a, b) {
            return App.sum(g2[b], function (e) { return e.amount; }) - App.sum(g2[a], function (e) { return e.amount; });
          }).map(function (c) {
            var t = App.sum(g2[c], function (e) { return e.amount; });
            return [App.esc(c), g2[c].length, App.money(t), total3 ? App.round2(t / total3 * 100) + '%' : '0%'];
          }),
          foot: ['TOTAL', exps.length, App.money(total3), '100%'],
          cards: [{ l: 'Total Expenses', v: App.money0(total3), k: 'warn', h: exps.length + ' entries' }]
        };
      }

      case 'purchase': {
        var purs = M.purchases().filter(function (p) { return p.date >= from && p.date <= to; })
          .sort(function (a, b) { return b.date > a.date ? 1 : -1; });
        var act2 = purs.filter(function (p) { return p.status !== 'cancelled'; });
        return {
          title: 'Purchase Report',
          cols: [C.txt('Date'), C.b('Bill No'), C.txt('Supplier'), C.num('Items'), C.num('Units'), C.num('Total'), C.num('Paid'), C.num('Due'), C.txt('Status')],
          rows: purs.map(function (p) {
            var sup = p.supplierId ? M.find('suppliers', p.supplierId) : null;
